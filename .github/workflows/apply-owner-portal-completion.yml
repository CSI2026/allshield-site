name: Apply Owner Portal Completion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-owner-portal-completion.yml'
      - '.restore/owner-portal-patch/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: owner-portal-completion
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble verified Owner portal patch
        shell: bash
        run: |
          test -f .restore/owner-portal-patch/part-00
          test -f .restore/owner-portal-patch/part-01
          test -f .restore/owner-portal-patch/part-02
          test -f .restore/owner-portal-patch/part-03
          cat .restore/owner-portal-patch/part-* > /tmp/owner-modules.diff.gz.b64
          base64 -d /tmp/owner-modules.diff.gz.b64 > /tmp/owner-modules.diff.gz
          gzip -cd /tmp/owner-modules.diff.gz > /tmp/owner-modules.diff
          echo 'ab076a68ee533977d5e56b8984ae85c920e798cbdef30623363d56a69bd16947  /tmp/owner-modules.diff' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/owner-modules.diff')
          s=p.read_text()
          s=s.replace('/mnt/data/allshield_audit/b021_exact/ALLSHIELD_TRUE_MASTER_PRODUCTION_B021/','')
          s=s.replace('/mnt/data/allshield_fix/','')
          p.write_text(s)
          PY
          head -4 /tmp/owner-modules.diff

      - name: Apply completion to canonical B021 modules
        shell: bash
        run: |
          target_core='456dda5f347ada266990df162783a1ef110e7d64b053b5faf84b8aba1db738e1'
          target_live='13bfc7a52bbeffb8dfe5142d3d02805a3ed395daf503409ba39a42af30e90465'
          target_academy='be08c72e6883bbc2876f223b963257cefafd7a7abc922626f3d88094b8c20e56'
          if [ "$(sha256sum phase16-production-core.js | cut -d' ' -f1)" = "$target_core" ] && \
             [ "$(sha256sum phase16-live-backoffice.js | cut -d' ' -f1)" = "$target_live" ] && \
             [ "$(sha256sum phase16-academy-admin.js | cut -d' ' -f1)" = "$target_academy" ]; then
            echo 'Completion modules already applied.'
          else
            cat > /tmp/baseline.sha <<'EOF'
          3e42d90e1e1ee18595429ad17b7c44e506988f9915921da0ab48a61105f2ca52  phase16-production-core.js
          2902b7532d646bcc1760292d84c46a81cc9666a27cf5c3497e37ff21a8f5d1f3  phase16-live-backoffice.js
          a6d257b50693788bbcbf04a152fff2af5d8243c18e5a7496612a419350301e80  phase16-academy-admin.js
          EOF
            sed -i 's/^          //' /tmp/baseline.sha
            sha256sum -c /tmp/baseline.sha
            patch -p0 < /tmp/owner-modules.diff
          fi
          echo "$target_core  phase16-production-core.js" > /tmp/target.sha
          echo "$target_live  phase16-live-backoffice.js" >> /tmp/target.sha
          echo "$target_academy  phase16-academy-admin.js" >> /tmp/target.sha
          sha256sum -c /tmp/target.sha

      - name: Fix canonical portal routing and approved logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('assets/brand-914a23072410.webp','assets/brand-9aa0ec99b3b0.webp')
          marker="""  const host=document.getElementById(role==='agent'?'agentMain':role==='admin'?'adminMain':'ownerMain');\n  if(!host) return true;\n"""
          insert="""  const host=document.getElementById(role==='agent'?'agentMain':role==='admin'?'adminMain':'ownerMain');\n  if(!host) return true;\n  // The same portal host is reused by every tab. Renderer-specific data flags\n  // must never survive a route change or a returning tab may skip rebuilding.\n  for(const key of Object.keys(host.dataset)){\n    if(key!=='currentView') delete host.dataset[key];\n  }\n  host.dataset.currentView=view;\n"""
          if 'for(const key of Object.keys(host.dataset))' not in s:
              if marker not in s: raise SystemExit('Canonical router insertion point not found')
              s=s.replace(marker,insert,1)
          p.write_text(s)
          PY
          ! grep -q 'brand-914a23072410' index.html
          grep -q 'for(const key of Object.keys(host.dataset))' index.html

      - name: Install completed B021 Owner functional contract
        shell: bash
        run: |
          cat > tests/b021-production-contract.mjs <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const read=f=>fs.readFileSync(f,'utf8');
          const sha=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const index=read('index.html');
          const expectedRoutes=['dashboard','ai','permissions','teamaccounts','departments','communications','hierarchy','states','academy','testing','versions','updates','performance','meetings','marketing','social','video','media','brand','files','audit','buildhistory','settings'];
          const routes=[...new Set([...index.matchAll(/showOwnerView\('([^']+)'/g)].map(m=>m[1]))];
          const miss=expectedRoutes.filter(x=>!routes.includes(x));
          if(miss.length||routes.length!==expectedRoutes.length) throw new Error(`Owner navigation contract failed. missing=${miss.join(',')} count=${routes.length}`);
          if(!index.includes('for(const key of Object.keys(host.dataset))')) throw new Error('Canonical router does not clear stale portal-host state.');
          if(index.includes('brand-914a23072410')) throw new Error('Rejected legacy internal logo is active.');
          const files=['phase16-owner-live-dashboard.js','phase16-ai-command-production.js','phase16-live-backoffice.js','phase16-academy-admin.js','phase16-owner-support.js','phase16-production-core.js','phase16-social-production.js'];
          const combined=files.map(read).join('\n');
          for(const route of expectedRoutes) if(!combined.includes(`'owner','${route}'`)&&!combined.includes(`"owner","${route}"`)) throw new Error(`Missing canonical Owner renderer: ${route}`);
          for(const f of files) execFileSync(process.execPath,['--check',f],{stdio:'inherit'});
          for(const phrase of ['Production build will','requires the live','Interactive prototype','not yet available']) if(combined.includes(phrase)) throw new Error(`Unfinished canonical Owner source: ${phrase}`);
          const preserved={
           'phase16-ai-command-production.js':'69b37664106e52e2c89516cf0cc4e1fbf9b676c1bca47c2cbbea13ad98d3f237',
           'phase16-social-production.js':'592f534997bf00457da6fe8ce4e2ffb1b64c3ccc23ac8bce773d4453d2f98216',
           'phase16-owner-live-dashboard.js':'e4d6d08965527da54f1763ea312436d137bcc8f78e69c9bcb9b75bc735d0b121',
           'phase16-owner-support.js':'d826e926433b44b222ca1d0f549ab5f871e96db66dc782834cba066559d84628'
          };
          for(const [f,h] of Object.entries(preserved)) if(sha(f)!==h) throw new Error(`Approved B021 module changed unexpectedly: ${f}`);
          const live=read('phase16-live-backoffice.js');
          for(const m of ['Create Account','Edit Team Account','Reset Password','Permission Override','Approve Promotion']) if(!live.includes(m)) throw new Error(`Owner account/access feature absent: ${m}`);
          const core=read('phase16-production-core.js');
          for(const m of ['Create Department','Schedule Meeting','Company announcement center','Create Next Draft Version','Create Draft','Upload Asset','Upload Video','BRAND CENTER','OWNER FILE VAULT','AUDIT & CHANGE HISTORY','BUILD & RELEASE CONTROL']) if(!core.includes(m)) throw new Error(`Owner production feature absent: ${m}`);
          const academy=read('phase16-academy-admin.js');
          if(!academy.includes('STATE LICENSING MATRIX')||!academy.includes('50-STATE MATRIX')) throw new Error('50-state Owner licensing matrix is missing.');
          const social=read('phase16-social-production.js');
          for(const m of ['Brand + Profile AI','Posts + Ads','Connections + Queue']) if(!social.includes(m)) throw new Error(`Approved Social tab missing: ${m}`);
          const ai=read('phase16-ai-command-production.js');
          if(!ai.includes('Live AI across Allshield')) throw new Error('Approved AI Command Center is missing.');
          if(!/DEMO_FALLBACK:\s*false/.test(read('config.js'))) throw new Error('Demo fallback is not disabled.');
          console.log(JSON.stringify({status:'PASS',baseline:'B2026.08.23.021',owner_routes:23,canonical_handlers:23,approved_ai_preserved:true,approved_social_preserved:true,owner_feature_completion:true},null,2));
          EOF
          sed -i 's/^          //' tests/b021-production-contract.mjs
          cat > package.json <<'EOF'
          {
            "name":"allshield-site",
            "private":true,
            "version":"1.0.0",
            "scripts":{"test":"node tests/b021-production-contract.mjs && node tests/owner-portal-functional-contract.mjs"}
          }
          EOF
          npm test

      - name: Commit completed Owner portal
        shell: bash
        run: |
          git config user.name 'Allshield Production Completion'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html phase16-production-core.js phase16-live-backoffice.js phase16-academy-admin.js tests/b021-production-contract.mjs tests/owner-portal-functional-contract.mjs package.json
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
          else
            git commit -m 'Complete Owner portal against approved B2026.08.23.021'
            git push origin HEAD:main
          fi
