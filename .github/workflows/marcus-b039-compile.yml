name: Marcus B039 Dependency-Aware Compile
on:
  push:
    branches: [marcus-b039]
    paths: ['.github/workflows/marcus-b039-compile.yml']
permissions:
  contents: write
jobs:
  compile:
    if: github.event.head_commit.message == 'Add Marcus B039 dependency-aware compile workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marcus-b039
          fetch-depth: 0
      - name: Repair malformed template-key delimiters
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('supabase/functions/ai-marcus-performance-analyst/index.ts')
          s=p.read_text()
          fixed,n=re.subn(r'(add\("(?:critical|high|normal|low)",`[^`\n]*?)","',r'\1`,"',s)
          if n < 2:
              raise SystemExit(f'expected at least 2 malformed delimiters, repaired {n}')
          p.write_text(fixed)
          print('repaired',n,'delimiter(s)')
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno compile check
        run: deno check --node-modules-dir=auto supabase/functions/ai-marcus-performance-analyst/index.ts
      - name: Run ALLSHIELD contract suite
        run: npm test
      - name: Commit compiled repair
        run: |
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git add supabase/functions/ai-marcus-performance-analyst/index.ts
          git commit -m 'Compile Marcus B039 runtime' || true
          git push origin HEAD:marcus-b039
