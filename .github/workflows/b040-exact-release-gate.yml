name: B040 Exact Release Gate
# rerun after direct production bootstrap contract correction
on:
  push:
    branches: [universal-comp-b040]
    paths: ['.github/workflows/b040-exact-release-gate.yml']
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-comp-b040
          fetch-depth: 0
      - name: Syntax
        run: |
          node --check universal-compensation-platform.js
          node --check comp-qualification-ui.js
      - name: Universal compensation contracts
        run: |
          node tests/universal-compensation-contract.mjs
          node tests/universal-compensation-live-contract.mjs
      - name: Full ALLSHIELD regression
        run: npm test
      - name: AI organization regression
        run: node tests/ai-workforce-organization-cert.mjs
      - name: Release tree scope
        run: |
          test "$(git diff --name-only 800b62703c9c6c95e7a5b631ee73504572fbf669...HEAD | grep '^mobile-symmetry-fix-2026-08-28.js$' | wc -l)" -eq 0
          grep -q 'universal-compensation-platform.js?v=B2026.08.29.040' index.html
          grep -q 'comp-qualification-ui.js?v=B2026.08.29.040' index.html
          grep -q "current_build:'B2026.08.29.040'" build-info.js
      - name: Remove one-time gate
        run: rm -f .github/workflows/b040-exact-release-gate.yml
      - name: Commit exact release
        run: |
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Lock exact B040 universal compensation release'
          git push origin HEAD:universal-comp-b040
