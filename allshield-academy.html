d leaves a family behind.","This chapter explains how that system works. You will learn who pays for Social Security, how a worker earns the right to benefits, who in the family can collect, and how the benefit amount is figured.","As an agent, you will not sell Social Security, but you will plan around it on almost every case. Its benefits are a foundation, not a full solution. Knowing exactly where the gaps are is how you show a client why private life, disability and retirement coverage is needed."],"objectives":["Explain the purpose of the OASDI program and how it is funded","Differentiate fully insured status from currently insured status","Describe retirement benefits and the effect of claiming before or after full retirement age","Identify who qualifies for survivor benefits and explain the blackout period","State the Social Security definition of disability and the waiting period for benefits","Summarize how the primary insurance amount is used and how benefits are taxed","Relate Social Security benefits to a client's need for private insurance"],"avaIntro":"Hi, it's Ava. Welcome to chapter twelve, where we look at Social Security. Nearly every client you meet is paying into this program right now, and most of them have only a rough idea of what they are getting for it. By the end of this chapter you will know more than they do. We will cover how the program is paid for, how a worker earns credits, and the difference between being fully insured and currently insured. Then we will go through the three kinds of benefits: retirement, survivor and disability. I will also explain the blackout period, which is one of the best reasons a family needs life insurance. Keep an eye out for a few key numbers, because the exam loves them. Ready? Let's begin."},"keywords":[{"term":"Average indexed monthly earnings (AIME)","def":"A worker's highest years of earnings, adjusted for wage growth and averaged by month, used to compute the PIA."},{"term":"Blackout period","def":"The span when a surviving spouse receives no Social Security benefit, from the youngest child's 16th birthday until the spouse turns 60."},{"term":"Credit","def":"The unit of work history used for eligibility, also called a quarter of coverage; up to four can be earned each year."},{"term":"Currently insured","def":"Status reached with at least 6 credits in the last 13 calendar quarters, giving limited survivor benefits."},{"term":"Disability (Social Security)","def":"Inability to engage in any substantial gainful activity because of an impairment expected to last at least 12 months or end in death."},{"term":"FICA","def":"The Federal Insurance Contributions Act, the payroll tax that funds Social Security and Medicare."},{"term":"Full retirement age","def":"The age at which a worker can receive 100 percent of the primary insurance amount as a retirement benefit."},{"term":"Fully insured","def":"Status reached with 40 credits, about ten years of work, giving eligibility for retirement and the full range of survivor benefits."},{"term":"Lump-sum death benefit","def":"A one-time payment of $255 to an eligible surviving spouse or child."},{"term":"OASDI","def":"Old-Age, Survivors and Disability Insurance, the formal name for the Social Security benefit programs."},{"term":"Primary insurance amount (PIA)","def":"The monthly benefit a worker receives at full retirement age and the base for figuring all other benefits."},{"term":"Self-employment tax","def":"The Social Security and Medicare tax paid by self-employed people, covering both the employee and employer shares."},{"term":"Survivor benefits","def":"Monthly payments to eligible family members of a deceased insured worker."}],"sections":[{"title":"What Social Security Is and How It Is Funded","blocks":[{"type":"p","text":"Social Security was created by the Social Security Act of 1935, during the Great Depression. Its formal name is <b>OASDI<\/b>, which stands for Old-Age, Survivors and Disability Insurance. The three parts of that name are the three risks it covers: living into old age without a paycheck, dying and leaving dependents, and becoming unable to work."},{"type":"p","text":"The program is social insurance, not a personal savings account. It is meant to provide a basic floor of income, and it was never designed to replace a worker's full earnings. Participation is compulsory for nearly all workers in the country."},{"type":"h","text":"The payroll tax"},{"type":"p","text":"Social Security is paid for by a payroll tax under the Federal Insurance Contributions Act, known as <b>FICA<\/b>. The employee and the employer each pay the same percentage of the worker's wages. The employer withholds the employee's share from each paycheck and sends both shares to the government."},{"type":"list","items":["The Social Security portion of the tax applies only up to a maximum amount of earnings each year, called the taxable wage base. The base is adjusted annually.","The Medicare portion of the tax applies to all earnings, with no cap.","A self-employed person pays both halves, the employee share and the employer share, through the self-employment tax."]},{"type":"h","text":"Pay as you go"},{"type":"p","text":"Taxes collected from today's workers are used to pay today's beneficiaries. This is called a pay-as-you-go system. Any excess is held in federal trust funds. A worker's taxes are not set aside in an account with his or her name on it."},{"type":"flow","nodes":["Worker and employer pay FICA","Trust funds","Benefits to current retirees, survivors and disabled workers"],"caption":"Social Security is financed on a pay-as-you-go basis"},{"type":"example","text":"Carla works as a salaried bookkeeper. She sees one share of FICA tax on her pay stub, and her employer pays an equal share she never sees. Her brother Luis is a self-employed plumber. He has no employer, so he pays both shares himself when he files his tax return."},{"type":"p","text":"Because Social Security is a government program financed by taxes, benefits and eligibility rules are set by federal law and can be changed by Congress. A private insurance policy, by contrast, is a contract whose terms the insurer must honor."},{"type":"tip","text":"Employee and employer split the FICA tax equally, and a self-employed person pays both parts."}]},{"title":"Earning Coverage: Credits and Insured Status","blocks":[{"type":"p","text":"A worker does not qualify for Social Security just by paying tax once. Eligibility depends on a work record measured in <b>credits<\/b>, which are also called quarters of coverage. A worker earns one credit for a set amount of covered earnings, and the amount needed goes up a little each year. No matter how much a person earns, the most that can be earned is four credits in a year."},{"type":"p","text":"The number of credits on a worker's record determines the worker's insured status. Insured status decides which benefits are available. It does not decide how large the benefit is. The amount depends on earnings."},{"type":"h","text":"Fully insured"},{"type":"p","text":"A worker is <b>fully insured<\/b> after earning 40 credits. At four credits a year, that is about ten years of work. Once a worker reaches 40 credits, fully insured status is permanent. Fully insured status is required for retirement benefits and opens the door to the complete range of survivor benefits."},{"type":"h","text":"Currently insured"},{"type":"p","text":"A worker is <b>currently insured<\/b> with at least 6 credits earned during the 13 calendar quarters ending with the quarter of death. This lesser status exists to protect young families. If a worker dies before reaching fully insured status, being currently insured still allows benefits for the worker's children and for a surviving spouse who is caring for a young child, plus the lump-sum death benefit. It does not provide retirement benefits."},{"type":"table","head":["Status","Credits required","What it provides"],"rows":[["Fully insured","40 credits (about 10 years)","Retirement benefits and all survivor benefits"],["Currently insured","6 credits in the last 13 quarters","Limited survivor benefits for children and a spouse caring for a child, plus the lump-sum death benefit"]]},{"type":"h","text":"Disability insured"},{"type":"p","text":"Disability benefits have their own work test. In general the worker must be fully insured and must also have worked recently, which for most adults means earning 20 credits in the 40 quarters before the disability began. Younger workers can qualify with fewer credits."},{"type":"example","text":"Jamal is 26 and has worked steadily for the past two years, so he has 8 credits. He is not fully insured. If he died today, he would be currently insured, and his wife and infant daughter could receive survivor benefits."},{"type":"flow","nodes":["Covered work","Credits earned (max 4 per year)","Insured status","Eligibility for benefits"],"caption":"How a work record turns into eligibility"},{"type":"tip","text":"Memorize both tests: 40 credits for fully insured, and 6 credits in the last 13 quarters for currently insured."}]},{"title":"Retirement Benefits","blocks":[{"type":"p","text":"A fully insured worker can receive a monthly retirement benefit for life. The amount depends on the worker's earnings record and on the age at which the worker starts collecting."},{"type":"h","text":"Full retirement age"},{"type":"p","text":"<b>Full retirement age<\/b>, sometimes called normal retirement age, is the age at which the worker receives 100 percent of the primary insurance amount. It used to be 65 for everyone. Congress has raised it gradually based on year of birth, and it is 67 for anyone born in 1960 or later."},{"type":"h","text":"Claiming early or late"},{"type":"list","items":["Early retirement: a worker can start benefits as early as age 62. The monthly amount is reduced, and the reduction is permanent.","Full retirement age: the worker receives the full primary insurance amount.","Delayed retirement: a worker who waits past full retirement age earns delayed retirement credits that raise the monthly benefit. The credits stop building at age 70."]},{"type":"table","head":["When benefits start","Effect on monthly benefit"],"rows":[["Age 62","Permanently reduced"],["Full retirement age","100 percent of PIA"],["After full retirement age, up to 70","Increased by delayed retirement credits"]]},{"type":"h","text":"Benefits for family members"},{"type":"p","text":"When a worker retires, certain family members can also collect on the worker's record. A spouse can receive up to half of the worker's primary insurance amount if the spouse claims at full retirement age, or a reduced amount as early as 62. A spouse of any age can qualify while caring for the worker's child who is under 16 or disabled. Unmarried dependent children can also receive benefits. A divorced spouse may qualify if the marriage lasted at least ten years. The total paid on one worker's record is capped by a family maximum."},{"type":"h","text":"Working while collecting"},{"type":"p","text":"A person who collects retirement benefits before full retirement age and keeps working is subject to an earnings test. If earnings go over an annual limit, part of the benefit is withheld. Once the person reaches full retirement age, the earnings test no longer applies and the person can earn any amount without losing benefits."},{"type":"example","text":"Ruth was born in 1962, so her full retirement age is 67. If she claims at 62, her check will be smaller for the rest of her life. If she waits until 70, her check will be larger than her full retirement age amount."},{"type":"tip","text":"The earliest age for retirement benefits is 62, and the reduction for claiming early never goes away."}]},{"title":"Survivor Benefits and the Blackout Period","blocks":[{"type":"p","text":"When an insured worker dies, Social Security can pay monthly <b>survivor benefits<\/b> to family members who depended on that worker. These payments act much like a modest life insurance policy paid in installments."},{"type":"h","text":"Who can receive survivor benefits"},{"type":"list","items":["A surviving spouse age 60 or older, or age 50 or older if disabled.","A surviving spouse of any age who is caring for the deceased worker's child under age 16 or disabled. This is often called the mother's or father's benefit.","Unmarried children under 18, or up to 19 if still attending high school full time.","Children who became disabled before age 22.","Dependent parents age 62 or older."]},{"type":"h","text":"Lump-sum death benefit"},{"type":"p","text":"Social Security also pays a one-time <b>lump-sum death benefit<\/b> of $255 to a surviving spouse, or to eligible children if there is no spouse. The amount is fixed and has not changed in decades. It is available whether the worker was fully or currently insured."},{"type":"h","text":"The blackout period"},{"type":"p","text":"The benefit for a surviving spouse who is caring for children does not last until the spouse reaches retirement. It ends when the youngest child turns 16. The spouse cannot collect a widow's or widower's benefit until age 60. The stretch of years in between is called the <b>blackout period<\/b>, because the surviving spouse receives nothing from Social Security during that time."},{"type":"p","text":"Note that the child's own benefit continues until 18, or 19 if still in high school. It is the caregiver spouse's benefit that stops at the child's 16th birthday."},{"type":"flow","nodes":["Worker dies","Spouse benefit while child is under 16","Blackout period","Widow(er) benefit at 60"],"caption":"Timeline of benefits for a surviving spouse with children"},{"type":"example","text":"Dana is 38 when her husband dies. Their only child is 10. Dana receives a caregiver benefit for six years, until the child turns 16. Dana is then 44. She will receive nothing from Social Security for the next 16 years, until she turns 60."},{"type":"p","text":"The blackout period is one of the clearest reasons to recommend life insurance. A needs analysis should plan for income during those years."},{"type":"tip","text":"The blackout period starts when the youngest child turns 16 and ends when the surviving spouse turns 60."}]},{"title":"Disability Benefits","blocks":[{"type":"p","text":"Social Security pays a monthly income to insured workers who become severely disabled before reaching full retirement age. The rules are much stricter than those in most private disability policies, and many applicants are turned down."},{"type":"h","text":"Definition of disability"},{"type":"p","text":"To qualify, the worker must be unable to engage in <b>any substantial gainful activity<\/b> because of a medically determinable physical or mental impairment. The impairment must be expected to last at least 12 months or to result in death. This is an any-occupation standard. It is not enough that the worker can no longer do his or her usual job. The worker must be unable to do any substantial work, taking into account age, education and experience. Social Security pays nothing for partial or short-term disability."},{"type":"h","text":"Work requirement"},{"type":"p","text":"The worker must also have disability insured status. For most adults this means being fully insured and having earned 20 credits in the last 40 quarters, which is roughly five of the past ten years."},{"type":"h","text":"Waiting period"},{"type":"p","text":"There is a waiting period of <b>five full calendar months<\/b> after the disability begins. No benefit is paid for those months, and the first payment is for the sixth full month of disability. Benefits are not paid retroactively to cover the waiting period."},{"type":"flow","nodes":["Disability begins","5 full months with no benefit","Benefits start in month 6"],"caption":"The Social Security disability waiting period"},{"type":"h","text":"Amount and duration"},{"type":"list","items":["The disability benefit equals 100 percent of the worker's primary insurance amount.","Eligible dependents, such as children and a spouse caring for a young child, may also receive benefits, subject to the family maximum.","Benefits continue as long as the worker remains disabled. At full retirement age the disability benefit converts to a retirement benefit of the same amount.","After 24 months of receiving disability benefits, the worker becomes eligible for Medicare, regardless of age."]},{"type":"example","text":"A surgeon develops a hand tremor and can no longer operate, but he can still teach at a medical school. A private own-occupation policy might pay him. Social Security would not, because he is able to do other substantial work."},{"type":"tip","text":"Remember the pairing of 5 and 12: a 5-month waiting period and a disability expected to last at least 12 months or end in death."}]},{"title":"The Primary Insurance Amount and Taxation of Benefits","blocks":[{"type":"p","text":"Every Social Security benefit, whether for a retiree, a disabled worker, a spouse, a child or a survivor, starts from one number: the worker's <b>primary insurance amount<\/b>, or PIA."},{"type":"h","text":"How the PIA is calculated"},{"type":"p","text":"The Social Security Administration first adjusts the worker's past earnings to reflect changes in average wages over time. It then takes the highest 35 years of those indexed earnings and converts them to a monthly average. This figure is the <b>average indexed monthly earnings<\/b>, or AIME. Years with no earnings count as zeros, which pulls the average down."},{"type":"p","text":"A formula is then applied to the AIME to produce the PIA. The formula is weighted in favor of lower earners. It replaces a larger share of a low-wage worker's income than of a high-wage worker's income. This is one way the program meets its social purpose."},{"type":"flow","nodes":["Lifetime earnings","Highest 35 years, indexed","AIME","PIA"],"caption":"From earnings record to primary insurance amount"},{"type":"h","text":"How the PIA is used"},{"type":"table","head":["Beneficiary","Benefit as a share of the worker's PIA"],"rows":[["Worker retiring at full retirement age","100 percent"],["Disabled worker","100 percent"],["Spouse of a retired worker, at the spouse's full retirement age","Up to 50 percent"],["Surviving spouse at full retirement age","Up to 100 percent"]]},{"type":"p","text":"Benefits are increased from time to time by cost-of-living adjustments, which are tied to inflation."},{"type":"h","text":"Taxation of benefits"},{"type":"p","text":"Social Security benefits are not always tax free. Whether they are taxed depends on the recipient's total income. The test uses a figure often called provisional or combined income, which is adjusted gross income plus tax-exempt interest plus one-half of the Social Security benefits received."},{"type":"list","items":["If provisional income is below the first threshold, benefits are not taxed.","If it falls between the first and second thresholds, up to 50 percent of benefits are included in taxable income.","If it is above the second threshold, up to 85 percent of benefits are included in taxable income."]},{"type":"p","text":"No one pays federal income tax on more than 85 percent of Social Security benefits. Texas has no state income tax, so benefits are not taxed at the state level."},{"type":"example","text":"A retired couple lives on Social Security plus large withdrawals from a traditional IRA. The IRA withdrawals raise their provisional income, and part of their Social Security becomes taxable. A neighbor whose only income is Social Security pays no tax on her benefits."},{"type":"tip","text":"The largest share of Social Security benefits that can ever be subject to federal income tax is 85 percent."}]},{"title":"Social Security and Private Insurance Planning","blocks":[{"type":"p","text":"Social Security was built to be a floor of protection. Financial planners often describe retirement income as a three-legged stool: Social Security, employer retirement plans, and personal savings and insurance. An agent's job is to measure what the first leg will provide and then help the client build the other two."},{"type":"h","text":"Life insurance planning"},{"type":"p","text":"When you run a needs analysis for a family, you subtract expected Social Security survivor benefits from the income the family would need. Three gaps usually appear."},{"type":"list","items":["Survivor benefits replace only part of the lost paycheck, even while children are at home.","During the blackout period, the surviving spouse receives nothing at all.","The lump-sum death benefit is far too small to cover final expenses."]},{"type":"p","text":"Life insurance fills those gaps. Term coverage is often matched to the years until the children are grown and the blackout years that follow."},{"type":"h","text":"Disability income planning"},{"type":"p","text":"Clients often assume Social Security will support them if they cannot work. In practice it pays only for total, long-lasting disability under an any-occupation standard, and only after a five-month wait. A private disability income policy can pay sooner, can cover partial disability, and can use an own-occupation definition."},{"type":"p","text":"Some disability policies offer a <b>social insurance supplement<\/b> rider. The rider pays an extra benefit when the insured is disabled under the policy but is not receiving Social Security or other social insurance benefits. If those benefits are later approved, the rider's payment is reduced or stops."},{"type":"h","text":"Retirement planning"},{"type":"p","text":"For most workers, Social Security replaces well under half of pre-retirement income, and the share is smaller for higher earners. Annuities, IRAs and employer plans make up the difference. The age at which a client claims benefits also matters. Personal savings can be used to bridge the years between leaving work and a later, larger Social Security check."},{"type":"table","head":["Need","What Social Security provides","How private coverage helps"],"rows":[["Death of a breadwinner","Partial income with a blackout gap","Life insurance replaces income and covers the gap"],["Disability","Benefits only for total, long-term disability after 5 months","Disability income insurance with broader definitions"],["Retirement","A basic floor of income","Annuities, IRAs and employer plans add income"]]},{"type":"example","text":"An agent meets a couple in their thirties with two small children. She estimates the survivor benefits each spouse would receive, shows them the years with no benefit after the younger child turns 16, and recommends term life insurance sized to cover the shortfall."},{"type":"tip","text":"On planning questions, treat Social Security as a supplement to private insurance and savings, never as a complete replacement for income."}]}],"summary":{"recap":["Social Security, formally OASDI, protects against loss of income from old age, death and disability. It is funded by FICA payroll taxes shared equally by employees and employers, with the self-employed paying both shares.","Eligibility is based on credits, with a maximum of four per year. Forty credits make a worker fully insured. Six credits in the last 13 quarters make a worker currently insured, which provides limited survivor benefits.","Retirement benefits can start at 62 with a permanent reduction, are paid in full at full retirement age, and grow with delayed retirement credits up to age 70.","Survivor benefits go to eligible spouses, children and dependent parents. The blackout period runs from the youngest child's 16th birthday until the surviving spouse turns 60.","Disability benefits require an inability to perform any substantial gainful activity for at least 12 months or until death, and they begin after a five-month waiting period.","All benefits are based on the primary insurance amount. Up to 85 percent of benefits can be taxable for higher-income recipients. Social Security is a floor that private insurance and savings must build on."],"avaSummary":"Great job finishing chapter twelve. Let's review what you now know about Social Security. The official name is OASDI, which stands for Old-Age, Survivors and Disability Insurance. It is funded by the FICA payroll tax. The worker and the employer each pay an equal share, and a self-employed person pays both. Workers earn credits, up to four each year. With forty credits a worker is fully insured, and that is what it takes to collect retirement benefits. With six credits in the last thirteen quarters, a worker is currently insured, which protects a young family with limited survivor benefits. For retirement, a worker can claim as early as sixty-two, but the check is permanently smaller. At full retirement age the worker gets one hundred percent of the primary insurance amount, and waiting until seventy makes the check larger. For survivors, remember the blackout period. The caregiver spouse's benefit stops when the youngest child turns sixteen and does not start again until the spouse turns sixty. That gap is a strong reason to own life insurance. For disability, the definition is strict. The worker must be unable to do any substantial gainful activity, the condition must be expected to last at least twelve months or end in death, and there is a five-month waiting period. Every benefit is based on the primary insurance amount, which comes from the worker's highest thirty-five years of indexed earnings. And benefits can be taxed. Depending on income, up to eighty-five percent may be taxable. Most important, Social Security is a floor. Your clients will still need life insurance, disability income coverage and retirement savings to stand on. Now go take the chapter exam and show what you have learned.","reviewNotes":[{"objective":"Explain the purpose of the OASDI program and how it is funded","concepts":["OASDI covers old age, death and disability and provides a basic floor of income.","It is funded by FICA payroll taxes split equally between employee and employer.","Self-employed people pay both shares through the self-employment tax.","The system is pay as you go: current workers fund current beneficiaries."],"terms":[{"term":"OASDI","def":"Old-Age, Survivors and Disability Insurance."},{"term":"FICA","def":"The payroll tax that funds Social Security and Medicare."},{"term":"Self-employment tax","def":"Both the employee and employer shares, paid by a self-employed person."}]},{"objective":"Differentiate fully insured status from currently insured status","concepts":["A worker can earn at most four credits per year.","Fully insured requires 40 credits and is needed for retirement benefits.","Currently insured requires 6 credits in the last 13 quarters.","Currently insured status provides survivor benefits for children and a spouse caring for a child, plus the lump-sum death benefit."],"terms":[{"term":"Credit","def":"A quarter of coverage earned through covered work."},{"term":"Fully insured","def":"Having 40 credits."},{"term":"Currently insured","def":"Having 6 credits in the last 13 quarters."}]},{"objective":"Describe retirement benefits and the effect of claiming before or after full retirement age","concepts":["Full retirement age is 67 for people born in 1960 or later.","Benefits can begin at 62 with a permanent reduction.","Delayed retirement credits increase the benefit until age 70.","A spouse can receive up to 50 percent of the worker's PIA.","An earnings test applies to beneficiaries who work before full retirement age."],"terms":[{"term":"Full retirement age","def":"The age at which 100 percent of the PIA is payable."}]},{"objective":"Identify who qualifies for survivor benefits and explain the blackout period","concepts":["A surviving spouse qualifies at 60, at 50 if disabled, or at any age while caring for a child under 16.","Children qualify until 18, or 19 if still in high school.","Dependent parents qualify at 62.","The lump-sum death benefit is $255.","The blackout period runs from the youngest child's 16th birthday to the surviving spouse's 60th birthday."],"terms":[{"term":"Survivor benefits","def":"Monthly payments to family members of a deceased insured worker."},{"term":"Blackout period","def":"The years when a surviving spouse receives no benefit."},{"term":"Lump-sum death benefit","def":"A one-time $255 payment to an eligible survivor."}]},{"objective":"State the Social Security definition of disability and the waiting period for benefits","concepts":["The worker must be unable to engage in any substantial gainful activity.","The impairment must be expected to last at least 12 months or result in death.","There is a waiting period of five full months, and benefits begin with the sixth month.","The benefit equals 100 percent of the PIA and converts to a retirement benefit at full retirement age.","Medicare eligibility begins after 24 months of disability benefits."],"terms":[{"term":"Disability (Social Security)","def":"Inability to perform any substantial gainful activity for at least 12 months or until death."}]},{"objective":"Summarize how the primary insurance amount is used and how benefits are taxed","concepts":["The PIA is based on the AIME, which uses the highest 35 years of indexed earnings.","The benefit formula favors lower earners.","All benefits are stated as a percentage of the worker's PIA.","Depending on provisional income, none, up to 50 percent, or up to 85 percent of benefits may be taxable."],"terms":[{"term":"Primary insurance amount (PIA)","def":"The benefit payable to the worker at full retirement age."},{"term":"Average indexed monthly earnings (AIME)","def":"The wage-adjusted monthly average of the worker's highest earning years."}]},{"objective":"Relate Social Security benefits to a client's need for private insurance","concepts":["Social Security is a floor of protection, not a full replacement of income.","Life insurance covers the shortfall in survivor benefits and the blackout period.","Private disability income insurance pays sooner and under broader definitions than Social Security.","A social insurance supplement rider pays when Social Security disability benefits are not being received.","Annuities, IRAs and employer plans supplement Social Security retirement income."],"terms":[{"term":"Blackout period","def":"A gap in survivor benefits that life insurance is often used to cover."}]}]},"exam":[{"q":"What does OASDI stand for?","choices":["Old-Age, Survivors and Disability Insurance","Occupational Accident, Sickness and Disability Insurance","Old-Age Security and Dependent Income","Official Annuity and Survivor Death Insurance"],"answer":0,"why":"OASDI is the formal name of Social Security and names the three risks it covers."},{"q":"Social Security is funded primarily by","choices":["Federal income taxes","State sales taxes","Payroll taxes under FICA","Premiums paid by retirees"],"answer":2,"why":"FICA payroll taxes on covered earnings finance the program."},{"q":"How is the FICA tax divided between an employee and an employer?","choices":["The employee pays all of it","Each pays an equal share","The employer pays all of it","The employee pays two-thirds"],"answer":1,"why":"Employee and employer each pay the same percentage of the employee's wages."},{"q":"A self-employed person pays","choices":["No Social Security tax","Only the employee share","Only the employer share","Both the employee and employer shares"],"answer":3,"why":"With no employer to share the cost, the self-employed pay both halves through the self-employment tax."},{"q":"What is the maximum number of Social Security credits a worker can earn in one year?","choices":["Two","Four","Six","Ten"],"answer":1,"why":"No more than four credits, or quarters of coverage, can be earned in a year regardless of earnings."},{"q":"How many credits are needed for a worker to be fully insured?","choices":["6","20","40","13"],"answer":2,"why":"Forty credits, about ten years of work, make a worker fully insured."},{"q":"A worker is currently insured with at least","choices":["6 credits in the last 13 quarters","10 credits in the last 20 quarters","20 credits in the last 40 quarters","40 credits over a lifetime"],"answer":0,"why":"Currently insured status requires 6 credits during the last 13 calendar quarters."},{"q":"A worker who dies while only currently insured leaves a spouse and a 4-year-old child. Which is true?","choices":["No benefits of any kind are payable","Only a retirement benefit is payable","Benefits are delayed until the spouse is 65","The child and the spouse caring for the child can receive survivor benefits"],"answer":3,"why":"Currently insured status provides benefits for children and a spouse caring for a young child."},{"q":"What is the earliest age at which a worker can begin receiving Social Security retirement benefits?","choices":["59 1/2","60","62","65"],"answer":2,"why":"Reduced retirement benefits are available starting at age 62."},{"q":"A worker who begins retirement benefits before full retirement age will receive","choices":["A benefit that returns to 100 percent at full retirement age","A permanently reduced benefit","No benefit until full retirement age","A larger benefit"],"answer":1,"why":"The reduction for claiming early is permanent."},{"q":"A worker who delays claiming past full retirement age earns delayed retirement credits until what age?","choices":["70","67","72","75"],"answer":0,"why":"Delayed retirement credits stop accumulating at age 70."},{"q":"The blackout period for a surviving spouse begins when","choices":["The worker dies","The surviving spouse turns 60","The youngest child turns 18","The youngest child turns 16"],"answer":3,"why":"The caregiver spouse's benefit ends at the youngest child's 16th birthday, which starts the blackout period."},{"q":"The blackout period ends when the surviving spouse reaches age","choices":["55","60","62","65"],"answer":1,"why":"A widow or widower can first receive benefits at age 60, ending the blackout period."},{"q":"The Social Security lump-sum death benefit is","choices":["Equal to one month of the worker's PIA","$1,000","$255","Paid only if the worker was fully insured"],"answer":2,"why":"The lump-sum death benefit is a fixed $255 and is payable under either insured status."},{"q":"To qualify for Social Security disability benefits, a worker must be unable to","choices":["Engage in any substantial gainful activity","Perform the duties of his or her own occupation","Work more than 20 hours a week","Earn as much as before the disability"],"answer":0,"why":"Social Security uses a strict any-occupation standard based on substantial gainful activity."},{"q":"Under Social Security, a disability must be expected to last at least how long, or result in death?","choices":["5 months","6 months","24 months","12 months"],"answer":3,"why":"The impairment must be expected to last at least 12 months or end in death."},{"q":"What is the waiting period before Social Security disability benefits begin?","choices":["30 days","5 full months","12 months","24 months"],"answer":1,"why":"Benefits begin with the sixth full month after a five-month waiting period."},{"q":"The primary insurance amount (PIA) is best described as","choices":["The total FICA tax a worker has paid","The maximum family benefit","The monthly benefit payable to the worker at full retirement age","The amount of the lump-sum death benefit"],"answer":2,"why":"The PIA is the full retirement age benefit and the base for all other benefits."},{"q":"What is the maximum portion of Social Security benefits that can be subject to federal income tax?","choices":["85 percent","50 percent","100 percent","25 percent"],"answer":0,"why":"Depending on provisional income, up to 85 percent of benefits may be taxable, never more."},{"q":"In insurance planning, Social Security benefits are best viewed as","choices":["A full replacement for a worker's income","A substitute for disability income insurance","A reason to avoid buying life insurance","A basic floor of income to be supplemented by private coverage and savings"],"answer":3,"why":"The program was designed as a floor, leaving gaps that private insurance and savings fill."}]},{"id":"ch13","num":13,"title":"Health and Accident Insurance","intro":{"hook":["Picture a self-employed electrician who falls from a ladder. In one afternoon she faces three separate money problems: a hospital bill, months without a paycheck, and the chance that her hand never works the same way again. No single policy solves all three.","That is the big idea of this chapter. Health and accident insurance is really a family of coverages, and each one answers a different kind of loss. You will learn what each type pays for, how policies define an accident, what limited policies do and do not cover, and how the renewal wording decides who controls the future of the contract.","These topics show up again and again on the Texas exam, and they come up in real client conversations just as often. An agent who can explain why a cancer policy is not a medical plan, or why a noncancellable policy costs more, protects the client and protects their own license."],"objectives":["Identify the four main types of health insurance losses and the benefits that respond to each","Distinguish an accident from a sickness and accidental means from accidental bodily injury","Describe the common limited policies and what each one pays","Recognize the exclusions and limitations found in most health policies","Explain how pre-existing condition rules affect coverage","Compare the five renewability provisions and who holds the right to continue or change the policy"],"avaIntro":"Hi, I am Ava, and welcome to chapter thirteen. Up to now we have spent most of our time on life insurance. Today we cross over to the health side of your license. When people say health insurance, they usually think of doctor bills, but that is only one piece. In this chapter I will show you four kinds of loss: medical bills, lost income, accidental death or dismemberment, and the need for long-term care. Then we will look at how a policy defines an accident, because two short phrases can decide whether a claim is paid. We will walk through limited policies such as hospital indemnity and critical illness, review the usual exclusions, and finish with renewability, a favorite exam topic. Take your time with the comparison tables. They are where the points are. Let us get started."},"keywords":[{"term":"Accidental bodily injury","def":"A definition of accident that requires only the injury itself to be unexpected and unintended."},{"term":"Accidental death and dismemberment (AD&D)","def":"Coverage that pays a set amount for death or loss of limbs or sight caused by an accident."},{"term":"Accidental means","def":"A stricter definition of accident that requires both the cause and the result to be unexpected."},{"term":"Cancellable","def":"A policy the insurer may end at any time by giving written notice and refunding unearned premium."},{"term":"Capital sum","def":"The AD&D amount, usually a portion of the principal sum, paid for certain dismemberment or sight losses."},{"term":"Conditionally renewable","def":"A policy the insurer may decline to renew only for reasons listed in the contract."},{"term":"Disability income insurance","def":"Coverage that replaces part of a person's earnings while they are unable to work because of injury or sickness."},{"term":"Dread disease policy","def":"A limited policy covering one named illness, such as cancer, or a short list of named illnesses."},{"term":"Guaranteed renewable","def":"A policy the insurer must renew, although premiums may be raised for an entire class of insureds."},{"term":"Hospital indemnity policy","def":"A limited policy paying a fixed dollar amount for each day of hospital confinement, regardless of actual charges."},{"term":"Long-term care insurance","def":"Coverage for extended help with daily living in a nursing facility, assisted living setting, or at home."},{"term":"Medical expense insurance","def":"Coverage that pays for the cost of doctors, hospitals, surgery, and related treatment."},{"term":"Noncancellable","def":"A policy the insurer can neither cancel nor reprice as long as premiums are paid."},{"term":"Optionally renewable","def":"A policy the insurer may choose not to renew on the anniversary or premium due date."},{"term":"Pre-existing condition","def":"A health problem for which the person received advice, diagnosis, or treatment before coverage began."},{"term":"Principal sum","def":"The full AD&D benefit, paid for accidental death or the most severe dismemberment losses."}],"sections":[{"title":"The Four Kinds of Health Loss","blocks":[{"type":"p","text":"Health insurance is an umbrella term. Underneath it sit several different coverages, and each one is built for a different kind of financial harm. Before you study any policy detail, learn to ask one question: what loss is this policy meant to replace?"},{"type":"p","text":"<b>Medical expense insurance<\/b> pays the cost of care. Think of hospital stays, surgery, office visits, lab work, and prescriptions. Benefits may be paid to the provider or reimbursed to the insured, and the amount depends on what the care actually cost."},{"type":"p","text":"<b>Disability income insurance<\/b> has nothing to do with medical bills. It replaces a portion of the paycheck when the insured cannot work because of injury or sickness. Benefits are paid to the insured, usually monthly, after a waiting period ends."},{"type":"p","text":"<b>Accidental death and dismemberment (AD&D)<\/b> pays a stated amount when an accident causes death or the loss of limbs or eyesight. The full amount is the principal sum. A smaller amount, called the capital sum, is paid for less severe losses such as one hand or the sight of one eye. AD&D pays nothing for death from illness."},{"type":"p","text":"<b>Long-term care insurance<\/b> covers extended custodial help for people who can no longer manage everyday activities such as bathing, dressing, or eating on their own. Care may be given in a nursing home, an assisted living facility, or the insured's own home."},{"type":"table","head":["Coverage","Loss it answers","How it pays"],"rows":[["Medical expense","Cost of treatment","Based on actual charges"],["Disability income","Lost earnings","Periodic income, usually monthly"],["AD&D","Accidental death or loss of limb or sight","Principal sum or capital sum"],["Long-term care","Cost of ongoing custodial care","Daily or monthly benefit up to policy limits"]]},{"type":"example","text":"Marcus breaks his leg badly in a car wreck. His medical plan pays the surgeon and the hospital. His disability income policy sends him a monthly check while he cannot drive his delivery route. His AD&D policy pays nothing, because he did not die or lose a limb."},{"type":"flow","nodes":["Identify the loss","Match the coverage","Check how it pays"],"caption":"A simple way to sort any health insurance question"},{"type":"tip","text":"If a question mentions the capital sum, it is describing an AD&D dismemberment benefit, not a death benefit."}]},{"title":"Accident, Sickness, and Two Definitions of Accident","blocks":[{"type":"p","text":"Health policies separate losses into two causes. An <b>accident<\/b> is a sudden, unforeseen, unintended event that causes bodily injury. A <b>sickness<\/b> is an illness or disease that first shows itself while the policy is in force. The split matters because some policies cover both and some cover only accidents."},{"type":"p","text":"Accident-only coverage costs less than coverage for accident and sickness, since most claims come from illness. A client who buys accident-only coverage and then has a heart attack will collect nothing, so the agent needs to make that limit clear at the point of sale."},{"type":"h","text":"Two ways to define an accident"},{"type":"p","text":"Insurers have used two different wordings to decide whether an injury counts as accidental. They sound alike, but one is much tougher on the insured."},{"type":"p","text":"Under <b>accidental means<\/b>, both the cause of the injury and the injury itself must be unexpected and unintended. If the insured did something on purpose and got hurt in the process, the cause was not accidental, so the claim can be denied."},{"type":"p","text":"Under <b>accidental bodily injury<\/b>, sometimes called the results definition, only the injury has to be unexpected. The action that led to it can be intentional. This wording is more generous to the insured and is the one most modern policies use."},{"type":"table","head":["Definition","What must be accidental","Effect on the insured"],"rows":[["Accidental means","The cause and the result","Stricter, fewer claims paid"],["Accidental bodily injury","The result only","Broader, more claims paid"]]},{"type":"example","text":"Dana deliberately jumps off a loading dock to save time and breaks her ankle. Under accidental bodily injury wording the claim is paid, because she never meant to break her ankle. Under accidental means wording it could be denied, because the jump itself was intentional. If she had slipped off the dock instead, both definitions would pay."},{"type":"list","items":["Slip, trip, or unintended fall: covered under both definitions","Intentional act with an unintended injury: covered only under accidental bodily injury","Intentionally self-inflicted injury: covered under neither"]},{"type":"tip","text":"Remember that accidental means is the meaner, more restrictive definition because it tests the cause as well as the result."}]},{"title":"Limited Policies","blocks":[{"type":"p","text":"A <b>limited policy<\/b> covers only certain causes of loss or pays only a narrow, fixed benefit. These products are inexpensive and can fill gaps, but they are not a replacement for comprehensive medical coverage. Policies of this kind must make their limited nature clear to the buyer."},{"type":"h","text":"Common limited policies"},{"type":"list","items":["Hospital indemnity: pays a flat dollar amount for each day the insured is confined in a hospital, such as 200 dollars per day. The payment does not depend on the hospital bill and goes straight to the insured to use as they wish.","Dread disease or specified disease: pays only for a named illness, with cancer policies being the classic example.","Critical illness: pays a lump sum when the insured is first diagnosed with a listed serious condition, such as a heart attack, stroke, or kidney failure.","Accident-only: pays for injury, disability, or death caused by an accident and nothing for sickness.","Dental: covers preventive, basic, and major dental work, usually with a yearly maximum.","Vision: covers eye exams and helps pay for glasses or contact lenses.","Short-term medical: temporary medical coverage for people between plans, such as someone changing jobs. It runs for a limited period and normally does not cover pre-existing conditions."]},{"type":"p","text":"Dental plans deserve a little extra attention. Routine and preventive services such as cleanings and exams are usually paid at the highest level to encourage regular care. Fillings and other basic work are paid at a lower percentage, and major work such as crowns or dentures at a lower level still."},{"type":"p","text":"Limited policies generally pay in addition to any other coverage the insured has. That makes them useful as supplements. A hospital indemnity check can cover a deductible, groceries, or rent while the insured is recovering."},{"type":"example","text":"Luis owns a hospital indemnity policy that pays 150 dollars per day. He spends four days in the hospital, and his major medical plan pays most of the bill. The indemnity policy still sends Luis 600 dollars, which he uses toward his deductible."},{"type":"flow","nodes":["Covered event occurs","Policy checks the trigger","Fixed benefit paid to insured"],"caption":"How a fixed-benefit limited policy pays"},{"type":"tip","text":"A hospital indemnity policy pays a set daily amount no matter what the hospital actually charges."}]},{"title":"Common Exclusions and Limitations","blocks":[{"type":"p","text":"No health policy covers everything. An <b>exclusion<\/b> removes a cause of loss from coverage completely. A limitation leaves the loss covered but caps or narrows the benefit, for example by limiting the number of visits or the dollar amount paid."},{"type":"p","text":"Exclusions exist for practical reasons. Some losses are catastrophic and impossible to price, some are within the insured's control, and some are already paid for by another program. Removing them keeps premiums affordable for everyone in the pool."},{"type":"h","text":"Exclusions you will see most often"},{"type":"list","items":["Injuries that are intentionally self-inflicted","Losses caused by war or an act of war","Injury or sickness while serving on active military duty","Injuries suffered while committing a felony or taking part in an illegal activity","Elective cosmetic surgery, as opposed to reconstructive surgery needed after an accident or illness","Conditions covered by workers' compensation or similar laws","Care received in a government facility when the insured has no obligation to pay"]},{"type":"p","text":"Notice the pattern in the workers' compensation exclusion. A job-related injury is already paid by the employer's coverage, so an individual health policy steps aside to avoid paying twice for the same loss."},{"type":"p","text":"Limitations work differently. A policy might cover mental health visits, physical therapy, or chiropractic care but only up to a stated number of sessions. Dental plans often apply waiting periods before major work is covered. A waiting or probationary period at the start of a policy can also delay coverage for sickness so that people do not buy insurance only after they feel ill."},{"type":"example","text":"Priya has a nose operation purely to change her appearance, and her policy denies the claim as elective cosmetic surgery. A year later she breaks her nose in a bicycle crash. The surgery to repair it is reconstructive, so it is covered."},{"type":"tip","text":"Cosmetic surgery is excluded only when it is elective; surgery to correct damage from an accident is normally covered."}]},{"title":"Pre-existing Conditions","blocks":[{"type":"p","text":"A <b>pre-existing condition<\/b> is a health problem that existed before coverage started. Policies usually define it as a condition for which the person received medical advice, diagnosis, care, or treatment within a stated period before the effective date, or one with symptoms that would lead an ordinarily careful person to seek care."},{"type":"p","text":"Insurers care about this because of adverse selection. If people could wait until they were sick and then buy coverage for that exact problem, premiums would not hold up. A pre-existing condition provision limits that risk by excluding or delaying benefits for the earlier condition."},{"type":"h","text":"How the rules differ by product"},{"type":"p","text":"The federal Affordable Care Act changed the picture for comprehensive medical plans. Major medical policies that comply with the Act cannot refuse coverage, charge more, or exclude benefits because of a pre-existing condition."},{"type":"p","text":"That protection does not reach every product. Pre-existing condition limits can still appear in coverages that fall outside those rules, including:"},{"type":"list","items":["Short-term medical policies","Disability income policies","Long-term care policies","Medicare supplement policies, for a limited period","Many fixed-benefit and other limited policies"]},{"type":"p","text":"Two time periods appear in most pre-existing condition provisions. The look-back period is how far before the effective date the insurer reviews the person's history. The exclusion period is how long after the effective date benefits for that condition are withheld. Once the exclusion period ends, the condition is covered like any other."},{"type":"flow","nodes":["Look-back period","Effective date","Exclusion period","Condition covered"],"caption":"Timeline of a typical pre-existing condition provision"},{"type":"example","text":"Tom is treated for a back problem in March and buys a disability income policy in June. The policy excludes pre-existing conditions for a stated period after issue. If his back disables him during that period, the claim may be denied. A disability from an unrelated cause, such as a broken arm, would still be covered."},{"type":"tip","text":"ACA-compliant major medical plans may not exclude pre-existing conditions, but short-term, disability, and long-term care policies still can."}]},{"title":"Renewability Provisions","blocks":[{"type":"p","text":"The renewability provision answers a simple question: who decides whether this policy continues, and who decides what it costs? Unlike life insurance, health policies are often renewed period by period, so this clause carries real weight. The more protection it gives the insured, the higher the premium."},{"type":"p","text":"A <b>noncancellable<\/b> policy gives the insured the strongest rights. The insurer cannot cancel it, cannot refuse to renew it, and cannot raise the premium, as long as premiums are paid. This wording is most common in disability income policies and typically runs to a stated age such as 65."},{"type":"p","text":"A <b>guaranteed renewable<\/b> policy must also be renewed, and the insurer cannot change the benefits on its own. The difference is price. The insurer may raise premiums, but only for an entire class of insureds, never for one person because of their claims or health. Long-term care and Medicare supplement policies are guaranteed renewable."},{"type":"p","text":"A <b>conditionally renewable<\/b> policy may be non-renewed, but only for reasons spelled out in the contract, such as reaching a certain age or leaving the occupation. The insured's worsening health cannot be the reason."},{"type":"p","text":"An <b>optionally renewable<\/b> policy lets the insurer decline to renew on the policy anniversary or premium due date, for any reason. It cannot end the policy in the middle of a paid term. Premiums may be increased by class."},{"type":"p","text":"A <b>cancellable<\/b> policy gives the insured the least security. The insurer may end it at any time by sending written notice and returning any unearned premium. Claims that arose before cancellation must still be paid."},{"type":"table","head":["Provision","Can the insurer end it?","Can the insurer raise premiums?"],"rows":[["Noncancellable","No","No"],["Guaranteed renewable","No","Yes, by class only"],["Conditionally renewable","Only for reasons stated in the policy","Yes, by class"],["Optionally renewable","Yes, at anniversary or premium due date","Yes, by class"],["Cancellable","Yes, at any time with notice","Yes"]]},{"type":"tip","text":"Both noncancellable and guaranteed renewable policies must be renewed; the only difference is that guaranteed renewable premiums can go up by class."}]}],"summary":{"recap":["Health insurance covers four broad kinds of loss. Medical expense insurance pays for treatment, disability income replaces earnings, AD&D pays for accidental death or loss of limb or sight, and long-term care pays for extended custodial help.","Policies treat accidents and sickness separately. Accidental means requires both the cause and the result to be unexpected, while accidental bodily injury looks only at the result and is more favorable to the insured.","Limited policies such as hospital indemnity, dread disease, critical illness, accident-only, dental, vision, and short-term medical cover narrow risks or pay fixed amounts. They supplement comprehensive coverage and do not replace it.","Most policies exclude self-inflicted injuries, war, active military service, felony-related injuries, elective cosmetic surgery, and losses paid by workers' compensation.","Pre-existing condition exclusions are barred in ACA-compliant major medical plans but remain in products such as short-term medical, disability income, and long-term care.","Renewability runs from noncancellable, the strongest for the insured, through guaranteed renewable, conditionally renewable, and optionally renewable, down to cancellable, the weakest."],"avaSummary":"Nice work finishing chapter thirteen. Let me pull it together for you. First, health insurance is not one product. Medical expense coverage pays the bills for care. Disability income replaces a paycheck. Accidental death and dismemberment pays the principal sum for death or the worst losses and the capital sum for lesser ones. Long-term care pays for extended help with daily living. Always start by asking which loss the policy is meant to cover. Second, know your accident definitions. Accidental means is strict, because the cause and the result must both be unexpected. Accidental bodily injury is broader, because only the result has to be unexpected. Third, limited policies. Hospital indemnity pays a flat amount per day in the hospital. Dread disease and critical illness policies pay for named conditions. Accident-only ignores sickness completely. Dental, vision, and short-term medical each cover a narrow need. None of them replaces a full medical plan. Fourth, exclusions. Expect to see self-inflicted injury, war, military service, felonies, elective cosmetic surgery, and anything paid by workers' compensation. Fifth, pre-existing conditions cannot be excluded by major medical plans under the Affordable Care Act, but they still matter in short-term, disability, and long-term care policies. Finally, renewability. Noncancellable means no cancellation and no rate increase. Guaranteed renewable means no cancellation, but rates can rise for a whole class. Conditionally renewable can end for reasons listed in the policy. Optionally renewable can end at renewal time. Cancellable can end at any time with notice. Review the tables once more, then try the chapter exam. You are ready.","reviewNotes":[{"objective":"Identify the four main types of health insurance losses and the benefits that respond to each","concepts":["Medical expense insurance pays for the cost of treatment","Disability income insurance replaces part of lost earnings with periodic payments","AD&D pays only for accidental death or loss of limb or sight","Long-term care insurance pays for extended custodial care at home or in a facility"],"terms":[{"term":"Principal sum","def":"The full AD&D amount, paid for accidental death or the most severe losses."},{"term":"Capital sum","def":"A portion of the principal sum paid for lesser dismemberment or sight losses."}]},{"objective":"Distinguish an accident from a sickness and accidental means from accidental bodily injury","concepts":["An accident is sudden, unforeseen, and unintended","A sickness is an illness or disease that first appears while the policy is in force","Accidental means requires an unexpected cause and an unexpected result","Accidental bodily injury requires only an unexpected result and is more liberal"],"terms":[{"term":"Accidental means","def":"The strict definition that tests both cause and result."},{"term":"Accidental bodily injury","def":"The results-based definition used in most modern policies."}]},{"objective":"Describe the common limited policies and what each one pays","concepts":["Limited policies cover narrow risks or pay fixed amounts","Hospital indemnity pays a flat daily amount regardless of actual charges","Dread disease and critical illness policies pay for named conditions","Accident-only policies pay nothing for sickness","Short-term medical is temporary and usually excludes pre-existing conditions"],"terms":[{"term":"Hospital indemnity policy","def":"Pays a fixed amount per day of hospital confinement directly to the insured."},{"term":"Dread disease policy","def":"Covers one named disease, such as cancer, or a short list of them."}]},{"objective":"Recognize the exclusions and limitations found in most health policies","concepts":["An exclusion removes a cause of loss entirely","A limitation covers a loss but restricts the benefit","Common exclusions include self-inflicted injury, war, military service, and felony-related injuries","Elective cosmetic surgery is excluded, while reconstructive surgery after an accident is covered","Losses paid by workers' compensation are excluded"],"terms":[{"term":"Exclusion","def":"A policy provision that eliminates coverage for a stated cause of loss."},{"term":"Limitation","def":"A provision that caps or narrows the benefit for a covered loss."}]},{"objective":"Explain how pre-existing condition rules affect coverage","concepts":["A pre-existing condition is one that received advice, diagnosis, or treatment before coverage began","The provision protects the insurer against adverse selection","ACA-compliant major medical plans cannot exclude pre-existing conditions","Short-term medical, disability income, and long-term care policies may still apply these limits"],"terms":[{"term":"Pre-existing condition","def":"A health problem that existed and was treated or advised on before the policy took effect."},{"term":"Exclusion period","def":"The time after the effective date during which a pre-existing condition is not covered."}]},{"objective":"Compare the five renewability provisions and who holds the right to continue or change the policy","concepts":["Noncancellable: insurer cannot cancel or raise premiums","Guaranteed renewable: insurer must renew but may raise premiums by class","Conditionally renewable: insurer may non-renew only for reasons stated in the contract","Optionally renewable: insurer may non-renew at anniversary or premium due date","Cancellable: insurer may cancel at any time with written notice and a refund of unearned premium"],"terms":[{"term":"Noncancellable","def":"Guarantees both renewal and the premium."},{"term":"Guaranteed renewable","def":"Guarantees renewal but not the premium."},{"term":"Cancellable","def":"May be ended by the insurer at any time with proper notice."}]}]},"exam":[{"q":"Which type of health insurance is designed to replace a portion of the insured's earnings?","choices":["Medical expense insurance","Disability income insurance","Hospital indemnity insurance","Accidental death and dismemberment"],"answer":1,"why":"Disability income insurance pays periodic benefits to replace lost earnings when the insured cannot work."},{"q":"Under an AD&D policy, the amount paid for accidental death is called the","choices":["capital sum","face reserve","principal sum","indemnity limit"],"answer":2,"why":"The principal sum is the full AD&D benefit paid for accidental death or the most severe losses."},{"q":"An insured with AD&D coverage loses the sight of one eye in an accident. The benefit paid is most likely the","choices":["capital sum","principal sum","daily indemnity","actual medical cost"],"answer":0,"why":"Lesser losses such as the sight of one eye are paid as the capital sum, a portion of the principal sum."},{"q":"An AD&D policy would pay nothing in which situation?","choices":["The insured dies in a car crash","The insured loses both hands in a machinery accident","The insured loses a foot in a fall","The insured dies of pneumonia"],"answer":3,"why":"AD&D covers only accidental losses, so death from illness is not covered."},{"q":"Which definition of accident requires that both the cause and the result be unexpected?","choices":["Accidental bodily injury","Results definition","Accidental means","Unintended injury clause"],"answer":2,"why":"Accidental means tests both the cause and the result, making it the stricter definition."},{"q":"An insured purposely jumps from a porch and breaks a leg. The claim would most likely be paid under which definition?","choices":["Accidental bodily injury","Accidental means","Neither definition","Sickness definition"],"answer":0,"why":"Accidental bodily injury requires only that the injury be unexpected, even if the act was intentional."},{"q":"Compared with accidental means, the accidental bodily injury definition is","choices":["more restrictive for the insured","more favorable to the insured","used only in life insurance","limited to job-related injuries"],"answer":1,"why":"Because only the result must be unexpected, more claims qualify under accidental bodily injury."},{"q":"A policy that pays 200 dollars for each day the insured is hospitalized, regardless of the bill, is a","choices":["major medical policy","dread disease policy","disability income policy","hospital indemnity policy"],"answer":3,"why":"Hospital indemnity policies pay a fixed daily amount that does not depend on actual charges."},{"q":"A cancer-only policy is an example of","choices":["comprehensive medical insurance","a dread disease policy","disability income insurance","long-term care insurance"],"answer":1,"why":"A dread or specified disease policy covers a named illness such as cancer."},{"q":"Which policy typically pays a lump sum when the insured is first diagnosed with a listed condition such as a stroke?","choices":["Critical illness","Accident-only","Vision","Short-term medical"],"answer":0,"why":"Critical illness policies pay a lump sum on diagnosis of a covered serious condition."},{"q":"A person between jobs who needs temporary medical coverage would most likely buy","choices":["long-term care insurance","a dread disease policy","short-term medical insurance","an AD&D policy"],"answer":2,"why":"Short-term medical provides temporary coverage for people in a gap between plans."},{"q":"An insured with an accident-only policy is hospitalized after a heart attack. The policy will pay","choices":["the full hospital bill","half of the hospital bill","a daily indemnity only","nothing"],"answer":3,"why":"Accident-only policies do not cover losses caused by sickness."},{"q":"Which of the following is commonly excluded from a health insurance policy?","choices":["Emergency room treatment after a fall","Surgery to repair injuries from a car accident","Intentionally self-inflicted injury","Hospitalization for pneumonia"],"answer":2,"why":"Intentionally self-inflicted injuries are a standard exclusion in health policies."},{"q":"An individual health policy usually excludes on-the-job injuries because","choices":["they are covered by workers' compensation","they are never serious","employers are not allowed to buy insurance","they are considered pre-existing"],"answer":0,"why":"Workers' compensation already pays for job-related injuries, so health policies exclude them to avoid duplicate payment."},{"q":"Which surgery would most likely be covered by a medical expense policy?","choices":["An elective face-lift","Reconstructive surgery after an accident","Elective liposuction","A purely cosmetic nose reshaping"],"answer":1,"why":"Elective cosmetic surgery is excluded, but reconstructive surgery needed because of an accident is covered."},{"q":"A pre-existing condition is best described as a condition that","choices":["develops after the policy has been in force for a year","is caused by an accident at work","the insurer discovers during a claim audit","was treated or advised on before coverage began"],"answer":3,"why":"A pre-existing condition is one for which advice, diagnosis, or treatment was received before the effective date."},{"q":"Under the Affordable Care Act, a compliant major medical plan","choices":["may exclude pre-existing conditions for one year","may charge more for pre-existing conditions","may not exclude pre-existing conditions","may decline applicants with pre-existing conditions"],"answer":2,"why":"ACA-compliant major medical plans cannot deny, surcharge, or exclude coverage because of pre-existing conditions."},{"q":"Which renewability provision prevents the insurer from both cancelling the policy and raising the premium?","choices":["Noncancellable","Guaranteed renewable","Optionally renewable","Conditionally renewable"],"answer":0,"why":"A noncancellable policy guarantees both continued coverage and the premium."},{"q":"Under a guaranteed renewable policy, the insurer may","choices":["cancel the policy after a large claim","raise premiums for an entire class of insureds","raise the premium of one insured because of poor health","refuse renewal at the policy anniversary"],"answer":1,"why":"Guaranteed renewable policies must be renewed, but premiums can be increased on a class basis."},{"q":"A policy that the insurer may end at any time by giving written notice and refunding unearned premium is","choices":["noncancellable","guaranteed renewable","conditionally renewable","cancellable"],"answer":3,"why":"A cancellable policy may be terminated by the insurer at any time with proper notice and a refund of unearned premium."}]},{"id":"ch14","num":14,"title":"Health Insurance Providers","intro":{"hook":["Two neighbors both say they have good health insurance. One can walk into almost any doctor's office in the country. The other must start with a single primary doctor and stay inside one network. They pay very different amounts, and both are happy. How can that be?","The answer is that health coverage comes from many different kinds of organizations, and each is built on a different trade between freedom of choice and cost. This chapter walks through who provides health coverage: commercial insurers, service organizations, HMOs, PPOs and their cousins, employers that fund their own plans, and government programs.","As an agent you will be asked which plan is right for a family or a business. You cannot answer that until you know how each provider type works, how it pays doctors, and how it keeps costs under control. The exam tests these differences closely."],"objectives":["Compare commercial insurers with service organizations such as Blue Cross Blue Shield","Describe how an HMO operates, including the gatekeeper, capitation, and the four HMO models","Differentiate PPO, EPO, and POS plans by network rules and out-of-network coverage","Explain self-funded plans and the roles of third-party administrators and stop-loss insurance","Identify what a MEWA is and how it is regulated","Summarize the major government health programs and who each one serves","List the cost containment methods used by health plans"],"avaIntro":"Hello again, it is Ava. In the last chapter we looked at what health insurance pays for. In chapter fourteen we ask a different question: who is actually providing the coverage? You will meet traditional insurance companies, the Blue Cross Blue Shield plans, and the managed care family, which includes HMOs, PPOs, EPOs, and point of service plans. I will show you how each one pays doctors and how much freedom the member has to choose a provider. Then we will look at employers that pay claims out of their own pocket, the administrators and stop-loss insurers that help them, and groups of employers that band together. We will finish with government programs and the tools plans use to hold costs down. There are many abbreviations here, so keep the keyword list close. Ready? Let us begin."},"keywords":[{"term":"Capitation","def":"A fixed payment per member, per month, made to a provider regardless of how much care the member uses."},{"term":"Case management","def":"Coordination of care for a seriously ill or injured member to find effective, cost-efficient treatment."},{"term":"CHIP","def":"The Children's Health Insurance Program, covering children in families that earn too much for Medicaid but cannot afford private coverage."},{"term":"EPO","def":"Exclusive provider organization, a plan that covers only network providers except in an emergency."},{"term":"Gatekeeper","def":"The primary care physician who directs a member's care and approves referrals to specialists."},{"term":"HMO","def":"Health maintenance organization, a prepaid plan that both finances and delivers care within a service area."},{"term":"IPA","def":"Independent practice association, an HMO model using independent physicians who work from their own offices."},{"term":"Medicaid","def":"A joint federal and state program that pays for medical care for people with low income and limited resources."},{"term":"Medicare","def":"The federal health program mainly for people 65 and older and certain disabled individuals."},{"term":"MEWA","def":"Multiple employer welfare arrangement, in which two or more employers join to provide benefits to their employees."},{"term":"POS plan","def":"Point of service plan, a hybrid that lets a member choose network or non-network care each time care is needed."},{"term":"PPO","def":"Preferred provider organization, a network of providers who accept discounted fees, with out-of-network care allowed at higher cost."},{"term":"Self-funded plan","def":"A plan in which the employer pays employee claims from its own funds instead of buying insurance."},{"term":"Stop-loss insurance","def":"Coverage that reimburses a self-funded employer when claims exceed a set threshold."},{"term":"Third-party administrator (TPA)","def":"An outside firm that processes claims and handles paperwork for a self-funded plan without bearing the risk."},{"term":"Utilization review","def":"Evaluation of whether care is necessary and appropriate, done before, during, or after treatment."}],"sections":[{"title":"Commercial Insurers and Service Organizations","blocks":[{"type":"p","text":"The most traditional source of health coverage is the <b>commercial insurer<\/b>. These are stock and mutual insurance companies that sell individual and group policies. Many of them also sell life insurance and annuities."},{"type":"p","text":"Commercial insurers have historically worked on a reimbursement basis. The insured receives care, a bill is produced, and the insurer pays benefits according to the policy. Payment may go to the insured or, if the insured assigns benefits, straight to the provider. In a classic fee-for-service arrangement the insured may use any licensed provider, and the provider is paid for each service performed."},{"type":"h","text":"Service organizations"},{"type":"p","text":"<b>Blue Cross and Blue Shield<\/b> plans grew up differently. They are service organizations rather than traditional insurers. Instead of reimbursing the member, they deliver benefits in the form of services by contracting directly with hospitals and physicians. The member pays a subscription in advance, which is why these are called prepaid plans, and the person covered is called a subscriber."},{"type":"list","items":["Blue Cross historically covers hospital services","Blue Shield historically covers physician and surgical services","Providers agree by contract to accept set payment amounts","The plan pays the provider directly, not the subscriber"]},{"type":"p","text":"Because the provider has a contract with the plan, the provider accepts the plan's payment schedule. The subscriber is not billed for the difference between the provider's usual charge and the agreed amount, other than any deductible or copayment the plan requires."},{"type":"table","head":["Feature","Commercial insurer","Service organization"],"rows":[["How benefits are delivered","Reimbursement of expenses","Services from contracted providers"],["Who is paid","Insured, or provider if assigned","Provider directly"],["Person covered is called","Insured","Subscriber"],["Timing of payment for coverage","Premium for a policy","Prepaid subscription"]]},{"type":"flow","nodes":["Subscriber prepays","Plan contracts with providers","Provider treats subscriber","Plan pays provider"],"caption":"How a service organization delivers benefits"},{"type":"tip","text":"Commercial insurers reimburse; service organizations such as Blue Cross Blue Shield pay contracted providers directly on a prepaid basis."}]},{"title":"Health Maintenance Organizations","blocks":[{"type":"p","text":"A <b>health maintenance organization (HMO)<\/b> does two jobs that a traditional insurer keeps separate. It finances care and it also arranges or delivers that care. Members pay a fixed amount in advance and in return receive a broad range of services from the HMO's own providers within a defined geographic service area."},{"type":"p","text":"HMOs are built around prevention. Routine physicals, immunizations, and screenings are covered because finding problems early costs less than treating them late. Members usually pay a small copayment at each visit rather than a large deductible."},{"type":"h","text":"Gatekeeper and capitation"},{"type":"p","text":"Each member chooses a primary care physician, known as the <b>gatekeeper<\/b>. The gatekeeper handles routine care and decides when a specialist is needed. Without a referral, a specialist visit is normally not covered. Emergencies are the exception and are covered even outside the network or service area."},{"type":"p","text":"Many HMO providers are paid by <b>capitation<\/b>. The provider receives a flat amount per member each month, whether the member visits ten times or never. This shifts some financial risk to the provider and rewards keeping members healthy rather than performing more procedures."},{"type":"h","text":"The four models"},{"type":"table","head":["Model","How physicians are engaged"],"rows":[["Staff","Doctors are salaried employees of the HMO and work in HMO facilities"],["Group","The HMO contracts with one independent multi-specialty medical group"],["Network","The HMO contracts with two or more independent medical groups"],["IPA","The HMO contracts with an association of independent doctors who keep their own offices and may see non-HMO patients"]]},{"type":"p","text":"Staff and group models are called closed panel plans because the physicians serve HMO members only. The IPA model is an open panel arrangement, since its doctors continue to treat patients who are not HMO members."},{"type":"example","text":"Renee belongs to an HMO and wants to see a dermatologist. She first visits her primary care physician, who examines her and issues a referral. If she had gone to the dermatologist on her own, the HMO would not have paid for the visit."},{"type":"tip","text":"In a staff model HMO the doctors are paid a salary as employees of the HMO, which sets it apart from every other model."}]},{"title":"PPO, EPO, and POS Plans","blocks":[{"type":"p","text":"Not everyone wants the tight structure of an HMO. Three other managed care designs loosen the rules in different ways. The exam expects you to tell them apart by two things: whether a gatekeeper is required, and what happens when the member goes outside the network."},{"type":"p","text":"A <b>preferred provider organization (PPO)<\/b> is a group of doctors and hospitals that contract with an insurer or employer to provide care at discounted fees. Providers are paid on a fee-for-service basis, not by capitation. Members do not need a primary care physician or a referral. They may use any provider, but the plan pays a larger share when they stay in the network."},{"type":"p","text":"An <b>exclusive provider organization (EPO)<\/b> looks like a PPO on the inside but closes the door on outside care. Members generally do not need a gatekeeper, yet the plan pays nothing for non-network providers unless it is an emergency. In exchange for that restriction, premiums are usually lower than for a comparable PPO."},{"type":"p","text":"A <b>point of service (POS) plan<\/b> blends HMO and PPO features. The member has a primary care physician who coordinates care, as in an HMO. The difference is that each time care is needed, at the point of service, the member may decide to go outside the network. Doing so means higher deductible
