name: B045 Clean Tree Check
on:
  push:
    branches: [social-professional-b045]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-professional-b045
      - name: Verify clean release tree
        run: |
          node --check social-connection-center.js
          node tests/social-professional-b045-contract.mjs
          npm test
          git diff --exit-code -- deno.lock
