name: Apply Maya B037 Staging

on:
  push:
    branches: [maya-creative-b037]
    paths:
      - '.github/workflows/apply-maya-b037-staging.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maya-creative-b037

      - name: Reconstruct exact B037 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/ai-maya-marketing-manager supabase/seeds tests docs
          cat .staging/maya/fn.* | base64 -d | gzip -d > supabase/functions/ai-maya-marketing-manager/index.ts
          cat .staging/maya/seed.* | base64 -d | gzip -d > supabase/seeds/maya-marketing-capabilities-b037.sql
          cat .staging/maya/test.* | base64 -d | gzip -d > tests/maya-marketing-manager-contract.mjs
          cat .staging/maya/doc.* | base64 -d | gzip -d > docs/maya-b037-professional-readiness.md

      - name: Verify exact payload hashes
        shell: bash
        run: |
          set -euo pipefail
          echo '7238ed7ae341d7d521bb5b57c917f606e8ef83f9eaad23e684e324ede688f299  supabase/functions/ai-maya-marketing-manager/index.ts' | sha256sum -c -
          echo 'fd90652fd2dbe858fdeeeaf430e868c9ee6da2391a1f10be1615bec66e690d9e  supabase/seeds/maya-marketing-capabilities-b037.sql' | sha256sum -c -
          echo '0021f6715d6800ef0f020f930a155aea5b9c5fabf66d783576151286267a799e  tests/maya-marketing-manager-contract.mjs' | sha256sum -c -
          echo 'c49a8b0171ccb24c4613eb269c5d494b2f6de6cc80ba0e9cacd41783cfc92f99  docs/maya-b037-professional-readiness.md' | sha256sum -c -

      - name: Verify B037 contract
        shell: bash
        run: |
          set -euo pipefail
          cp supabase/functions/ai-maya-marketing-manager/index.ts /tmp/maya-b037.mjs
          node --check /tmp/maya-b037.mjs
          node tests/maya-marketing-manager-contract.mjs

      - name: Commit clean staged implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git rm -r .staging/maya
          git rm .github/workflows/apply-maya-b037-staging.yml
          git add supabase/functions/ai-maya-marketing-manager/index.ts \
                  supabase/seeds/maya-marketing-capabilities-b037.sql \
                  tests/maya-marketing-manager-contract.mjs \
                  docs/maya-b037-professional-readiness.md
          git commit -m 'Stage Maya B037 professional paid marketing workstation'
          git push origin HEAD:maya-creative-b037
