name: Maya B037 Full Regression

on:
  push:
    branches: [maya-creative-b037]
    paths:
      - '.github/workflows/maya-b037-regression.yml'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maya-creative-b037
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify B037 safety markers
        run: |
          set -euo pipefail
          grep -q 'B2026.08.28.037' supabase/functions/ai-maya-marketing-manager/index.ts
          grep -q 'gpt-5.6-sol' supabase/functions/ai-maya-marketing-manager/index.ts
          grep -q 'gpt-image-2' supabase/functions/ai-maya-marketing-manager/index.ts
          grep -q 'MAYA_VIDEO_PROVIDER_URL' supabase/functions/ai-maya-marketing-manager/index.ts
          ! grep -q 'api.openai.com/v1/videos' supabase/functions/ai-maya-marketing-manager/index.ts
      - name: Remove one-time regression workflow
        if: success()
        run: |
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git rm .github/workflows/maya-b037-regression.yml
          git commit -m 'Record Maya B037 regression pass'
          git push origin HEAD:maya-creative-b037
