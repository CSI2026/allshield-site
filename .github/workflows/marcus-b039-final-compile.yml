name: Marcus B039 Final Compile Repair
on:
  push:
    branches: [marcus-b039]
    paths: ['.github/workflows/marcus-b039-final-compile.yml']
permissions:
  contents: write
jobs:
  compile:
    if: github.event.head_commit.message == 'Add Marcus B039 final compile repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marcus-b039
          fetch-depth: 0
      - name: Repair source and database typing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('supabase/functions/ai-marcus-performance-analyst/index.ts')
          s=p.read_text()
          s,n=re.subn(r'(add\("(?:critical|high|normal|low)",`[^`\n]*?)","',r'\1`,"',s)
          if n < 2:
              raise SystemExit(f'expected at least 2 malformed delimiters, repaired {n}')
          old='async function rows(table:string,select="*",limit=5000){const r=await db.from(table).select(select).limit(limit);if(r.error)throw r.error;return r.data||[]}'
          new='async function rows(table:string,select="*",limit=5000):Promise<any[]>{const r:any=await db.from(table).select(select).limit(limit);if(r.error)throw r.error;return (r.data||[]) as any[]}'
          if old not in s:
              raise SystemExit('rows helper marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          print('repaired template delimiters:',n)
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno compile check
        run: deno check --node-modules-dir=auto supabase/functions/ai-marcus-performance-analyst/index.ts
      - name: Run ALLSHIELD contract suite
        run: npm test
      - name: Commit compile-clean source
        run: |
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git add supabase/functions/ai-marcus-performance-analyst/index.ts
          git commit -m 'Finalize Marcus B039 compile-clean runtime'
          git push origin HEAD:marcus-b039
