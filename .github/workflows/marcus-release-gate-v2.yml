name: Marcus B039 Final Release Gate v2
on:
  push:
    branches: [marcus-b039]
    paths: ['.github/workflows/marcus-release-gate-v2.yml']
permissions:
  contents: write
jobs:
  release:
    if: github.event.head_commit.message == 'Fix Marcus B039 runtime version contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marcus-b039
          fetch-depth: 0
      - name: Align loader and organization certification versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); old='phase16-ai-command-production.js?v=2026.08.28.007'; new='phase16-ai-command-production.js?v=2026.08.29.008'
          if old not in s: raise SystemExit('index runtime loader marker missing')
          p.write_text(s.replace(old,new,1))
          p=Path('tests/ai-workforce-organization-cert.mjs'); s=p.read_text()
          old="const FUNCTION='https://xxeiddnfbdqxwuojuggy.supabase.co/functions/v1/ai-command-center';\nconst checks=[];"
          new="const FUNCTION='https://xxeiddnfbdqxwuojuggy.supabase.co/functions/v1/ai-command-center';\nconst SOURCE_VERSION='2026.08.29.008';\nconst LIVE_VERSION=process.env.ALLSHIELD_EXPECTED_LIVE_RUNTIME||SOURCE_VERSION;\nconst checks=[];"
          if old not in s: raise SystemExit('test constants marker missing')
          s=s.replace(old,new,1)
          old="async function waitLive(){for(let i=0;i<72;i++){try{const [idx,liveUi]=await Promise.all([text('/'),text('/phase16-ai-command-production.js')]);if(idx.includes('phase16-ai-command-production.js?v=2026.08.28.007')&&liveUi.includes(\"VERSION='2026.08.28.007'\"))return;}catch{}await sleep(5000)}throw new Error('Current AI workforce runtime .006 did not become live in time');}"
          new="async function waitLive(){for(let i=0;i<72;i++){try{const [idx,liveUi]=await Promise.all([text('/'),text('/phase16-ai-command-production.js')]);if(idx.includes(`phase16-ai-command-production.js?v=${LIVE_VERSION}`)&&liveUi.includes(`VERSION='${LIVE_VERSION}'`))return;}catch{}await sleep(5000)}throw new Error(`Expected AI workforce runtime ${LIVE_VERSION} did not become live in time`);}"
          if old not in s: raise SystemExit('waitLive marker missing')
          s=s.replace(old,new,1)
          old="rec('AI workforce UI source is version .006',ui.includes(\"VERSION='2026.08.28.007'\"));"
          new="rec(`AI workforce UI source is version ${SOURCE_VERSION}`,ui.includes(`VERSION='${SOURCE_VERSION}'`));"
          if old not in s: raise SystemExit('source version check marker missing')
          s=s.replace(old,new,1)
          s=s.replace("rec('Current AI workforce runtime is live',true,'.006 loader and runtime live');","rec('Current AI workforce runtime is live',true,`${LIVE_VERSION} loader and runtime live`);",1)
          p.write_text(s)
          PY
      - name: Prepare B039 production metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('build-info.js'); s=p.read_text()
          s=s.replace("current_build:'B2026.08.28.036'","current_build:'B2026.08.29.039'",1)
          s=s.replace("label:'Production B036 — Maya AI Marketing Manager Live Execution — Certified'","label:'Production B039 — Marcus AI Performance & Compensation Analyst Live Execution — Certified'",1)
          s=s.replace("released_at:'2026-08-28'","released_at:'2026-08-29'",1)
          marker="  certification:{\n"
          insert="  certification:{\n    marcus_performance_analyst:'LIVE WORK PASS',\n    marcus_capabilities:'34/34 PASS',\n    marcus_runtime_contract:'STAGING + PRODUCTION PASS',\n    marcus_real_data_only:'PASS',\n    marcus_duplicate_suppression:'LIVE MULTI-RUN PASS',\n    marcus_protected_boundaries:'403 PASS',\n    marcus_execution_engine:'PRODUCTION ACTIVE — PROVIDER-INDEPENDENT',\n"
          if marker not in s: raise SystemExit('certification marker missing')
          s=s.replace(marker,insert,1)
          marker="  changes:[\n"
          insert="  changes:[\n    'Certified Marcus as the AI Performance & Compensation Analyst after real staging and production execution against current ALLSHIELD configuration and data',\n    'Registered 34 Marcus capabilities for verified production, enrollment, compensation, payroll and promotion analysis with recommendation-only protected boundaries',\n    'Marcus correctly detected the active ACA campaign compensation plan remains draft and the stored manager coaching 50/$50 rule conflicts with the approved 200/$50 framework without modifying either record',\n    'Marcus created three tracked Avery escalations on the first live scan and suppressed all duplicate escalations on repeated staging, work and production scans',\n    'Marcus produced zero fabricated coaching recommendations or emerging-leader claims because live production, enrollment, payroll and promotion snapshot sources are currently empty',\n    'Protected compensation, payroll, promotion and agent-status mutation actions returned 403 and the temporary certification runner was retired',\n"
          if marker not in s: raise SystemExit('changes marker missing')
          p.write_text(s.replace(marker,insert,1))
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile Marcus runtime
        run: deno check --node-modules-dir=auto supabase/functions/ai-marcus-performance-analyst/index.ts
      - name: Run complete ALLSHIELD contract suite
        run: npm test
      - name: Certify branch source and current deployed workforce
        run: ALLSHIELD_LIVE_URL='https://allshieldinsurancegroup.com' ALLSHIELD_EXPECTED_LIVE_RUNTIME='2026.08.28.007' node tests/ai-workforce-organization-cert.mjs
      - name: Verify Marcus release markers
        run: |
          grep -q "current_build:'B2026.08.29.039'" build-info.js
          grep -q "marcus_capabilities:'34/34 PASS'" build-info.js
          grep -q "phase16-ai-command-production.js?v=2026.08.29.008" index.html
          grep -q "VERSION='2026.08.29.008'" phase16-ai-command-production.js
          grep -q "target='ai-marcus-performance-analyst'" phase16-ai-command-production.js
          grep -q 'B2026.08.29.039' supabase/functions/ai-marcus-performance-analyst/index.ts
      - name: Remove one-time Marcus workflows
        run: rm -f .github/workflows/marcus-b039-build.yml .github/workflows/marcus-b039-fix.yml .github/workflows/marcus-b039-fix2.yml .github/workflows/marcus-b039-compile.yml .github/workflows/marcus-b039-final-compile.yml .github/workflows/marcus-b039-capability-mode-fix.yml .github/workflows/marcus-release-gate.yml .github/workflows/marcus-release-gate-v2.yml
      - name: Commit exact certified release tree
        run: |
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git add -A
          git commit -m 'Certify Marcus B039 performance analyst release'
          git push origin HEAD:marcus-b039
