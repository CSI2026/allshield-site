e":"h","text":"Policy loans"},{"type":"p","text":"A <b>policy loan<\/b> lets the owner of a cash value policy borrow from the insurer, using the cash value as security. Term policies have no cash value and so offer no loans. Key points to remember:"},{"type":"list","items":["The owner may borrow up to the available cash value, less interest","The insurer charges interest, and unpaid interest is added to the loan balance","The loan does not have to be repaid on any schedule","Any unpaid loan and interest is subtracted from the death benefit at claim time, or from the cash value at surrender","If the loan balance grows to equal the cash value, the policy terminates","The insurer may delay a loan request for up to six months, except when the loan is to pay premiums"]},{"type":"example","text":"Priya has a 100,000 dollar whole life policy with 20,000 dollars of cash value. She borrows 8,000 dollars for a roof repair and never repays it. When she dies, the loan balance with interest is 9,000 dollars, so her beneficiary receives 91,000 dollars."},{"type":"p","text":"Loans are not the same as withdrawals. A loan leaves the policy intact with a debt against it, while a withdrawal, available on universal life, permanently removes money from the policy."},{"type":"tip","text":"An outstanding policy loan never voids a claim; it just reduces the amount the beneficiary receives."}]},{"title":"Nonforfeiture Options","blocks":[{"type":"p","text":"Cash value belongs to the policyowner. If the owner stops paying premiums on a permanent policy, the law does not let the insurer keep that value. <b>Nonforfeiture options<\/b> are the guaranteed choices for what happens to it. The policy must include a table showing these values for at least the first 20 years."},{"type":"h","text":"Cash surrender"},{"type":"p","text":"The owner gives up the policy and receives the cash surrender value in a lump sum. Coverage ends completely, and a surrendered policy cannot be reinstated. The insurer may defer payment for up to six months, although this is rarely done. Any amount received above the total premiums paid is taxable."},{"type":"h","text":"Reduced paid-up insurance"},{"type":"p","text":"The cash value is used as a single premium to buy a smaller policy of the same type as the original. No more premiums are ever due. The new policy lasts as long as the original would have, to age 100 or maturity for whole life, and it continues to build cash value. The trade is a lower face amount for permanent protection."},{"type":"h","text":"Extended term insurance"},{"type":"p","text":"The cash value is used as a single premium to buy term insurance for the same face amount as the original policy. The coverage lasts only as long as the cash value will pay for, a number of years and days shown in the policy table. When that term runs out, coverage ends. This is usually the <b>automatic option<\/b>, the one the insurer applies if the owner stops paying and does not choose."},{"type":"table","head":["Option","Face amount","How long it lasts"],"rows":[["Cash surrender","None, coverage ends","Ends immediately"],["Reduced paid-up","Lower than original","For life or to maturity"],["Extended term","Same as original","Limited period only"]]},{"type":"example","text":"Leo, age 55, can no longer afford his 200,000 dollar whole life policy. His kids are grown, but he wants something to remain for final expenses for the rest of his life. Reduced paid-up fits him best. If he instead wanted the full 200,000 dollars for the next several years while his mortgage is paid off, extended term would be the better fit."},{"type":"tip","text":"Extended term keeps the same face amount for a shorter time, while reduced paid-up keeps the same duration for a smaller amount."}]},{"title":"Dividend Options","blocks":[{"type":"p","text":"A <b>participating policy<\/b>, usually issued by a mutual insurer, may pay dividends to its policyowners. A dividend is a return of part of the premium, paid when the company's actual results for mortality, interest, and expenses turn out better than it assumed. Dividends are never guaranteed, and an agent must not present them as if they were."},{"type":"p","text":"Because a dividend is considered a refund of premium the owner overpaid, it is generally not subject to income tax. The owner chooses how dividends are used and can change that choice later."},{"type":"list","items":["Cash: the insurer sends a check, usually once a year on the policy anniversary","Reduction of premium: the dividend is applied toward the next premium due, so the owner pays less out of pocket","Accumulation at interest: the insurer holds the dividends in an account that earns interest; the dividends are not taxed, but the interest earned is taxable each year","Paid-up additions: each dividend buys a small, fully paid piece of permanent insurance of the same type as the base policy, which adds to both the death benefit and the cash value","One-year term: the dividend buys one-year term insurance, often in an amount equal to the policy's cash value, which is useful when the owner has a policy loan","Paid-up option: dividends are used to pay the policy up earlier than scheduled"]},{"type":"h","text":"Why paid-up additions matter"},{"type":"p","text":"Paid-up additions are bought at the insured's attained age but with no evidence of insurability. Each addition has its own cash value and may earn its own dividends. Over many years this can raise the total death benefit well above the original face amount. If the owner never picks an option, many insurers apply paid-up additions automatically."},{"type":"flow","nodes":["Insurer has favorable results","Dividend declared","Owner's chosen option applied"],"caption":"A dividend exists only if the board declares one; the owner then decides how it is used."},{"type":"example","text":"Tanya leaves her dividends with the insurer to accumulate at interest. This year she is credited a 300 dollar dividend and 40 dollars of interest. Only the 40 dollars of interest is reported as taxable income."},{"type":"tip","text":"Dividends themselves are not taxable, but interest earned on dividends left with the insurer is."}]},{"title":"Riders: Customizing the Policy","blocks":[{"type":"p","text":"A <b>rider<\/b> is an attachment that adds a benefit to the base policy or changes it, usually for an extra premium. Riders let you fit a standard policy to one person's situation."},{"type":"h","text":"Riders tied to disability or the payor"},{"type":"list","items":["Waiver of premium: if the insured becomes totally disabled, the insurer waives premiums after a waiting period, commonly six months, and refunds premiums paid during that wait; the policy keeps building cash value, and the rider usually ends at age 60 or 65","Payor benefit: used on juvenile policies; if the adult paying the premiums dies or becomes disabled, premiums are waived until the child reaches a stated age, such as 21 or 25"]},{"type":"h","text":"Riders that add or increase coverage"},{"type":"list","items":["Guaranteed insurability: the owner may buy additional coverage at specified ages or life events, such as marriage or the birth of a child, with no proof of insurability; the new coverage is priced at the insured's attained age","Accidental death: pays an extra amount, often equal to the face amount, if death is caused by an accident and occurs within a set time after it, commonly 90 days; this is why it is nicknamed double indemnity","Cost of living: raises the face amount automatically to keep pace with inflation, measured by the Consumer Price Index, without evidence of insurability","Term riders: add term coverage on the insured, a spouse, or children; a children's term rider covers all children for one premium and can usually be converted to permanent coverage without evidence of insurability"]},{"type":"h","text":"Living benefit riders"},{"type":"p","text":"An <b>accelerated death benefit<\/b> pays part of the death benefit while the insured is still alive, typically after a diagnosis of a terminal illness. Whatever is paid early, along with any charge for the advance, is subtracted from what the beneficiary later receives. A <b>long-term care rider<\/b> works in a similar way, drawing on the death benefit to pay for qualifying care when the insured cannot perform a set number of activities of daily living."},{"type":"example","text":"A young couple buys a policy on their newborn. They add a payor benefit so that the policy stays in force if the premium-paying parent dies, and a guaranteed insurability rider so the child can add coverage later regardless of health."},{"type":"tip","text":"Guaranteed insurability waives proof of good health, not the premium; the added coverage is charged at the attained age."}]}],"summary":{"recap":["The policy and its attached application are the entire contract. The insuring clause states the promise to pay, the consideration clause states what each side gives, and the free look lets a new owner return the policy for a full refund, with the clock starting at delivery.","A missed premium does not end coverage right away. The grace period keeps the policy in force, the automatic premium loan can pay the premium from cash value, and reinstatement lets the owner restore a lapsed policy by proving insurability and paying back premiums with interest.","After two years the insurer cannot contest the policy for misstatements in the application. A misstated age or sex leads to an adjusted benefit at any time. Suicide within the exclusion period results in a refund of premiums, and excluded causes such as war or certain aviation are not covered.","Owners can assign a policy absolutely or as collateral, and can borrow against cash value. Unpaid loans and interest reduce the death benefit.","When premiums stop on a cash value policy, the owner chooses cash surrender, reduced paid-up, or extended term. On participating policies, dividends can be taken in cash, used to reduce premiums, left to earn interest, or used to buy paid-up additions or one-year term.","Riders tailor the contract: waiver of premium and payor benefit protect against disability or death of the payer, guaranteed insurability and cost of living riders increase coverage without medical proof, accidental death adds a benefit, and living benefit riders release money before death."],"avaSummary":"Nice work getting through chapter five. Let me pull it together for you. The policy plus the attached application is the entire contract, and nothing outside it counts. The free look starts on the delivery date and gives the owner a full refund if the policy is returned. When a premium is missed, think in order: the grace period keeps coverage going, the automatic premium loan can borrow the premium from cash value, and if the policy still lapses, reinstatement can bring it back with evidence of insurability and back premiums plus interest. Next, the two-year rules. After two years, the insurer cannot contest the policy for misstatements, and the suicide exclusion typically ends. But a misstated age or sex is different. That one adjusts the benefit, and it can happen at any time. For nonforfeiture options, remember this pair. Extended term keeps the full face amount for a limited time and is usually the automatic choice. Reduced paid-up keeps coverage for life at a smaller amount. With dividends, they are a return of premium, never guaranteed, and not taxed, although interest earned on them is. Paid-up additions grow both the death benefit and the cash value. Finally, riders. Waiver of premium helps a disabled insured, payor benefit protects a child's policy, guaranteed insurability lets the owner buy more without a medical exam, and accelerated benefits pay while the insured is still living. Before the exam, go back over every number in this chapter: ten days, thirty-one days, six months, two years, three years. Those are the points most often tested. You are ready for the practice questions.","reviewNotes":[{"objective":"Identify the standard provisions that form the foundation of a life insurance contract","concepts":["The policy and attached application are the whole agreement","Changes require written approval from an officer of the insurer, not the agent","The insuring clause is the promise to pay on proof of death","Consideration is the premium plus application statements from the owner and the promise to pay from the insurer","The free look begins on delivery and gives a full refund"],"terms":[{"term":"Entire contract","def":"The policy and attached application make up the complete agreement."},{"term":"Free look","def":"Period after delivery to return the policy for a full premium refund."}]},{"objective":"Explain how the grace period, reinstatement, and automatic premium loan provisions keep coverage from lapsing","concepts":["The grace period is generally 31 days and coverage continues during it","A claim during the grace period is paid less the overdue premium","An automatic premium loan pays the premium from cash value at the end of the grace period","Reinstatement requires evidence of insurability and back premiums with interest","A surrendered policy cannot be reinstated"],"terms":[{"term":"Grace period","def":"Time after the due date when coverage stays in force without payment."},{"term":"Reinstatement","def":"Restoring a lapsed policy by meeting stated conditions."},{"term":"Automatic premium loan","def":"A loan from cash value that pays an overdue premium."}]},{"objective":"Describe how the incontestability, misstatement, and suicide provisions limit the defenses an insurer can raise","concepts":["The insurer has two years to contest misstatements in the application","Nonpayment of premium is not protected by incontestability","Misstated age or sex adjusts the benefit and applies at any time","Suicide within the exclusion period results in a refund of premiums","War, aviation, and hazardous activities are common exclusions"],"terms":[{"term":"Incontestability","def":"Bars the insurer from voiding the policy for misstatements after two years."},{"term":"Exclusion","def":"A cause of death the policy does not cover."}]},{"objective":"Compare the three nonforfeiture options available to the owner of a cash value policy","concepts":["Cash surrender ends coverage and pays the cash value","Reduced paid-up gives a smaller permanent policy with no more premiums","Extended term gives the original face amount for a limited period","Extended term is usually the automatic option","The insurer may defer a cash surrender payment up to six months"],"terms":[{"term":"Reduced paid-up","def":"Smaller permanent policy bought with the cash value."},{"term":"Extended term","def":"Term coverage for the full face amount bought with the cash value."}]},{"objective":"Distinguish the dividend options offered on participating policies","concepts":["Dividends are a return of premium and are not guaranteed","Dividends are not taxable, but interest earned on them is","Options include cash, reduction of premium, accumulation at interest, paid-up additions, and one-year term","Paid-up additions increase both death benefit and cash value without evidence of insurability"],"terms":[{"term":"Participating policy","def":"A policy that may pay dividends to its owner."},{"term":"Paid-up additions","def":"Small fully paid blocks of permanent insurance bought with dividends."}]},{"objective":"Match common riders to the client need each one is designed to solve","concepts":["Waiver of premium covers premiums during the insured's total disability after a waiting period","Payor benefit waives premiums on a juvenile policy if the payer dies or is disabled","Guaranteed insurability allows added coverage without proof of health at attained-age rates","Accidental death pays an additional amount for death by accident","Accelerated death benefits and long-term care riders pay while the insured is living and reduce the death benefit","A cost of living rider raises the face amount with inflation"],"terms":[{"term":"Rider","def":"An attachment that adds to or changes the base policy."},{"term":"Payor benefit","def":"Waives premiums on a child's policy if the premium payer dies or is disabled."},{"term":"Accelerated death benefit","def":"Early payment of part of the death benefit to a qualifying living insured."}]}]},"exam":[{"q":"Under the entire contract provision, the contract consists of which of the following?","choices":["The policy and the agent's sales illustration","The policy and the attached application","The policy alone","The policy and the insurer's underwriting manual"],"answer":1,"why":"The policy together with a copy of the application attached to it forms the complete agreement."},{"q":"When does the free look period begin?","choices":["When the application is signed","When the policy is issued by the home office","When the first premium is paid","When the policy is delivered to the owner"],"answer":3,"why":"The right to examine the policy starts on the date of delivery to the policyowner."},{"q":"An insured dies 15 days after a premium due date without having paid the premium. What will the insurer do?","choices":["Pay the face amount minus the overdue premium","Deny the claim because the policy lapsed","Pay the full face amount with no deduction","Refund all premiums paid"],"answer":0,"why":"The policy is still in force during the grace period, and the unpaid premium is deducted from the proceeds."},{"q":"Which provision states the insurer's basic promise to pay the death benefit?","choices":["Consideration clause","Entire contract clause","Insuring clause","Assignment clause"],"answer":2,"why":"The insuring clause sets out the insurer's promise to pay upon proof of the insured's death."},{"q":"The automatic premium loan provision is triggered when","choices":["the owner requests a loan in writing","a premium remains unpaid at the end of the grace period","the policy has been lapsed for three years","dividends are not enough to pay the premium"],"answer":1,"why":"The insurer borrows the overdue premium from cash value once the grace period ends unpaid."},{"q":"Which of the following is normally required to reinstate a lapsed life policy?","choices":["A new free look period","Consent of the beneficiary","Payment of the cash surrender value","Evidence of insurability and payment of back premiums with interest"],"answer":3,"why":"Reinstatement requires proof the insured is still insurable and payment of overdue premiums plus interest."},{"q":"An insurer discovers three years after issue that the insured misstated a health condition on the application. The insurer","choices":["may void the policy at any time","may reduce the benefit by half","cannot contest the policy on that basis","must refund premiums only"],"answer":2,"why":"After the two-year contestable period, the incontestability clause prevents the insurer from voiding the policy for misstatements."},{"q":"At claim time the insurer learns the insured was five years older than stated on the application. The insurer will","choices":["adjust the benefit to what the premium would have bought at the correct age","deny the claim for misrepresentation","pay the full face amount because the policy is incontestable","refund the premiums with interest"],"answer":0,"why":"Misstatement of age leads to an adjustment of benefits, and this applies regardless of how long the policy has been in force."},{"q":"If an insured dies by suicide during the suicide exclusion period, the insurer typically","choices":["pays the full face amount","pays half of the face amount","pays nothing at all","refunds the premiums paid"],"answer":3,"why":"Within the exclusion period the insurer's liability is limited to a return of premiums."},{"q":"A policyowner pledges her policy to a bank as security for a business loan. This is","choices":["an absolute assignment","a collateral assignment","a nonforfeiture option","a change of beneficiary"],"answer":1,"why":"A collateral assignment is a temporary, partial transfer of rights to secure a debt."},{"q":"An insured dies with an unpaid policy loan. What happens to the claim?","choices":["The loan balance and interest are subtracted from the death benefit","The claim is denied","The beneficiary must repay the loan before receiving payment","The full face amount is paid and the loan is forgiven"],"answer":0,"why":"Outstanding loans and accrued interest reduce the proceeds paid to the beneficiary."},{"q":"Which nonforfeiture option provides the same face amount as the original policy for a limited time?","choices":["Reduced paid-up","Cash surrender","Extended term","Paid-up additions"],"answer":2,"why":"Extended term uses the cash value to buy term insurance equal to the original face amount for as long as the value lasts."},{"q":"A policyowner who wants lifelong coverage with no more premiums, and accepts a lower face amount, should choose","choices":["extended term","reduced paid-up","cash surrender","automatic premium loan"],"answer":1,"why":"Reduced paid-up provides a smaller permanent policy that needs no further premium payments."},{"q":"If a policyowner stops paying premiums and selects no nonforfeiture option, the insurer will usually apply","choices":["cash surrender","reduced paid-up","one-year term","extended term"],"answer":3,"why":"Extended term is typically the automatic nonforfeiture option."},{"q":"Policy dividends are best described as","choices":["a return of excess premium that is not guaranteed","guaranteed investment earnings","taxable income to the policyowner","a benefit available only on term policies"],"answer":0,"why":"Dividends return part of the premium when results are favorable and can never be guaranteed."},{"q":"Which dividend option increases both the death benefit and the cash value of the policy?","choices":["Cash payment","Reduction of premium","Paid-up additions","Accumulation at interest"],"answer":2,"why":"Paid-up additions are small permanent policies that add their own death benefit and cash value."},{"q":"A policyowner leaves dividends with the insurer to accumulate at interest. What is taxable?","choices":["Both the dividends and the interest","Only the interest earned","Only the dividends","Neither the dividends nor the interest"],"answer":1,"why":"Dividends are a nontaxable return of premium, but the interest they earn is taxable in the year credited."},{"q":"Which rider allows the owner to buy additional coverage at specified times without proving insurability?","choices":["Waiver of premium","Accidental death","Payor benefit","Guaranteed insurability"],"answer":3,"why":"The guaranteed insurability rider permits added purchases at set ages or events with no evidence of insurability."},{"q":"A father buys a policy on his 5-year-old daughter and wants premiums waived if he dies or becomes disabled before she is an adult. Which rider fits?","choices":["Payor benefit","Cost of living","Guaranteed insurability","Children's term"],"answer":0,"why":"The payor benefit waives premiums on a juvenile policy when the premium payer dies or is disabled."},{"q":"When an insured receives an accelerated death benefit, what is the effect on the policy?","choices":["The policy's premium is doubled","The policy becomes incontestable","The death benefit payable to the beneficiary is reduced","The policy is converted to term insurance"],"answer":2,"why":"Amounts paid early are subtracted from the death benefit later paid to the beneficiary."}]},{"id":"ch06","num":6,"title":"Life Insurance Premiums, Proceeds and Beneficiaries","intro":{"hook":["A client hands you a premium check and asks two questions: why does it cost this much, and who gets the money when I am gone? Those two questions cover almost everything in this chapter.","The first half looks at the money going in. You will see how insurers build a premium from three ingredients and why paying monthly costs more than paying once a year.","The second half looks at the money coming out: who can be named as beneficiary, what happens when a beneficiary dies first or is a child, how proceeds can be paid, and how the IRS treats each piece. Getting a beneficiary designation wrong can send money to the wrong person or into probate, so this is knowledge you will use on every sale."],"objectives":["Explain how mortality, interest, and expense combine to produce a life insurance premium","Compare premium payment modes and their effect on total cost","Differentiate the types of beneficiary designations and how each affects who is paid","Describe how common disaster and spendthrift provisions protect policy proceeds","Compare the settlement options available for paying out death proceeds","Summarize the federal income tax treatment of premiums, proceeds, cash values, dividends, and exchanges","Distinguish viatical settlements from life settlements"],"avaIntro":"Hi, it's Ava again. Welcome to chapter six. This one is all about following the money. We will start with premiums and I will show you the three ingredients every insurer uses to price a policy. Once you know them, premium questions on the exam become much easier. Then we move to the other end of the policy, the payout. You will learn the different ways to name a beneficiary and what can go wrong when a designation is vague or out of date. We will cover settlement options, which are simply the different ways the death benefit can be paid, and then the tax rules for life insurance. The tax section has a lot of detail, so take it slowly. We finish with viatical and life settlements, where an owner sells a policy for cash. Ready? Let's begin."},"keywords":[{"term":"Class designation","def":"Naming a group, such as all my children, as beneficiary instead of listing individuals by name."},{"term":"Contingent beneficiary","def":"The person next in line for the proceeds if no primary beneficiary is living when the insured dies."},{"term":"Cost basis","def":"The total premiums the owner has paid into a policy, less any dividends received, used to measure taxable gain."},{"term":"Gross premium","def":"The premium the policyowner actually pays: the net premium plus the expense loading."},{"term":"Irrevocable beneficiary","def":"A beneficiary who cannot be changed or removed without that beneficiary's written consent."},{"term":"Life settlement","def":"The sale of a policy to a third party by an owner whose insured is not terminally ill, for more than its cash value but less than its face amount."},{"term":"Modified endowment contract","def":"A life policy funded faster than the seven-pay test allows, which loses favorable tax treatment on loans and withdrawals."},{"term":"Mortality","def":"The rate at which people of a given age and sex are expected to die, used to estimate the cost of claims."},{"term":"Net premium","def":"The mortality cost reduced by assumed interest earnings, before any expenses are added."},{"term":"Per capita","def":"A distribution in which the surviving named beneficiaries share the proceeds equally."},{"term":"Per stirpes","def":"A distribution in which a deceased beneficiary's share passes down to that beneficiary's descendants."},{"term":"Primary beneficiary","def":"The person or entity with first claim to the death proceeds."},{"term":"Section 1035 exchange","def":"A tax-free swap of one life insurance or annuity contract for another that qualifies under the Internal Revenue Code."},{"term":"Settlement options","def":"The methods, other than a single lump sum, by which policy proceeds can be paid out."},{"term":"Spendthrift clause","def":"A provision that shields proceeds held by the insurer from the beneficiary's creditors and prevents the beneficiary from assigning them."},{"term":"Viatical settlement","def":"The sale of a policy covering a terminally or chronically ill insured to a third party for a percentage of the face amount."}],"sections":[{"title":"The Three Ingredients of a Premium","blocks":[{"type":"p","text":"An insurer has to collect enough money to pay claims, cover its operating costs, and stay solvent. Actuaries set premiums using three factors: mortality, interest, and expense."},{"type":"h","text":"Mortality"},{"type":"p","text":"<b>Mortality<\/b> is the expected rate of death for a group of people of the same age and sex. Insurers use mortality tables built from large numbers of lives to predict how many people in a group will die each year. That prediction gives the cost of the claims the insurer expects to pay. Because death rates rise with age, the mortality cost rises as the insured gets older. Mortality is the starting point for every premium."},{"type":"h","text":"Interest"},{"type":"p","text":"Premiums are paid in advance, and the insurer invests that money until it is needed for claims. The earnings the insurer expects from those investments are the <b>interest<\/b> factor. Since the insurer counts on those earnings, it can charge less. The higher the interest rate the insurer assumes, the lower the premium, and the lower the assumed rate, the higher the premium."},{"type":"h","text":"Expense"},{"type":"p","text":"The <b>expense<\/b> factor, also called loading, covers the costs of doing business. It includes agent commissions, underwriting, salaries, rent, taxes, and a margin for profit and unexpected losses. Expenses are added to the premium."},{"type":"flow","nodes":["Mortality cost","Minus interest","Net premium","Plus expenses","Gross premium"],"caption":"How the three factors combine into the premium the client pays."},{"type":"p","text":"The individual applicant's characteristics then place that person in a rate class. Age, sex, health, tobacco use, occupation, and hobbies all affect which class applies, and so does the type and amount of coverage."},{"type":"example","text":"Two insurers use the same mortality table and have the same expenses. Company A assumes its investments will earn 4 percent and Company B assumes 3 percent. All else equal, Company A can charge the lower premium because it expects more help from interest."},{"type":"tip","text":"Interest is the only one of the three factors that lowers the premium; mortality and expense both push it up."}]},{"title":"Net Premium, Gross Premium, and Payment Modes","blocks":[{"type":"p","text":"The exam expects you to know the two simple formulas that turn the three factors into a price."},{"type":"table","head":["Term","Formula","Meaning"],"rows":[["Net premium","Mortality minus interest","The amount needed just to pay expected claims"],["Gross premium","Net premium plus expense","The amount the policyowner is actually billed"]]},{"type":"p","text":"The <b>net single premium<\/b> is the one lump sum that, with interest, would pay for the whole policy up front. Very few people can pay that way, so insurers convert it into equal payments spread over time. This is the <b>level premium<\/b> concept: the owner pays more than the true cost of coverage in the early years and less than the true cost in the later years. The early overpayment, held in reserve and earning interest, is what makes a level premium possible."},{"type":"h","text":"Premium modes"},{"type":"p","text":"The <b>premium mode<\/b> is how often the owner pays. The usual choices are annual, semiannual, quarterly, and monthly. Monthly premiums are often paid by automatic bank draft."},{"type":"p","text":"The annual mode is the least expensive overall. When premiums are paid more often, the total paid in a year goes up for two reasons:"},{"type":"list","items":["The insurer loses interest, because it does not have the full year's premium to invest from the first day","The insurer has higher administrative costs from billing and processing more payments"]},{"type":"p","text":"The owner can change the mode. The trade is convenience against cost: smaller, more frequent payments are easier on a monthly budget but add up to more over a year."},{"type":"flow","nodes":["Annual","Semiannual","Quarterly","Monthly"],"caption":"Moving left to right, each payment gets smaller but the total paid in a year gets larger."},{"type":"example","text":"Rosa is quoted 1,200 dollars a year for her policy. If she chooses the monthly mode instead, each payment might be 105 dollars, which totals 1,260 dollars for the year. The extra 60 dollars is the cost of paying in installments."},{"type":"tip","text":"The more often premiums are paid, the higher the total annual cost; the annual mode always costs the least."}]},{"title":"Naming Beneficiaries","blocks":[{"type":"p","text":"The <b>beneficiary<\/b> is the person or entity that receives the proceeds when the insured dies. A beneficiary does not need an insurable interest and does not have to sign anything. The policyowner makes the choice. Almost anyone or anything can be named: a person, several people, a business, a charity, a trust, or the insured's estate."},{"type":"h","text":"Order of succession"},{"type":"p","text":"The <b>primary beneficiary<\/b> has first claim to the proceeds. The <b>contingent beneficiary<\/b>, also called secondary, receives the proceeds only if no primary beneficiary is alive when the insured dies. Some owners also name a tertiary beneficiary as a third level. If no named beneficiary survives the insured, the proceeds are paid to the owner's or insured's estate."},{"type":"flow","nodes":["Primary","Contingent","Tertiary","Estate"],"caption":"Proceeds move to the next level only when no one at the level above is living."},{"type":"h","text":"Revocable and irrevocable"},{"type":"table","head":["Type","Can the owner change it?","Effect on owner's rights"],"rows":[["Revocable","Yes, at any time without the beneficiary's consent","Owner keeps full control of the policy"],["Irrevocable","Only with the beneficiary's written consent","Owner also needs consent to borrow, assign, or surrender"]]},{"type":"p","text":"A revocable beneficiary has only an expectation of receiving money. An irrevocable beneficiary has a vested interest in the policy, which is why the owner's hands are tied without that person's agreement. Most designations are revocable."},{"type":"h","text":"Class designations"},{"type":"p","text":"A <b>class designation<\/b> names a group instead of individuals, for example all children of the insured. It is useful because it automatically includes children born after the policy was issued. It should be worded carefully so there is no doubt about who is in the group."},{"type":"example","text":"Ben names his wife, Carla, as primary beneficiary and his brother as contingent. Carla dies before Ben, and Ben never updates the policy. At Ben's death the proceeds go to his brother. If Ben had named no contingent, the money would have gone to his estate."},{"type":"tip","text":"A contingent beneficiary collects only when no primary beneficiary survives the insured; primary and contingent never share."}]},{"title":"Distribution Rules, Special Beneficiaries, and Protective Clauses","blocks":[{"type":"h","text":"Per stirpes and per capita"},{"type":"p","text":"These terms decide what happens to the share of a beneficiary who dies before the insured. <b>Per stirpes<\/b> means by the branch: the deceased beneficiary's share passes down to that person's children. <b>Per capita<\/b> means by the head: the surviving named beneficiaries divide the proceeds equally, and the deceased beneficiary's family receives nothing."},{"type":"example","text":"An insured names her three children equally. One child dies before her, leaving two children of his own. Per stirpes, the two surviving children each get one third and the two grandchildren split the remaining third. Per capita, the two surviving children each get one half."},{"type":"h","text":"Minors, estates, and trusts"},{"type":"list","items":["Minors: a child can be named, but an insurer will not hand proceeds directly to a minor because a minor cannot give a legal release; the money is paid to a guardian or trustee, or held until the child is an adult","Estate: proceeds paid to the insured's estate go through probate, can be reached by the estate's creditors, and are delayed; this is usually the least desirable choice","Trust: naming a trust lets a trustee manage and pay out the money under the owner's written instructions, which works well for minor children or anyone who should not receive a large sum at once"]},{"type":"h","text":"Common disaster"},{"type":"p","text":"When the insured and the primary beneficiary die in the same accident and there is no proof of who died first, the <b>Uniform Simultaneous Death Act<\/b> treats the insured as having outlived the beneficiary. The proceeds go to the contingent beneficiary or, if there is none, to the insured's estate. A <b>common disaster clause<\/b> goes a step further by requiring the primary beneficiary to outlive the insured by a stated number of days. If the beneficiary dies within that time, the proceeds are paid as though the beneficiary had died first."},{"type":"h","text":"Spendthrift clause"},{"type":"p","text":"The <b>spendthrift clause<\/b> protects proceeds that the insurer is holding and paying out in installments. Creditors of the beneficiary cannot seize the money while the insurer holds it, and the beneficiary cannot assign, borrow against, or cash out the future payments. The protection ends once a payment is in the beneficiary's hands, and it does not apply to a lump sum."},{"type":"tip","text":"Under the Uniform Simultaneous Death Act, assume the insured died last, so the money goes to the contingent beneficiary."}]},{"title":"Settlement Options","blocks":[{"type":"p","text":"<b>Settlement options<\/b> are the ways proceeds can be paid. The policyowner may select one in advance. If the owner does not, the beneficiary chooses at the time of the claim. The default is a single <b>lump sum<\/b> payment in cash, which is the most common choice and is generally free of income tax."},{"type":"p","text":"The other options leave the proceeds with the insurer for some period:"},{"type":"list","items":["Interest only: the insurer holds the principal and pays the beneficiary the interest it earns; the principal is paid out later or passes to someone else, so this is a temporary arrangement","Fixed period: the proceeds plus interest are paid in equal installments over a set number of years; the length of time is chosen, and that determines the size of each payment","Fixed amount: a set dollar amount is paid each period until principal and interest run out; the payment size is chosen, and that determines how long payments last","Life income: the proceeds are used to buy an annuity that pays the beneficiary for life; payment size depends on the beneficiary's age and sex and on the form chosen"]},{"type":"h","text":"Forms of life income"},{"type":"table","head":["Form","How long payments last","Payment size"],"rows":[["Straight life","Until the beneficiary dies, then nothing more","Highest"],["Life with period certain","For life, but at least for a guaranteed number of years","Lower"],["Life refund","For life, with any unpaid balance of the proceeds refunded to a survivor","Lower"],["Joint and survivor","For as long as either of two people is alive","Lowest"]]},{"type":"p","text":"With the fixed period and fixed amount options, if the beneficiary dies before the money is used up, the remaining payments go to that beneficiary's own beneficiary or estate. With straight life income, payments simply stop at death, even if only one payment was made. That risk is the reason straight life pays the most per month."},{"type":"example","text":"A widow receives 300,000 dollars of proceeds. She wants an income she cannot outlive, but she also wants her daughter protected if she dies early. Life income with a 10-year period certain pays her for life and guarantees that payments continue to her daughter if she dies within the first 10 years."},{"type":"tip","text":"Fixed period sets the time and the amount follows; fixed amount sets the payment and the time follows."}]},{"title":"How Life Insurance Is Taxed","blocks":[{"type":"p","text":"Life insurance receives favorable tax treatment, but the rules differ for each part of the policy."},{"type":"h","text":"Premiums"},{"type":"p","text":"Premiums on individual life insurance are a personal expense and are <b>not tax deductible<\/b>. In group life, an employer may deduct the premiums it pays as a business expense, and the cost of the first 50,000 dollars of employer-paid group term coverage is not taxed to the employee."},{"type":"h","text":"Death proceeds"},{"type":"p","text":"A death benefit paid in a lump sum to a named beneficiary is generally <b>free of federal income tax<\/b>. When proceeds are paid in installments under a settlement option, each payment is part principal and part interest. The principal portion stays tax-free and the interest portion is taxable. Proceeds can be included in the insured's estate for estate tax purposes if the insured owned the policy or the estate is the beneficiary."},{"type":"h","text":"Cash value, loans, and dividends"},{"type":"list","items":["Cash value grows tax-deferred; no tax is due on the growth while it stays in the policy","On surrender, the owner is taxed only on the gain, which is the amount received above the cost basis, and that gain is ordinary income","Policy loans are not taxable income","Dividends are a return of premium and are not taxable, but interest earned on dividends left with the insurer is taxable","Accelerated death benefits paid to a terminally ill insured are generally received tax-free"]},{"type":"example","text":"Omar paid 30,000 dollars in premiums over the years and surrenders his policy for 38,000 dollars. His cost basis is 30,000 dollars, so only the 8,000 dollar gain is taxed as ordinary income."},{"type":"h","text":"Modified endowment contracts"},{"type":"p","text":"A policy that fails the <b>seven-pay test<\/b> because too much premium was paid in during the first seven years becomes a modified endowment contract. Its death benefit is still tax-free, but loans and withdrawals are taxed on an earnings-first basis and may carry a 10 percent penalty if taken before age 59 and a half."},{"type":"h","text":"Section 1035 exchanges"},{"type":"p","text":"A <b>Section 1035 exchange<\/b> lets an owner trade one contract for another without paying tax on the gain at that time. Permitted exchanges are life insurance to life insurance, life insurance to an annuity, and annuity to annuity. An annuity cannot be exchanged tax-free for a life insurance policy."},{"type":"tip","text":"For 1035 exchanges, remember that you can go from life to annuity but never from annuity to life."}]},{"title":"Viatical and Life Settlements","blocks":[{"type":"p","text":"A life insurance policy is property, and its owner can sell it. Two kinds of sales are tested, and the difference between them is the health of the insured."},{"type":"h","text":"Viatical settlements"},{"type":"p","text":"In a <b>viatical settlement<\/b>, the owner of a policy covering a terminally or chronically ill insured sells it to a third party. The seller is called the <b>viator<\/b>. The buyer, called the viatical settlement provider, pays the viator a lump sum that is a percentage of the face amount, more than the cash value but less than the death benefit. The buyer becomes the new owner and beneficiary, takes over the premium payments, and collects the full death benefit when the insured dies. The closer the insured is to death, the larger the percentage paid."},{"type":"p","text":"The viator gets money for medical bills and living costs while still alive. In exchange, the original beneficiaries give up the death benefit."},{"type":"h","text":"Life settlements"},{"type":"p","text":"A <b>life settlement<\/b> is the same kind of sale, but the insured is not terminally ill. The typical seller is an older person who no longer needs or can no longer afford the coverage. Instead of surrendering the policy for its cash value or letting it lapse, the owner sells it for a higher amount."},{"type":"table","head":["Feature","Viatical settlement","Life settlement"],"rows":[["Insured's health","Terminally or chronically ill","Not terminally ill, usually older"],["Amount paid","More than cash value, less than face amount","More than cash value, less than face amount"],["Income tax on proceeds","Generally tax-free for a terminally ill insured","Gain is generally taxable"]]},{"type":"h","text":"Consumer protections"},{"type":"p","text":"These transactions are regulated by the state. Providers and brokers must be authorized by the Texas Department of Insurance before doing business, and the owner must receive written disclosures before signing. Those disclosures explain alternatives such as accelerated death benefits or policy loans, possible tax consequences, the effect on eligibility for public assistance, and the owner's right to cancel the sale within a limited time. The insured's medical and personal information must be kept confidential."},{"type":"p","text":"A settlement differs from an accelerated death benefit. An accelerated benefit is paid by the original insurer and the policy stays with the owner. A settlement transfers the policy to an outside buyer."},{"type":"tip","text":"The viator is the policyowner who sells; the buyer becomes owner and beneficiary and pays all future premiums."}]}],"summary":{"recap":["Premiums are built from mortality, interest, and expense. Mortality minus interest is the net premium, and net premium plus expense is the gross premium the client pays. A higher assumed interest rate lowers the premium.","Premiums can be paid annually, semiannually, quarterly, or monthly. The annual mode costs the least in total because the insurer has the money longer and handles fewer payments.","The primary beneficiary is first in line and the contingent is next. A revocable beneficiary can be changed freely, while an irrevocable beneficiary must consent in writing to any change. Per stirpes passes a deceased beneficiary's share down the family branch, and per capita divides it among the survivors.","Minors cannot receive proceeds directly, estates expose proceeds to probate and creditors, and trusts allow managed payouts. The Uniform Simultaneous Death Act treats the insured as dying last, and the spendthrift clause protects proceeds held by the insurer from the beneficiary's creditors.","Proceeds can be paid as a lump sum or through interest only, fixed period, fixed amount, or life income options. Lump sum death benefits are income tax-free, and only the interest in installment payments is taxed.","Individual premiums are not deductible, cash value grows tax-deferred, and Section 1035 allows tax-free exchanges from life to life or life to annuity. Viatical settlements involve terminally or chronically ill insureds, and life settlements involve insureds who are not terminally ill."],"avaSummary":"That was a full chapter, so let's go over the main points one more time. Every premium starts with three factors: mortality, interest, and expense. Take mortality, subtract interest, and you have the net premium. Add expenses and you have the gross premium, which is the number on the client's bill. Paying once a year is the cheapest mode, and paying monthly costs the most in total. On beneficiaries, the primary is paid first and the contingent is paid only if no primary is living. A revocable beneficiary can be changed whenever the owner likes. An irrevocable beneficiary has to agree in writing. Per stirpes sends a deceased beneficiary's share down to that person's children, and per capita splits everything among the survivors. If the insured and the primary beneficiary die together, the law assumes the insured died last, so the contingent is paid. The spendthrift clause keeps a beneficiary's creditors away from money the insurer is still holding. For settlement options, lump sum is the default. Fixed period sets the time, fixed amount sets the payment, and life income lasts as long as the beneficiary lives. On taxes, individual premiums are not deductible, a lump sum death benefit is not taxed as income, cash value grows tax-deferred, and dividends are a tax-free return of premium. Interest is the part that gets taxed. A 1035 exchange works from life to life or life to annuity, but never from annuity to life. Finally, a viatical settlement involves a terminally or chronically ill insured, and a life settlement does not. Now try the practice exam.","reviewNotes":[{"objective":"Explain how mortality, interest, and expense combine to produce a life insurance premium","concepts":["Mortality tables predict the cost of expected claims","Assumed interest earnings reduce the premium","Expense loading covers commissions, operations, taxes, and profit","Net premium equals mortality minus interest","Gross premium equals net premium plus expense"],"terms":[{"term":"Mortality","def":"Expected death rate for a group, used to price claims."},{"term":"Net premium","def":"Mortality cost less assumed interest."},{"term":"Gross premium","def":"Net premium plus expense loading; what the owner pays."}]},{"objective":"Compare premium payment modes and their effect on total cost","concepts":["Modes are annual, semiannual, quarterly, and monthly","The annual mode has the lowest total cost","More frequent payments cost more because of lost interest and added handling","The level premium concept spreads the cost evenly over the paying period"],"terms":[{"term":"Premium mode","def":"How often premiums are paid."},{"term":"Level premium","def":"A premium that stays the same, overpaying early to offset underpaying later."}]},{"objective":"Differentiate the types of beneficiary designations and how each affects who is paid","concepts":["Primary is paid first, contingent only if no primary survives","Revocable designations can be changed by the owner at will","Irrevocable beneficiaries must consent in writing to changes, loans, and assignments","A class designation names a group and can include later-born members","Per stirpes pays by family branch and per capita pays the survivors equally","With no surviving beneficiary, proceeds go to the estate"],"terms":[{"term":"Contingent beneficiary","def":"Second in line for proceeds."},{"term":"Irrevocable beneficiary","def":"Cannot be changed without that beneficiary's written consent."},{"term":"Per stirpes","def":"A deceased beneficiary's share passes to that person's descendants."}]},{"objective":"Describe how common disaster and spendthrift provisions protect policy proceeds","concepts":["The Uniform Simultaneous Death Act presumes the insured outlived the beneficiary","A common disaster clause requires the beneficiary to survive the insured by a set number of days","The spendthrift clause blocks the beneficiary's creditors from proceeds held by the insurer","Spendthrift protection does not apply to a lump sum already paid"],"terms":[{"term":"Common disaster clause","def":"Requires the beneficiary to survive the insured for a stated period to receive proceeds."},{"term":"Spendthrift clause","def":"Protects insurer-held proceeds from the beneficiary's creditors and from assignment."}]},{"objective":"Compare the settlement options available for paying out death proceeds","concepts":["Lump sum is the default and the most common","Interest only keeps the principal intact and pays out earnings","Fixed period sets the length of time; fixed amount sets the payment size","Life income pays for the beneficiary's lifetime and depends on age and sex","Straight life pays the most per payment but stops at death"],"terms":[{"term":"Settlement options","def":"Ways proceeds can be paid other than one lump sum."},{"term":"Period certain","def":"A guaranteed minimum number of years of life income payments."}]},{"objective":"Summarize the federal income tax treatment of premiums, proceeds, cash values, dividends, and exchanges","concepts":["Individual life premiums are not deductible","Lump sum death proceeds are income tax-free; interest on installments is taxable","Cash value grows tax-deferred and surrender gain above cost basis is ordinary income","Dividends are not taxable, but interest on them is","A modified endowment contract loses favorable treatment on loans and withdrawals","Section 1035 allows life to life, life to annuity, and annuity to annuity exchanges"],"terms":[{"term":"Cost basis","def":"Premiums paid, less dividends received."},{"term":"Section 1035 exchange","def":"Tax-free exchange of qualifying insurance or annuity contracts."},{"term":"Modified endowment contract","def":"A policy that fails the seven-pay test."}]},{"objective":"Distinguish viatical settlements from life settlements","concepts":["Both are sales of an existing policy to a third party for more than cash value and less than face amount","A viatical settlement involves a terminally or chronically ill insured","A life settlement involves an insured who is not terminally ill","The buyer becomes owner and beneficiary and pays future premiums","Written disclosures and a right to cancel protect the seller"],"terms":[{"term":"Viator","def":"The policyowner who sells a policy in a viatical settlement."},{"term":"Life settlement","def":"Sale of a policy on an insured who is not terminally ill."}]}]},"exam":[{"q":"Which three factors are used to calculate a life insurance premium?","choices":["Mortality, morbidity, and expense","Interest, dividends, and expense","Mortality, interest, and expense","Mortality, interest, and cash value"],"answer":2,"why":"Life insurance premiums are built from mortality, interest, and expense."},{"q":"Net premium is calculated as","choices":["mortality minus interest","mortality plus expense","gross premium plus expense","interest minus expense"],"answer":0,"why":"The net premium is the mortality cost reduced by assumed interest earnings."},{"q":"If an insurer assumes a higher rate of interest on its investments, premiums will generally","choices":["be higher","be lower","stay the same","become nondeductible"],"answer":1,"why":"Expected interest earnings offset the cost of claims, so a higher assumed rate reduces the premium."},{"q":"Which premium mode results in the lowest total cost for the year?","choices":["Monthly","Quarterly","Semiannual","Annual"],"answer":3,"why":"Paying annually avoids the added charges for lost interest and extra handling that come with more frequent payments."},{"q":"Gross premium equals","choices":["net premium minus expense","net premium plus expense","mortality minus interest","mortality plus interest"],"answer":1,"why":"Adding the expense loading to the net premium produces the gross premium charged to the owner."},{"q":"A contingent beneficiary receives the proceeds when","choices":["no primary beneficiary is living at the insured's death","the primary beneficiary agrees to share","the policy has an outstanding loan","the insured dies during the contestable period"],"answer":0,"why":"The contingent beneficiary is paid only if no primary beneficiary survives the insured."},{"q":"A policyowner wants to change an irrevocable beneficiary. What is required?","choices":["Approval of the insurer's underwriter","A court order","The written consent of the irrevocable beneficiary","Nothing; the owner may change it at any time"],"answer":2,"why":"An irrevocable beneficiary has a vested interest and must consent in writing to a change."},{"q":"An insured names his two daughters equally, per stirpes. One daughter dies before him, leaving a son. At the insured's death, the proceeds are paid","choices":["entirely to the surviving daughter","entirely to the insured's estate","equally among the surviving daughter, the grandson, and the estate","half to the surviving daughter and half to the grandson"],"answer":3,"why":"Per stirpes passes the deceased beneficiary's share down to her descendants."},{"q":"Why is naming a minor directly as beneficiary a problem?","choices":["Minors have no insurable interest","A minor cannot give the insurer a legal release for the payment","State law prohibits minors from being beneficiaries","Proceeds paid to minors are taxable"],"answer":1,"why":"Insurers will not pay directly to a minor, so a guardian or trustee must receive the funds."},{"q":"Naming the insured's estate as beneficiary generally means the proceeds","choices":["pass through probate and may be reached by the estate's creditors","are protected by the spendthrift clause","are paid faster than to a named person","can only be paid as a life income"],"answer":0,"why":"Proceeds payable to the estate become part of the probate estate and are exposed to its creditors."},{"q":"The insured and the primary beneficiary die in the same car accident with no evidence of who died first. Under the Uniform Simultaneous Death Act, the proceeds are paid","choices":["to the primary beneficiary's estate","half to each estate","as if the insured survived the primary beneficiary","to the state"],"answer":2,"why":"The Act presumes the insured outlived the beneficiary, so the contingent beneficiary or the insured's estate is paid."},{"q":"The spendthrift clause protects policy proceeds from","choices":["federal income tax","the insured's creditors before death","the insurer's insolvency","claims of the beneficiary's creditors while the insurer holds the proceeds"],"answer":3,"why":"The clause shields proceeds held by the insurer from the beneficiary's creditors and bars the beneficiary from assigning them."},{"q":"Under which settlement option does the insurer hold the principal and pay out only its earnings?","choices":["Fixed amount","Interest only","Fixed period","Straight life income"],"answer":1,"why":"The interest only option leaves the principal intact and pays the beneficiary the interest earned."},{"q":"A beneficiary chooses to receive proceeds in equal payments over exactly 15 years. This is the","choices":["fixed amount option","life income option","fixed period option","interest only option"],"answer":2,"why":"The fixed period option pays principal and interest over a chosen length of time."},{"q":"Which life income form provides the highest payment but nothing after the beneficiary's death?","choices":["Straight life","Life with period certain","Life refund","Joint and survivor"],"answer":0,"why":"Straight life has no guarantee beyond the beneficiary's life, so it pays the largest amount per payment."},{"q":"Death proceeds paid in a lump sum to a named beneficiary are generally","choices":["taxed as ordinary income","taxed as capital gains","taxed only above the cost basis","free of federal income tax"],"answer":3,"why":"Lump sum life insurance death benefits are generally received income tax-free."},{"q":"A policyowner who paid 20,000 dollars in premiums surrenders the policy for 26,000 dollars. How much is taxable?","choices":["Nothing","6,000 dollars","20,000 dollars","26,000 dollars"],"answer":1,"why":"Only the gain above the cost basis, 26,000 minus 20,000 dollars, is taxed as ordinary income."},{"q":"Which of the following does NOT qualify as a tax-free Section 1035 exchange?","choices":["Life insurance to life insurance","Life insurance to annuity","Annuity to life insurance","Annuity to annuity"],"answer":2,"why":"An annuity cannot be exchanged tax-free for a life insurance policy."},{"q":"Premiums paid on an individually owned life insurance policy are","choices":["not deductible for income tax purposes","fully deductible","deductible up to 50,000 dollars","deductible only if the policy is participating"],"answer":0,"why":"Individual life insurance premiums are a personal expense and cannot be deducted."},{"q":"In a viatical settlement, the viator is","choices":["the company that buys the policy","the original insurer","the new beneficiary","the policyowner who sells the policy"],"answer":3,"why":"The viator is the owner of the policy on a terminally or chronically ill insured who sells it to a provider."}]},{"id":"ch07","num":7,"title":"Life Insurance Underwriting and Policy Issue","intro":{"hook":["Picture your first real sale. The client says yes, you pull out the application, and suddenly every box on the form matters. A skipped question, a missing signature, or the wrong receipt can delay the policy, or leave a family without coverage they thought they had.","This chapter follows a life insurance policy from the moment the application is opened until the policy is placed in the client's hands. You will see what the insurer asks, where it gets its information, how it sorts applicants into risk classes, and exactly when coverage starts.","It also covers the rules that protect the client along the way: privacy and credit reporting laws, HIV testing rules, replacement duties, and anti-money laundering requirements. These are heavily tested, and they are the habits that keep your license safe."],"objectives":["Describe the parts of a life insurance application, the signatures it requires, and how corrections are handled","Identify the sources of underwriting information and the agent's role as field underwriter","Explain how the Fair Credit Reporting Act, HIPAA, and HIV testing rules protect applicants","Compare the preferred, standard, substandard, and declined risk classifications","Distinguish conditional receipts from binding receipts and determine when coverage begins","Summarize an agent's duties for policy delivery, replacement, and anti-money laundering compliance"],"avaIntro":"Hi, I'm Ava, and welcome to chapter seven. So far we have talked about what life insurance policies are. Now I want to show you how one actually gets issued. I think of this chapter as the paperwork chapter, but do not let that fool you. This is where agents make most of their early mistakes, and it is where the exam loves to test you. We will walk through the application together, then look at how the underwriter checks the facts using medical exams, the MIB, and inspection reports. I will explain the privacy laws that protect your client, how applicants are grouped into risk classes, and the difference between a conditional receipt and a binding receipt. We will finish with policy delivery, replacement, and anti-money laundering rules. Take your time here. Getting these steps right protects your client, and it protects you."},"keywords":[{"term":"Agent's report","def":"The agent's personal observations about the applicant, sent to the insurer but not made part of the contract."},{"term":"Binding receipt","def":"A receipt that provides temporary coverage immediately for a stated period, even before the insurer decides on the application."},{"term":"Conditional receipt","def":"A receipt given when premium is paid with the application; coverage starts early only if the applicant is found insurable."},{"term":"Constructive delivery","def":"Delivery that is legally complete when the insurer gives up control of the policy, such as by mailing it."},{"term":"Fair Credit Reporting Act","def":"Federal law that sets rules for how consumer reports are collected, shared, and corrected."},{"term":"Field underwriter","def":"The agent, who gathers accurate information and screens applicants at the point of sale."},{"term":"Inspection report","def":"A report from an outside agency about an applicant's finances, character, habits, and lifestyle."},{"term":"Investigative consumer report","def":"A consumer report built from interviews with people who know the applicant."},{"term":"MIB","def":"A member-owned nonprofit that lets insurers share coded medical information from earlier applications."},{"term":"Preferred risk","def":"An applicant with better than average health and habits who earns a lower premium."},{"term":"Replacement","def":"A transaction in which a new policy is bought and an existing policy is lapsed, surrendered, or otherwise reduced in value."},{"term":"Standard risk","def":"An applicant who represents average mortality and pays the regular premium rate."},{"term":"Statement of good health","def":"A signed statement at delivery confirming the insured's health has not changed since the application."},{"term":"Substandard risk","def":"An applicant with higher than average risk who is insured with an extra charge or modified coverage."},{"term":"Suspicious Activity Report","def":"A report filed with the federal government when a transaction appears to involve money laundering."}],"sections":[{"title":"The Application","blocks":[{"type":"p","text":"The <b>application<\/b> is the main document an insurer uses to decide whether to issue a policy. Once the policy is issued, a copy of the application is attached to it and becomes part of the contract. That is why accuracy matters so much: the insurer is relying on these answers for years to come."},{"type":"h","text":"Parts of the application"},{"type":"list","items":["Part 1, General Information: name, address, date of birth, sex, occupation, income, the type and amount of coverage requested, the beneficiary, and other insurance owned or applied for.","Part 2, Medical Information: health history, current conditions, medications, doctor visits, family history, and tobacco or alcohol use.","Agent's Report: the agent's own remarks about the applicant. It goes to the insurer but is not part of the contract."]},{"type":"p","text":"In the <b>agent's report<\/b>, you tell the underwriter things the form cannot show: how long you have known the applicant, what you know about the person's finances and habits, and whether the new policy will replace existing coverage. Be honest. The underwriter is counting on your eyes and ears."},{"type":"h","text":"Required signatures"},{"type":"p","text":"The application must be signed by the applicant, by the proposed insured if that is a different person, and by the agent who took the application. If a third party will own the policy, such as a business insuring a key employee, the policyowner signs too. A parent or guardian signs for a minor."},{"type":"h","text":"Changes and incomplete applications"},{"type":"p","text":"Never erase an answer or use correction fluid. If a mistake is made, the usual choices are to start a fresh application, or to cross out the wrong answer, write in the right one, and have the applicant initial the change. Only the applicant can approve a change to the applicant's answers."},{"type":"p","text":"If the underwriter receives an application with a question left blank, it should be sent back to the agent to be completed. If the insurer issues the policy anyway, it is generally treated as having given up its right to that missing answer and cannot later contest the claim over it."},{"type":"flow","nodes":["Complete Part 1","Complete Part 2","Collect signatures","Add agent's report","Submit to insurer"],"caption":"The basic path of an application from the client's kitchen table to the home office."},{"type":"example","text":"Maria notices she wrote the wrong birth year for her client, Tom. She draws a single line through the error, writes the correct year, and has Tom initial next to it before he signs."},{"type":"tip","text":"The agent's report is sent with the application but never becomes part of the insurance contract."}]},{"title":"Field Underwriting and Sources of Information","blocks":[{"type":"p","text":"<b>Underwriting<\/b> is the process of selecting and classifying risks. The goal is to charge each person a premium that fits the risk and to protect the insurer from adverse selection, which is the tendency of people in poor health to seek insurance more than healthy people do."},{"type":"h","text":"The agent as field underwriter"},{"type":"p","text":"The home office underwriter may never meet the applicant. You do. As the <b>field underwriter<\/b>, you are the first line of screening. Your duties include:"},{"type":"list","items":["Asking every question and recording the answers exactly as given","Making sure the application is complete and properly signed","Reporting anything you observe that affects the risk","Collecting the first premium and giving the correct receipt","Explaining the required disclosures and delivering the policy"]},{"type":"h","text":"Where underwriters get their facts"},{"type":"table","head":["Source","What it provides"],"rows":[["Application","The applicant's own answers; always the starting point"],["Agent's report","The agent's personal observations"],["Medical exam or paramedical report","Height, weight, blood pressure, and blood or urine samples, taken by a physician, nurse, or paramedic and paid for by the insurer"],["Attending Physician's Statement (APS)","Details from the applicant's own doctor about a specific condition or treatment"],["MIB report","Coded medical findings reported by other member insurers"],["Inspection report","Lifestyle, finances, character, and habits, gathered by an outside agency"]]},{"type":"p","text":"The <b>MIB<\/b> is a nonprofit organization owned by its member insurance companies. When a member insurer finds a medical condition during underwriting, it reports a code to the MIB. Other members can then check whether an applicant left something out. The MIB does not hold claim records or full medical files, and agents do not report to it."},{"type":"p","text":"An insurer may not refuse coverage or charge more based only on what the MIB report shows. The report is a signal to look further, and the insurer must confirm the information on its own. The applicant must be told in writing that the insurer may report to and receive information from the MIB."},{"type":"p","text":"<b>Inspection reports<\/b> are more common for larger policies. They may include interviews with neighbors, coworkers, or friends, and they fall under the Fair Credit Reporting Act covered in the next section."},{"type":"tip","text":"An MIB report alone can never be the only reason an insurer declines or rates an applicant."}]},{"title":"Privacy and Consumer Protection Rules","blocks":[{"type":"p","text":"Underwriting requires personal information, so federal and state laws limit how that information is gathered and used. Expect several exam questions from this section."},{"type":"h","text":"Fair Credit Reporting Act"},{"type":"p","text":"The <b>Fair Credit Reporting Act<\/b> (FCRA) protects consumers when reports about them are used to make decisions on insurance, credit, or employment. It covers two kinds of reports."},{"type":"table","head":["Report type","How the information is gathered"],"rows":[["Consumer report","From records such as credit history; no interviews"],["Investigative consumer report","From interviews with neighbors, friends, coworkers, and others who know the applicant"]]},{"type":"list","items":["The applicant must be told in writing that a report may be ordered. For an investigative report, the notice must be given within three days of the request.","The applicant may ask for more detail about the investigation, and that information must be provided within five days of the request.","If coverage is declined or rated because of a report, the insurer must tell the applicant and give the name and address of the reporting agency.","The consumer may ask the agency what is in the file and may dispute errors. The agency must reinvestigate and correct or remove information it cannot verify.","Most negative information may not be reported after seven years, and bankruptcies after ten years."]},{"type":"h","text":"HIPAA"},{"type":"p","text":"The <b>Health Insurance Portability and Accountability Act<\/b> protects a person's health information. Doctors, hospitals, and health plans generally cannot release an applicant's medical records to a life insurer without the applicant's signed authorization. This is why every application package includes an authorization form, and why the applicant must receive a notice of the insurer's information practices."},{"type":"h","text":"HIV testing"},{"type":"p","text":"An insurer may ask an applicant to take an HIV test as part of underwriting, but strict conditions apply:"},{"type":"list","items":["The applicant must give written informed consent before the test, after being told its purpose and how results will be used.","Testing must be required on a nondiscriminatory basis. An insurer may not use sexual orientation, marital status, living arrangements, or zip code to decide who is tested.","Results are confidential and may be shared only with those the applicant has authorized or the law allows."]},{"type":"example","text":"An insurer rates Dana's policy after reading a report from a consumer reporting agency. The insurer must tell Dana about the decision and give her the agency's name and address so she can review her file."},{"type":"tip","text":"An investigative consumer report is the one that uses interviews with people who know the applicant."}]},{"title":"Risk Classification","blocks":[{"type":"p","text":"After the facts are gathered, the underwriter places the applicant in a <b>risk classification<\/b>. The class decides whether a policy is issued and what premium is charged. Underwriters look at factors that predict mortality."},{"type":"list","items":["Age and sex","Current health and medical history","Family medical history","Tobacco, alcohol, and drug use","Occupation and dangerous hobbies such as flying or scuba diving","Financial situation, to confirm the amount requested makes sense"]},{"type":"p","text":"Underwriting must be fair. An insurer may treat people differently only when real differences in expected loss support it. Texas law does not permit an insurer to refuse coverage or charge a different rate because of race, color, religion, or national origin."},{"type":"table","head":["Class","Who fits","Premium"],"rows":[["Preferred","Better than average health, habits, and history; usually nonsmokers","Lower than standard"],["Standard","Average risk for the person's age and sex","Regular rate"],["Substandard (rated)","Higher than average risk because of health, occupation, or habits","Higher than standard, or coverage is modified"],["Declined","Risk is too high or cannot be measured","No policy is issued"]]},{"type":"h","text":"How substandard risks are handled"},{"type":"p","text":"A <b>substandard risk<\/b> is still insurable. The insurer simply adjusts the deal to match the extra risk. Common methods include:"},{"type":"list","items":["Extra percentage: the premium is raised by a set percentage over the standard rate.","Rated-up age: the applicant is charged the rate of an older person.","Flat extra premium: a set dollar amount is added for each $1,000 of coverage, sometimes only for a few years.","Limited benefits: the policy is issued with an exclusion or a reduced amount."]},{"type":"h","text":"Declined risks"},{"type":"p","text":"An applicant may be declined when the chance of loss is so high that no reasonable premium would cover it, or when there is no insurable interest, or when the applicant's situation is so unusual that it cannot be rated."},{"type":"example","text":"Luis is 40, does not smoke, exercises, and has no health problems, so he is offered preferred rates. His brother Ray has diabetes and a risky job, so Ray's policy is issued as a rated policy with a higher premium."},{"type":"tip","text":"Substandard does not mean uninsurable; it means insured at a higher premium or with modified coverage."}]},{"title":"Premium Collection and Receipts","blocks":[{"type":"p","text":"Agents are encouraged to collect the first premium with the application. Doing so shows the applicant is serious, and it can allow coverage to begin sooner. The kind of receipt you hand over decides how soon."},{"type":"h","text":"Handling premiums"},{"type":"p","text":"Premium money belongs to the insurer, not to you. An agent holds it in a <b>fiduciary<\/b> capacity, which means a position of trust. Send it to the insurer promptly, and never mix it with your personal funds. Mixing the two is called commingling and can cost you your license."},{"type":"h","text":"Conditional receipt"},{"type":"p","text":"The <b>conditional receipt<\/b> is the most common type. Coverage begins on the date of the application or the date of the medical exam, whichever is later, but only if the applicant turns out to be insurable as applied for under the company's normal rules. If the applicant dies before the policy is issued, the underwriter finishes the review. If the applicant would have been approved, the claim is paid. If not, the premium is refunded."},{"type":"h","text":"Binding receipt"},{"type":"p","text":"A <b>binding receipt<\/b>, also called a temporary insurance agreement, gives coverage right away with no condition about insurability. It lasts for a limited time stated in the receipt, or until the insurer issues or declines the policy, whichever comes first. Binding receipts are uncommon in life insurance."},{"type":"table","head":["Feature","Conditional receipt","Binding receipt"],"rows":[["When coverage starts","Later of application date or medical exam","Immediately"],["Depends on insurability","Yes","No"],["How long it lasts","Until the policy is issued or declined","A stated period, or until the insurer acts"],["How common","Very common","Rare in life insurance"]]},{"type":"flow","nodes":["Premium paid with application","Conditional receipt given","Medical exam completed","Coverage begins if insurable"],"caption":"With a conditional receipt, early coverage depends on the applicant being found insurable."},{"type":"p","text":"If no premium is collected with the application, there is no receipt and no early coverage. In contract terms, the applicant has only invited the insurer to make an offer."},{"type":"example","text":"Jan pays her first premium on Monday and gets a conditional receipt. Her exam is on Thursday and shows normal results. She is killed in an accident on Saturday, before the policy is issued. Because she was insurable, coverage started Thursday and the claim is paid."},{"type":"tip","text":"Under a conditional receipt, coverage starts at the later of the application date or the medical exam date."}]},{"title":"Policy Delivery and When Coverage Begins","blocks":[{"type":"p","text":"Once the underwriter approves the application, the insurer issues the policy and sends it to the agent. Your job is not finished until the policy is delivered and the client understands it."},{"type":"h","text":"Ways a policy is delivered"},{"type":"list","items":["Personal delivery by the agent, which is the preferred method","Mailing the policy to the policyowner","Constructive delivery, which happens when the insurer gives up control of the policy, for example by mailing it to the agent with nothing left for the applicant to do"]},{"type":"p","text":"With <b>constructive delivery<\/b>, the policy counts as delivered in the eyes of the law even though the owner is not yet holding it."},{"type":"h","text":"What to do at delivery"},{"type":"list","items":["Review the coverage, riders, and exclusions, and explain any rating or change from what was applied for","Collect the first premium if it was not paid with the application","Obtain a signed statement of good health when required","Have the owner sign a delivery receipt"]},{"type":"p","text":"The signed and dated delivery receipt proves when the owner received the policy. That date starts the free-look period, during which the owner may return the policy for a full refund of premium."},{"type":"h","text":"Statement of good health"},{"type":"p","text":"When no premium was paid with the application, the insurer may require a <b>statement of good health<\/b> at delivery. The insured signs to confirm that their health has not changed and that they have not been injured or treated since the application date. If the insured cannot honestly sign it, do not leave the po
