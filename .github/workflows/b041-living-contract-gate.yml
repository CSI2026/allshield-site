name: B041 Living Contract Integration Gate
on:
  push:
    branches: [living-contract-b041]
    paths: ['.github/workflows/b041-living-contract-gate.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: living-contract-b041
          fetch-depth: 0
      - name: Patch production integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/comp-admin/index.ts')
          s=p.read_text()
          old='for (const k of ["effective_from", "effective_to", "weekly_arrears_days", "payday_dow", "open_enrollment_start_mmdd", "open_enrollment_end_mmdd", "reconciliation_end_mmdd", "residual_pool_per_member", "config", "contract_terms", "rate_basis", "metric_key", "unit_label"]) if (body[k] !== undefined) patch[k] = body[k];'
          new='for (const k of ["effective_from", "effective_to", "weekly_arrears_days", "payday_dow", "open_enrollment_start_mmdd", "open_enrollment_end_mmdd", "reconciliation_end_mmdd", "residual_pool_per_member", "residuals_enabled", "config", "contract_terms", "rate_basis", "metric_key", "unit_label"]) if (body[k] !== undefined) patch[k] = body[k];'
          assert old in s
          s=s.replace(old,new,1)
          old='residual_pool_per_member: last.residual_pool_per_member, config: last.config, contract_terms: last.contract_terms, created_by: actor.id,'
          new='residual_pool_per_member: last.residual_pool_per_member, residuals_enabled: last.residuals_enabled !== false, config: last.config, contract_terms: last.contract_terms, created_by: actor.id,'
          assert old in s
          s=s.replace(old,new,1)
          start='      const bodyText = contractBody(campaign, pubPlan, rules || [], tiers || [], splits || []);'
          end='      return json({ ok: true, plan: pubPlan, contract_body: bodyText });'
          a=s.index(start); b=s.index(end,a)+len(end)
          repl='''      const { data: livingContract, error: contractError } = await admin.from("contract_plan_versions")\n        .select("id,version,status,title,body_markdown,body_hash,effective_from,effective_to,published_at,generated_at")\n        .eq("comp_plan_version_id", planId).eq("status", "published").maybeSingle();\n      if (contractError) return json({ error: contractError.message }, 400);\n      if (!livingContract) return json({ error: "Living contract generation failed" }, 500);\n      await admin.from("comp_plan_change_log").insert({ plan_version_id: planId, actor_id: actor.id, action: "published", after_state: { plan: pubPlan, campaign_code: campaign.code, contract_version_id: livingContract.id, contract_body_hash: livingContract.body_hash } });\n      return json({ ok: true, plan: pubPlan, contract_body: livingContract.body_markdown, contract: livingContract });'''
          s=s[:a]+repl+s[b:]
          p.write_text(s)

          p=Path('supabase/functions/comp-calculations/index.ts')
          s=p.read_text()
          old='    if (action === "calculate_residuals") {\n      if (campaign.production_source !== "campaign_enrollments")'
          new='    if (action === "calculate_residuals") {\n      if (plan.residuals_enabled === false) return json({ error: "Residuals are disabled for this compensation version." }, 409);\n      if (campaign.production_source !== "campaign_enrollments")'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          marker='<script defer src="./comp-qualification-ui.js?v=B2026.08.29.040"></script>'
          add=marker+'\n<script defer src="./living-comp-contracts.js?v=B2026.08.29.041"></script>'
          assert marker in s
          s=s.replace(marker,add,1)
          p.write_text(s)

          p=Path('build-info.js')
          s=p.read_text()
          s=s.replace("current_build:'B2026.08.29.040'","current_build:'B2026.08.29.041'",1)
          s=s.replace("label:'Production B040 — Universal Editable Compensation + Qualification Tracking — Certified'","label:'Production B041 — Living Compensation Contracts + Versioned Re-Acceptance — Certified'",1)
          needle="    universal_compensation:'LIVE CONFIGURATION PASS',"
          repl="    living_compensation_contracts:'PASS',\n    contract_section_auto_sync:'PASS',\n    residual_section_removal:'PASS',\n    versioned_contract_reacceptance:'PASS',\n"+needle
          assert needle in s
          s=s.replace(needle,repl,1)
          needle="  changes:[\n"
          repl="  changes:[\n    'Added living compensation agreements generated directly from each compensation version; base rates, bonuses, tiers, leadership rules, residuals and program terms now drive the current agreement automatically',\n    'Removing residuals from a draft clears that version residual split configuration, blocks residual calculations and removes the entire Residuals section and residual clauses from the generated agreement',\n    'Previously published and accepted agreements remain immutable; each newly published compensation version creates a new agreement and pending acceptance requirement for assigned agents',\n"
          assert needle in s
          s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
      - name: Syntax gate
        run: node --check living-comp-contracts.js && node --check universal-compensation-platform.js
      - name: Living contract contract
        run: node tests/living-comp-contracts-contract.mjs
      - name: Full ALLSHIELD suite
        run: npm test
      - name: AI organization regression
        run: node tests/ai-workforce-organization-cert.mjs
      - name: Verify exact integration markers
        run: |
          grep -q 'residuals_enabled: last.residuals_enabled' supabase/functions/comp-admin/index.ts
          grep -q 'Living contract generation failed' supabase/functions/comp-admin/index.ts
          grep -q 'Residuals are disabled for this compensation version' supabase/functions/comp-calculations/index.ts
          grep -q 'living-comp-contracts.js?v=B2026.08.29.041' index.html
          grep -q "current_build:'B2026.08.29.041'" build-info.js
      - name: Remove one-time workflow
        run: rm -f .github/workflows/b041-living-contract-gate.yml
      - name: Commit clean B041 release candidate
        run: |
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Stage B041 living compensation contracts'
          git push origin HEAD:living-contract-b041
