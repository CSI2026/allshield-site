name: Certify Full Career Application Viewer

on:
  push:
    branches: [main]
    paths:
      - 'career-application-detail-2026-08-28.js'
      - 'config.js'
      - 'build-info.js'
      - 'tests/career-application-detail-cert.mjs'
      - '.github/workflows/career-application-detail-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Certify full career application viewer on live production
        run: ALLSHIELD_LIVE_URL='https://allshieldinsurancegroup.com' node tests/career-application-detail-cert.mjs
