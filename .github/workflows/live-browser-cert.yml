name: Live Browser Certification

on:
  push:
    branches: [main]
    paths:
      - 'tests/live-browser-cert.mjs'
      - '.github/workflows/live-browser-cert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live browser certification
        id: browsercert
        shell: bash
        run: |
          mkdir -p certification
          set +e
          ALLSHIELD_LIVE_URL='https://allshieldinsurancegroup.com' node tests/live-browser-cert.mjs > certification/live-browser-certification.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat certification/live-browser-certification.json
          exit 0
      - name: Commit certification result
        run: |
          git config user.name "allshield-cert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add certification/live-browser-certification.json certification/live-homepage.png || true
          if git diff --cached --quiet; then
            echo "No certification result changes."
          else
            git commit -m "Record live browser certification result"
            git push
          fi
      - name: Enforce certification result
        run: |
          test '${{ steps.browsercert.outputs.exit_code }}' = '0'
