licy. Return it to the insurer for further review."},{"type":"h","text":"When coverage begins"},{"type":"table","head":["Situation","Coverage starts"],"rows":[["Premium paid with application, conditional receipt","Later of application or exam date, if insurable"],["Premium paid with application, binding receipt","Immediately"],["No premium paid with application","When the policy is delivered, the first premium is paid, and any statement of good health is signed"]]},{"type":"flow","nodes":["Policy issued","Agent delivers and explains","Premium and good health statement","Coverage in force"],"caption":"The delivery steps when no premium was paid with the application."},{"type":"tip","text":"A statement of good health is collected only when the first premium was not paid with the application."}]},{"title":"Replacement and Anti-Money Laundering","blocks":[{"type":"h","text":"Replacement"},{"type":"p","text":"<b>Replacement<\/b> happens when a new life policy or annuity is bought and, as part of the deal, an existing one is lapsed, surrendered, converted to reduced paid-up or extended term coverage, borrowed against heavily, or otherwise reduced in value. Replacement is legal, but it can hurt a client: a new contestable period, a new suicide clause, higher premiums at an older age, and new surrender charges. The rules exist so the client can compare before deciding."},{"type":"h","text":"Duties of the replacing agent"},{"type":"list","items":["Ask whether the applicant has existing life insurance or annuities, and submit a signed statement with every application about whether replacement is involved","If it is, give the applicant the Notice Regarding Replacement no later than the time of application, signed by both the applicant and the agent","List on the notice each existing policy or contract that will be replaced","Leave the applicant with the original or a copy of all sales materials used","Send the insurer copies of the notice and the sales materials with the application"]},{"type":"h","text":"Duties of the insurers"},{"type":"p","text":"The replacing insurer must notify the existing insurer of the proposed replacement and keep its replacement records on file. It must also give the policyowner a free-look period of 30 days on the new policy. The existing insurer may then contact the client with information about keeping the old policy, an effort known as conservation."},{"type":"h","text":"USA PATRIOT Act and anti-money laundering"},{"type":"p","text":"<b>Money laundering<\/b> is the act of making illegally obtained money look legitimate. Life insurance and annuities with cash value can be misused for this, so federal law requires insurers to run an anti-money laundering (AML) program. A program has four basic parts:"},{"type":"list","items":["Written policies, procedures, and internal controls","A designated compliance officer","Ongoing training for employees and agents","Independent testing of the program"]},{"type":"p","text":"When a transaction of $5,000 or more looks suspicious, the insurer must file a <b>Suspicious Activity Report<\/b> (SAR) with the federal Financial Crimes Enforcement Network within 30 days of spotting it. The customer must not be told that a report was filed."},{"type":"list","items":["Red flag: paying a large premium in cash or with several money orders","Red flag: more interest in the cancellation or free-look terms than in the coverage","Red flag: quickly surrendering a policy despite the penalties","Red flag: reluctance to provide identifying information"]},{"type":"tip","text":"A Suspicious Activity Report covers suspicious transactions of $5,000 or more and is filed within 30 days."}]}],"summary":{"recap":["The application has a general information part, a medical part, and an agent's report. The applicant, the proposed insured, the policyowner if different, and the agent all sign. Corrections are initialed by the applicant, and the agent's report never becomes part of the contract.","The agent is the field underwriter. The home office underwriter also draws on medical exams, attending physician's statements, MIB reports, and inspection reports. MIB information cannot be the only reason for an adverse decision.","The Fair Credit Reporting Act gives applicants notice of reports and the right to learn the source of negative information and dispute it. HIPAA requires a signed authorization before medical records are released. HIV testing requires written informed consent and must be nondiscriminatory.","Applicants are classed as preferred, standard, substandard, or declined. Substandard risks are insured with a higher premium or modified coverage.","A conditional receipt starts coverage at the later of the application or exam date if the applicant is insurable. A binding receipt covers immediately for a limited time. With no premium paid up front, coverage waits for delivery, payment, and a statement of good health.","Replacement requires a signed notice and copies of sales materials. Insurers must maintain an anti-money laundering program and report suspicious transactions without tipping off the customer."],"avaSummary":"Nice work getting through chapter seven. Let me pull the key points together for you. Everything starts with the application. It has a general part, a medical part, and your agent's report, and remember that your report is not part of the contract. The applicant, the proposed insured, and you all sign, and any correction needs the applicant's initials. You are the field underwriter, which means the company trusts you to record answers accurately and report what you see. The underwriter then checks the facts using medical exams, doctor statements, the MIB, and inspection reports. An MIB report alone can never be the reason someone is declined. On the legal side, the Fair Credit Reporting Act gives your client the right to know about reports and to dispute errors. HIPAA requires a signed authorization, and HIV testing needs written informed consent. Next come the risk classes: preferred, standard, substandard, and declined. Substandard still means insurable, just at a higher price. For receipts, lock this in. A conditional receipt starts coverage at the later of the application or the medical exam, as long as the person is insurable. A binding receipt covers right away for a limited time. If no premium is paid with the application, coverage waits until you deliver the policy, collect the premium, and get a statement of good health. Finally, handle replacement carefully with the signed notice, and stay alert for money laundering red flags. If something looks suspicious, the insurer reports it and nobody tells the customer. Review your notes, then take the chapter exam. You are ready.","reviewNotes":[{"objective":"Describe the parts of a life insurance application, the signatures it requires, and how corrections are handled","concepts":["Part 1 collects general information and Part 2 collects medical information","A copy of the application is attached to the policy and becomes part of the contract","The applicant, proposed insured, policyowner if different, and agent must sign","Corrections are initialed by the applicant or a new application is completed","Issuing a policy on an incomplete application generally waives the insurer's right to the missing answer"],"terms":[{"term":"Agent's report","def":"The agent's observations about the applicant; not part of the contract."},{"term":"Application","def":"The main underwriting document, attached to and made part of the policy."}]},{"objective":"Identify the sources of underwriting information and the agent's role as field underwriter","concepts":["The agent screens applicants and records answers accurately","Medical exams are paid for by the insurer","An attending physician's statement comes from the applicant's own doctor","The MIB shares coded medical information among member insurers","MIB information cannot be the sole basis for declining or rating"],"terms":[{"term":"Field underwriter","def":"The agent, acting as the first screen of the risk."},{"term":"MIB","def":"Member-owned nonprofit that exchanges coded medical underwriting information."},{"term":"Inspection report","def":"Outside agency report on lifestyle, finances, and character."}]},{"objective":"Explain how the Fair Credit Reporting Act, HIPAA, and HIV testing rules protect applicants","concepts":["Applicants must be notified in writing that a report may be ordered","Investigative consumer reports rely on interviews","After an adverse decision, the insurer gives the name and address of the reporting agency","HIPAA requires signed authorization to release health information","HIV tests need written informed consent and cannot be based on sexual orientation"],"terms":[{"term":"Fair Credit Reporting Act","def":"Federal law governing consumer reports and consumers' rights to dispute them."},{"term":"Investigative consumer report","def":"A report built from interviews with people who know the applicant."}]},{"objective":"Compare the preferred, standard, substandard, and declined risk classifications","concepts":["Preferred risks pay less than the standard rate","Standard risks represent average mortality","Substandard risks are insured with an extra premium or modified coverage","Declined risks are not issued a policy","Race, color, religion, and national origin cannot be used to refuse or rate coverage"],"terms":[{"term":"Substandard risk","def":"A higher than average risk issued a rated policy."},{"term":"Flat extra premium","def":"A set dollar charge added per $1,000 of coverage for a substandard risk."}]},{"objective":"Distinguish conditional receipts from binding receipts and determine when coverage begins","concepts":["A receipt is given only when premium is paid with the application","Conditional receipt: later of application or exam date, if insurable","Binding receipt: immediate coverage for a limited period","No premium with the application means no coverage until delivery and payment","Premiums are held in a fiduciary capacity and must not be commingled"],"terms":[{"term":"Conditional receipt","def":"Early coverage that depends on the applicant being insurable."},{"term":"Binding receipt","def":"Immediate temporary coverage with no insurability condition."}]},{"objective":"Summarize an agent's duties for policy delivery, replacement, and anti-money laundering compliance","concepts":["Explain the policy, riders, and any rating at delivery","The delivery receipt date starts the free-look period","A statement of good health is needed when premium was not paid with the application","Replacement requires a signed notice and copies of sales materials","Suspicious transactions of $5,000 or more are reported within 30 days, without telling the customer"],"terms":[{"term":"Constructive delivery","def":"Delivery completed when the insurer gives up control of the policy."},{"term":"Replacement","def":"Buying new coverage while ending or reducing existing coverage."},{"term":"Suspicious Activity Report","def":"Federal report of a transaction that may involve money laundering."}]}]},"exam":[{"q":"Which of the following is NOT part of the insurance contract?","choices":["Part 1 of the application","Part 2 of the application","The agent's report","The policy riders"],"answer":2,"why":"The agent's report is sent to the insurer for underwriting but is never attached to or made part of the contract."},{"q":"An applicant gives a wrong answer and the agent notices before submitting the application. What is an acceptable way to fix it?","choices":["Cross out the error, write the correct answer, and have the applicant initial it","Cover the error with correction fluid","Have the agent initial the change","Erase the answer and rewrite it"],"answer":0,"why":"Corrections must be visible and approved by the applicant's initials, or a new application is completed."},{"q":"A corporation applies for a policy on the life of its vice president. Besides the agent, who must sign the application?","choices":["Only the vice president","Only an officer of the corporation","The beneficiary and the vice president","An officer of the corporation and the vice president"],"answer":3,"why":"When the policyowner and the insured are different, both the owner and the proposed insured must sign."},{"q":"An insurer issues a policy even though one application question was left unanswered. What is the result?","choices":["The policy is void","The insurer is treated as having waived its right to that answer","The agent must pay any claim","The contestable period is doubled"],"answer":1,"why":"By issuing the policy without the answer, the insurer gives up the right to that information."},{"q":"Who is known as the field underwriter?","choices":["The medical examiner","The home office underwriter","The agent","The MIB"],"answer":2,"why":"The agent meets the applicant and performs the first screening of the risk."},{"q":"Which statement about the MIB is correct?","choices":["It is a federal agency","It stores complete medical records","Agents report directly to it","Its report cannot be the only reason coverage is declined"],"answer":3,"why":"MIB data is a prompt for further investigation and may not be the sole basis for an adverse decision."},{"q":"Who normally pays for a medical exam required for underwriting?","choices":["The insurer","The applicant","The agent","The MIB"],"answer":0,"why":"The insurer orders the exam and bears its cost."},{"q":"A report that includes interviews with an applicant's neighbors and coworkers is called:","choices":["An attending physician's statement","An investigative consumer report","An MIB report","An agent's report"],"answer":1,"why":"Investigative consumer reports gather information through interviews with people who know the applicant."},{"q":"An applicant is charged a higher premium because of information in a consumer report. Under the Fair Credit Reporting Act, the insurer must:","choices":["Refund the first premium","Issue the policy at standard rates","Give the applicant the name and address of the reporting agency","Order a second report at its own cost"],"answer":2,"why":"After an adverse decision based on a report, the consumer must be told which agency supplied it."},{"q":"Under HIPAA, an applicant's doctor may release medical records to a life insurer when:","choices":["The applicant has signed an authorization","The agent requests them by phone","The insurer is a member of the MIB","The policy amount is large"],"answer":0,"why":"Protected health information generally cannot be released without the individual's signed authorization."},{"q":"Before an insurer may test an applicant for HIV, it must:","choices":["Decline all other coverage","Notify the applicant's employer","Confirm the applicant's marital status","Obtain the applicant's written informed consent"],"answer":3,"why":"HIV testing requires written informed consent and must be applied on a nondiscriminatory basis."},{"q":"An applicant in excellent health who does not smoke would most likely be classified as:","choices":["Standard","Preferred","Substandard","Declined"],"answer":1,"why":"Preferred risks have better than average mortality expectations and pay lower premiums."},{"q":"How is a substandard risk usually handled?","choices":["The application is always declined","The policy is issued at the standard rate","The policy is issued with a higher premium or modified coverage","The applicant is referred to the MIB"],"answer":2,"why":"Substandard risks are insurable but are rated up or issued with limits."},{"q":"An applicant pays the first premium with the application on June 1, receives a conditional receipt, and completes the required medical exam on June 6. If found insurable, coverage begins:","choices":["June 1","When the policy is delivered","When the policy is issued","June 6"],"answer":3,"why":"A conditional receipt starts coverage on the later of the application date or the medical exam date."},{"q":"Which receipt provides immediate coverage for a limited time whether or not the applicant is insurable?","choices":["Binding receipt","Conditional receipt","Delivery receipt","Inspection receipt"],"answer":0,"why":"A binding receipt, or temporary insurance agreement, covers the applicant at once for a stated period."},{"q":"An agent deposits a client's premium check into his personal checking account along with his own money. This is called:","choices":["Twisting","Commingling","Rebating","Replacement"],"answer":1,"why":"Premiums are held in trust, and mixing them with personal funds is commingling."},{"q":"No premium was submitted with the application. When the agent delivers the policy, the agent should collect the premium and:","choices":["A new application","An inspection report","A statement of good health","A conditional receipt"],"answer":2,"why":"The statement of good health confirms the insured's health has not changed since the application."},{"q":"An insurer mails an issued policy to the agent with no conditions left to be met. This is an example of:","choices":["A binding receipt","Field underwriting","Replacement","Constructive delivery"],"answer":3,"why":"Delivery is legally complete once the insurer gives up control of the policy."},{"q":"In a replacement sale, the agent must give the applicant the Notice Regarding Replacement:","choices":["No later than the time of application","When the policy is delivered","Only if the applicant asks for it","After the existing policy is surrendered"],"answer":0,"why":"The notice is presented and signed at or before the application so the client can compare before deciding."},{"q":"Under federal anti-money laundering rules, a Suspicious Activity Report must be filed for suspicious transactions of at least:","choices":["$1,000","$5,000","$10,000","$25,000"],"answer":1,"why":"Insurers report suspicious transactions involving $5,000 or more, within 30 days of detecting them."}]},{"id":"ch08","num":8,"title":"Group Life Insurance","intro":{"hook":["For many people, the first life insurance they ever own is not something they shopped for. It showed up in a benefits packet on the first week of a new job, with a line that said something like one times your annual salary.","That is group life insurance. One contract covers many people, the paperwork is light, and most members never answer a health question. It works very differently from the individual policies covered in earlier chapters.","This chapter explains who holds the contract, which groups qualify, how the group is underwritten and priced, what happens when a member leaves, and how the coverage is taxed. You will also meet three close relatives: credit life, blanket life, and franchise life."],"objectives":["Compare group life insurance with individual life insurance","Identify the master policy, the certificate of insurance, and the types of groups eligible for coverage","Explain contributory and noncontributory plans and their participation requirements","Describe how group life insurance is underwritten and rated","Explain the conversion privilege and how dependent coverage works","Describe the tax treatment of group term life and the features of credit, blanket, and franchise life insurance"],"avaIntro":"Hi, it's Ava. Welcome to chapter eight, group life insurance. If you have ever had life insurance through a job, you already know a little about this topic. In this chapter I will show you what is going on behind that benefit. We will start with how group coverage differs from an individual policy, including who owns the contract and what the employee actually receives. Then we will look at which groups can be insured, who pays the premium, and how many members have to sign up. I will explain how the insurance company underwrites a whole group at once and how it sets the price. After that, we will cover the conversion privilege, dependent coverage, and the fifty thousand dollar tax rule. We will wrap up with credit, blanket, and franchise life. There are a few numbers to memorize here, and I will point them out as we go."},"keywords":[{"term":"Blanket life insurance","def":"Coverage for a changing group of people who are not individually named, such as passengers or students."},{"term":"Certificate of insurance","def":"The document given to each insured group member as evidence of coverage; it is not the contract."},{"term":"Contributory plan","def":"A group plan in which members pay part or all of the premium; at least 75% of eligible members must participate."},{"term":"Conversion privilege","def":"The right to change group coverage to an individual policy without proving insurability, within 31 days of losing coverage."},{"term":"Credit life insurance","def":"Coverage on a borrower's life that pays off the remaining debt to the lender at death."},{"term":"Enrollment period","def":"The window in which a newly eligible member can join the plan without proving insurability."},{"term":"Experience rating","def":"Setting a group's premium based on that group's own claims history."},{"term":"Franchise life insurance","def":"Individual policies issued to members of a small group, each individually underwritten."},{"term":"Group life insurance","def":"One contract that insures the lives of many people who share a common tie, such as an employer."},{"term":"Master policy","def":"The group contract issued to the policyowner, such as the employer or other sponsor."},{"term":"Noncontributory plan","def":"A group plan in which the sponsor pays the whole premium; 100% of eligible members must be covered."},{"term":"Probationary period","def":"A waiting time a new employee must complete before becoming eligible for group coverage."},{"term":"Table I","def":"The IRS table used to value employer-paid group term life coverage above $50,000 for income tax purposes."}],"sections":[{"title":"Group Versus Individual Life Insurance","blocks":[{"type":"p","text":"<b>Group life insurance<\/b> covers many people under a single contract. The people share a common tie, most often the same employer. Instead of evaluating each person, the insurer evaluates the group as one unit."},{"type":"p","text":"This approach lowers costs. There is one contract to issue, one premium bill to send, and far less underwriting work per person. Those savings are passed along, so group coverage usually costs less per $1,000 than an individual policy."},{"type":"table","head":["Feature","Individual life","Group life"],"rows":[["Contract","One policy per insured","One master policy for the whole group"],["Policyowner","Usually the insured or a family member","The employer or other sponsor"],["What the insured receives","The policy","A certificate of insurance"],["Underwriting","Each person is evaluated","The group is evaluated as a whole"],["Evidence of insurability","Usually required","Usually not required"],["Cost","Higher per $1,000","Lower per $1,000"],["Type of coverage","Term or permanent","Most often annually renewable term"]]},{"type":"h","text":"Group term life"},{"type":"p","text":"Most group life is written as <b>annually renewable term<\/b>. The contract renews each year, and the insurer may adjust the premium at renewal based on the ages in the group and its claims. There is no cash value. Coverage lasts only while the person remains an eligible member and the master policy stays in force."},{"type":"h","text":"How benefit amounts are set"},{"type":"p","text":"Members generally do not pick any amount they like. Benefits follow a schedule that applies automatically, such as:"},{"type":"list","items":["A flat amount for every member","A multiple of annual earnings, such as one or two times salary","An amount based on job position or length of service"]},{"type":"p","text":"A set schedule keeps people who expect to die soon from choosing a very large amount, which protects the insurer from adverse selection."},{"type":"h","text":"Beneficiaries"},{"type":"p","text":"Each insured member names a beneficiary and can change it. In employer group life, the employer cannot be the beneficiary. The death benefit goes to the person the employee chose."},{"type":"example","text":"A warehouse company insures all 80 full-time employees for one times annual pay. The company holds one contract. Each worker gets a certificate and names a beneficiary."},{"type":"tip","text":"Group life is usually annually renewable term insurance with no cash value."}]},{"title":"Master Policy, Certificates, and Eligible Groups","blocks":[{"type":"h","text":"Who holds what"},{"type":"p","text":"In group insurance, there are two parties to the contract: the insurer and the group policyowner. The contract itself is called the <b>master policy<\/b>. It is issued to the sponsor, such as an employer, union, or association. The sponsor applies for the coverage, pays the premium to the insurer, and handles enrollment."},{"type":"p","text":"The insured members are not parties to the contract. Each one receives a <b>certificate of insurance<\/b>. The certificate is evidence of coverage. It summarizes the benefit amount, the named beneficiary, and the member's rights, including the right to convert."},{"type":"flow","nodes":["Insurer","Master policy to sponsor","Certificates to members"],"caption":"The sponsor holds the contract; each insured member holds a certificate."},{"type":"h","text":"The purpose rule"},{"type":"p","text":"To qualify, a group must exist for a reason other than buying insurance. This is sometimes called a natural group. A group thrown together just to get cheap coverage would attract mostly unhealthy people, and the plan would fail."},{"type":"h","text":"Types of eligible groups"},{"type":"table","head":["Group type","Policyowner","Who is covered"],"rows":[["Single employer","The employer","Employees"],["Labor union","The union","Union members"],["Multiple employer trust","Trustees of the fund","Employees of two or more employers that join together"],["Association","The association","Members of a trade, professional, or similar association"],["Creditor","The lender","Borrowers (debtors)"]]},{"type":"p","text":"Small employers often cannot get good group rates alone. By joining a multiple employer trust, several employers in the same industry pool their employees to form one larger group."},{"type":"h","text":"Eligibility of members"},{"type":"p","text":"The sponsor may set reasonable rules about which members are eligible, as long as the rules are tied to employment and not to health. Typical rules cover full-time status and length of service. A new hire may have to complete a <b>probationary period<\/b> before becoming eligible. After that comes the <b>enrollment period<\/b>, when the employee may sign up without any health questions."},{"type":"example","text":"Ana starts work on March 1. Her employer's plan has a 60-day probationary period followed by a 31-day enrollment period. She enrolls in May without answering a single health question."},{"type":"tip","text":"The employer receives the master policy; the employees receive certificates of insurance."}]},{"title":"Contributory and Noncontributory Plans","blocks":[{"type":"p","text":"Group plans are sorted by who pays the premium. The answer also decides how many eligible members must be covered."},{"type":"h","text":"Noncontributory plans"},{"type":"p","text":"In a <b>noncontributory plan<\/b>, the employer pays the entire premium. The employees contribute nothing. Because the coverage costs them nothing, there is no reason for anyone to stay out, so the insurer requires that 100% of eligible employees be covered."},{"type":"h","text":"Contributory plans"},{"type":"p","text":"In a <b>contributory plan<\/b>, the employees pay part of the premium, or in some cases all of it, usually through payroll deduction. Since joining costs money, some people will say no. The insurer requires that at least 75% of eligible employees participate."},{"type":"table","head":["Feature","Noncontributory","Contributory"],"rows":[["Who pays the premium","Employer pays all","Employee pays part or all"],["Participation required","100% of eligible members","At least 75% of eligible members"],["Employee action needed","None; coverage is automatic","Employee must elect coverage and authorize payroll deduction"]]},{"type":"h","text":"Why participation rules exist"},{"type":"p","text":"Participation requirements do two jobs. First, they guard against <b>adverse selection<\/b>. If only a few people join a contributory plan, they are likely to be the ones who think they need the coverage most. Requiring a large share of the group brings in plenty of healthy members to balance the risk. Second, more members means the fixed costs of running the plan are spread over more people, which keeps the cost per person down."},{"type":"h","text":"Enrolling late"},{"type":"p","text":"In a contributory plan, an employee who turns down coverage during the enrollment period and later wants in is a late enrollee. The insurer may ask a late enrollee to provide evidence of insurability, because a person who waits and then suddenly wants coverage may have learned of a health problem."},{"type":"flow","nodes":["Hired","Probationary period","Enrollment period","Covered without health questions"],"caption":"The usual path into a contributory group plan for a new employee."},{"type":"example","text":"A plan has 200 eligible employees and each pays $6 a month toward the premium. Because the plan is contributory, at least 150 of them must enroll for the plan to meet the 75% requirement."},{"type":"tip","text":"Noncontributory means 100% participation; contributory means at least 75%."}]},{"title":"Group Underwriting and Rating","blocks":[{"type":"p","text":"In <b>group underwriting<\/b>, the insurer studies the group, not the individuals in it. Members are normally covered without a medical exam or health questions. The insurer accepts that some members are in poor health, because the rules of the plan make sure they are balanced by many healthy ones."},{"type":"h","text":"What the underwriter looks at"},{"type":"list","items":["Purpose of the group: it must exist for a reason other than buying insurance","Size: larger groups produce more predictable results","Stability and turnover: steady movement of younger workers in and older workers out keeps the average age from rising","Makeup of the group: ages, sex, and the type of industry or work","How benefits are determined: a set schedule, not individual choice","Participation: enough eligible members must be covered","Financial strength of the sponsor and its ability to pay premiums and handle administration"]},{"type":"p","text":"Individual evidence of insurability may still be asked for in a few cases, such as late enrollees, very small groups, or members who request amounts above the normal schedule."},{"type":"h","text":"How the premium is set"},{"type":"p","text":"Group life premiums are recalculated each year. Two rating methods are used."},{"type":"table","head":["Method","How it works","Typical use"],"rows":[["Experience rating","The premium reflects the claims history of this particular group","Larger groups with enough data to be reliable"],["Manual rating","The premium comes from the insurer's rate tables, built from the average results of similar groups","Small or new groups with little history"]]},{"type":"p","text":"With <b>experience rating<\/b>, a group with fewer claims than expected may see its premium lowered or receive a refund or dividend. A group with poor claims experience may see an increase at renewal. Any refund is paid to the policyowner. In a contributory plan, a refund larger than the employer's own share of the cost must be used for the benefit of the employees."},{"type":"flow","nodes":["Review group's claims","Compare to expected claims","Adjust renewal premium"],"caption":"The basic idea behind experience rating."},{"type":"example","text":"A trucking firm with 900 employees had far fewer death claims than expected over three years. At renewal, the insurer lowers the firm's group life rate based on that record."},{"type":"tip","text":"Experience rating bases the premium on the group's own claims history, not on industry averages."}]},{"title":"Conversion Privilege and Dependent Coverage","blocks":[{"type":"h","text":"When a member leaves the group"},{"type":"p","text":"Group coverage normally ends when employment ends. The <b>conversion privilege<\/b> keeps a departing member from being left with nothing. It gives the person the right to change the group coverage into an individual policy without proving insurability. No exam and no health questions are allowed."},{"type":"list","items":["The member must apply and pay the first premium within 31 days after group coverage ends.","The new policy is individual permanent insurance, such as whole life. It is usually not term insurance.","The amount may not be more than the group coverage that was lost.","The premium is the insurer's standard rate for the person's attained age, which is the age at the time of conversion."]},{"type":"p","text":"Expect the converted policy to cost much more than the group coverage did. The person is now older, is buying permanent insurance, and is paying an individual rate."},{"type":"h","text":"Death during the conversion period"},{"type":"p","text":"The group coverage in effect continues through the 31-day conversion period. If the former member dies during those 31 days, the group death benefit is paid to the beneficiary, even if the person never applied for an individual policy."},{"type":"h","text":"When the master policy ends"},{"type":"p","text":"If the employer cancels the group plan altogether, conversion rights are narrower. Members who have been insured under the plan for at least five years may convert, and the amount available is usually limited."},{"type":"flow","nodes":["Employment ends","31-day conversion period","Individual policy issued, no health evidence"],"caption":"How a departing employee converts group life to an individual policy."},{"type":"h","text":"Dependent coverage"},{"type":"p","text":"Many group plans allow an insured employee to add coverage on the lives of dependents. Eligible dependents usually include the employee's spouse and children. The amount on a dependent is normally a modest sum and is less than the employee's own coverage. The employee is typically the beneficiary. A covered spouse usually has a conversion right as well, for example if the employee dies or the marriage ends."},{"type":"example","text":"Greg leaves his job on June 30 with $50,000 of group life. He has a heart condition. On July 15 he applies to convert and pays the premium. The insurer must issue him an individual whole life policy at his attained-age rate and cannot ask about his heart."},{"type":"tip","text":"The conversion period is 31 days, and no evidence of insurability can be required."}]},{"title":"Tax Treatment of Group Term Life","blocks":[{"type":"p","text":"Group term life gets favorable tax treatment, which is one reason employers offer it. The rules look at three things: the premium the employer pays, the value of the coverage to the employee, and the death benefit."},{"type":"h","text":"Premiums paid by the employer"},{"type":"p","text":"Premiums an employer pays for group life on its employees are generally deductible by the employer as an ordinary business expense, as long as the employer is not the beneficiary."},{"type":"h","text":"The $50,000 rule"},{"type":"p","text":"The cost of the first <b>$50,000<\/b> of employer-paid group term life is not taxable income to the employee. If the employer provides more than $50,000, the cost of the coverage above that amount is treated as taxable income to the employee."},{"type":"p","text":"The taxable cost is not what the employer actually paid. It is figured from an IRS schedule called <b>Table I<\/b>, which lists a monthly cost per $1,000 of coverage based on the employee's age. Anything the employee paid toward the coverage with after-tax dollars is subtracted."},{"type":"table","head":["Item","Tax result"],"rows":[["Employer-paid premium","Deductible by the employer"],["Cost of the first $50,000 of coverage","Not taxable to the employee"],["Cost of coverage above $50,000","Taxable income to the employee, valued using IRS Table I"],["Premium the employee pays","Not deductible by the employee"],["Death benefit paid in a lump sum","Received income tax free by the beneficiary"]]},{"type":"h","text":"Death benefits"},{"type":"p","text":"As with individual life insurance, a death benefit paid in a lump sum is received by the beneficiary free of federal income tax. If the beneficiary instead takes the money in installments, the part of each payment that is interest is taxable."},{"type":"h","text":"Why the rule matters to an agent"},{"type":"p","text":"Employees are often surprised to see a small amount of extra income on a pay stub or W-2 because of group life. When you can explain that it comes from coverage above $50,000, you build trust. It can also open a conversation about personal coverage that the employee owns and keeps after leaving the job."},{"type":"example","text":"Priya's employer pays for $120,000 of group term life. The cost of the first $50,000 is tax free to her. The cost of the remaining $70,000, figured from IRS Table I for her age, is added to her taxable income."},{"type":"tip","text":"Only the cost of employer-paid group term coverage above $50,000 is taxable to the employee."}]},{"title":"Credit, Blanket, and Franchise Life","blocks":[{"type":"p","text":"Three other forms of coverage are tested alongside group life. Each bends the usual group rules in its own way."},{"type":"h","text":"Credit life insurance"},{"type":"p","text":"<b>Credit life insurance<\/b> pays off a loan if the borrower dies. It is usually written as decreasing term, so the amount of coverage drops as the loan balance drops. It may be sold as an individual policy or as a group plan in which the lender holds the master policy."},{"type":"list","items":["The creditor (lender) is the policyowner and the beneficiary.","The debtor (borrower) is the insured and usually pays the premium.","The amount of coverage may not be more than the amount of the debt.","A lender may require coverage as a condition of the loan, but may not require the borrower to buy it from a particular insurer.","The borrower must receive a certificate or policy describing the coverage."]},{"type":"p","text":"Credit life is the one situation in group life where the policyowner is also the beneficiary."},{"type":"h","text":"Blanket life insurance"},{"type":"p","text":"<b>Blanket insurance<\/b> covers a group whose members constantly change. The people are not named, and no certificates are issued. A person is covered automatically by being part of the group at the time of a loss. Examples include passengers of an airline or other common carrier, students at a school, members of a volunteer fire department, and participants at a camp or on a sports team."},{"type":"h","text":"Franchise life insurance"},{"type":"p","text":"<b>Franchise life insurance<\/b>, also called wholesale life, serves groups too small to qualify for true group coverage. There is no master policy. Each person applies for and receives an individual policy, and each person is individually underwritten. The premium is lower than for a policy bought alone, though not as low as true group rates. The employer or association may collect and send in the premiums, often by payroll deduction."},{"type":"table","head":["Type","Who is covered","Key feature"],"rows":[["Credit life","Borrowers","Lender is owner and beneficiary; benefit limited to the debt"],["Blanket life","Unnamed, changing members","Automatic coverage; no certificates"],["Franchise life","Members of small groups","Individual policies and individual underwriting"]]},{"type":"example","text":"Ben takes out a five-year car loan and buys credit life through the lender's group plan. He dies in year three. The insurer pays the remaining loan balance directly to the lender."},{"type":"tip","text":"In credit life, the lender is both the policyowner and the beneficiary, and coverage cannot exceed the debt."}]}],"summary":{"recap":["Group life insurance covers many people under one contract. It is usually annually renewable term, costs less per $1,000 than individual coverage, and is issued without individual evidence of insurability.","The sponsor holds the master policy, and each insured member receives a certificate of insurance. A group must exist for a purpose other than buying insurance. Eligible groups include employers, unions, multiple employer trusts, associations, and creditors.","A noncontributory plan is paid for entirely by the employer and must cover 100% of eligible members. A contributory plan is paid for partly or fully by employees and needs at least 75% participation.","Underwriters evaluate the group as a whole, looking at its purpose, size, stability, and makeup. Premiums are set by experience rating for larger groups and manual rating for smaller ones.","A member who loses coverage has 31 days to convert to an individual permanent policy at the attained-age rate without evidence of insurability. Death during those 31 days is paid under the group policy.","The cost of employer-paid group term coverage above $50,000 is taxable to the employee. Credit life protects lenders, blanket life covers unnamed and changing members, and franchise life uses individual policies for small groups."],"avaSummary":"Great job finishing chapter eight. Let's run back through the main ideas. Group life insurance puts many people under one contract. The employer or other sponsor holds the master policy, and each covered person gets a certificate of insurance, which is proof of coverage but not the contract itself. Most group life is annually renewable term. A group has to exist for some reason other than buying insurance, and it can be an employer, a union, a trust, an association, or a lender's borrowers. Next, know who pays. If the employer pays everything, the plan is noncontributory and one hundred percent of eligible employees must be covered. If employees share the cost, the plan is contributory and at least seventy-five percent must join. The insurer underwrites the group as a whole, so members usually skip the health questions. Larger groups are priced with experience rating, which uses the group's own claims history. When someone leaves the group, the conversion privilege gives that person thirty-one days to move to an individual permanent policy with no evidence of insurability, at the rate for their attained age. If the person dies in that window, the group benefit is still paid. On taxes, remember fifty thousand dollars. The cost of employer-paid coverage above that amount is taxable income to the employee, while the death benefit itself is income tax free. Finally, credit life pays the lender and cannot exceed the debt, blanket life covers people who are not named, and franchise life means individual policies for small groups. Look over the review notes, and then try the exam.","reviewNotes":[{"objective":"Compare group life insurance with individual life insurance","concepts":["One master contract covers many people","The group is underwritten as a whole, usually with no individual evidence of insurability","Cost per $1,000 is lower because of reduced administrative and underwriting expense","Coverage is usually annually renewable term with no cash value","Benefit amounts follow a schedule, not individual choice"],"terms":[{"term":"Group life insurance","def":"One contract insuring many people with a common tie."},{"term":"Annually renewable term","def":"Term coverage that renews each year, with the premium recalculated at renewal."}]},{"objective":"Identify the master policy, the certificate of insurance, and the types of groups eligible for coverage","concepts":["The contract is between the insurer and the sponsor","Insured members receive certificates as evidence of coverage","The group must exist for a purpose other than buying insurance","Eligible groups include employers, unions, multiple employer trusts, associations, and creditors","Eligibility rules must relate to employment, not health"],"terms":[{"term":"Master policy","def":"The group contract issued to the sponsor."},{"term":"Certificate of insurance","def":"Evidence of coverage given to each insured member."},{"term":"Probationary period","def":"Waiting time before a new employee becomes eligible."}]},{"objective":"Explain contributory and noncontributory plans and their participation requirements","concepts":["Noncontributory: employer pays all, 100% of eligible members covered","Contributory: employees pay part or all, at least 75% must participate","Participation rules reduce adverse selection and spread expenses","Late enrollees may have to show evidence of insurability"],"terms":[{"term":"Contributory plan","def":"Members share in the premium; 75% participation required."},{"term":"Noncontributory plan","def":"Sponsor pays the whole premium; 100% participation required."},{"term":"Enrollment period","def":"The window to join without proving insurability."}]},{"objective":"Describe how group life insurance is underwritten and rated","concepts":["Underwriters evaluate the purpose, size, stability, and makeup of the group","A steady flow of members keeps the average age stable","Experience rating uses the group's own claims history","Manual rating uses the insurer's tables for similar groups","Refunds go to the policyowner and excess amounts must benefit employees in a contributory plan"],"terms":[{"term":"Experience rating","def":"Premium based on the specific group's claims record."},{"term":"Adverse selection","def":"The tendency of poorer risks to seek coverage more than better risks."}]},{"objective":"Explain the conversion privilege and how dependent coverage works","concepts":["Conversion must be requested within 31 days of losing group coverage","No evidence of insurability may be required","The new policy is individual permanent insurance at the attained-age rate","Death within the 31 days is paid by the group policy","If the master policy ends, members insured at least five years may convert","Dependent coverage is for spouses and children in amounts lower than the employee's"],"terms":[{"term":"Conversion privilege","def":"Right to change group coverage to an individual policy without proving insurability."},{"term":"Attained age","def":"The insured's age at the time of conversion."}]},{"objective":"Describe the tax treatment of group term life and the features of credit, blanket, and franchise life insurance","concepts":["Employer-paid premiums are deductible by the employer","The cost of coverage above $50,000 is taxable to the employee, using IRS Table I","Lump-sum death benefits are income tax free","Credit life: lender is owner and beneficiary, and coverage cannot exceed the debt","Blanket life covers unnamed members automatically, with no certificates","Franchise life uses individual policies and individual underwriting"],"terms":[{"term":"Table I","def":"IRS schedule used to value group term coverage over $50,000."},{"term":"Credit life insurance","def":"Coverage that pays a borrower's remaining debt at death."},{"term":"Franchise life insurance","def":"Individual policies issued to members of a small group."}]}]},"exam":[{"q":"In an employer group life plan, the master policy is issued to:","choices":["Each employee","The employer","The beneficiaries","The state insurance department"],"answer":1,"why":"The sponsor, here the employer, is the policyowner and holds the master policy."},{"q":"What does an insured employee receive as evidence of group life coverage?","choices":["A certificate of insurance","A copy of the master policy","A conditional receipt","An individual policy"],"answer":0,"why":"Members receive certificates of insurance; the contract itself stays with the sponsor."},{"q":"Which of the following would NOT qualify as a group for group life insurance?","choices":["A labor union","A single employer","A professional association","People who join together only to buy insurance"],"answer":3,"why":"A group must be formed for a purpose other than obtaining insurance."},{"q":"Most group life insurance is written as:","choices":["Whole life","Universal life","Annually renewable term","Variable life"],"answer":2,"why":"Group life is typically annually renewable term with no cash value."},{"q":"An employer pays the full premium for its group life plan. What percentage of eligible employees must be covered?","choices":["50%","75%","90%","100%"],"answer":3,"why":"A noncontributory plan must cover all eligible employees."},{"q":"In a contributory group life plan, the minimum participation is:","choices":["75% of eligible employees","100% of eligible employees","50% of eligible employees","25% of eligible employees"],"answer":0,"why":"When employees share the premium, at least 75% of those eligible must participate."},{"q":"The main reason insurers set participation requirements for group plans is to:","choices":["Increase agent commissions","Guard against adverse selection","Avoid issuing certificates","Allow individual underwriting"],"answer":1,"why":"Broad participation brings in enough healthy members to balance the poorer risks."},{"q":"In group life underwriting, the insurer evaluates:","choices":["Each member's medical history","Only the oldest members","The group as a whole","Only members who request high amounts"],"answer":2,"why":"Group underwriting looks at the characteristics of the entire group, not individuals."},{"q":"A premium based on a specific group's own claims history is an example of:","choices":["Manual rating","Experience rating","Community rating","Attained-age rating"],"answer":1,"why":"Experience rating uses the group's actual past claims to set its premium."},{"q":"An employee who declines contributory group coverage during the enrollment period and asks to join a year later may be required to:","choices":["Pay a state penalty","Wait five years","Convert to an individual policy","Provide evidence of insurability"],"answer":3,"why":"Late enrollees present a greater risk of adverse selection, so proof of insurability may be required."},{"q":"A terminated employee who wants to convert group life coverage must apply within:","choices":["31 days","10 days","60 days","90 days"],"answer":0,"why":"The conversion privilege must be used within 31 days after group coverage ends."},{"q":"When an employee converts group life coverage, the premium for the new policy is based on the person's:","choices":["Age when first hired","Original group rate","Attained age","Health at conversion"],"answer":2,"why":"The converted policy is issued at the standard rate for the insured's attained age, with no evidence of insurability."},{"q":"An employee is laid off and dies 20 days later without having applied to convert the group life coverage. The insurer will:","choices":["Pay nothing","Pay the group death benefit","Refund the premiums paid","Pay half of the benefit"],"answer":1,"why":"Coverage continues during the 31-day conversion period, so the group benefit is payable."},{"q":"Group life coverage is usually converted to which type of policy?","choices":["Individual term insurance","Another group certificate","Credit life insurance","Individual permanent insurance"],"answer":3,"why":"Conversion is to an individual permanent policy such as whole life, usually not term."},{"q":"An employer provides an employee with $80,000 of group term life at no cost to the employee. Which statement is true?","choices":["The cost of $30,000 of the coverage is taxable income to the employee","The entire cost is taxable income to the employee","None of the cost is taxable to the employee","The death benefit will be taxable to the beneficiary"],"answer":0,"why":"Only the cost of coverage above $50,000 is taxable, which here is $30,000 of coverage."},{"q":"Premiums an employer pays for group term life insurance on its employees are generally:","choices":["Taxed twice","Not deductible","Deductible by the employer as a business expense","Deductible by the employee"],"answer":2,"why":"Employer-paid group life premiums are an ordinary business expense."},{"q":"In credit life insurance, the beneficiary is the:","choices":["Borrower's spouse","Creditor","Borrower's estate","Insurer"],"answer":1,"why":"The lender is both policyowner and beneficiary, and the benefit pays off the debt."},{"q":"The amount of credit life insurance may not exceed:","choices":["The amount of the debt","$50,000","Twice the borrower's income","The lender's total assets"],"answer":0,"why":"Credit life is limited to the amount owed to the creditor."},{"q":"Which type of coverage insures members of a changing group who are not individually named and receive no certificates?","choices":["Franchise life","Credit life","Contributory group life","Blanket life"],"answer":3,"why":"Blanket coverage applies automatically to whoever is in the group at the time of loss."},{"q":"Under franchise (wholesale) life insurance, members of a small group receive:","choices":["Certificates under a master policy","No written evidence of coverage","Individual policies that are individually underwritten","A blanket policy"],"answer":2,"why":"Franchise life issues individual policies to each member, with individual underwriting."}]},{"id":"ch09","num":9,"title":"Annuities","intro":{"hook":["Picture a client who has saved faithfully for forty years. On the day she retires, her biggest fear is no longer dying too soon. It is living so long that the money runs out before she does.","Life insurance protects a family against an early death. An annuity does the opposite job: it protects a person against outliving their savings by turning a sum of money into a stream of income.","In this chapter you will learn who the parties to an annuity are, how money goes in and how it comes out, the differences between fixed, indexed and variable contracts, the payout choices, the tax rules, and what it takes to recommend an annuity responsibly.","Annuities show up on the Texas exam and in real client conversations. They also involve large sums and long commitments, so regulators hold agents to a high standard when selling them."],"objectives":["Explain the purpose of an annuity and identify the owner, annuitant and beneficiary","Distinguish the accumulation phase from the annuitization phase, including surrender charges and death before annuitization","Classify annuities by how premiums are paid and when income begins","Compare fixed, indexed and variable annuities and the licensing each requires","Describe the life only, period certain, refund and joint and survivor payout options","Apply the basic tax rules for annuities and the suitability standards for recommending them"],"avaIntro":"Hi, I'm Ava, and welcome to chapter nine. So far we have talked a lot about what happens when someone dies too soon. Today we flip that around. What if your client lives to ninety-eight? That is wonderful news for the family, but it can be hard on a savings account. An annuity is the insurance industry's answer to that problem. It takes a pile of money and turns it into a paycheck that can last a lifetime. In this chapter I will walk you through the people involved in an annuity, the two phases every contract goes through, the main product types, and the payout options your clients can pick from. We will finish with taxes and suitability, two areas the exam loves to test. Take your time with this one. The vocabulary is new, but the ideas fit together neatly once you see the whole picture. Let's get started."},"keywords":[{"term":"Accumulation phase","def":"The period when premiums are paid in and the contract value grows tax-deferred."},{"term":"Annuitant","def":"The person whose age and life expectancy are used to calculate the income payments."},{"term":"Annuitization","def":"Converting the contract value into a series of scheduled income payments."},{"term":"Beneficiary","def":"The person who receives any amount payable when the owner or annuitant dies."},{"term":"Deferred annuity","def":"An annuity whose income payments begin more than one year after purchase."},{"term":"Exclusion ratio","def":"The formula that splits each annuity payment into tax-free return of cost and taxable earnings."},{"term":"Fixed annuity","def":"An annuity with a guaranteed minimum interest rate, backed by the insurer's general account."},{"term":"Immediate annuity","def":"A single-premium annuity whose income payments begin within one year of purchase."},{"term":"Indexed annuity","def":"A fixed annuity whose interest is linked to a market index, with a guaranteed minimum."},{"term":"Joint and survivor","def":"A payout option that continues income until the last of two or more annuitants dies."},{"term":"Life only","def":"A payout option that pays the highest income for life and nothing after the annuitant's death."},{"term":"Owner","def":"The person who buys the annuity, holds all contract rights and usually pays the premiums."},{"term":"Period certain","def":"A guarantee that payments will be made for at least a stated number of years."},{"term":"Separate account","def":"The investment account, kept apart from the insurer's general assets, that funds a variable annuity."},{"term":"Surrender charge","def":"A fee for withdrawing money or cashing in the contract during its early years."},{"term":"Variable annuity","def":"An annuity whose value rises and falls with investments chosen by the owner, who bears the risk."}],"sections":[{"title":"What an Annuity Is and Who Is Involved","blocks":[{"type":"p","text":"An <b>annuity<\/b> is a contract with an insurance company. The buyer hands over money, either all at once or over time, and the insurer promises to pay that money back, with earnings, as a series of regular payments. The main purpose is retirement income. In plain terms, an annuity is built to liquidate an estate in an orderly way, while life insurance is built to create one."},{"type":"p","text":"The risk an annuity addresses is sometimes called longevity risk, which is the chance of outliving your money. Because the insurer pools many annuitants together, it can promise income for life to each of them. Those who die early help fund the payments to those who live a long time."},{"type":"p","text":"Annuities are sold by life insurance companies, and a life insurance license is needed to sell them. However, an annuity is not life insurance. There is normally no medical underwriting, because the insurer is not worried about the buyer dying early."},{"type":"h","text":"The three parties"},{"type":"list","items":["The <b>owner<\/b> buys the contract and controls it. The owner pays premiums, names the beneficiary, chooses the payout option, and can make withdrawals or surrender the contract.","The <b>annuitant<\/b> is the person whose life the payments are measured by. The annuitant's age and life expectancy drive the size of the payments. The annuitant must be a natural person, not a company or a trust.","The <b>beneficiary<\/b> receives whatever the contract pays out at death, such as the account value if death happens before income payments begin."]},{"type":"p","text":"In most contracts the owner and the annuitant are the same person, but they do not have to be. A parent could own an annuity that uses an adult child as the annuitant, for instance."},{"type":"table","head":["Party","Main role"],"rows":[["Owner","Holds the rights and makes the decisions"],["Annuitant","Life used to figure the payments"],["Beneficiary","Receives any death benefit"]]},{"type":"example","text":"Rosa, age 60, buys an annuity on her own life and names her son as beneficiary. Rosa is both owner and annuitant. If she dies before she starts taking income, her son receives the value of the contract."},{"type":"tip","text":"If a question asks whose life expectancy sets the payment amount, the answer is the annuitant, not the owner."}]},{"title":"The Two Phases: Accumulation and Annuitization","blocks":[{"type":"p","text":"Every annuity moves through up to two stages. Knowing which stage a contract is in tells you what the owner can do with it and what happens at death."},{"type":"flow","nodes":["Premiums paid in","Value grows tax-deferred","Annuitization","Income paid out"],"caption":"The life cycle of a deferred annuity"},{"type":"h","text":"Accumulation phase"},{"type":"p","text":"The <b>accumulation phase<\/b>, also called the pay-in period, is when money goes into the contract and grows. Earnings are not taxed while they stay inside the annuity. This tax deferral is one of the main selling points. During this phase the owner can usually add money, take withdrawals, or surrender the contract for its cash value."},{"type":"h","text":"Surrender charges"},{"type":"p","text":"Insurers expect annuity money to stay put for years. To discourage early exits, most deferred annuities carry a <b>surrender charge<\/b>. This is a percentage taken from money withdrawn during the first several contract years. The percentage normally steps down each year until it reaches zero. Many contracts let the owner pull out a limited amount each year without a charge, and the charge is commonly waived when the death benefit is paid."},{"type":"example","text":"A contract has a surrender charge that starts at 7 percent and drops one point a year. An owner who cashes out in year three pays 5 percent of the amount withdrawn. An owner who waits until year eight pays nothing."},{"type":"h","text":"Annuitization phase"},{"type":"p","text":"The <b>annuitization phase<\/b>, also called the pay-out or annuity period, begins when the owner converts the contract value into scheduled income. The insurer calculates the payment using the amount of money in the contract, the annuitant's age and sex, the assumed interest rate, and the payout option chosen. Once a contract is annuitized, the decision generally cannot be undone, and the owner gives up access to the lump sum in exchange for the income."},{"type":"h","text":"Death before annuitization"},{"type":"p","text":"If the owner or annuitant dies during the accumulation phase, the contract pays a death benefit to the beneficiary. It is typically the greater of the premiums paid in or the current account value. This is not life insurance. Any gain above what was paid in is taxable income to the beneficiary."},{"type":"tip","text":"Death during accumulation pays the beneficiary the greater of premiums paid or account value, and the growth portion is taxable."}]},{"title":"How Annuities Are Purchased","blocks":[{"type":"p","text":"Annuities are grouped in two ways on the exam: by how the premium is paid, and by when the income starts. A contract's name usually tells you both."},{"type":"h","text":"How premiums are paid"},{"type":"list","items":["<b>Single premium<\/b>: one lump-sum payment funds the whole contract. Nothing more is paid in later.","<b>Flexible premium<\/b>: the owner makes a series of payments and can change the amount and timing, within limits set by the insurer.","Level or periodic premium: the owner pays a set amount on a regular schedule. This is less common today but still appears in exam questions."]},{"type":"h","text":"When income begins"},{"type":"p","text":"An <b>immediate annuity<\/b> starts paying income within one year of the purchase date, often after one month. Because the insurer needs all the money up front to begin paying, an immediate annuity can only be bought with a single premium. There is no real accumulation phase."},{"type":"p","text":"A <b>deferred annuity<\/b> starts paying income at some later date, more than one year after purchase. The years in between are the accumulation phase. A deferred annuity can be bought with a single premium or with flexible premiums."},{"type":"table","head":["Type","Premium","Income starts"],"rows":[["Single premium immediate annuity (SPIA)","One lump sum","Within one year"],["Single premium deferred annuity (SPDA)","One lump sum","Later than one year"],["Flexible premium deferred annuity (FPDA)","Payments over time","Later than one year"]]},{"type":"flow","nodes":["Lump sum paid","Payments start within 12 months"],"caption":"An immediate annuity skips the long accumulation period"},{"type":"example","text":"Darnell, 66, receives a large payout from the sale of his business and wants monthly income right now. A single premium immediate annuity fits. His daughter Kayla, 35, wants to put away a few hundred dollars a month for retirement. A flexible premium deferred annuity fits her."},{"type":"p","text":"Notice that there is no such thing as a flexible premium immediate annuity. If the question describes ongoing premium payments, the contract must be deferred."},{"type":"tip","text":"Immediate annuities are always single premium; deferred annuities may be single or flexible premium."}]},{"title":"Fixed, Indexed and Variable Annuities","blocks":[{"type":"p","text":"Annuities are also classified by how the money inside them earns a return. The key question is simple: who carries the investment risk, the insurer or the owner?"},{"type":"h","text":"Fixed annuities"},{"type":"p","text":"A <b>fixed annuity<\/b> credits a guaranteed minimum interest rate. The insurer may credit a higher current rate, but never less than the minimum. Premiums go into the insurer's general account, and the insurer bears the investment risk. Income payments, once started, are a level dollar amount. The weakness is inflation: a level payment buys less each year."},{"type":"h","text":"Indexed annuities"},{"type":"p","text":"An <b>indexed annuity<\/b>, also called an equity indexed annuity, is a type of fixed annuity. Its interest is tied to the movement of a market index such as the S&P 500, but the owner is not directly invested in the market. The contract guarantees a minimum, so a falling index does not reduce the credited value. In return, the upside is limited by features such as a participation rate or a cap. Only a life insurance license is needed to sell it."},{"type":"h","text":"Variable annuities"},{"type":"p","text":"A <b>variable annuity<\/b> lets the owner direct premiums into investment subaccounts held in the insurer's <b>separate account<\/b>. The value goes up and down with those investments, there is no guaranteed rate, and the owner bears the investment risk. Income payments also vary. During accumulation the owner's share is measured in accumulation units, which convert to annuity units at payout. The appeal is growth potential that may keep pace with inflation."},{"type":"p","text":"Because a variable annuity is a security as well as an insurance product, it is regulated by both the state insurance department and securities regulators such as the SEC and FINRA. An agent needs a life insurance license plus securities registration to sell one, and the buyer must receive a prospectus."},{"type":"table","head":["Feature","Fixed","Indexed","Variable"],"rows":[["Investment risk","Insurer","Insurer","Owner"],["Guaranteed minimum","Yes","Yes","No"],["Account used","General","General","Separate"],["Securities registration needed","No","No","Yes"]]},{"type":"tip","text":"Variable means the owner takes the risk, the money sits in a separate account, and the agent needs both an insurance license and securities registration."}]},{"title":"Payout Options","blocks":[{"type":"p","text":"When an owner annuitizes, they pick a settlement or payout option. The choice is a trade-off. The more guarantees the option carries, the smaller each payment will be, because the insurer is taking on more obligation."},{"type":"h","text":"Life only"},{"type":"p","text":"<b>Life only<\/b>, also called straight life or pure life, pays income for as long as the annuitant lives and then stops. Nothing goes to a beneficiary, even if the annuitant dies after one payment. Because there is no guarantee beyond the annuitant's life, this option pays the highest amount per payment."},{"type":"h","text":"Period certain"},{"type":"p","text":"A <b>period certain<\/b> guarantee promises payments for a minimum number of years, such as 10 or 20. With life with period certain, income lasts for life, and if the annuitant dies inside the guaranteed period, the beneficiary receives the remaining payments for that period. A stand-alone fixed period option pays for the stated years only and is not tied to anyone's lifetime."},{"type":"h","text":"Refund options"},{"type":"p","text":"A refund life annuity pays for life and guarantees that at least the amount paid in will come back out. If the annuitant dies before receiving that much, the balance goes to the beneficiary. A cash refund pays the balance in a lump sum. An installment refund keeps making the regular payments until the balance is used up."},{"type":"h","text":"Joint and survivor"},{"type":"p","text":"<b>Joint and survivor<\/b> covers two or more annuitants, most often spouses. Payments continue until the last one dies. The survivor's payment may stay the same or drop to a set fraction, such as two-thirds or one-half. Do not confuse this with a joint life option, under which payments end at the first death."},{"type":"table","head":["Option","Pays until","Anything left for a beneficiary?"],"rows":[["Life only","Annuitant's death","No"],["Life with period certain","Death or end of period, whichever is later","Yes, if death is within the period"],["Refund","Annuitant's death","Yes, any unrecovered balance"],["Joint and survivor","Last annuitant's death","No, unless a guarantee is added"]]},{"type":"example","text":"Hank picks life with 10 years certain and dies after 4 years of payments. His beneficiary receives the remaining 6 years of payments. Had Hank chosen life only, payments would have ended at his death."},{"type":"tip","text":"Life only gives the biggest payment and the biggest risk of forfeiture, since nothing is paid after the annuitant dies."}]},{"title":"Taxation of Annuities","blocks":[{"type":"p","text":"The rules below apply to nonqualified annuities, which are bought with money that has already been taxed. The premiums are not deductible, but the earnings grow tax-deferred until they are taken out. The amount of after-tax money the owner has paid in is called the cost basis."},{"type":"h","text":"Withdrawals during accumulation"},{"type":"p","text":"When the owner takes a partial withdrawal before annuitizing, the IRS treats the money on a last in, first out basis, known as <b>LIFO<\/b>. Earnings are considered to come out first, so withdrawals are fully taxable as ordinary income until all the gain has been removed. Only after that does the owner reach the tax-free cost basis."},{"type":"h","text":"The 10 percent penalty"},{"type":"p","text":"If the owner takes money out before age 59½, the taxable part of the withdrawal is hit with an extra 10 percent federal tax penalty on top of ordinary income tax. The penalty does not apply in certain cases, including death or disability of the owner."},{"type":"example","text":"Lena, 50, paid 40,000 dollars into a nonqualified annuity now worth 55,000 dollars. She withdraws 10,000 dollars. Under LIFO, all 10,000 dollars is earnings. She owes income tax on it plus a 10 percent penalty of 1,000 dollars."},{"type":"h","text":"Annuity payments and the exclusion ratio"},{"type":"p","text":"Once the contract is annuitized, each payment is part return of cost basis and part earnings. The <b>exclusion ratio<\/b> works out the split. It divides the investment in the contract by the total expected return. That percentage of each payment is excluded from tax, and the rest is taxed as ordinary income."},{"type":"flow","nodes":["Cost basis","Divided by expected return","Tax-free share of each payment"],"caption":"How the exclusion ratio works"},{"type":"p","text":"After the annuitant has recovered the entire cost basis, later payments are fully taxable."},{"type":"h","text":"Qualified annuities and death"},{"type":"p","text":"A qualified annuity is funded with pre-tax dollars inside a retirement plan. Since no tax was ever paid on the money, payments are generally taxable in full. And when a beneficiary receives a death benefit from any annuity, the gain in the contract is taxable as ordinary income to that beneficiary."},{"type":"tip","text":"Nonqualified withdrawals are LIFO, meaning earnings come out first and are taxed first."}]},{"title":"Suitability","blocks":[{"type":"p","text":"An annuity can tie up a large share of a person's savings for many years. For that reason, an agent may not recommend one simply because the client asked or because it pays a good commission. The recommendation has to fit the client."},{"type":"p","text":"<b>Suitability<\/b> means the agent has a reasonable basis to believe the annuity meets the consumer's financial needs and objectives. Texas follows the model standard that requires agents to act in the consumer's best interest when recommending an annuity, without putting the agent's or insurer's financial interest ahead of the client's. Texas also requires agents to complete annuity-specific training before selling these products."},{"type":"h","text":"Information to gather"},{"type":"p","text":"Before making a recommendation, the agent must make a reasonable effort to collect the consumer's profile information, including:"},{"type":"list","items":["Age","Annual income and overall financial situation","Financial objectives and the intended use of the annuity","Financial time horizon","Existing assets, including other insurance and investments","Liquidity needs and liquid net worth","Risk tolerance","Tax status"]},{"type":"flow","nodes":["Gather client facts","Analyze needs","Recommend","Document the basis"],"caption":"Steps in a suitable annuity sale"},{"type":"h","text":"Questions to ask yourself"},{"type":"p","text":"Will the client need this money before the surrender period ends? Does the client have enough liquid funds for emergencies? Does the client understand the surrender charges, fees, and any tax penalty? If the product is variable, can the client live with the possibility of losing value?"},{"type":"p","text":"Replacing an existing annuity deserves extra care. The agent has to weigh whether the client will pay a new surrender charge, start a new surrender period, or give up benefits in the old contract, and whether the client truly comes out ahead."},{"type":"example","text":"An 82-year-old widow wants to move nearly all of her savings into a deferred annuity with a ten-year surrender schedule. She has little other cash. Given her age and her need for accessible money, this recommendation would be hard to defend as suitable."},{"type":"p","text":"The agent should keep a record of the information gathered and the reasoning behind the recommendation. The insurer is responsible for supervising these sales and may decline to issue a contract that does not appear suitable."},{"type":"tip","text":"A long surrender period paired with a client who has high liquidity needs or a short time horizon is the classic unsuitable sale."}]}],"summary":{"recap":["An annuity turns money into income and protects against outliving one's savings. The owner controls the contract, the annuitant's life measures the payments, and the beneficiary receives any death benefit.","Money grows tax-deferred in the accumulation phase and is paid out in the annuitization phase. Early withdrawals may trigger surrender charges. Death before annuitization pays the beneficiary the greater of premiums paid or the account value.","Immediate annuities begin paying within one year and are always single premium. Deferred annuities begin later and may be funded with a single premium or flexible premiums.","Fixed and indexed annuities carry guarantees and place the investment risk on the insurer. Variable annuities use a separate account, place the risk on the owner, and require securities registration in addition to a life license.","Payout options range from life only, which pays the most and leaves nothing behind, to period certain, refund, and joint and survivor options that add guarantees and lower the payment.","Nonqualified withdrawals are taxed earnings first, a 10 percent penalty applies to taxable amounts taken before 59½, and the exclusion ratio splits annuitized payments into taxable and tax-free parts. Every recommendation must be suitable for the client."],"avaSummary":"Nice work getting through chapter nine. Let me pull it all together for you. An annuity is the mirror image of life insurance. Life insurance creates an estate when someone dies too soon. An annuity pays that estate out so a person does not outlive it. Remember the three parties. The owner has the rights. The annuitant is the measuring life. The beneficiary gets paid if death comes before the income starts. Next, think in two phases. Accumulation is money going in and growing tax-deferred. Annuitization is money coming out as income. Pull money out too early and you may face a surrender charge. For timing, immediate means income within a year and always a single premium. Deferred means income later, with either a single or a flexible premium. For product type, ask who carries the risk. With fixed and indexed annuities, the insurer does, and there is a guaranteed minimum. With a variable annuity, the owner does, the money sits in a separate account, and you need securities registration to sell it. On payouts, life only pays the most but stops at death. Period certain and refund options protect a beneficiary. Joint and survivor keeps paying until the second person dies. For taxes, memorize three things. Withdrawals from a nonqualified annuity are last in, first out, so earnings are taxed first. Taxable money taken before fifty-nine and a half gets a ten percent penalty. And the exclusion ratio tells you how much of each annuity payment is tax free. Finally, never forget suitability. Know your client's age, income, goals, liquidity needs and risk tolerance before you recommend anything. Review the notes, take the chapter exam, and I will see you in chapter ten.","reviewNotes":[{"objective":"Explain the purpose of an annuity and identify the owner, annuitant and beneficiary","concepts":["An annuity provides income and protects against outliving savings","Annuities liquidate an estate; life insurance creates one","The owner holds all rights and usually pays the premiums","The annuitant's age and life expectancy set the payment amount","Owner and annuitant are often, but not always, the same person"],"terms":[{"term":"Owner","def":"The party who controls the contract and its rights."},{"term":"Annuitant","def":"The natural person whose life measures the payments."},{"term":"Beneficiary","def":"The party who receives any amount payable at death."}]},{"objective":"Distinguish the accumulation phase from the annuitization phase, including surrender charges and death before annuitization","concepts":["Accumulation is the pay-in period, with tax-deferred growth","Annuitization is the pay-out period, when value becomes income","Surrender charges apply in the early years and decline over time","Death during accumulation pays the greater of premiums paid or account value","Gain paid to a beneficiary is taxable"],"terms":[{"term":"Accumulation phase","def":"The period when premiums are paid and value grows."},{"term":"Annuitization","def":"Converting contract value into scheduled income."},{"term":"Surrender charge","def":"A declining fee for early withdrawal or surrender."}]},{"objective":"Classify annuities by how premiums are paid and whe
