n income begins","concepts":["Single premium means one lump-sum payment","Flexible premium means payments that can vary in amount and timing","Immediate annuities pay within one year and are always single premium","Deferred annuities pay later and may be single or flexible premium"],"terms":[{"term":"Immediate annuity","def":"Income begins within one year of purchase."},{"term":"Deferred annuity","def":"Income begins more than one year after purchase."},{"term":"Flexible premium","def":"Premiums that may change in amount and frequency."}]},{"objective":"Compare fixed, indexed and variable annuities and the licensing each requires","concepts":["Fixed annuities guarantee a minimum rate; the insurer bears the risk","Indexed annuities link interest to an index but keep a guaranteed minimum","Variable annuities have no guaranteed rate; the owner bears the risk","Variable annuity funds are held in a separate account","Selling variable annuities takes a life license plus securities registration"],"terms":[{"term":"Fixed annuity","def":"An annuity with guaranteed minimum interest, backed by the general account."},{"term":"Indexed annuity","def":"A fixed annuity with interest tied to a market index."},{"term":"Variable annuity","def":"An annuity whose value follows investments chosen by the owner."},{"term":"Separate account","def":"The investment account that funds variable products."}]},{"objective":"Describe the life only, period certain, refund and joint and survivor payout options","concepts":["More guarantees mean a smaller payment","Life only pays the most and ends at the annuitant's death","Life with period certain continues payments to a beneficiary through the guaranteed period","Refund options return any unrecovered balance as a lump sum or in installments","Joint and survivor pays until the last annuitant dies"],"terms":[{"term":"Life only","def":"Income for life with nothing payable after death."},{"term":"Period certain","def":"A guaranteed minimum number of years of payments."},{"term":"Joint and survivor","def":"Income that continues until the last annuitant's death."}]},{"objective":"Apply the basic tax rules for annuities and the suitability standards for recommending them","concepts":["Growth is tax-deferred during accumulation","Nonqualified withdrawals are taxed LIFO, earnings first","A 10 percent penalty applies to taxable amounts taken before age 59½","The exclusion ratio is cost basis divided by expected return","Suitability depends on age, income, objectives, time horizon, liquidity needs, risk tolerance and tax status","Agents must act in the consumer's best interest and document the basis for the recommendation"],"terms":[{"term":"Exclusion ratio","def":"The formula that identifies the tax-free part of each annuity payment."},{"term":"LIFO","def":"Last in, first out; earnings are treated as withdrawn first."},{"term":"Suitability","def":"A reasonable basis to believe a product fits the client's needs and objectives."}]}]},"exam":[{"q":"The primary purpose of an annuity is to:","choices":["Create an estate at the insured's death","Provide income and protect against outliving one's savings","Pay off a mortgage if the borrower dies","Replace income lost during a disability"],"answer":1,"why":"Annuities are designed to liquidate savings as income, guarding against the risk of living longer than the money lasts."},{"q":"In an annuity contract, whose life expectancy is used to calculate the income payments?","choices":["The annuitant","The owner","The beneficiary","The agent"],"answer":0,"why":"The annuitant is the measuring life, so that person's age and life expectancy determine the payment amount."},{"q":"Which party has the right to name the beneficiary and surrender an annuity?","choices":["The annuitant","The insurer","The beneficiary","The owner"],"answer":3,"why":"The owner holds all contract rights, including naming the beneficiary and surrendering the contract."},{"q":"The period during which premiums are paid into an annuity and earnings grow tax-deferred is the:","choices":["Annuitization phase","Surrender period","Accumulation phase","Period certain"],"answer":2,"why":"The accumulation, or pay-in, phase is when money goes in and grows without current taxation."},{"q":"An annuity that begins income payments within one year of purchase is:","choices":["A deferred annuity","An immediate annuity","A flexible premium annuity","A variable annuity"],"answer":1,"why":"An immediate annuity starts paying income within twelve months of the purchase date."},{"q":"An immediate annuity can be purchased with which type of premium?","choices":["Flexible premium only","Either single or flexible premium","Level annual premiums","Single premium only"],"answer":3,"why":"Because income begins right away, the insurer needs the full amount up front, so an immediate annuity is always single premium."},{"q":"A client wants to contribute varying amounts each month toward retirement income that will start in 25 years. Which annuity fits?","choices":["Flexible premium deferred annuity","Single premium immediate annuity","Single premium deferred annuity","Life only immediate annuity"],"answer":0,"why":"Ongoing, changeable premiums and a future income date describe a flexible premium deferred annuity."},{"q":"In a fixed annuity, who bears the investment risk?","choices":["The owner","The beneficiary","The insurer","The annuitant"],"answer":2,"why":"A fixed annuity guarantees a minimum interest rate, so the insurer carries the investment risk."},{"q":"Which statement about an indexed annuity is correct?","choices":["It has no guaranteed minimum","It is a fixed annuity with interest linked to a market index","Its funds are held in a separate account","It requires securities registration to sell"],"answer":1,"why":"An indexed annuity is a fixed product that ties credited interest to an index while keeping a guaranteed minimum."},{"q":"To sell variable annuities, an agent must hold:","choices":["A life insurance license only","A securities registration only","A property and casualty license","Both a life insurance license and securities registration"],"answer":3,"why":"A variable annuity is both an insurance product and a security, so both credentials are required."},{"q":"Premiums paid into a variable annuity are held in the insurer's:","choices":["Separate account","General account","Reserve account","Premium deposit fund"],"answer":0,"why":"Variable annuity funds are invested in subaccounts within the separate account, apart from the insurer's general assets."},{"q":"Which payout option provides the largest payment per period for a single annuitant?","choices":["Life with 20 years certain","Cash refund","Life only","Installment refund"],"answer":2,"why":"Life only carries no guarantee beyond the annuitant's lifetime, so it pays the highest amount."},{"q":"An annuitant chooses life with 10 years certain and dies after receiving payments for 3 years. What happens?","choices":["Payments stop immediately","The beneficiary receives payments for the remaining 7 years","The beneficiary receives payments for 10 more years","The insurer refunds all premiums paid"],"answer":1,"why":"The period certain guarantees a total of 10 years of payments, so the beneficiary gets the 7 years that remain."},{"q":"Under a joint and survivor payout option, income payments end when:","choices":["The first annuitant dies","The period certain expires","The cost basis is fully recovered","The last surviving annuitant dies"],"answer":3,"why":"Joint and survivor continues payments, sometimes at a reduced amount, until the last annuitant dies."},{"q":"A refund life annuity guarantees that:","choices":["At least the amount paid in will be paid out to the annuitant or beneficiary","Payments will increase with inflation","The annuitant can cancel after annuitization","Payments continue to a spouse for life"],"answer":0,"why":"If the annuitant dies before receiving back the purchase amount, the balance is paid to the beneficiary in cash or installments."},{"q":"A surrender charge on a deferred annuity typically:","choices":["Increases each year the contract is held","Applies only after annuitization","Declines over the early contract years until it disappears","Is a federal tax penalty"],"answer":2,"why":"Surrender charges are insurer fees that step down over the first several years of the contract."},{"q":"If an annuity owner dies during the accumulation phase, the beneficiary generally receives:","choices":["Nothing","The greater of premiums paid or the account value","Only the interest earned","A tax-free life insurance death benefit"],"answer":1,"why":"The death benefit during accumulation is typically the larger of total premiums paid or the current account value."},{"q":"Partial withdrawals from a nonqualified deferred annuity are taxed on what basis?","choices":["First in, first out, so principal comes out first","They are never taxed","An equal split of principal and earnings","Last in, first out, so earnings come out first"],"answer":3,"why":"Under LIFO treatment, earnings are considered withdrawn first and are taxable as ordinary income."},{"q":"A 52-year-old takes a withdrawal of earnings from a nonqualified annuity. In addition to ordinary income tax, what applies?","choices":["A 10 percent federal tax penalty on the taxable amount","A 50 percent excise tax","No additional tax","A 6 percent excess contribution penalty"],"answer":0,"why":"Taxable amounts withdrawn before age 59½ are generally subject to a 10 percent penalty."},{"q":"The exclusion ratio is used to determine:","choices":["The surrender charge for an early withdrawal","The interest rate credited to a fixed annuity","The tax-free portion of each annuitized payment","The commission paid to the agent"],"answer":2,"why":"The exclusion ratio divides cost basis by expected return to find the part of each payment that is a tax-free return of principal."}]},{"id":"ch10","num":10,"title":"Uses of Life Insurance","intro":{"hook":["Ask ten people why they own life insurance and most will say the same thing: so my family is okay if something happens to me. That is the heart of it, but it is only the start.","The same death benefit that keeps a family in its home can also keep a small business open, let surviving partners buy out a deceased owner's share, or reward a valued executive.","This chapter covers the personal and business uses of life insurance, the two main ways to work out how much coverage a person needs, and how to match a recommendation to the client in front of you.","Knowing the products is half of the job. Knowing what problem each one solves is what turns product knowledge into good advice, and it is what the exam tests here."],"objectives":["Identify the personal uses of life insurance","Compare the human life value approach with the needs approach","Explain how key person insurance protects a business","Distinguish cross-purchase from entity and stock redemption buy-sell agreements","Describe split-dollar, deferred compensation and executive bonus arrangements","Determine a suitable amount and type of coverage for a client"],"avaIntro":"Welcome to chapter ten. I'm Ava. Up to now we have looked at what life insurance is and how the different policies work. In this chapter we ask a more practical question: what is it actually for? We will start at home, with the reasons a family buys coverage, like replacing a paycheck, paying final bills, and leaving something behind. Then I will show you two ways to figure out how much insurance someone needs, the human life value approach and the needs approach. After that we head to the office. Businesses use life insurance to protect against the loss of a key person, to fund buy-sell agreements, and to reward top employees. We will wrap up with suitability, because the right amount and type of coverage depends on the person sitting across from you. There are some new terms here, but each one solves a real problem. Let's dive in."},"keywords":[{"term":"Buy-sell agreement","def":"A contract that sets out who will buy a deceased owner's business interest and at what price."},{"term":"Cash accumulation","def":"The buildup of cash value in a permanent policy that the owner can use while living."},{"term":"Cross-purchase plan","def":"A buy-sell arrangement in which each owner holds a policy on each of the other owners."},{"term":"Deferred compensation","def":"An employer's promise to pay part of an employee's earnings at a later date, such as retirement."},{"term":"Entity plan","def":"A buy-sell arrangement in which the business itself owns a policy on each owner."},{"term":"Estate creation","def":"Using a death benefit to produce an immediate sum of money for heirs."},{"term":"Executive bonus","def":"A plan in which the employer pays the premium on a policy the employee owns, treated as taxable pay."},{"term":"Final expenses","def":"Costs that arise at death, such as funeral bills, medical bills and outstanding debts."},{"term":"Human life value approach","def":"A method that bases coverage on the present value of the insured's future earnings available to dependents."},{"term":"Key person insurance","def":"Coverage a business buys on an employee whose death would cause it financial harm."},{"term":"Liquidity","def":"Having cash available quickly without being forced to sell other assets."},{"term":"Needs approach","def":"A method that bases coverage on the specific financial needs survivors would face."},{"term":"Split-dollar plan","def":"An arrangement in which an employer and employee share the premiums and benefits of a policy."},{"term":"Stock redemption plan","def":"An entity-type buy-sell agreement used by a corporation to buy back a deceased shareholder's stock."},{"term":"Survivor protection","def":"Replacing the income and support dependents lose when the insured dies."}],"sections":[{"title":"Personal Uses of Life Insurance","blocks":[{"type":"p","text":"When a person dies, the bills do not stop. Life insurance delivers money at the moment a family needs it most. Here are the main personal reasons people buy it."},{"type":"h","text":"Survivor protection"},{"type":"p","text":"<b>Survivor protection<\/b> is the most common reason. If a wage earner dies, the people who depended on that income still need to pay for housing, food, child care and schooling. The death benefit replaces some or all of the lost income so the family can keep its standard of living."},{"type":"h","text":"Estate creation"},{"type":"p","text":"Most people build wealth slowly through saving and investing. Life insurance offers <b>estate creation<\/b> in a single step. The moment the first premium is paid and the policy is in force, the full death benefit exists for the heirs, even if the insured has saved very little so far. No other financial product creates an immediate estate this way."},{"type":"h","text":"Cash accumulation"},{"type":"p","text":"Permanent policies build cash value that grows tax-deferred. This <b>cash accumulation<\/b> gives the owner a living benefit. The owner can borrow against it or withdraw from it for emergencies, education costs, or to add to retirement income."},{"type":"h","text":"Liquidity"},{"type":"p","text":"<b>Liquidity<\/b> means having ready cash. An estate may be rich in property, a farm, or a business but short on money in the bank. Death proceeds provide cash quickly, so survivors are not forced to sell assets at a poor price to pay taxes, debts or settlement costs. Cash value also gives the living policyowner a liquid resource."},{"type":"h","text":"Final expenses"},{"type":"p","text":"<b>Final expenses<\/b> include funeral and burial costs, unpaid medical bills, outstanding debts, and the costs of settling the estate. Even people with no dependents often buy a small policy for this purpose so the burden does not fall on relatives."},{"type":"flow","nodes":["Insured dies","Death benefit paid","Bills paid, income replaced"],"caption":"How life insurance protects survivors"},{"type":"example","text":"Marcus owns ranch land worth a great deal but keeps little cash. At his death, his life insurance pays his final bills and estate costs, so his children do not have to sell part of the ranch in a hurry."},{"type":"tip","text":"Life insurance is the only product that creates an immediate estate as soon as the policy takes effect."}]},{"title":"Determining the Amount: Human Life Value and Needs Approaches","blocks":[{"type":"p","text":"How much coverage is enough? There are two classic methods, and the exam expects you to tell them apart."},{"type":"h","text":"Human life value approach"},{"type":"p","text":"The <b>human life value approach<\/b> treats a person's earning power as an asset. It asks what the insured would have earned and contributed to the family over the rest of a working life. The calculation considers the insured's income, the years left until retirement, the portion of income spent on the insured personally, and the effect of inflation and interest. The result is the present value of the future earnings the family would lose."},{"type":"flow","nodes":["Annual earnings","Minus personal costs","Times working years left","Discounted to today"],"caption":"The human life value idea in simple steps"},{"type":"h","text":"Needs approach"},{"type":"p","text":"The <b>needs approach<\/b> starts from the other side. Instead of asking what the insured is worth, it asks what the survivors would actually need. The agent totals those needs and subtracts resources already in place, such as savings, existing insurance and Social Security survivor benefits. The gap is the amount of coverage to buy."},{"type":"p","text":"Needs fall into two groups. Lump-sum needs are one-time amounts. Income needs are ongoing."},{"type":"list","items":["Final expenses and unpaid debts","A fund to pay off the mortgage","An education fund for the children","An emergency reserve","Income while the children are dependent","Income for the surviving spouse, including the blackout period"]},{"type":"p","text":"The blackout period is the stretch when Social Security survivor benefits are not being paid. It runs from the time the youngest child turns 16 until the surviving spouse becomes eligible for retirement-age benefits, as early as age 60."},{"type":"table","head":["","Human life value","Needs approach"],"rows":[["Focus","The insured's future earnings","The survivors' specific needs"],["Key inputs","Income, working years, personal expenses, inflation","Debts, final costs, education, income needs, existing assets"],["Result","Economic value of the insured's life","Shortfall the family must cover"]]},{"type":"example","text":"A family adds up 400,000 dollars of needs: mortgage, college, debts and income replacement. They already have 100,000 dollars in savings and group life coverage. Under the needs approach, the recommended new coverage is 300,000 dollars."},{"type":"tip","text":"If the question mentions future earnings and years until retirement, think human life value; if it lists debts, mortgage and education, think needs approach."}]},{"title":"Key Person Insurance","blocks":[{"type":"p","text":"Some employees are very hard to replace. It might be the founder whose reputation brings in customers, the top salesperson, or the engineer who designed the product. If that person died, the business could lose revenue, lose credit with lenders, and face the cost of finding and training a replacement."},{"type":"p","text":"<b>Key person insurance<\/b> covers this risk. The business buys a life insurance policy on the key employee, and the death benefit helps the company stay on its feet while it recovers."},{"type":"h","text":"How it is set up"},{"type":"p","text":"The structure is easy to remember because the business fills every role except the insured."},{"type":"table","head":["Role","Who holds it"],"rows":[["Applicant and owner","The business"],["Premium payer","The business"],["Beneficiary","The business"],["Insured","The key employee"]]},{"type":"p","text":"The business has an insurable interest because it would suffer a financial loss at the employee's death. The employee must know about the policy and give written consent to be insured."},{"type":"h","text":"Tax treatment"},{"type":"p","text":"Premiums the business pays for key person coverage are not a tax-deductible business expense, because the business itself is the beneficiary. In exchange, the death benefit is generally received by the business free of federal income tax."},{"type":"h","text":"What the money does"},{"type":"list","items":["Makes up for lost sales and profits","Pays the cost of recruiting and training a successor","Reassures lenders, suppliers and customers","Keeps the business running during the transition"]},{"type":"p","text":"If a permanent policy is used, the cash value is an asset of the business. It can be borrowed against in an emergency, and if the key employee stays until retirement, it can help fund a retirement benefit."},{"type":"example","text":"A small architecture firm depends on Priya, its lead designer, for most of its client relationships. The firm buys a 500,000 dollar policy on her life, pays the premiums and names itself beneficiary. If Priya dies, the firm uses the proceeds to cover lost income while it hires and trains a new lead designer."},{"type":"tip","text":"In key person insurance the business is the owner, premium payer and beneficiary, and the premiums are not deductible."}]},{"title":"Buy-Sell Agreements","blocks":[{"type":"p","text":"When an owner of a closely held business dies, awkward questions come up. The heirs may want cash, not a seat at the table. The surviving owners may not want a new partner they did not choose. And nobody may agree on what the share is worth."},{"type":"p","text":"A <b>buy-sell agreement<\/b> answers these questions ahead of time. It is a legal contract that says who will buy a deceased owner's interest and for what price or by what formula. Life insurance is the usual way to fund it, because the death that triggers the purchase also produces the cash to complete it."},{"type":"flow","nodes":["Owner dies","Policy pays proceeds","Interest is purchased","Heirs receive cash"],"caption":"How an insured buy-sell agreement works"},{"type":"h","text":"Cross-purchase plan"},{"type":"p","text":"In a <b>cross-purchase plan<\/b>, the owners make the agreement with each other. Each owner buys, pays for, and is beneficiary of a policy on each of the other owners. When one dies, the survivors collect the proceeds and use them to buy the deceased's share from the estate. The number of policies needed is the number of owners multiplied by that number minus one. Three owners need six policies. This gets unwieldy when there are many owners."},{"type":"h","text":"Entity plan and stock redemption"},{"type":"p","text":"In an <b>entity plan<\/b>, the business itself is a party to the agreement. The business owns, pays for, and is beneficiary of one policy on each owner. When an owner dies, the business buys the interest from the estate. When the business is a corporation, this arrangement is called a <b>stock redemption plan<\/b>, because the corporation redeems the deceased shareholder's stock. Only one policy per owner is needed."},{"type":"table","head":["","Cross-purchase","Entity or stock redemption"],"rows":[["Who owns the policies","Each owner, on the others","The business"],["Who buys the interest","Surviving owners","The business"],["Policies for 3 owners","6","3"]]},{"type":"p","text":"Under either design, the premiums are not tax deductible, and the death proceeds are generally received income tax free."},{"type":"example","text":"Ana, Ben and Cole are equal partners. Under a cross-purchase plan, Ana owns policies on Ben and Cole, and so on, for six policies. Under an entity plan, the partnership would own just three."},{"type":"tip","text":"For a cross-purchase plan, count policies as owners times owners minus one; for an entity plan, it is one policy per owner."}]},{"title":"Split-Dollar, Deferred Compensation and Executive Bonus Plans","blocks":[{"type":"p","text":"Employers also use life insurance to attract, reward and keep valuable people. Three arrangements appear on the exam. None of them is a qualified retirement plan, so an employer can offer them to selected employees without including everyone."},{"type":"h","text":"Split-dollar plan"},{"type":"p","text":"A <b>split-dollar plan<\/b> is not a type of policy. It is a way of sharing one. The employer and the employee agree to split the premiums on a permanent policy insuring the employee, and they split the benefits as well. In a typical design, the employer pays the part of each premium equal to the yearly increase in cash value, and the employee pays the rest. At the employee's death, the employer gets back what it paid in, and the remainder of the death benefit goes to the employee's beneficiary. The employee gets a large amount of coverage for a small outlay."},{"type":"h","text":"Deferred compensation"},{"type":"p","text":"Under a nonqualified <b>deferred compensation<\/b> plan, the employer promises to pay part of an employee's compensation later, usually at retirement, death or disability. The employee is not taxed until the money is actually received, and the employer cannot deduct it until it is paid. Businesses often buy life insurance on the employee to fund the promise. The business owns the policy and is its beneficiary, and it uses the cash value or the death benefit to meet its obligation."},{"type":"h","text":"Executive bonus plan"},{"type":"p","text":"In an <b>executive bonus<\/b> plan, the employer pays the premium on a policy that the employee owns outright. The premium is treated as extra pay. That makes it deductible to the employer as compensation and taxable income to the employee. The employee controls the policy, names the beneficiary and owns the cash value."},{"type":"table","head":["Plan","Policy owner","Key tax point"],"rows":[["Split-dollar","Depends on the agreement","Employer recovers its premium outlay at death"],["Deferred compensation","Employer","Employee taxed when benefits are received"],["Executive bonus","Employee","Premium deductible to employer, taxable to employee"]]},{"type":"example","text":"A company wants to reward its sales director. It pays the 4,000 dollar annual premium on a policy she owns. The company deducts the 4,000 dollars as compensation, and she reports it as income. This is an executive bonus plan."},{"type":"tip","text":"Executive bonus is the one where the employee owns the policy and the premium is deductible to the employer."}]},{"title":"Choosing the Right Coverage: Suitability","blocks":[{"type":"p","text":"Working out a number is only part of the job. The amount and the type of policy both have to fit the client. <b>Suitability<\/b> means the recommendation is appropriate for this person's needs, goals and budget, based on facts the agent has actually gathered."},{"type":"h","text":"Start with fact-finding"},{"type":"p","text":"A good recommendation begins with questions. The agent needs to understand the client's situation before suggesting anything."},{"type":"list","items":["Age, health and family situation, including dependents","Income, expenses and debts","Existing insurance, savings and other assets","Goals, such as paying for college or leaving an inheritance","How long the need will last","How much premium the client can comfortably afford","Comfort with risk, especially for variable products"]},{"type":"flow","nodes":["Gather facts","Identify needs","Size the coverage","Match the policy","Review regularly"],"caption":"The path to a suitable recommendation"},{"type":"h","text":"Match the product to the need"},{"type":"p","text":"The length of the need points to the type of policy. A temporary need, such as a mortgage or the years until children are grown, is often met with term insurance, which gives the most coverage for the lowest initial premium. A need that lasts a lifetime, such as final expenses, estate liquidity or a funded buy-sell agreement, usually calls for permanent insurance."},{"type":"table","head":["Client need","Often suitable"],"rows":[["Income replacement while children are young","Term insurance"],["Paying off a mortgage balance","Decreasing or level term"],["Final expenses and estate costs","Permanent insurance"],["Coverage plus cash accumulation","Whole life or universal life"]]},{"type":"p","text":"Affordability matters as much as the amount. A policy that lapses because the premium was too high protects nobody. It is better to recommend coverage the client can keep in force."},{"type":"p","text":"Needs also change. Marriage, a new child, a new home, a business venture or retirement can each raise or lower the right amount of coverage. A careful agent reviews the client's program from time to time and never recommends replacing an existing policy unless the change clearly benefits the client."},{"type":"example","text":"A young couple with a new baby and a tight budget needs a large amount of protection for the next 20 years. A level term policy fits their need and their budget better than a small whole life policy that would leave them underinsured."},{"type":"tip","text":"Temporary need points to term insurance; permanent need points to permanent insurance."}]}],"summary":{"recap":["Individuals use life insurance for survivor protection, estate creation, cash accumulation, liquidity and final expenses. It is the only product that creates an immediate estate.","The human life value approach measures the present value of the insured's future earnings. The needs approach totals what survivors would require and subtracts what they already have.","Key person insurance protects a business from the loss of a vital employee. The business owns the policy, pays the premium and is the beneficiary. Premiums are not deductible.","Buy-sell agreements arrange the sale of a deceased owner's interest. In a cross-purchase plan the owners insure each other. In an entity or stock redemption plan the business owns one policy per owner.","Split-dollar plans share premiums and benefits between employer and employee. Deferred compensation postpones pay and its taxation. Executive bonus plans pay the premium on an employee-owned policy as taxable compensation.","A suitable recommendation rests on fact-finding and matches the amount, type and cost of coverage to the client's needs, with regular reviews as life changes."],"avaSummary":"That is chapter ten complete. Let me give you the short version. On the personal side, remember five uses. Survivor protection replaces lost income. Estate creation produces instant money for heirs. Cash accumulation gives the owner a living benefit. Liquidity provides ready cash so assets do not have to be sold. And final expenses covers funeral costs and last bills. To work out how much coverage someone needs, you have two tools. The human life value approach looks at the insured and asks what their future earnings are worth today. The needs approach looks at the survivors and asks what they would need, then subtracts what they already have. On the business side, start with key person insurance. The business owns it, pays for it and collects the benefit. The premiums are not deductible. Next come buy-sell agreements. In a cross-purchase plan the owners buy policies on each other, so three owners means six policies. In an entity plan, or a stock redemption plan for a corporation, the business owns one policy on each owner. Then there are the employee benefit arrangements. Split-dollar means the employer and employee share the premium and the benefits. Deferred compensation means the employer promises to pay later, and the employee is taxed later. Executive bonus means the employer pays the premium on a policy the employee owns, the employer deducts it, and the employee reports it as income. Last of all, suitability. Gather the facts first. Match temporary needs with term and lifelong needs with permanent coverage. Make sure the premium is affordable, and check back when the client's life changes. Go through the review notes, then take the exam when you feel ready. You are doing great.","reviewNotes":[{"objective":"Identify the personal uses of life insurance","concepts":["Survivor protection replaces income for dependents","Estate creation provides an immediate sum once the policy is in force","Cash accumulation in permanent policies is a living benefit","Liquidity prevents a forced sale of assets","Final expenses include funeral, medical and estate settlement costs"],"terms":[{"term":"Survivor protection","def":"Replacing support that dependents lose at the insured's death."},{"term":"Estate creation","def":"Producing an immediate estate through a death benefit."},{"term":"Liquidity","def":"Access to cash without having to sell other assets."}]},{"objective":"Compare the human life value approach with the needs approach","concepts":["Human life value focuses on the insured's future earnings","It considers income, working years left, personal expenses and inflation","The needs approach focuses on what survivors will require","Needs include lump sums and ongoing income","Existing assets and benefits are subtracted from total needs","The blackout period is a gap in Social Security survivor benefits"],"terms":[{"term":"Human life value approach","def":"Coverage based on the present value of future earnings."},{"term":"Needs approach","def":"Coverage based on survivors' specific financial needs."},{"term":"Blackout period","def":"The time when a surviving spouse receives no Social Security survivor benefits."}]},{"objective":"Explain how key person insurance protects a business","concepts":["The business is owner, premium payer and beneficiary","The key employee is the insured and must consent","Proceeds offset lost profits and replacement costs","Premiums are not deductible; proceeds are generally income tax free"],"terms":[{"term":"Key person insurance","def":"Business-owned coverage on an employee whose death would hurt the company."},{"term":"Insurable interest","def":"A financial stake in the continued life of the insured."}]},{"objective":"Distinguish cross-purchase from entity and stock redemption buy-sell agreements","concepts":["A buy-sell agreement sets the buyer and the price in advance","Cross-purchase: each owner holds a policy on every other owner","Entity plan: the business holds one policy on each owner","Stock redemption is the entity plan used by a corporation","Cross-purchase policies equal owners times owners minus one"],"terms":[{"term":"Buy-sell agreement","def":"A contract for the purchase of a deceased owner's business interest."},{"term":"Cross-purchase plan","def":"Owners insure each other and buy the interest personally."},{"term":"Entity plan","def":"The business insures the owners and buys the interest."},{"term":"Stock redemption plan","def":"A corporation buys back a deceased shareholder's stock."}]},{"objective":"Describe split-dollar, deferred compensation and executive bonus arrangements","concepts":["Split-dollar is a method of sharing a policy, not a type of policy","In split-dollar, the employer recovers its premiums and the rest goes to the employee's beneficiary","Deferred compensation delays both payment and taxation for the employee","In an executive bonus plan the employee owns the policy","Executive bonus premiums are deductible to the employer and taxable to the employee"],"terms":[{"term":"Split-dollar plan","def":"Employer and employee share a policy's premiums and benefits."},{"term":"Deferred compensation","def":"A promise to pay part of an employee's compensation at a future date."},{"term":"Executive bonus","def":"Employer-paid premium on an employee-owned policy, treated as compensation."}]},{"objective":"Determine a suitable amount and type of coverage for a client","concepts":["Suitability depends on facts gathered from the client","Consider dependents, income, debts, existing coverage, goals and budget","Temporary needs often fit term; lifelong needs often fit permanent","Coverage must be affordable enough to stay in force","Review coverage when the client's life changes"],"terms":[{"term":"Suitability","def":"A recommendation that fits the client's needs, goals and finances."},{"term":"Fact-finding","def":"Collecting client information before making a recommendation."}]}]},"exam":[{"q":"Which personal use of life insurance refers to replacing income for dependents after the insured's death?","choices":["Cash accumulation","Liquidity","Survivor protection","Estate conservation"],"answer":2,"why":"Survivor protection means providing the funds dependents need to replace the insured's lost income."},{"q":"Life insurance is unique among financial products because it can:","choices":["Create an immediate estate","Guarantee investment gains","Eliminate all estate taxes","Be purchased without insurable interest"],"answer":0,"why":"As soon as the policy is in force, the full death benefit is available to heirs, creating an estate at once."},{"q":"An estate consists mostly of real estate and has little cash. Life insurance proceeds would help most by providing:","choices":["Deferred compensation","Liquidity","A stock redemption","Human life value"],"answer":1,"why":"Liquidity is ready cash, which keeps survivors from having to sell assets quickly to pay costs."},{"q":"Funeral costs, unpaid medical bills and estate settlement costs are known as:","choices":["Dependency period needs","Blackout period needs","Readjustment income","Final expenses"],"answer":3,"why":"Final expenses are the costs that arise at or because of the insured's death."},{"q":"The ability to borrow from a permanent policy for an emergency is an example of which use of life insurance?","choices":["Survivor protection","Estate creation","Cash accumulation","Key person protection"],"answer":2,"why":"Cash value built up in a permanent policy is a living benefit the owner can access."},{"q":"Which method of determining coverage is based on the present value of the insured's future earnings?","choices":["Human life value approach","Needs approach","Capital retention approach","Entity approach"],"answer":0,"why":"The human life value approach measures the economic value of the insured's future earnings to the family."},{"q":"An agent totals a family's mortgage, education costs, debts and income needs, then subtracts existing savings and insurance. This is the:","choices":["Human life value approach","Needs approach","Cross-purchase approach","Split-dollar approach"],"answer":1,"why":"The needs approach identifies specific survivor needs and offsets them with resources already available."},{"q":"Which factor is used in the human life value approach?","choices":["The balance on the mortgage","The cost of the funeral","The number of policies the insured owns","The number of working years remaining until retirement"],"answer":3,"why":"Human life value looks at income, years left to work, personal expenses and inflation."},{"q":"The blackout period refers to the time when:","choices":["A policy is in its grace period","A surviving spouse receives no Social Security survivor benefits","A business has no key person coverage","Cash value cannot be borrowed"],"answer":1,"why":"It is the gap after the youngest child turns 16 and before the surviving spouse qualifies for benefits again."},{"q":"In a key person life insurance policy, who is the beneficiary?","choices":["The key employee's spouse","The key employee's estate","The business","The other employees"],"answer":2,"why":"The business owns the policy, pays the premium and receives the proceeds to offset its loss."},{"q":"Premiums paid by a business for key person life insurance are:","choices":["Not tax deductible","Fully tax deductible","Deductible up to 50 percent","Taxable income to the key employee"],"answer":0,"why":"Because the business is the beneficiary, the premiums are not a deductible expense."},{"q":"The main purpose of a buy-sell agreement is to:","choices":["Give all employees group life coverage","Defer an executive's income until retirement","Share premiums between employer and employee","Arrange in advance for the purchase of a deceased owner's business interest"],"answer":3,"why":"A buy-sell agreement fixes who will buy a departing owner's share and at what price."},{"q":"In a cross-purchase buy-sell plan, the policies are owned by:","choices":["The business entity","Each owner on the lives of the other owners","The owners' spouses","A lender"],"answer":1,"why":"Under cross-purchase, each owner buys and is beneficiary of a policy on every other owner."},{"q":"A business has four owners and uses a cross-purchase plan. How many policies are needed?","choices":["4","8","12","16"],"answer":2,"why":"The number of policies is owners times owners minus one: 4 times 3 equals 12."},{"q":"Under an entity buy-sell plan with three partners, how many policies are purchased and who owns them?","choices":["Three, owned by the business","Six, owned by the partners","Three, owned by the partners' estates","Six, owned by the business"],"answer":0,"why":"In an entity plan the business buys one policy on each owner, so three partners need three policies."},{"q":"A stock redemption plan is a buy-sell agreement in which:","choices":["Shareholders buy each other's stock directly","Employees receive stock as a bonus","A partnership dissolves at a partner's death","The corporation buys back a deceased shareholder's stock"],"answer":3,"why":"Stock redemption is the entity-type plan for corporations, with the corporation purchasing the stock."},{"q":"In a split-dollar plan, what typically happens when the insured employee dies?","choices":["The employer receives the entire death benefit","The employer recovers the premiums it paid and the rest goes to the employee's beneficiary","The employee's beneficiary receives only the cash value","The policy is surrendered"],"answer":1,"why":"The employer is repaid its premium outlay and the balance of the proceeds passes to the employee's beneficiary."},{"q":"Under a nonqualified deferred compensation plan, the employee is taxed on the benefits:","choices":["When the agreement is signed","Each year as the employer funds the plan","When the benefits are actually received","Never"],"answer":2,"why":"Taxation is postponed until the employee receives the deferred payments."},{"q":"In an executive bonus plan, the premium the employer pays is:","choices":["Deductible to the employer and taxable income to the employee","Not deductible to the employer and tax free to the employee","Repaid to the employer at the employee's death","Owned by the employer as cash value"],"answer":0,"why":"The premium is treated as compensation, so the employer deducts it and the employee, who owns the policy, reports it as income."},{"q":"A young couple with a limited budget needs a large amount of coverage until their children are grown. The most suitable recommendation is generally:","choices":["A small whole life policy","A single premium immediate annuity","A key person policy","Term life insurance"],"answer":3,"why":"A temporary need for a large amount of protection at low cost is best matched by term insurance."}]},{"id":"ch11","num":11,"title":"Retirement Plans","intro":{"hook":["Picture a client who has worked for thirty years and is six months from her last day on the job. She has a 401(k) from her current employer, an old IRA she opened in her twenties, and a letter from a former employer about a pension she forgot she had. She asks you one question: what do I do with all of this?","This chapter gives you the vocabulary and the rules to answer her. You will learn how the tax code separates qualified plans from nonqualified plans, how employer plans and individual retirement accounts work, and what happens when money goes in, moves between accounts, and finally comes out.","Retirement plans show up on the Texas exam because life insurers issue many of the products that fund them, especially annuities. They also matter in the field. An agent who understands the tax rules can keep a client from an avoidable penalty, and an agent who does not can cause one."],"objectives":["Distinguish qualified retirement plans from nonqualified plans and describe the tax treatment of each","Explain the main protections ERISA gives to plan participants","Compare defined benefit plans with defined contribution plans","Identify the employer-sponsored and self-employed plans, including 401(k), 403(b), profit sharing, Keogh, SEP and SIMPLE plans","Contrast the traditional IRA with the Roth IRA","Describe rollovers, transfers, required minimum distributions and the early withdrawal penalty with its exceptions"],"avaIntro":"Hi, I'm Ava, and welcome to chapter eleven. Today we are talking about retirement plans. I know the names can look like alphabet soup at first. There are four-oh-one-k plans, four-oh-three-b plans, SEPs, SIMPLEs, Keoghs and two kinds of IRA. Here is the good news. Almost every plan follows the same basic story. Money goes in, it grows without being taxed each year, and then it comes out and the tax bill is settled. What changes from plan to plan is who can use it, who puts the money in, and when the tax is paid. I will walk you through each plan one at a time, and I will point out the ages and penalties that the exam likes to test. Take your time with this one. Let's get started."},"keywords":[{"term":"403(b) plan","def":"A tax-deferred retirement plan for employees of public schools and certain nonprofit organizations, also called a tax-sheltered annuity."},{"term":"Defined benefit plan","def":"An employer plan that promises a specific retirement benefit set by a formula, with the employer carrying the investment risk."},{"term":"Defined contribution plan","def":"A plan that sets what goes into each participant's account but does not promise a specific benefit at retirement."},{"term":"Direct transfer","def":"Movement of retirement money straight from one trustee or custodian to another without the owner taking possession."},{"term":"ERISA","def":"The Employee Retirement Income Security Act of 1974, the federal law that sets minimum standards for private employer retirement plans."},{"term":"Fiduciary","def":"A person who manages plan assets or decisions and must act solely in the interest of participants and beneficiaries."},{"term":"Keogh (HR-10) plan","def":"A qualified retirement plan for self-employed people such as sole proprietors and partners, and their eligible employees."},{"term":"Nonqualified plan","def":"A retirement or deferred compensation arrangement that does not meet IRS qualification rules and may favor selected employees."},{"term":"Qualified plan","def":"A retirement plan that meets IRS and ERISA requirements and receives favorable tax treatment in return."},{"term":"Required minimum distribution (RMD)","def":"The smallest amount an owner must withdraw each year from most tax-deferred retirement accounts once the starting age is reached."},{"term":"Rollover","def":"A distribution paid to the owner that is redeposited into another retirement account within 60 days to keep its tax-deferred status."},{"term":"Roth IRA","def":"An individual retirement account funded with after-tax dollars whose qualified distributions are tax free."},{"term":"SEP","def":"A Simplified Employee Pension, in which an employer contributes to IRAs set up for its employees."},{"term":"SIMPLE plan","def":"A retirement plan for employers with 100 or fewer employees that requires an employer contribution and has light administrative rules."},{"term":"Traditional IRA","def":"An individual retirement account whose contributions may be tax deductible and whose earnings are taxed when withdrawn."},{"term":"Vesting","def":"The process by which a participant gains a nonforfeitable right to employer contributions in a plan."}],"sections":[{"title":"Qualified and Nonqualified Plans","blocks":[{"type":"p","text":"Every retirement plan falls into one of two groups for tax purposes. A <b>qualified plan<\/b> is one that follows a set of rules written by the IRS and by federal pension law. In exchange for following those rules, the plan receives tax advantages. A <b>nonqualified plan<\/b> does not follow those rules, so it gives up most of those advantages but gains flexibility."},{"type":"h","text":"What makes a plan qualified"},{"type":"list","items":["It is set up for the exclusive benefit of employees and their beneficiaries.","It is in writing, is permanent in intent, and is communicated to employees.","It does not discriminate in favor of officers, owners or highly paid employees.","It has a vesting schedule that meets federal minimums.","It is approved by the IRS."]},{"type":"h","text":"Tax advantages of a qualified plan"},{"type":"list","items":["Employer contributions are deductible to the business as an ordinary business expense when made.","Employer contributions are not counted as current taxable income to the employee.","Earnings inside the plan grow tax deferred.","Tax is paid when money is distributed, usually in retirement."]},{"type":"p","text":"A nonqualified plan lets the employer pick and choose who is covered. That is why these plans are popular for rewarding executives and other key people. Common examples are deferred compensation agreements, executive bonus plans and split-dollar life insurance arrangements. The trade-off is tax timing. In general the employer cannot deduct money set aside under a nonqualified deferred compensation plan until the employee actually receives it and reports it as income."},{"type":"table","head":["Feature","Qualified plan","Nonqualified plan"],"rows":[["IRS approval","Required","Not required"],["May favor key employees","No","Yes"],["Employer deduction","When the contribution is made","Generally when the employee is paid"],["Earnings","Tax deferred","Depends on the funding vehicle"],["Subject to most ERISA rules","Yes","Largely exempt"]]},{"type":"example","text":"A machine shop wants to give its plant manager an extra retirement promise without offering the same deal to all forty employees. A nonqualified deferred compensation agreement allows that. If the shop instead wants an immediate tax deduction for contributions, it needs a qualified plan that covers the workforce fairly."},{"type":"flow","nodes":["Contribution goes in","Growth is tax deferred","Distribution is taxed"],"caption":"The basic life cycle of money in a qualified plan"},{"type":"tip","text":"If a question says the plan can discriminate in favor of selected employees, the answer is a nonqualified plan."}]},{"title":"ERISA and the Two Plan Designs","blocks":[{"type":"p","text":"Congress passed <b>ERISA<\/b>, the Employee Retirement Income Security Act, in 1974. Before that law, workers sometimes lost promised pensions when a company failed or when plan money was mismanaged. ERISA does not force an employer to offer a plan. It sets minimum standards for private employers that choose to offer one."},{"type":"h","text":"Main ERISA protections"},{"type":"list","items":["Participation: rules on who must be allowed into the plan and when.","Vesting: schedules that give employees a permanent right to employer money after a set period of service.","Funding: requirements that enough money be set aside to pay promised benefits.","Fiduciary duty: people who run the plan must act only in the interest of participants.","Reporting and disclosure: participants must receive a summary plan description, and annual reports must be filed with the government."]},{"type":"p","text":"Money an employee contributes from his or her own pay is always fully vested. <b>Vesting<\/b> schedules apply only to the employer's contributions."},{"type":"h","text":"Defined benefit plans"},{"type":"p","text":"A <b>defined benefit plan<\/b> is the traditional pension. The plan document contains a formula, often based on years of service and pay, that tells the worker what monthly income to expect at retirement. The employer must contribute whatever an actuary says is needed to keep that promise. If the investments do poorly, the employer has to make up the shortfall, so the employer bears the investment risk."},{"type":"h","text":"Defined contribution plans"},{"type":"p","text":"A <b>defined contribution plan<\/b> defines what goes in, not what comes out. Each participant has an individual account. The retirement benefit is simply whatever that account is worth, so the participant bears the investment risk. Profit sharing plans, money purchase plans and 401(k) plans are all defined contribution plans."},{"type":"table","head":["Question","Defined benefit","Defined contribution"],"rows":[["What is fixed?","The retirement benefit","The contribution"],["Who bears investment risk?","Employer","Employee"],["Individual accounts?","No, one pooled fund","Yes"],["Actuary needed each year?","Yes","No"]]},{"type":"example","text":"Maria's plan promises 1.5 percent of her final average pay for each year she works. That is a defined benefit plan. Devon's employer puts 5 percent of his pay into an account with his name on it. That is a defined contribution plan."},{"type":"tip","text":"Match the risk to the name: in a defined benefit plan the employer carries the investment risk, and in a defined contribution plan the employee carries it."}]},{"title":"Employer-Sponsored Plans: 401(k), 403(b) and Profit Sharing","blocks":[{"type":"p","text":"Most workers today save for retirement through a defined contribution plan at work. Three versions appear again and again on the exam."},{"type":"h","text":"401(k) plans"},{"type":"p","text":"A <b>401(k) plan<\/b> lets employees choose to have part of their pay sent into the plan instead of receiving it as cash. This choice is called an elective deferral, and the arrangement is sometimes called a cash or deferred arrangement. In a traditional 401(k), the deferred pay is not included in the employee's taxable income for the year, and it grows tax deferred. Many employers add a matching contribution. The employee's own deferrals are always fully vested, while the match may follow a vesting schedule. Federal law caps how much can be deferred each year, and the cap is adjusted regularly, with a higher catch-up amount allowed for participants age 50 and older."},{"type":"h","text":"403(b) plans"},{"type":"p","text":"A <b>403(b) plan<\/b>, also called a tax-sheltered annuity or TSA, works much like a 401(k) but is available only to certain employers. These are public school systems and nonprofit organizations that are tax exempt under section 501(c)(3), such as charities, hospitals and churches. Employees make contributions through salary reduction, the contributions are excluded from current income, and the earnings grow tax deferred."},{"type":"h","text":"Profit sharing plans"},{"type":"p","text":"In a <b>profit sharing plan<\/b>, the employer shares part of company profits with employees by contributing to their retirement accounts. The employer is not required to contribute the same amount every year and may skip a year, but contributions must be substantial and recurring for the plan to stay qualified. Contributions must be divided among participants using a set formula that does not favor highly paid people."},{"type":"table","head":["Plan","Who can sponsor it","Main funding source"],"rows":[["401(k)","For-profit employers","Employee salary deferrals, often with an employer match"],["403(b)","Public schools and 501(c)(3) nonprofits","Employee salary reduction"],["Profit sharing","Employers of any size","Flexible employer contributions"]]},{"type":"example","text":"A high school teacher and a nurse at a nonprofit hospital both ask about saving through payroll. Each is eligible for a 403(b). Their neighbor who works for a retail chain would use a 401(k) instead."},{"type":"tip","text":"When a question mentions teachers, public schools or a 501(c)(3) organization, look for 403(b) or tax-sheltered annuity as the answer."}]},{"title":"Plans for the Self-Employed and Small Employers","blocks":[{"type":"p","text":"Small business owners often want a retirement plan but cannot afford the paperwork of a large corporate plan. The tax code offers three answers."},{"type":"h","text":"Keogh (HR-10) plans"},{"type":"p","text":"A <b>Keogh plan<\/b>, also called an HR-10 plan, is a qualified plan for people who are self-employed, such as sole proprietors and partners. The owner makes tax-deductible contributions based on net self-employment earnings. Because it is a qualified plan, the owner cannot cover only himself or herself. Eligible employees must be included on the same basis. In general, that means full-time employees who are at least 21 and have worked for the business for at least one year. A Keogh can be designed as either a defined contribution or a defined benefit plan."},{"type":"h","text":"Simplified Employee Pension (SEP)"},{"type":"p","text":"A <b>SEP<\/b> is built on individual retirement accounts. The employer opens an IRA for each eligible employee and contributes directly to it. The employer gets a deduction, the employee is not taxed on the contribution, and the employee is immediately 100 percent vested. A SEP allows much larger contributions than a person could make to an IRA alone. It is funded by the employer, and it suits small businesses and self-employed individuals who want very little administration."},{"type":"h","text":"SIMPLE plans"},{"type":"p","text":"SIMPLE stands for Savings Incentive Match Plan for Employees. A <b>SIMPLE plan<\/b> is available to an employer with 100 or fewer employees that does not maintain another qualified plan. Employees may defer part of their pay, and the employer is required to contribute every year. The employer either matches employee deferrals up to a set percentage of pay or makes a smaller contribution for every eligible employee whether or not that employee defers. Employees are immediately vested in everything."},{"type":"table","head":["Plan","Designed for","Who contributes"],"rows":[["Keogh (HR-10)","Sole proprietors and partners","The self-employed owner, who must also cover eligible employees"],["SEP","Small employers and the self-employed","Employer, into each employee's IRA"],["SIMPLE","Employers with 100 or fewer employees","Employee deferrals plus a required employer contribution"]]},{"type":"example","text":"A dentist who runs her practice as a sole proprietor has two full-time assistants who have been with her for three years. If she sets up a Keogh plan for herself, she must also contribute for both assistants."},{"type":"tip","text":"Remember the number 100 for SIMPLE plans and remember that the employer contribution is mandatory."}]},{"title":"Traditional IRAs and Roth IRAs","blocks":[{"type":"p","text":"An individual retirement account is opened by a person, not an employer. Anyone with earned income, such as wages or self-employment income, can contribute. Investment income, pension income and Social Security benefits do not count as earned income. A married person can also contribute to a spousal IRA for a husband or wife who has little or no earnings, as long as the couple files a joint return. Annual contributions are capped by law, with an extra catch-up amount for people age 50 and older. Putting in more than the limit triggers a 6 percent excise tax on the excess for each year it stays in the account."},{"type":"h","text":"Traditional IRA"},{"type":"p","text":"Contributions to a <b>traditional IRA<\/b> may be tax deductible. A person who is not covered by an employer plan can deduct the full contribution. A person who is covered by an employer plan may lose part or all of the deduction as income rises. Either way, earnings grow tax deferred. Withdrawals of deductible contributions and all earnings are taxed as ordinary income. There is no longer an upper age limit for contributing, as long as the owner still has earned income."},{"type":"h","text":"Roth IRA"},{"type":"p","text":"Contributions to a <b>Roth IRA<\/b> are never deductible. They are made with money that has already been taxed. The reward comes later: a qualified distribution is entirely free of income tax, including the earnings. To be qualified, the account must have been open at least five years, and the owner must be at least 59 1/2, disabled, deceased, or using the money for a first-time home purchase within the allowed lifetime limit. High earners are phased out of contributing directly to a Roth. The original owner of a Roth IRA is never required to take minimum distributions."},{"type":"table","head":["Feature","Traditional IRA","Roth IRA"],"rows":[["Contributions","May be deductible","Never deductible"],["Growth","Tax deferred","Tax free if qualified"],["Qualified withdrawals","Taxed as ordinary income","Tax free"],["Required minimum distributions for owner","Yes","No"],["Income limit to contribute","No","Yes"]]},{"type":"p","text":"IRA money may be placed in many kinds of investments, including annuities, mutual funds and bank deposits. It may not be invested in life insurance or in collectibles."},{"type":"example","text":"Two coworkers each put the same amount into an IRA. Tom chooses a traditional IRA and takes a deduction this year. Lena chooses a Roth and gets no deduction. Thirty years later Tom pays income tax on every dollar he withdraws, while Lena's qualified withdrawals are tax free."},{"type":"tip","text":"Think of it as pay tax later with a traditional IRA and pay tax now with a Roth IRA."}]},{"title":"Rollovers, Transfers and Distribution Rules","blocks":[{"type":"p","text":"Retirement money often has to move, for example when someone changes jobs. There are two ways to move it without owing tax."},{"type":"h","text":"Rollover versus direct transfer"},{"type":"p","text":"In a <b>rollover<\/b>, the plan pays the money to the owner, and the owner must deposit it into another eligible plan or IRA within 60 days. Any amount not redeposited in time is treated as a taxable distribution. When the payout comes from an employer's qualified plan and is made payable to the participant, the plan must withhold 20 percent for federal income tax. An IRA owner is allowed only one IRA-to-IRA rollover in any 12-month period."},{"type":"p","text":"In a <b>direct transfer<\/b>, sometimes called a trustee-to-trustee transfer or direct rollover, the money goes straight from one custodian to the next. The owner never touches it, so nothing is withheld and there is no limit on how often it can be done."},{"type":"flow","nodes":["Old plan","Check paid to owner","20% withheld","Redeposit within 60 days"],"caption":"An indirect rollover from an employer plan. A direct transfer skips the middle steps."},{"type":"h","text":"Early withdrawal penalty"},{"type":"p","text":"Money taken from a qualified plan or IRA before age 59 1/2 is generally hit with a 10 percent penalty tax on top of regular income tax. The penalty is waived in certain situations, including:"},{"type":"list","items":["Death of the owner","Total and permanent disability of the owner","A series of substantially equal periodic payments over the owner's life expectancy","Unreimbursed medical expenses above a set percentage of adjusted gross income","Qualified higher education expenses (IRAs)","A first-time home purchase, up to a lifetime limit (IRAs)","Health insurance premiums while unemployed (IRAs)","Payments to a former spouse under a qualified domestic relations order (employer plans)"]},{"type":"p","text":"A waiver of the penalty does not waive the income tax. One special rule applies to SIMPLE IRAs: an early withdrawal during the first two years of participation carries a 25 percent penalty instead of 10 percent."},{"type":"h","text":"Required minimum distributions"},{"type":"p","text":"The government does not let tax-deferred money stay sheltered forever. Under current law, <b>required minimum distributions<\/b> must begin at age 73. The first one may be delayed until April 1 of the year after the owner reaches that age, and later ones are due by December 31 each year. Federal law schedules the starting age to rise to 75 in 2033. If the owner withdraws less than the required amount, an excise tax of 25 percent applies to the shortfall, and it can drop to 10 percent if the mistake is corrected promptly. Older study materials may show earlier starting ages or a 50 percent penalty, which were the rules before recent changes in federal law."},{"type":"tip","text":"Know three numbers cold: 59 1/2 for the early withdrawal penalty, 60 days for a rollover, and 20 percent withholding when an employer plan pays the participant directly."}]}],"summary":{"recap":["Qualified plans follow IRS and ERISA rules and cannot favor highly paid employees. In return the employer deducts contributions right away, employees are not taxed on them yet, and earnings grow tax deferred. Nonqualified plans can be selective but generally delay the employer's deduction.","ERISA protects participants in private employer plans through standards for participation, vesting, funding, fiduciary conduct, and reporting and disclosure.","A defined benefit plan promises a specific retirement income and leaves the investment risk with the employer. A defined contribution plan promises only a contribution, and the employee carries the investment risk.","401(k) plans serve for-profit employers, 403(b) plans serve public schools and 501(c)(3) nonprofits, and profit sharing plans allow flexible employer contributions. Keogh plans serve the self-employed, SEPs put employer money into employee IRAs, and SIMPLE plans serve employers with 100 or fewer employees.","Traditional IRA contributions may be deductible and withdrawals are taxed. Roth IRA contributions are after tax, and qualified withdrawals are tax free with no required distributions for the owner.","Rollovers must be completed within 60 days, and direct transfers avoid the 20 percent withholding. Withdrawals before 59 1/2 usually carry a 10 percent penalty, and required minimum distributions currently begin at age 73."],"avaSummary":"Nice work getting through chapter eleven. Let me pull the big ideas together for you. First, the tax code sorts plans into qualified and nonqualified. A qualified plan plays by the IRS and ERISA rules. It cannot favor the highest paid people, and in return the employer gets a deduction now and the employee pays tax later. A nonqualified plan can be offered to just a few key people, but the employer usually waits for its deduction. Second, remember who carries the investment risk. In a defined benefit plan it is the employer, because the benefit is promised. In a defined contribution plan it is the employee, because only the contribution is promised. Third, match each plan to its user. A four-oh-one-k is for for-profit companies. A four-oh-three-b is for public schools and nonprofits. A Keogh is for the self-employed. A SEP uses employer-funded IRAs. A SIMPLE is for employers with one hundred or fewer employees, and the employer must contribute. Fourth, compare the two IRAs. With a traditional IRA you may get a deduction today and you pay tax when you withdraw. With a Roth you get no deduction, but qualified withdrawals are tax free, and the owner never has required distributions. Finally, lock in the numbers. Fifty-nine and a half is the age when the ten percent early withdrawal penalty ends. Sixty days is the rollover window. Twenty percent is withheld when an employer plan pays you directly, which is why a direct transfer is usually the better move. And required minimum distributions currently start at age seventy-three. Review the exceptions to the early withdrawal penalty one more time, then head to the chapter exam. You are ready.","reviewNotes":[{"objective":"Distinguish qualified retirement plans from nonqualified plans and describe the tax treatment of each","concepts":["Qualified plans need IRS approval and must not discriminate in favor of highly paid employees.","Employer contributions to a qualified plan are deductible when made and are not current income to the employee.","Earnings in a qualified plan grow tax deferred and are taxed at distribution.","Nonqualified plans can cover selected employees, and the employer's deduction is generally delayed until the employee is paid."],"terms":[{"term":"Qualified plan","def":"A plan meeting IRS and ERISA requirements that receives favorable tax treatment."},{"term":"Nonqualified plan","def":"A plan that does not meet qualification rules and may favor selected employees."}]},{"objective":"Explain the main protections ERISA gives to plan participants","concepts":["ERISA was enacted in 1974 and applies to private employer plans.","It does not require an employer to offer a plan.","It sets standards for participation, vesting, funding, fiduciary duty, and reporting and disclosure.","Employee contributions are always 100 percent vested."],"terms":[{"term":"ERISA","def":"The federal law setting minimum standards for private employer retirement plans."},{"term":"Vesting","def":"Gaining a nonforfeitable right to employer contributions."},{"term":"Fiduciary","def":"A person who must run the plan solely in the interest of participants."}]},{"objective":"Compare defined benefit plans with defined contribution plans","concepts":["A defined benefit plan uses a formula to promise a set retirement benefit.","The employer bears the investment risk in a defined benefit plan and needs an actuary to calculate funding.","A defined contribution plan uses individual accounts, and the benefit equals the account value.","The employee bears the investment risk in a defined contribution plan."],"terms":[{"term":"Defined benefit plan","def":"A plan that promises a specific benefit at retirement."},{"term":"Defined contribution plan","def":"A plan that specifies contributions rather than a final benefit."}]},{"objective":"Identify the employer-sponsored and self-employed plans, including 401(k), 403(b), profit sharing, Keogh, SEP and SIMPLE plans","concepts":["A 401(k) is funded mainly by employee elective deferrals, often with an employer match.","A 403(b) is for employees of public schools and 501(c)(3) organizations.","Profit sharing contributions are flexible but must be substantial and recurring.","A Keogh plan covers self-employed owners and must include eligible employees.","A SEP is funded by the employer into employee IRAs with immediate vesting.","A SIMPLE plan is for employers with 100 or fewer employees and requires an employer contribution."],"terms":[{"term":"403(b) plan","def":"A tax-sheltered annuity plan for school and nonprofit employees."},{"term":"Keogh (HR-10) plan","def":"A qualified plan for the self-employed."},{"term":"SEP","def":"An employer-funded plan that uses employee IRAs."},{"term":"SIMPLE plan","def":"A small-employer plan with required employer contributions."}]},{"objective":"Contrast the traditional IRA with the Roth IRA","concepts":["Both require earned income, and a spousal IRA is allowed on a joint return.","Traditional IRA contributions may be deductible, and withdrawals are taxed as ordinary income.","Roth IRA contributions are never deductible, and qualified distributions are tax free.","A Roth distribution is qualified after five years plus age 59 1/2, death, disability or a first-time home purchase.","Roth owners have no required minimum distributions, and excess contributions to either IRA face a 6 percent excise tax."],"terms":[{"term":"Traditional IRA","def":"An IRA with possibly deductible contributions and taxable withdrawals."},{"term":"Roth IRA","def":"An IRA funded with after-tax money that can pay out tax free."}]},{"objective":"Describe rollovers, transfers, required minimum distributions and the early withdrawal penalty with its exceptions","concepts":["A rollover must be completed within 60 days, and IRA-to-IRA rollovers are limited to one per 12 months.","An employer plan must withhold 20 percent when it pays an eligible distribution to the participant.","A direct transfer between trustees avoids withholding and has no frequency limit.","Withdrawals before age 59 1/2 generally carry a 10 percent penalty unless an exception such as death or disability applies.","Required minimum distributions currently begin at age 73, with an excise tax on any shortfall."],"terms":[{"term":"Rollover","def":"A distribution redeposited into another plan within 60 days."},{"term":"Direct transfer","def":"A trustee-to-trustee movement of retirement funds."},{"term":"Required minimum distribution (RMD)","def":"The minimum yearly withdrawal required after the starting age."}]}]},"exam":[{"q":"Which of the following is a requirement for a retirement plan to be qualified?","choices":["It must cover only officers of the company","It must not discriminate in favor of highly paid employees","It must be funded only with life insurance","It must guarantee a fixed rate of return"],"answer":1,"why":"Qualified plans must benefit employees broadly and cannot favor owners, officers or highly paid employees."},{"q":"An employer wants to provide extra retirement benefits to three senior executives only. Which type of plan allows this?","choices":["A nonqualified plan","A 401(k) plan","A SIMPLE plan","A profit sharing plan"],"answer":0,"why":"Nonqualified plans are not bound by nondiscrimination rules, so the employer may choose who participates."},{"q":"How are employer contributions to a qualified plan treated for tax purposes?","choices":["They are taxable to the employee in the year made","They are never deductible by the employer","They are deductible by the employer and not currently taxed to the employee","They are deductible only when the employee retires"],"answer":2,"why":"The employer deducts contributions when made, and the employee is taxed later at distribution."},{"q":"ERISA was enacted primarily to","choices":["Require every employer to offer a pension","Set contribution limits for Roth IRAs","Regulate Social Security benefits","Protect participants in private employer retirement plans"],"answer":3,"why":"ERISA sets minimum standards that protect participants and beneficiaries; it does not require employers to offer a plan."},{"q":"Under ERISA, a person who manages plan assets and must act solely in the interest of participants is called a","choices":["Beneficiary","Fiduciary","Custodian of record","Sponsor"],"answer":1,"why":"Fiduciary duty is one of the core ERISA standards for those who run a plan."},{"q":"In a defined benefit plan, who bears the investment risk?","choices":["The employee","The plan's beneficiaries","The employer","The IRS"],"answer":2,"why":"The employer promised a specific benefit and must fund it regardless of investment results."},{"q":"Which statement describes a defined contribution plan?","choices":["The retirement benefit equals the value of the participant's individual account","The benefit is set by a formula based on final pay","An actuary must certify a guaranteed benefit each year","The employer bears all the investment risk"],"answer":0,"why":"A defined contribution plan fixes what goes in, and the benefit is whatever the account is worth."},{"q":"A teacher employed by a public school district would most likely be eligible for which plan?","choices":["Keogh plan","SIMPLE plan","Executive bonus plan","403(b) plan"],"answer":3,"why":"403(b) tax-sheltered annuities are available to employees of public schools and 501(c)(3) organizations."},{"q":"In a 401(k) plan, an employee's own elective deferrals are","choices":["Vested after five years of service","Always 100 percent vested","Forfeited if the employee quits","Vested only when the employer matches"],"answer":1,"why":"Employee contributions are always fully vested; vesting schedules apply only to employer money."},{"q":"Which is true of employer contributions to a profit sharing plan?","choices":["They must be the same dollar amount every year","They may favor highly paid employees","They are flexible but must be substantial and recurring","They are made only by employees"],"answer":2,"why":"The employer can vary or skip contributions, but they must recur to keep the plan qualified."},{"q":"A Keogh (HR-10) plan is designed for","choices":["Self-employed individuals such as sole proprietors and partners","Employees of public schools","Corporations with more than 100 employees","Federal government workers"],"answer":0,"why":"Keogh plans are qualified plans for the self-employed and their eligible employees."},{"q":"In a Simplified Employee Pension (SEP), contributions are made","choices":["By employees through payroll only","Into a pooled pension trust","Into a life insurance policy","By the employer into each employee's IRA"],"answer":3,"why":"A SEP is funded by the employer using IRAs set up for each eligible employee."},{"q":"A SIMPLE plan is available to an employer that has no other qualified plan and has no more than how many employees?","choices":["25","100","250","500"],"answer":1,"why":"SIMPLE plans are limited to employers with 100 or fewer employees."},{"q":"Which of the following counts as earned income for making an IRA contribution?","choices":["Stock dividends","Social Security benefits","Wages from a job","Pension payments"],"answer":2,"why":"IRA contributions require earned income such as wages or self-employment income."},{"q":"Which statement about a Roth IRA is correct?","choices":["Contributions are not deductible, and qualified distributions are tax free","Contributions are fully deductible","The owner must begin minimum distributions at the required age","Anyone may contribute regardless of income"],"answer":0,"why":"Roth IRAs are funded with after-tax dollars and pay qualified distributions tax free."},{"q":"A participant receives a check from a former employer's qualified plan and wants to roll it over. How long does the participant have to complete the rollover?","choices":["30 days","45 days","90 days","60 days"],"answer":3,"why":"A rollover must be completed within 60 days to avoid being treated as a taxable distribution."},{"q":"When an employer's qualified plan pays an eligible rollover distribution directly to the participant, the plan must withhold","choices":["10 percent","20 percent","25 percent","Nothing"],"answer":1,"why":"Mandatory 20 percent federal withholding applies unless the money moves by direct transfer."},{"q":"A 45-year-old who is not disabled withdraws money from a traditional IRA to buy a car. In addition to income tax, what penalty applies?","choices":["6 percent","20 percent","10 percent","No penalty"],"answer":2,"why":"Withdrawals before age 59 1/2 that do not meet an exception are subject to a 10 percent penalty tax."},{"q":"Which of the following is an exception to the early withdrawal penalty?","choices":["Total and permanent disability of the owner","Purchase of a vacation home","Paying off credit card debt","A change of employers"],"answer":0,"why":"Death and disability of the owner are among the listed exceptions to the 10 percent penalty."},{"q":"Under current federal law, the owner of a traditional IRA must begin required minimum distributions at what age?","choices":["59 1/2","65","70 1/2","73"],"answer":3,"why":"The current starting age for required minimum distributions is 73."}]},{"id":"ch12","num":12,"title":"Social Security","intro":{"hook":["Look at any pay stub and you will find a deduction that most workers never think about. It quietly leaves every paycheck for forty years or more. That deduction buys something very real: a monthly income if the worker retires, becomes severely disabled, or dies an
