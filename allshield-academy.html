h changes effective January 1."},{"q":"How long is the Initial Enrollment Period for someone qualifying by age?","choices":["Three months","Six months","Twelve months","Seven months"],"answer":3,"why":"It covers the three months before the 65th birthday month, the birthday month, and the three months after."}]}]};

var INTRO={id:"intro",title:"Course Introduction: Life and Health Exam Prep",sections:[
 {title:"Welcome to Allshield Academy",blocks:[
  {type:"p",text:"Welcome. This course prepares you for the Texas Life, Accident and Health state exam. It is built as one straight path so you always know your next step."},
  {type:"flow",nodes:["Read the chapter","Pass the chapter exam","Prep Review","Simulated exams","State exam"],caption:"How the course moves"},
  {type:"h",text:"How each chapter works"},
  {type:"list",items:["Introduction: what the chapter covers and what you will be able to do afterward","Ava's intro video: a short spoken overview","Keywords: the terms to know before you read","Sections: short readings with diagrams and an Exam Tip in every one","Chapter summary: a recap, Ava's summary video and review notes tied to each objective","Chapter exam: 20 questions, taken right after the chapter"]},
  {type:"tip",text:"Lessons must be taken in order. Each chapter exam opens the next chapter."}]},
 {title:"Your Tools",blocks:[
  {type:"p",text:"<b>Ava</b> is your instructor. Her button is at the top of every lesson page. Ask her to explain a term, give you an exam tip, or quiz you on the chapter you are in."},
  {type:"p",text:"The <b>Menu</b> at the top of a lesson lists every section so you can jump back to anything you have already opened. The progress bar shows how far you are through the lesson."},
  {type:"p",text:"On the course page you will also find the <b>Study Guide</b> (every keyword in the course) and the <b>Review Notes</b> (the key points for every chapter, ready to print)."},
  {type:"h",text:"After the chapters"},
  {type:"list",items:["Final exam: opens when every chapter and chapter exam is complete","Prep Review: ten reviews organized the way the state exam outline is organized, each with its own review exam","Simulated exams: test-taking tips, then 200-question, 150-question and a timed 125-question exam","Survey: optional feedback at the end"]},
  {type:"tip",text:"Your progress saves on this device. Use the same device and browser each time you study."}]}
]};
var TIPS={id:"tips",title:"Test Taking Tips and Strategies",sections:[
 {title:"Before Exam Day",blocks:[
  {type:"list",items:["Schedule the exam while the material is fresh, ideally within a week or two of finishing the simulators","Score consistently above the passing mark on the simulators before you book","Re-read the review notes for your two weakest chapters the day before, then stop studying and sleep","Check the candidate handbook for the ID you must bring and the check-in time"]},
  {type:"tip",text:"Aim for simulator scores well above passing, so exam-day nerves still leave you a margin."}]},
 {title:"During the Exam",blocks:[
  {type:"list",items:["Read the last sentence of the question first so you know what is being asked","Watch for the words EXCEPT, NOT, ALWAYS and NEVER","Answer every question; an unanswered question is always wrong","Eliminate the two weakest choices, then choose between the remaining two","Flag hard questions and come back; a later question often jogs your memory","Do not change an answer unless you find a clear reason"]},
  {type:"flow",nodes:["Read the question","Eliminate two","Choose","Flag if unsure","Review flagged"],caption:"A repeatable routine for every question"},
  {type:"tip",text:"Pace yourself: divide your time by the number of questions and check the clock at the quarter marks."}]},
 {title:"Using the Simulators",blocks:[
  {type:"p",text:"The simulators draw questions from every chapter. Take the 200-question exam first without worrying about time, review every missed question, then move to the 150-question exam. The last simulator is 125 questions on a timer so you can practice pacing."},
  {type:"tip",text:"A missed question is a study assignment: read its explanation, then re-read that chapter's review notes."}]}

  function closeMenu(){var d=$(".dd",ov);if(d)d.remove();$("[data-menu]",ov).setAttribute("aria-expanded","false")}
  function menu(){if($(".dd",ov))return closeMenu();var h="",g=null;P.forEach(function(p,k){if(p.g!==g){g=p.g;h+='<b>'+esc(g)+'</b>'}h+='<button data-go="'+k+'" class="'+(k===i?"on":"")+'">'+esc(p.t)+'</button>'});
    var d=document.createElement("div");d.className="dd";d.innerHTML=h;$(".menu",ov).appendChild(d);$("[data-menu]",ov).setAttribute("aria-expanded","true")}
  function exit(){stopSpeak();closeAva();ov.remove();document.removeEventListener("keydown",key);home()}
  function key(e){if(e.key==="Escape"){if($(".dd",ov))closeMenu();else if(AVA)closeAva()}}
  document.addEventListener("keydown",key);
  ov.addEventListener("click",function(e){var t=e.target;
    if(t.closest("[data-next]")){if(i===P.length-1)exit();else{i++;draw()}}
    else if(t.closest("[data-prev]")){if(i>0){i--;draw()}}
    else if(t.closest("[data-exit]"))exit();
    else if(t.closest("[data-menu]"))menu();
    else if(t.closest("[data-go]")){i=+t.closest("[data-go]").dataset.go;draw()}
    else if(t.closest("[data-ava]"))toggleAva(c);
    else if(!t.closest(".menu"))closeMenu();
  });
  draw();$("[data-next]",ov).focus();
}
/* ---------- Ava video ---------- */
function videoHtml(v){
  var url=CONFIG.avaVideos[v.key];
  if(url){return /\.(mp4|webm|mov)(\?|$)/i.test(url)?'<video controls style="width:100%;border-radius:12px" src="'+esc(url)+'"></video>':'<div style="aspect-ratio:16/9"><iframe src="'+esc(url)+'" style="width:100%;height:100%;border:0;border-radius:12px" allowfullscreen title="'+esc(v.title)+'"></iframe></div>'}
  return '<div class="vid">'+WORD+'<h4>'+esc(v.title)+'</h4><div class="sub">'+esc(v.sub)+' with Ava</div><div class="capn" aria-live="polite" hidden></div><div class="ctl"><button data-play>&#9658; Play</button><div class="bar"><i style="width:0"></i></div><label style="font-size:13px">Speed <select data-rate><option value="0.85">0.85x</option><option value="1" selected>1x</option><option value="1.2">1.2x</option><option value="1.5">1.5x</option></select></label></div></div><details class="tr"><summary>Transcript</summary><p>'+esc(v.script)+'</p></details>'}
function videoWire(root,v){
  var b=$("[data-play]",root);if(!b)return;
  var ok=("speechSynthesis" in window)&&window.SpeechSynthesisUtterance,cap=$(".capn",root),bar=$(".vid .bar i",root),rate=$("[data-rate]",root);
  var parts=v.script.match(/[^.!?]+[.!?]+["')]*\s*|[^.!?]+$/g)||[v.script],k=0,on=false;
  if(!ok){b.textContent="Read transcript";b.addEventListener("click",function(){$("details.tr",root).open=true});return}
  function next(){if(!on)return;if(k>=parts.length){on=false;k=0;b.innerHTML="&#8635; Replay";bar.style.width="100%";speak=null;return}
    cap.hidden=false;cap.textContent=parts[k].trim();bar.style.width=(100*k/parts.length)+"%";
    var u=new SpeechSynthesisUtterance(parts[k]);u.rate=+rate.value;u.onend=function(){if(on){k++;next()}};u.onerror=function(){};speechSynthesis.speak(u)}
  function stop(){on=false;try{speechSynthesis.cancel()}catch(e){}b.innerHTML="&#9658; Play"}
  b.addEventListener("click",function(){if(on){stop();speak=null}else{on=true;b.innerHTML="&#10074;&#10074; Pause";speak={stop:stop};try{speechSynthesis.cancel()}catch(e){}next()}});
}
/* ---------- Ava assistant ---------- */
var AVA=null;
function closeAva(){if(AVA){AVA.remove();AVA=null}}
function toggleAva(c){if(AVA)return closeAva();
  AVA=document.createElement("div");AVA.className="ava";AVA.setAttribute("role","dialog");AVA.setAttribute("aria-label","Ava, your instructor");
  AVA.innerHTML='<div class="ah">&#10022; Ava <span style="font-weight:500;color:var(--mut);font-size:13px">your instructor</span><div style="flex:1"></div><button class="x" data-x aria-label="Close Ava">&times;</button></div><div class="al"></div><div class="q"><button class="btn sm" data-a="tip">Exam tip</button><button class="btn sm" data-a="quiz">Quiz me</button><button class="btn sm" data-a="terms">Key terms</button></div><form><input aria-label="Ask Ava about a term or topic" placeholder="Ask about a term or topic"><button class="btn pri sm">Ask</button></form>';
  document.body.appendChild(AVA);var log=$(".al",AVA);
  function say(h,u){var d=document.createElement("div");d.className="m "+(u?"u":"a");d.innerHTML=h;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
  say("Hi, I'm Ava. I can explain a term, give you an exam tip, or quiz you on <b>"+esc(c.title)+"</b>. What would you like?");
  var tips=tipsOf(c),qs=c.exam||[];
  function quiz(){if(!qs.length)return say("There is no question bank for this lesson. Try one of the chapters.");var q=qs[Math.floor(Math.random()*qs.length)];
    var d=say('<b>'+rich(q.q)+'</b>'+q.choices.map(function(x,n){return '<button class="opt" data-n="'+n+'">'+rich(x)+'</button>'}).join(""));
    d.addEventListener("click",function(e){var o=e.target.closest(".opt");if(!o||d.dataset.d)return;d.dataset.d=1;var n=+o.dataset.n;say((n===q.answer?"<b>Correct.</b> ":"<b>Not quite.</b> The answer is: "+rich(q.choices[q.answer])+". ")+rich(q.why))})}
  function answer(t){if(window.__asTutor){var wait=say("<i>Ava is thinking…</i>");return window.__asTutor(t,c,function(html){wait.innerHTML=html;log.scrollTop=log.scrollHeight},function(){wait.remove();answerLocal(t)})}answerLocal(t)}
  function answerLocal(t){var w=t.toLowerCase().replace(/[^a-z0-9 ]/g," ").trim();if(!w)return;
    var sets=[c].concat(DATA.chapters,DATA.modules),hit=null;
    sets.some(function(s){return (s.keywords||[]).some(function(k){var kt=k.term.toLowerCase();if(w===kt||w.indexOf(kt)>=0||(w.length>3&&kt.indexOf(w)>=0)){hit={k:k,s:s};return true}})});
    if(hit)return say('<b>'+esc(hit.k.term)+':</b> '+rich(hit.k.def)+(hit.s.title?' <span style="color:var(--mut)">('+esc(hit.s.title)+')</span>':''));
    var words=w.split(/\s+/).filter(function(x){return x.length>3}),best=null,bs=0;
    sets.forEach(function(s){(s.sections||[]).forEach(function(sec){sec.blocks.forEach(function(b){var txt=b.text||(b.items&&typeof b.items[0]==="string"?b.items.join(" "):"");if(!txt)return;var lo=txt.toLowerCase(),sc=0;words.forEach(function(x){if(lo.indexOf(x)>=0)sc++});if(sc>bs){bs=sc;best={txt:txt,s:s,sec:sec}}})})});
    if(best&&bs>=Math.max(1,Math.ceil(words.length/2)))return say(rich(best.txt)+' <span style="color:var(--mut)">('+esc(best.s.title)+': '+esc(best.sec.title)+')</span>');
    say("I could not find that in the course. Try a key term such as one from this chapter's keyword list, or tap <b>Key terms</b>.")}
  AVA.addEventListener("click",function(e){var t=e.target;if(t.closest("[data-x]"))return closeAva();var a=t.closest("[data-a]");if(!a)return;a=a.dataset.a;
    if(a==="tip")say(tips.length?'<b>Exam tip:</b> '+rich(tips[Math.floor(Math.random()*tips.length)]):"No tips for this lesson yet.");
    else if(a==="quiz")quiz();
    else say((c.keywords||[]).length?"Tap a term:<br>"+c.keywords.map(function(k){return '<button class="opt" data-term="'+esc(k.term)+'">'+esc(k.term)+'</button>'}).join(""):"This lesson has no keyword list.")});
  log.addEventListener("click",function(e){var o=e.target.closest("[data-term]");if(o){say(esc(o.dataset.term),1);answer(o.dataset.term)}});
  $("form",AVA).addEventListener("submit",function(e){e.preventDefault();var inp=$("input",AVA),v=inp.value.trim();if(!v)return;say(esc(v),1);inp.value="";answer(v)});
  $("input",AVA).focus();
}
/* ---------- exam engine ---------- */
function exam(it){
  var R=S.run[it.id];
  if(!R){R={keys:shuffle(it.keys).slice(0,it.n),ans:{},flag:{},i:0,left:it.time*60};S.run[it.id]=R;save()}
  var ov=document.createElement("div");ov.className="ov";ov.setAttribute("role","dialog");ov.setAttribute("aria-label",it.title);
  ov.innerHTML='<div class="hd">'+LOGO+'<b style="flex:1;min-width:160px">'+esc(it.title)+'</b><span class="timer"></span><button class="x" data-exit aria-label="Save and close exam">&times;</button></div><div class="bd"><div class="in"></div></div><div class="ft"><div class="ti">Passing score: '+CONFIG.passPercent+'%. Your answers save as you go.</div><button class="btn" data-prev>Previous</button><button class="btn" data-flag>Flag</button><button class="btn" data-next>Next</button><button class="btn pri" data-sub>Submit exam</button></div>';
  document.body.appendChild(ov);var tm=null;
  function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x}
  if(it.time){tm=setInterval(function(){R.left--;if(R.left%15===0)save();$(".timer",ov).textContent="Time left "+fmt(Math.max(0,R.left));if(R.left<=0)finish()},1000);$(".timer",ov).textContent="Time left "+fmt(R.left)}
  function draw(){var o=qOf(R.keys[R.i]),q=o.q,a=R.ans[R.i];
    var h='<div class="qn">QUESTION '+(R.i+1)+' OF '+R.keys.length+'</div><fieldset style="border:0;padding:0;margin:0"><legend class="qt">'+rich(q.q)+'</legend>'+q.choices.map(function(x,n){return '<label class="ch'+(a===n?" sel":"")+'"><input type="radio" name="q" value="'+n+'"'+(a===n?" checked":"")+'><span>'+rich(x)+'</span></label>'}).join("")+'</fieldset>';
    h+='<div class="grid" aria-label="Question navigator">'+R.keys.map(function(_,n){return '<button data-q="'+n+'" class="'+(R.ans[n]!=null?"ans ":"")+(R.flag[n]?"flag ":"")+(n===R.i?"on":"")+'" aria-label="Question '+(n+1)+(R.ans[n]!=null?", answered":"")+(R.flag[n]?", flagged":"")+'">'+(n+1)+'</button>'}).join("")+'</div>';
    $(".in",ov).innerHTML=h;$("[data-prev]",ov).disabled=R.i===0;$("[data-next]",ov).disabled=R.i===R.keys.length-1;$("[data-flag]",ov).textContent=R.flag[R.i]?"Unflag":"Flag";$(".bd",ov).scrollTop=0}
  function close(){clearInterval(tm);save();ov.remove();home()}
  function finish(){clearInterval(tm);var right=0;R.keys.forEach(function(k,n){if(R.ans[n]===qOf(k).q.answer)right++});
    var pct=Math.round(100*right/R.keys.length),pass=pct>=CONFIG.passPercent,sc=S.scores[it.id]||{best:0,tries:0};sc.tries++;sc.best=Math.max(sc.best,pct);sc.last=pct;S.scores[it.id]=sc;
    if(pass||!CONFIG.requirePassToUnlock)S.done[it.id]=true;delete S.run[it.id];save();
    var byc={};R.keys.forEach(function(k,n){var o=qOf(k),b=byc[o.c.id]||(byc[o.c.id]={c:o.c,r:0,t:0});b.t++;if(R.ans[n]===o.q.answer)b.r++});
    var h='<h2 class="ph">Results</h2><div class="score '+(pass?"pass":"fail")+'">'+pct+'%</div><p><b>'+(pass?"Passed.":"Not passed yet.")+'</b> '+right+' of '+R.keys.length+' correct. Passing score is '+CONFIG.passPercent+'%.'+(pass?"":" Review the explanations below, then retake the exam.")+'</p>';
    var bl=Object.keys(byc);if(bl.length>1){h+='<h3>Score by chapter</h3><div class="tw"><table><thead><tr><th>Chapter</th><th>Correct</th><th>Score</th></tr></thead><tbody>'+bl.map(function(k){var b=byc[k];return '<tr><td>'+b.c.num+'. '+esc(b.c.title)+'</td><td>'+b.r+' of '+b.t+'</td><td>'+Math.round(100*b.r/b.t)+'%</td></tr>'}).join("")+'</tbody></table></div>'}
    h+='<h3>Answer review</h3>'+R.keys.map(function(k,n){var q=qOf(k).q,a=R.ans[n];return '<div class="rv"><div class="qn">QUESTION '+(n+1)+' · '+(a===q.answer?'<span class="pass">Correct</span>':a==null?'<span class="fail">Not answered</span>':'<span class="fail">Incorrect</span>')+'</div><p><b>'+rich(q.q)+'</b></p>'+q.choices.map(function(x,m){return '<div class="ch '+(m===q.answer?"right":m===a?"wrong":"")+'" style="cursor:default">'+(m===q.answer?"&#10003; ":m===a?"&#10007; ":"")+rich(x)+'</div>'}).join("")+'<div class="why">'+rich(q.why)+'</div></div>'}).join("");
    $(".in",ov).innerHTML=h;$(".timer",ov).textContent="";$(".ft",ov).innerHTML='<div class="ti">'+esc(it.title)+'</div><button class="btn" data-retake>Retake</button><button class="btn pri" data-exit>Exit</button>';$(".bd",ov).scrollTop=0}
  ov.addEventListener("change",function(e){if(e.target.name==="q"){R.ans[R.i]=+e.target.value;save();draw();var c=$('input[name=q]:checked',ov);if(c)c.focus()}});
  ov.addEventListener("click",function(e){var t=e.target;
    if(t.closest("[data-exit]"))close();
    else if(t.closest("[data-retake]")){clearInterval(tm);ov.remove();exam(it)}
    else if(t.closest("[data-prev]")){if(R.i>0){R.i--;draw()}}
    else if(t.closest("[data-next]")){if(R.i<R.keys.length-1){R.i++;draw()}}
    else if(t.closest("[data-flag]")){R.flag[R.i]=!R.flag[R.i];save();draw()}
    else if(t.closest("[data-q]")){R.i=+t.closest("[data-q]").dataset.q;draw()}
    else if(t.closest("[data-sub]")){var un=R.keys.length-Object.keys(R.ans).length;if(un===0||window.confirm(un+" question"+(un>1?"s are":" is")+" unanswered. Submit anyway?"))finish()}
  });
  draw();
}
window.__academy={S:function(){return S},reset:function(){S={done:{},scores:{},pos:{},run:{},survey:null,track:"prep",tab:{}};save();home()},items:ITEMS};
home();
})();
