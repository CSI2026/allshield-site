"Information that can identify a person, such as name, Social Security number, date of birth or income."},{"term":"Prior express written consent","def":"Signed written agreement to receive marketing calls or texts made with an autodialer or a recorded or artificial voice."},{"term":"Rebating","def":"Offering something of value not stated in the policy as an inducement to buy insurance."},{"term":"Rescind","def":"To withdraw consent that was previously given."},{"term":"TCPA","def":"The Telephone Consumer Protection Act, the federal law governing telemarketing calls and texts."},{"term":"Twisting","def":"Using misrepresentation to persuade someone to drop or replace existing coverage."},{"term":"Unauthorized plan switching","def":"Changing a consumer's enrollment or agent of record without the consumer's knowledge and consent."}],"sections":[{"title":"Consent Before You Act","blocks":[{"type":"p","text":"Federal Marketplace rules require an agent to obtain a consumer's <b>consent<\/b> before helping them with a Marketplace application or enrollment, and to keep documentation of it. That includes searching for an existing application. The order is fixed: consent first, then access. A record created after the fact does not meet the rule."},{"type":"p","text":"The consumer, or their authorized representative, has to take an action that shows agreement. Rules allow different forms, such as a signed document, an email or text reply, or a recorded phone conversation. The method AllShield uses and where the record is stored: [AllShield to confirm]."},{"type":"h","text":"What the consent record must show"},{"type":"list","items":["The name of the consumer, or of the authorized representative giving consent","The date consent was given","The name of the agent, broker or agency receiving the consent","A description of what the consent covers: its scope, its purpose and how long it lasts","How the consumer can <b>rescind<\/b> the consent"]},{"type":"p","text":"A second, separate record is also required. Before the eligibility application is submitted, the consumer must review the information in it and confirm it is accurate. This <b>application review documentation<\/b> must show the date of the review, the consumer's name, the agent's name, and an explanation of the attestations the consumer makes at the end of the application."},{"type":"p","text":"Both records must be kept for a minimum of ten years and produced if CMS asks for them. An agent who cannot produce them is treated as not having obtained them."},{"type":"flow","nodes":["Explain your role","Consumer gives consent","Record it","Assist with application","Consumer reviews and confirms"],"caption":"Consent is documented before any work begins, and the review is documented before submission."},{"type":"p","text":"Consent is specific. It covers the purposes described in it and nothing more, and the consumer can withdraw it. Permission given to one agent is not permission for another agent or agency, and a lead form bought from a vendor is not, by itself, the consumer's consent to you."},{"type":"example","text":"A caller gives a name and date of birth and asks whether they already have a plan. Before searching the Marketplace, the agent explains the consent, obtains it in the agency's approved way, and saves the record. Only then does the agent look."},{"type":"tip","text":"Consent must be obtained and documented before the agent assists, and both consent and application review records are kept for at least ten years."}]},{"title":"Accurate Information and No Unauthorized Changes","blocks":[{"type":"p","text":"The eligibility application decides how much taxpayer-funded help a household receives. The information in it must be the consumer's own, and it must be true. The agent's duty is to enter what the consumer reports, to explain the questions clearly, and to give the consumer the chance to check the result."},{"type":"h","text":"Income and household"},{"type":"list","items":["Enter the household's honest projection of income for the coverage year.","Never suggest a number, round a figure toward a threshold, or coach a consumer toward the amount that produces the best subsidy.","Include every member of the tax household, and no one who does not belong in it.","Use the consumer's real address, email and phone number, never the agent's or the agency's.","Never create an application with made-up or placeholder identity details."]},{"type":"p","text":"Inflating or shrinking income hurts the consumer directly. Advance tax credits based on a false number are reconciled on the tax return, and the household may owe the money back. For the agent, providing false information to the Marketplace can lead to civil money penalties, termination of the Marketplace agreement, loss of license and referral for prosecution."},{"type":"h","text":"Unauthorized enrollments and plan switching"},{"type":"p","text":"<b>Unauthorized plan switching<\/b> means changing a person's plan, or replacing the agent listed on their enrollment, without their knowledge and consent. Enrolling someone who never asked to be enrolled is the same offense. Consumers harmed this way can lose their doctors, restart their deductible and face tax bills for credits they did not know about."},{"type":"p","text":"CMS treats this as a top enforcement priority. It monitors for patterns, can suspend an agent's access to Marketplace systems while it investigates, and has put system controls in place so that an agent who is not already associated with a consumer's enrollment cannot simply change it. In those situations the change is typically made with the consumer on the line with the Marketplace."},{"type":"table","head":["Situation","Right action"],"rows":[["Consumer asks about switching plans","Document consent, compare honestly, change only what the consumer approves"],["Consumer already has another agent","Explain what changing agents means; proceed only if the consumer chooses to"],["A lead list shows the person has coverage","Do not open or alter the application without that person's documented consent"],["You are unsure the caller is the consumer","Stop and verify identity or authority before going further"]]},{"type":"tip","text":"An agent enters only information the consumer provides and makes only changes the consumer has approved."}]},{"title":"Phone, Text and Do-Not-Call Rules","blocks":[{"type":"p","text":"The <b>TCPA<\/b> is the federal law that governs telemarketing calls and text messages. Violations carry penalties counted per call or per text, so a careless campaign can become very expensive. Texas has its own telephone solicitation laws on top of the federal ones, and whichever rule is stricter is the one to follow."},{"type":"h","text":"Core federal rules"},{"type":"list","items":["Do not make telemarketing calls to numbers on the national <b>Do-Not-Call Registry<\/b> unless an exception applies, such as the person's written permission.","Telemarketing calls to homes may be made only between 8 a.m. and 9 p.m. in the time zone of the person being called.","Keep an <b>internal do-not-call list<\/b>. When someone asks not to be called again, add them and honor it, even if they are not on the national registry.","At the start of a call, give your name, the business you are calling for, and a phone number or address where it can be reached.","Do not block or falsify caller ID."]},{"type":"h","text":"Autodialers, recorded voices and texts"},{"type":"p","text":"Marketing calls or texts sent to a cell phone using an automatic dialing system, and calls using a prerecorded or artificial voice, require the person's <b>prior express written consent<\/b>. That consent must be clear about what the person is agreeing to receive and from whom, and agreeing cannot be made a condition of buying anything. Text messages are treated as calls under the law."},{"type":"p","text":"Purchased leads deserve extra caution. A vendor's assurance that a lead opted in is not proof. Ask for the consent record, check that it names the seller making the call, and scrub the numbers against the national registry and the internal list before dialing. AllShield's approved lead sources, dialing tools and scrubbing procedure: [AllShield to confirm]."},{"type":"p","text":"Keep one more distinction in mind. Permission to call someone is not permission to work on their Marketplace application. TCPA consent covers the contact. Marketplace consent, from the first section, covers the assistance. You need each one for its own purpose."},{"type":"example","text":"During a call, a man says, please stop calling me. The agent apologizes, ends the call politely and adds the number to the internal do-not-call list the same day. The number is not dialed again, even though the lead vendor shows an opt-in on file."},{"type":"tip","text":"A request to stop calling must be honored through the company's internal do-not-call list, whether or not the number is on the national registry."}]},{"title":"Privacy, Safeguards and Record Keeping","blocks":[{"type":"p","text":"Customers hand you some of the most sensitive facts about their lives: Social Security numbers, birth dates, income, immigration documents and health details. This is <b>personally identifiable information<\/b>, often shortened to PII. The privacy and security agreement you sign with CMS at registration, along with federal and Texas privacy laws, limits what you may do with it."},{"type":"h","text":"Ground rules for PII"},{"type":"list","items":["Collect only what is needed for the task the consumer has agreed to.","Use it only for that purpose. Marketplace information may not be reused for unrelated marketing without permission.","Share it only with those who need it to complete the consumer's request.","Never share your Marketplace or carrier login, and never use anyone else's.","Report a suspected loss or breach right away through the agency's procedure: [AllShield to confirm]."]},{"type":"h","text":"Everyday safeguards"},{"type":"list","items":["Lock your screen whenever you step away, and keep screens out of public view.","Use strong, unique passwords and multi-factor authentication.","Do not send Social Security numbers or full applications through ordinary unencrypted email or text.","Do not keep customer data on personal devices or in personal accounts unless the agency has approved it.","Keep paper to a minimum, lock it up, and shred it when the retention period ends.","Take calls where other people cannot overhear."]},{"type":"h","text":"Record keeping"},{"type":"p","text":"Good records protect the consumer and protect you. If a complaint arrives two years from now, your notes and saved documents are your evidence of what was said and agreed."},{"type":"table","head":["Record","Why keep it"],"rows":[["Marketplace consent documentation","Required by federal rule; minimum ten years"],["Application review documentation","Required by federal rule; minimum ten years"],["Consent to call or text","Proof of permission if a TCPA complaint is made"],["Notes on needs, plans compared and the reason for the recommendation","Shows the advice fit the customer"],["Do-not-call requests","Shows the request was honored"]]},{"type":"p","text":"Carriers and the state set retention requirements of their own for applications and marketing materials. Where AllShield stores records and how long each type is kept beyond the federal minimum: [AllShield to confirm]."},{"type":"flow","nodes":["Collect only what is needed","Use for the agreed purpose","Store securely","Retain as required","Dispose securely"],"caption":"The life cycle of a customer's personal information."},{"type":"tip","text":"Consumer information gathered for Marketplace assistance may be used only for the purposes the consumer has agreed to."}]},{"title":"Honest Marketing and Unfair Trade Practices","blocks":[{"type":"p","text":"Everything you say or publish about insurance, including a social media post, a flyer, a text or a phone script, counts as marketing and must be truthful and not misleading. Advertising should make clear that it is about insurance and who it comes from."},{"type":"h","text":"Marketing that crosses the line"},{"type":"list","items":["Promising free money, cash cards or a government check to get someone to enroll","Saying a plan is free without explaining that the amount depends on eligibility and that cost sharing applies","Suggesting you work for, or are endorsed by, the government or HealthCare.gov","Using official-looking seals, names or web addresses that could confuse consumers","Inventing deadlines or claiming limited availability that does not exist","Leaving out a material fact, such as a narrow network, that would change the customer's decision"]},{"type":"p","text":"The Texas Insurance Code prohibits a set of <b>unfair trade practices<\/b>. You will see them on the licensing exam, and you will be held to them in the field."},{"type":"table","head":["Practice","What it means"],"rows":[["Misrepresentation","A false or misleading statement about a policy's benefits, terms or cost"],["False advertising","Untrue, deceptive or misleading statements in any advertisement"],["Twisting","Misrepresenting facts to get someone to drop or replace existing coverage"],["Rebating","Offering something of value not stated in the policy as an inducement to buy"],["Defamation","False statements that damage the reputation of an insurer or another agent"],["Unfair discrimination","Treating people in the same risk class differently in rates or benefits without a lawful basis"]]},{"type":"p","text":"Rules on gifts and inducements are detailed, and they differ between product lines. Do not offer a gift, a giveaway or a referral reward tied to a sale until the agency has approved it: [AllShield to confirm]."},{"type":"p","text":"Ethics goes further than the rule book. Put the customer's interest ahead of your own, speak accurately about competitors, admit what you do not know, and correct your own mistakes quickly. When something feels wrong, stop and ask before acting. The Texas Department of Insurance can fine an agent or suspend or revoke a license, and CMS can end an agent's Marketplace agreement. Asking a question first is always cheaper."},{"type":"tip","text":"Twisting involves misrepresentation to induce a replacement of coverage, while rebating involves an inducement not specified in the policy."}]}],"summary":{"recap":["Consent comes before assistance. The record must show who gave it, when, to whom, what it covers and for how long, and how it can be rescinded.","Before submission, the consumer reviews the application and confirms it is accurate. Both that record and the consent record are kept for at least ten years.","Income and household information must be the consumer's own honest figures. Enrolling or switching anyone without their knowledge and consent is prohibited and heavily enforced.","Telemarketing must respect the national Do-Not-Call Registry, an internal do-not-call list, calling hours and caller identification. Autodialed or recorded marketing calls and texts need prior express written consent.","Personal information is collected only as needed, used only for the agreed purpose, protected with everyday safeguards and retained as required.","Marketing must be truthful. Texas prohibits misrepresentation, false advertising, twisting, rebating, defamation and unfair discrimination."],"avaSummary":"Let us recap this module, because these rules will follow you every day of your career. First, consent. Before you search for, open or work on a Marketplace application, the consumer must give you permission, and you must document it. The record shows who gave consent, the date, your name, what the consent covers and for how long, and how they can take it back. Second, before you submit the application, the consumer reviews it and confirms it is accurate, and you document that too. Keep both records for at least ten years. Third, accuracy. You enter the income and household information the consumer gives you, and you never steer a number. You never enroll someone or change their plan without their knowledge and approval. Regulators watch for this closely. Fourth, the phone. Check the national Do-Not-Call Registry, keep an internal list, call only during permitted hours, identify yourself, and get written consent before any autodialed or recorded marketing call or text. Remember that permission to call is not permission to enroll. Fifth, privacy. Collect only what you need, use it only for what the customer agreed to, lock it down, and report any loss immediately. Finally, tell the truth in your marketing. No promises of free money, no pretending to be the government, no made-up deadlines. Know the unfair trade practices: misrepresentation, false advertising, twisting, rebating, defamation and unfair discrimination. And when you are unsure, stop and ask. That one habit will protect you more than anything else I can teach.","reviewNotes":[{"objective":"Explain the consent and application review documentation required before assisting a Marketplace consumer","concepts":["Consent is obtained and documented before any assistance, including searching for an application.","The record shows consumer name, date, agent name, scope, purpose, duration and how to rescind.","A separate record shows the consumer reviewed and confirmed the application before submission.","Both are retained at least ten years and produced on request."],"terms":[{"term":"Consent","def":"Permission given before the agent acts."},{"term":"Rescind","def":"To withdraw consent previously given."}]},{"objective":"Describe the agent's duty to enter accurate income and household information","concepts":["Enter the consumer's honest projection of coverage-year income.","Never coach toward a subsidy threshold.","List the true tax household.","Use the consumer's own contact details."],"terms":[{"term":"Application review documentation","def":"Proof the consumer confirmed the application's accuracy."}]},{"objective":"Recognize unauthorized enrollments and plan switching as prohibited conduct","concepts":["Changing a plan or agent of record without consent is prohibited.","Enrolling someone who did not ask is the same offense.","Consumers can lose doctors, restart deductibles and owe taxes.","CMS can suspend system access and terminate agreements; the state can act on the license."],"terms":[{"term":"Unauthorized plan switching","def":"Changing an enrollment or agent of record without the consumer's knowledge and consent."}]},{"objective":"Apply basic TCPA and Do-Not-Call rules to phone and text outreach","concepts":["Scrub against the national registry and the internal list.","Call only between 8 a.m. and 9 p.m. in the called person's time zone.","Identify yourself and the business; do not falsify caller ID.","Autodialed or recorded marketing calls and texts need prior express written consent.","Texas adds its own rules; follow the stricter one."],"terms":[{"term":"TCPA","def":"Federal law governing telemarketing calls and texts."},{"term":"Internal do-not-call list","def":"A company's own list of people who asked not to be called."}]},{"objective":"Describe how to safeguard personal information and keep required records","concepts":["Collect the minimum, use it only for the agreed purpose, share only as needed.","Never share logins.","Lock screens, use strong passwords and avoid unencrypted channels for sensitive data.","Keep consent, review, call-permission and needs records.","Report suspected breaches immediately."],"terms":[{"term":"Personally identifiable information","def":"Information that can identify a person."}]},{"objective":"Identify dishonest marketing and unfair trade practices","concepts":["No promises of free money or implied government endorsement.","No invented deadlines or omitted material facts.","Twisting uses misrepresentation to induce replacement.","Rebating offers an inducement not in the policy.","Penalties include fines and license suspension or revocation."],"terms":[{"term":"Misrepresentation","def":"A false or misleading statement about a policy."},{"term":"Twisting","def":"Misrepresentation used to induce a replacement of coverage."},{"term":"Rebating","def":"An inducement to buy that is not stated in the policy."}]}]},"exam":[{"q":"When must an agent obtain and document a consumer's consent for Marketplace assistance?","choices":["Before assisting, including before searching for an existing application","After the enrollment is submitted","Only if the consumer asks for a copy","Within ten days of the first premium"],"answer":0,"why":"Consent must come first. Documentation created after the work is done does not satisfy the rule."},{"q":"Which item must appear in the consent documentation?","choices":["The consumer's Social Security number","The plan's deductible","A description of the scope, purpose and duration of the consent","The agent's commission rate"],"answer":2,"why":"The record must describe what the consent covers and how long it lasts, along with names, date and how to rescind."},{"q":"For how long must Marketplace consent and application review documentation be kept?","choices":["One year","At least ten years","Until the plan year ends","Three years"],"answer":1,"why":"Federal rules require these records to be maintained for a minimum of ten years."},{"q":"A consumer is unsure of next year's income. What should the agent do?","choices":["Enter the amount that gives the largest tax credit","Enter last year's income without asking","Leave the field blank","Help the consumer make an honest, reasonable estimate and enter that"],"answer":3,"why":"The figure must be the consumer's own good-faith projection; the agent may explain but never steer the number."},{"q":"Changing a consumer's Marketplace plan without their knowledge is:","choices":["Allowed if the new plan is cheaper","Prohibited unauthorized plan switching","Allowed during open enrollment","Allowed if the agent bought the lead"],"answer":1,"why":"Any plan change requires the consumer's knowledge and consent, regardless of the agent's reason."},{"q":"Whose email address and phone number belong on a consumer's Marketplace application?","choices":["The consumer's own","The agent's","The agency's","The lead vendor's"],"answer":0,"why":"Applications must carry the consumer's own contact information so notices reach the consumer."},{"q":"Under federal telemarketing rules, calls to a home may be made only during which hours?","choices":["7 a.m. to 10 p.m. in the caller's time zone","9 a.m. to 5 p.m. on weekdays","8 a.m. to 9 p.m. in the called person's time zone","Any time if the number is not on a list"],"answer":2,"why":"The permitted window is 8 a.m. to 9 p.m. local time for the person being called."},{"q":"A person not on the national registry asks an agent to stop calling. What is required?","choices":["Nothing, since they are not on the national registry","Call back in thirty days","Ask them to register online first","Add them to the internal do-not-call list and stop calling"],"answer":3,"why":"Company-specific requests must be honored through the internal do-not-call list."},{"q":"Marketing texts sent with an automatic dialing system require:","choices":["Nothing, because texts are not calls","Prior express written consent","Only a verbal opt-in","Approval from the carrier"],"answer":1,"why":"Texts are treated as calls, and autodialed marketing messages require prior express written consent."},{"q":"Which is an appropriate way to handle a customer's Social Security number?","choices":["Use it only for the agreed purpose and store it in the agency's approved secure system","Text it to a coworker for safekeeping","Keep it in a personal notes app","Send it in ordinary email to yourself"],"answer":0,"why":"PII must be used only for the agreed purpose and protected with approved safeguards."},{"q":"An agent tells a client false things about their current policy to get them to replace it. This is:","choices":["Rebating","Defamation only","Twisting","Unfair discrimination"],"answer":2,"why":"Twisting is misrepresentation used to induce someone to drop or replace existing coverage."},{"q":"Which advertisement is acceptable?","choices":["Enroll today and receive a free cash card from the government","Official HealthCare.gov agent office","Only three plans left, call in the next hour","Licensed insurance agent offering help comparing Marketplace plans; savings depend on eligibility"],"answer":3,"why":"It is truthful, identifies the advertiser as an insurance agent and does not promise results or imply government endorsement."}]},{"id":"as05","num":5,"title":"Life Insurance Sales Basics","intro":{"hook":["Health insurance answers the question, what if I get sick? Life insurance answers a harder one: what happens to the people who depend on me if I am not here? Most families know they should have an answer and keep putting it off.","This module introduces life insurance sales. You will learn how to work out how much coverage a family needs, how to explain term and permanent insurance in plain words, what suitability means, how to take an application properly, how to deliver a policy, and when to be careful about replacing existing coverage.","Life insurance is a promise that may not be tested for decades. Mistakes made on the day of the application can surface at the worst possible moment, when a family files a claim. Doing it right is the whole job."],"objectives":["Conduct a basic life insurance needs analysis","Explain term and permanent life insurance in plain words","Apply suitability principles when recommending coverage","Follow best practices for the application and field underwriting","Describe proper policy delivery and the purpose of the free-look period","Recognize the cautions that apply when replacing existing coverage"],"avaIntro":"Welcome to module five. I am Ava, and today we move from health insurance to life insurance. The products are different, but the approach is the same one you already know: ask first, recommend second. I will show you a simple way to estimate how much coverage a family needs. Then I will explain term insurance and permanent insurance in everyday language, so you can help someone choose between them without drowning them in jargon. We will talk about suitability, which means the recommendation has to fit the person. After that we will go through the application, where you act as the company's eyes and ears, and the delivery of the policy. We will end with replacement, because replacing a policy someone already owns can hurt them if it is done carelessly. Take your time with this one. Families will be counting on what you learn here."},"keywords":[{"term":"Beneficiary","def":"The person or entity named to receive the death benefit."},{"term":"Cash value","def":"The savings element that builds inside a permanent life insurance policy."},{"term":"Conditional receipt","def":"A receipt given when premium is paid with the application that can provide coverage before issue if stated conditions are met."},{"term":"Death benefit","def":"The amount the insurer pays when the insured person dies."},{"term":"Field underwriting","def":"The agent's role in gathering accurate information about an applicant for the insurer."},{"term":"Free-look period","def":"A set number of days after delivery during which the owner may return the policy for a refund of premium."},{"term":"Insurable interest","def":"A real stake in the insured person's continued life, required at the time of application."},{"term":"Needs analysis","def":"A structured way to estimate how much life insurance a household requires."},{"term":"Permanent life insurance","def":"Coverage designed to last for life that builds cash value."},{"term":"Replacement","def":"Buying a new policy when an existing one will be lapsed, surrendered or otherwise reduced in value."},{"term":"Suitability","def":"The requirement that a recommendation fit the customer's needs, finances and objectives."},{"term":"Term life insurance","def":"Coverage for a set period that pays only if death occurs during that period."},{"term":"Underwriting","def":"The insurer's process of evaluating a risk and deciding whether and on what terms to insure it."}],"sections":[{"title":"Needs Analysis: How Much and For How Long","blocks":[{"type":"p","text":"A life insurance recommendation begins with a <b>needs analysis<\/b>. You are answering two questions: how much money would this family need if the insured person died, and for how many years will that need exist?"},{"type":"p","text":"One easy framework groups needs into four buckets. Add them up, then subtract what the family already has."},{"type":"table","head":["Bucket","What to ask"],"rows":[["Final expenses and debts","What would it cost to pay for a funeral and clear credit cards, car loans and other debts?"],["Income replacement","How much income would the family lose, and for how many years would they need it replaced?"],["Mortgage or housing","What is owed on the home, or what would rent cost for the survivors?"],["Education and future goals","Are there children whose schooling or care should be funded?"]]},{"type":"p","text":"From that total, subtract existing resources: savings, life insurance already owned, and any coverage through an employer. What is left is the gap, and the gap is the amount to insure. Remind customers that coverage through a job usually ends when the job does."},{"type":"flow","nodes":["Add up needs","Subtract existing resources","Find the gap","Match to budget","Recommend"],"caption":"A needs analysis turns a vague worry into a specific coverage amount."},{"type":"h","text":"Discovery questions"},{"type":"list","items":["Who depends on your income or on the work you do at home?","What debts would be left behind?","What coverage do you already have, and who are the beneficiaries?","How long until your children are independent or your mortgage is paid?","What monthly amount can you commit to without strain?"]},{"type":"p","text":"Do not overlook a spouse who does not earn a paycheck. Replacing child care and household work costs real money. Also be honest when the ideal amount is more than the budget allows. A smaller policy the family can keep paying is worth more than a large one that lapses in a year."},{"type":"example","text":"A couple with two young children, a mortgage and one main income works through the four buckets and finds a large gap during the next twenty years, shrinking afterward as the children grow up and the loan is paid down. That pattern points toward coverage sized for those years."},{"type":"tip","text":"The amount of life insurance needed equals total financial needs minus the resources the family already has."}]},{"title":"Term and Permanent Insurance in Plain Words","blocks":[{"type":"p","text":"Nearly every life insurance policy is one of two kinds. The simplest way to explain the difference is with housing: term is like renting, and permanent is like owning."},{"type":"p","text":"<b>Term life insurance<\/b> covers a set period, such as ten, twenty or thirty years. If the insured dies during the term, the <b>death benefit<\/b> is paid. If the insured outlives the term, coverage ends and nothing is paid. Term builds no savings, which is why it offers the most coverage for the lowest starting premium."},{"type":"p","text":"<b>Permanent life insurance<\/b> is designed to last a lifetime as long as premiums are paid. Part of each premium goes into <b>cash value<\/b>, a savings element that grows over time and that the owner can borrow against or take if the policy is surrendered. Premiums are noticeably higher than term for the same death benefit."},{"type":"table","head":["","Term","Permanent"],"rows":[["How long it lasts","A set number of years","For life, if premiums are paid"],["Cash value","None","Builds over time"],["Starting cost","Lower","Higher"],["Good fit for","Needs that end, like a mortgage or raising children","Needs that never end, like final expenses or leaving a legacy"]]},{"type":"h","text":"Common varieties"},{"type":"list","items":["Level term: the death benefit and premium stay the same for the whole term.","Decreasing term: the death benefit falls over time, often used alongside a loan balance.","Renewable and convertible term: can be renewed at a higher premium, or exchanged for permanent coverage without new proof of health.","Whole life: fixed premium, guaranteed death benefit and guaranteed cash value growth.","Universal life: flexible premiums and an adjustable death benefit, with cash value that depends on credited interest.","Variable products: cash value invested in market accounts; these are securities and require an additional securities license to sell."]},{"type":"p","text":"Loans and withdrawals from cash value reduce what the beneficiary receives if they are not repaid, so never present cash value as free money. Riders can be added to tailor a policy, such as waiver of premium during disability or an accelerated benefit for terminal illness."},{"type":"p","text":"Neither type is better. The right answer depends on how long the need lasts and what the customer can afford. Many families use both: term for the large temporary need and a smaller permanent policy for the need that never goes away."},{"type":"tip","text":"Term insurance provides pure protection for a limited period with no cash value; whole life provides lifetime protection with guaranteed cash value."}]},{"title":"Suitability","blocks":[{"type":"p","text":"<b>Suitability<\/b> means the product you recommend has to fit the person you are recommending it to. A policy can be perfectly legal and still be the wrong choice for a particular customer."},{"type":"h","text":"What to weigh"},{"type":"list","items":["The need: its size and how long it will last","Ability to pay: can the customer keep paying this premium through good months and bad ones?","Age and family situation","Existing coverage and other assets","Objectives: protection, final expenses, leaving something behind","Understanding: can the customer explain back what they are buying?"]},{"type":"p","text":"Affordability deserves special attention. Life insurance works only if it is still in force on the day it is needed. A premium that stretches the household budget is a policy likely to lapse, and a lapsed policy leaves the family with nothing to show for the premiums paid."},{"type":"table","head":["Warning sign","Why it matters"],"rows":[["Recommending the product with the highest commission","The customer's interest must come before the agent's"],["Selling permanent coverage to someone who cannot afford enough protection","The family may be left underinsured"],["The customer cannot describe how the policy works","A person cannot consent to what they do not understand"],["Coverage amount far beyond any need shown","Raises both suitability and underwriting concerns"],["Pressure to decide immediately","Good recommendations survive a night's sleep"]]},{"type":"p","text":"Document your reasoning. Keep your needs analysis, the options you showed and why the customer chose the one they did. If the customer picks something different from your recommendation, note that too. These notes are your proof that the sale was made on the customer's needs."},{"type":"p","text":"Be especially careful with older customers and anyone who seems confused or pressured by a relative. Slow down, involve a trusted family member if the customer wishes, and walk away from a sale you cannot justify."},{"type":"p","text":"Finally, describe the policy accurately. A life insurance policy is insurance. Do not call it a savings account, a retirement plan or an investment, and never present non-guaranteed figures in an illustration as though they were promised."},{"type":"example","text":"A young father on a tight budget wants the family protected until his children are grown. A whole life policy within his budget would cover only a fraction of the need. A level term policy sized to the full need, with the option to convert later, fits his situation better."},{"type":"tip","text":"A suitable recommendation is based on the customer's needs, objectives and ability to pay, not on the agent's compensation."}]},{"title":"The Application and Field Underwriting","blocks":[{"type":"p","text":"<b>Underwriting<\/b> is how an insurer decides whether to accept a risk and at what price. The underwriter never meets the applicant. You do. That makes the agent the field underwriter: the company's first and often only direct source of information about the person applying."},{"type":"h","text":"Best practices"},{"type":"list","items":["Ask every question exactly as it is written and record the applicant's answers accurately and completely.","Never soften, skip or guess at a health question, and never advise an applicant to leave something out.","Have the applicant, and the policyowner if different, sign personally. Never sign for anyone.","If an answer is corrected, have the applicant initial the change; do not use correction fluid or overwrite it yourself.","Confirm the beneficiary by full name and relationship, and suggest a contingent beneficiary.","Tell the applicant what comes next, such as a medical exam, a phone interview or a records request.","Report anything unusual you observed in the agent's statement."]},{"type":"p","text":"Two legal ideas apply at application. The proposed insured must consent to the coverage. And the policyowner must have an <b>insurable interest<\/b> in the insured, meaning a genuine stake in that person's continued life, as a spouse, a parent or a business partner would. Insurable interest is required when the policy is applied for."},{"type":"p","text":"When the first premium is collected with the application, the applicant usually receives a <b>conditional receipt<\/b>. It can make coverage effective before the policy is issued, but only if the conditions written on it are met, typically that the applicant is found insurable as applied for. Explain those conditions clearly, and never tell an applicant they are definitely covered. Send collected premium to the insurer promptly and never mix it with your own money."},{"type":"flow","nodes":["Complete application","Signatures and premium","Insurer underwrites","Policy issued","Deliver policy"],"caption":"The path from application to an in-force policy."},{"type":"p","text":"Honest answers protect the family. Life policies contain a contestable period, generally the first two years, during which the insurer may investigate and deny a claim over a material misstatement on the application. Helping an applicant hide a health condition does not get them coverage. It gets their beneficiary a denied claim."},{"type":"tip","text":"As field underwriter, the agent's duty is to gather and report complete and accurate information to the insurer."}]},{"title":"Policy Delivery and Replacement Cautions","blocks":[{"type":"p","text":"Delivery is more than handing over a document. It is your chance to confirm the customer understands what they own, and it is where the sale either sticks or falls apart."},{"type":"h","text":"At delivery"},{"type":"list","items":["Review the policy with the owner: the death benefit, premium, beneficiaries, riders and any exclusions.","Explain any difference from what was applied for, such as a higher rate class, and get the owner's acceptance.","If the first premium was not paid with the application, collect it and obtain any required statement that the insured's health has not changed.","Obtain a signed delivery receipt where the insurer requires one.","Explain the <b>free-look period<\/b> and the date it starts."]},{"type":"p","text":"The free-look period gives the owner a set number of days after delivery to read the policy and return it for a full refund of premium if they change their mind. The length is stated in the policy. Because it begins at delivery, deliver promptly and keep proof of the delivery date."},{"type":"h","text":"Replacement"},{"type":"p","text":"<b>Replacement<\/b> happens when a new policy is purchased and an existing one will be lapsed, surrendered, borrowed against heavily or otherwise reduced in value. Replacement is not illegal, and sometimes it truly helps the customer. Because it often does not, Texas regulates it: the application asks whether existing coverage will be replaced, and when it will, the agent must give the applicant a written notice about replacement, obtain signatures and send the required information to the insurer."},{"type":"table","head":["What the customer may lose","Why"],"rows":[["A lower premium","The new policy is priced at the customer's current, older age and health"],["Protection from contest","A new contestable period and a new suicide exclusion period begin"],["Cash value","Surrender charges may apply, and early cash value in a new policy is low"],["Favorable terms","Older policies may hold guarantees or provisions no longer offered"]]},{"type":"p","text":"Compare the two policies side by side and honestly. If the old policy is better, say so and keep it in place. If replacement is appropriate, the old policy must stay in force until the new one has been issued, delivered and accepted. Cancelling first can leave a person with no coverage at all if the new application is declined."},{"type":"p","text":"Persuading someone to replace a policy by misrepresenting either one is twisting, an unfair trade practice covered in Module 4."},{"type":"tip","text":"Never cancel existing life insurance until the replacement policy is issued and in force."}]}],"summary":{"recap":["A needs analysis adds up final expenses and debts, income replacement, housing and education, then subtracts existing resources to find the coverage gap.","Term insurance protects for a set period with no cash value and a lower starting cost. Permanent insurance is built to last for life and accumulates cash value at a higher premium.","Suitability means the recommendation fits the customer's needs, objectives and ability to keep paying. Document the reasoning.","As field underwriter, the agent records complete and truthful answers, obtains personal signatures, explains the conditional receipt and forwards premium promptly.","At delivery, the agent reviews the policy, collects anything outstanding and explains the free-look period, which starts on the delivery date.","Replacement can cost the customer a lower premium, a completed contestable period and cash value. Disclose, compare honestly, and keep the old policy until the new one is in force."],"avaSummary":"Let us review life insurance basics. Everything starts with a needs analysis. You add up what a family would need, including final expenses and debts, income replacement, housing and education. Then you subtract what they already have, and what remains is the gap to insure. Next, the two main kinds of coverage. Term insurance lasts for a set number of years, has no cash value, and gives the most protection for the lowest starting premium. Permanent insurance is meant to last a lifetime and builds cash value, at a higher cost. Neither is better. The right one depends on how long the need lasts and what the family can afford to keep paying. That brings us to suitability. Your recommendation must fit the customer, not your commission, and you should keep notes that show why you made it. At the application, you are the field underwriter. Ask every question as written, record the answers truthfully, get real signatures, and explain the conditional receipt without promising coverage. Honest answers protect the family, because a misstatement can lead to a denied claim during the contestable period. At delivery, review the policy, collect anything outstanding, and explain the free-look period. Finally, be cautious with replacement. A new policy means a higher age, a new contestable period, and possibly lost cash value. Give the required notice, compare honestly, and never let the old policy end before the new one is in force. Do these things consistently and families will be able to rely on the coverage you place.","reviewNotes":[{"objective":"Conduct a basic life insurance needs analysis","concepts":["Four buckets: final expenses and debts, income replacement, housing, education and goals.","Subtract savings, existing policies and employer coverage.","The remainder is the coverage gap.","A stay-at-home spouse has economic value to replace.","An affordable policy that stays in force beats a larger one that lapses."],"terms":[{"term":"Needs analysis","def":"A structured estimate of how much life insurance a household requires."},{"term":"Death benefit","def":"The amount paid when the insured dies."}]},{"objective":"Explain term and permanent life insurance in plain words","concepts":["Term covers a set period and pays only if death occurs within it.","Permanent lasts for life if premiums are paid and builds cash value.","Convertible term can be exchanged for permanent without new proof of health.","Unpaid policy loans reduce the death benefit.","Variable products require a securities license."],"terms":[{"term":"Term life insurance","def":"Coverage for a set period with no cash value."},{"term":"Cash value","def":"The savings element inside a permanent policy."}]},{"objective":"Apply suitability principles when recommending coverage","concepts":["Weigh need, duration, ability to pay, existing coverage and objectives.","The customer should be able to explain what they are buying.","Compensation must not drive the recommendation.","Document the analysis and the reason for the choice.","Do not describe life insurance as a savings account or investment."],"terms":[{"term":"Suitability","def":"The requirement that a recommendation fit the customer's needs, finances and objectives."}]},{"objective":"Follow best practices for the application and field underwriting","concepts":["Ask questions as written and record answers accurately.","Applicants sign personally and initial any corrections.","Insurable interest is required at the time of application.","A conditional receipt provides early coverage only if its conditions are met.","Misstatements can lead to a denied claim during the contestable period."],"terms":[{"term":"Field underwriting","def":"The agent's role in gathering accurate applicant information."},{"term":"Insurable interest","def":"A real stake in the insured's continued life."},{"term":"Conditional receipt","def":"A receipt that can provide coverage before issue if stated conditions are met."}]},{"objective":"Describe proper policy delivery and the purpose of the free-look period","concepts":["Review benefit, premium, beneficiaries, riders and exclusions with the owner.","Explain any change from what was applied for.","Collect outstanding premium and any required health statement.","The free-look period starts at delivery and allows return for a full premium refund."],"terms":[{"term":"Free-look period","def":"Days after delivery during which the policy can be returned for a refund."}]},{"objective":"Recognize the cautions that apply when replacing existing coverage","concepts":["Replacement is legal but regulated; a written notice and signatures are required.","New policies are priced at current age and health.","New contestable and suicide exclusion periods begin.","Surrender charges may reduce cash value.","Keep the old policy until the new one is in force."],"terms":[{"term":"Replacement","def":"Buying a new policy when an existing one will be ended or reduced in value."}]}]},"exam":[{"q":"In a needs analysis, the recommended coverage amount is best described as:","choices":["Ten times the customer's rent","Total financial needs minus existing resources","The largest amount the insurer will issue","The amount with the lowest premium"],"answer":1,"why":"The agent adds up the family's needs and subtracts what they already have to find the gap."},{"q":"Which statement about term life insurance is true?","choices":["It builds guaranteed cash value","It always lasts for the insured's whole life","It requires a securities license to sell","It pays a death benefit only if death occurs during the stated period"],"answer":3,"why":"Term is pure protection for a limited time with no cash value."},{"q":"What mainly distinguishes permanent life insurance from term?","choices":["It is designed to last for life and builds cash value","It has no death benefit","It is always cheaper","It cannot name a beneficiary"],"answer":0,"why":"Permanent coverage is lifelong if premiums are paid and includes a cash value element."},{"q":"A young parent with a tight budget needs a large amount of coverage until the children are grown. Which is generally the most suitable starting point?","choices":["A small whole life policy covering a fraction of the need","No coverage until income rises","Level term coverage sized to the need","A variable policy for growth"],"answer":2,"why":"Term provides the most protection per premium dollar for a need that has an end date."},{"q":"Suitability requires that a recommendation be based on:","choices":["The agent's commission schedule","The customer's needs, objectives and ability to pay","The newest product available","The fastest underwriting time"],"answer":1,"why":"A suitable recommendation fits the customer's situation, not the agent's interests."},{"q":"Why is the agent called a field underwriter?","choices":["The agent decides whether to issue the policy","The agent sets the premium rate","The agent pays claims","The agent gathers and reports accurate information about the applicant to the insurer"],"answer":3,"why":"The agent is the insurer's direct source of information, while the company's underwriter makes the decision."},{"q":"An applicant gives an incorrect answer and wants to change it on a paper application. The agent should:","choices":["Have the applicant correct it and initial the change","Cover it with correction fluid","Fix it later at the office","Leave it and tell the insurer verbally"],"answer":0,"why":"Corrections must be made and initialed by the applicant so the record reflects their own answers."},{"q":"When must insurable interest exist for a life insurance policy?","choices":["Only at the time of the claim","Throughout the life of the policy","At the time of application","Only during the free-look period"],"answer":2,"why":"For life insurance, insurable interest is required when the policy is applied for."},{"q":"What does a conditional receipt do?","choices":["Guarantees coverage no matter what underwriting finds","Can provide coverage before the policy is issued if its stated conditions are met","Replaces the policy document","Waives the first premium"],"answer":1,"why":"Coverage under a conditional receipt depends on conditions such as the applicant being insurable as applied for."},{"q":"When does the free-look period begin?","choices":["When the application is signed","When the medical exam is completed","When the first claim is filed","When the policy is delivered to the owner"],"answer":3,"why":"The period starts at delivery, which is why prompt delivery and proof of the date matter."},{"q":"Which is a common disadvantage of replacing an existing life insurance policy?","choices":["A new contestable period begins","The beneficiary can no longer be changed","Premiums are based on the customer's younger age","The death benefit becomes taxable in every case"],"answer":0,"why":"A replacement policy starts new contestable and suicide exclusion periods and is priced at the current, older age."},{"q":"A customer decides to replace an old policy. When should the old policy be ended?","choices":["Before applying, to avoid paying two premiums","On the day of the medical exam","Only after the new policy is issued and in force","As soon as the application is signed"],"answer":2,"why":"Ending the old policy early could leave the customer uninsured if the new application is declined or delayed."}]},{"id":"as06","num":6,"title":"The Medicare Path","intro":{"hook":["Every day, thousands of Americans turn 65 and face a mailbox full of Medicare advertising. Many of them are making this decision for the first time, and what they choose affects their health care for years.","This module is an overview of the Medicare path. You will learn who Medicare serves, what Parts A, B, C and D are, how Medigap fits in, why you must hold AHIP and carrier certifications before selling, the main marketing rules, and when people can enroll.","Medicare is the most tightly regulated product line you will work in. The rules exist because the customers are older, often live on fixed incomes, and have been targeted by aggressive sales tactics in the past. Agents who respect those rules build long careers here."],"objectives":["Identify who is eligible for Medicare","Describe what Parts A, B, C and D cover and how Medigap fits with Original Medicare","Explain why AHIP and carrier certification are required before selling Medicare plans","Apply core CMS marketing rules, including scope of appointment and contact rules","Distinguish the main Medicare enrollment periods"],"avaIntro":"Welcome to module six. I am Ava, and this is our introduction to Medicare. AllShield starts with Marketplace health coverage, so think of this module as a look ahead at where your career can grow. I will explain who Medicare is for, and then we will take the four parts one at a time: Part A for hospital care, Part B for medical care, Part C, which is Medicare Advantage, and Part D for prescriptions. We will also cover Medigap, the supplement coverage that works alongside Original Medicare. After that, I will explain why you need AHIP certification and carrier certification before you say a word about these plans to a customer. We will go through the marketing rules, including the scope of appointment and the limits on how you may contact people. We will close with enrollment periods. Let us get started."},"keywords":[{"term":"AHIP certification","def":"Annual Medicare training and testing that carriers require before an agent sells Medicare Advantage or Part D plans."},{"term":"Annual Enrollment Period","def":"The yearly window, October 15 through December 7, to join, switch or drop Medicare Advantage and Part D plans."},{"term":"Initial Enrollment Period","def":"The seven-month window around a person's 65th birthday month to first enroll in Medicare."},{"term":"Late enrollment penalty","def":"A lasting premium surcharge for enrolling in Part B or Part D late without other qualifying coverage."},{"term":"Medicare Advantage","def":"Part C; private plans that deliver Part A and Part B benefits, often with drug coverage and extras."},{"term":"Medigap","def":"Medicare Supplement insurance sold by private companies to help pay Original Medicare's cost sharing."},{"term":"Original Medicare","def":"Part A and Part B, run directly by the federal government."},{"term":"Part A","def":"Hospital insurance covering inpatient hospital, skilled nursing facility, hospice and some home health care."},{"term":"Part B","def":"Medical insurance covering doctor visits, outpatient care, preventive services and medical equipment."},{"term":"Part D","def":"Prescription drug coverage offered through private plans."},{"term":"Scope of appointment","def":"A documented agreement, made before a sales appointment, on which plan types the beneficiary wants to discuss."},{"term":"Special Enrollment Period","def":"A window outside the regular periods, opened by certain events, to make Medicare plan changes."},{"term":"Unsolicited contact","def":"Reaching out to a Medicare beneficiary who has not given permission to be contacted."}],"sections":[{"title":"Who Medicare Serves","blocks":[{"type":"p","text":"Medicare is the federal health insurance program created in 1965. It is run by the Centers for Medicare & Medicaid Services, the same agency that oversees the Marketplace. Enrollment in Parts A and B is handled by the Social Security Administration."},{"type":"h","text":"Three ways to qualify"},{"type":"list","items":["Age: people 65 or older who are U.S. citizens or long-term lawful permanent residents","Disability: people under 65 who have received Social Security disability benefits for 24 months","Specific conditions: people of any age with end-stage renal disease, and people with ALS, who qualify as soon as their disability benefits begin"]},{"type":"p","text":"Do not confuse Medicare with Medicaid. Medicare is based on age or disability, regardless of income. Medicaid is a joint federal and state program based on financial need. Some people qualify for both and are called dual eligible; special plans and extra help exist for them."},{"type":"p","text":"People already receiving Social Security benefits when they turn 65 are generally enrolled in Parts A and B automatically. Everyone else has to sign up through Social Security. Many people are still working at 65 and covered by an employer plan, and whether they should delay Part B depends on the size of the employer and the type of coverage. That decision can trigger lifelong penalties if it is made wrong, so send those questions to Social Security or the employer's benefits office and do not guess."},{"type":"h","text":"Moving from the Marketplace to Medicare"},{"type":"p","text":"This is where your Marketplace customers and your future Medicare customers meet. Once a person is eligible for Medicare, they generally cannot receive premium tax credits for their own Marketplace coverage, and it is against the rules to sell a Marketplace plan to someone you know has Medicare. A Marketplace customer who is approaching 65 needs a reminder, well ahead of time, to enroll in Medicare and end their Marketplace plan at the right moment."},{"type":"flow","nodes":["Approaching 65","Enroll in Parts A and B","Choose a coverage path","Review each year"],"caption":"The basic journey of a person becoming eligible for Medicare by age."},{"type":"example","text":"Rosa has had a Marketplace plan through you for three years and turns 65 in the spring. In the winter you call to explain that her Medicare window is opening and that her tax credit will not continue once she is eligible for Medicare. She avoids a gap in coverage and a tax bill."},{"type":"tip","text":"Medicare eligibility is based on age, disability or specific conditions, never on income; Medicaid is the needs-based program."}]},{"title":"Parts A, B, C, D and Medigap","blocks":[{"type":"p","text":"Medicare comes in four lettered parts. Parts A and B together are called <b>Original Medicare<\/b> and are run by the federal government. Parts C and D are delivered by private companies that contract with Medicare."},{"type":"table","head":["Part","Covers","Notes"],"rows":[["A","Inpatient hospital stays, skilled nursing facility care after a hospital stay, hospice, some home health","Most people pay no premium because they or a spouse paid Medicare taxes long enough"],["B","Doctor visits, outpatient care, preventive services, durable medical equipment","Monthly premium; higher for higher incomes"],["C","Everything in A and B through a private Medicare Advantage plan","Usually has a network; often includes drug coverage and extra benefits"],["D","Prescription drugs","Offered by private plans, standalone or inside a Medicare Advantage plan"]]},{"type":"p","text":"Original Medicare leaves gaps. It has deductibles and coinsurance, it has no yearly cap on what the beneficiary can spend out of pocket, and it does not cover most prescriptions, routine dental, vision or hearing care, or long-term custodial care."},{"type":"h","text":"Two ways to fill the gaps"},{"type":"p","text":"The first path keeps Original Medicare and adds a standalone Part D plan and, if the person chooses, a <b>Medigap<\/b> policy. Medigap, also called Medicare Supplement insurance, is sold by private insurers and pays some or all of Original Medicare's cost sharing. The plans are standardized and identified by letter, so a given letter offers the same basic benefits from any company; price and service are what differ. The beneficiary can see any provider that accepts Medicare."},{"type":"p","text":"The second path is <b>Medicare Advantage<\/b>. The person must have both Part A and Part B and continues paying the Part B premium. The private plan then provides those benefits, usually through an HMO or PPO network, with its own copays and a yearly out-of-pocket limit. Many plans include drug coverage and extras such as dental or vision."},{"type":"table","head":["","Original Medicare + Medigap + Part D","Medicare Advantage"],"rows":[["Provider choice","Any provider accepting Medicare","Generally the plan's network"],["Premiums","Part B plus Medigap plus Part D","Part B plus any plan premium"],["Costs when using care","Low and predictable with Medigap","Copays up to a yearly limit"],["Drug coverage","Separate Part D plan","Often built in"]]},{"type":"p","text":"The two paths do not mix. A Medigap policy cannot be used with a Medicare Advantage plan, and it is illegal to sell one to a person enrolled in Medicare Advantage unless they are returning to Original Medicare."},{"type":"tip","text":"Medigap works only with Original Medicare; it cannot be paired with a Medicare Advantage plan."}]},{"title":"Why Certification Comes First","blocks":[{"type":"p","text":"A Texas health license alone does not allow you to sell Medicare Advantage or Part D plans. Federal rules require the plans to make sure that every agent who represents them is licensed, appointed, and trained and tested on Medicare each year. The plans answer to CMS for what their agents do."},{"type":"p","text":"Most carriers meet the training requirement through <b>AHIP certification<\/b>, a course and exam offered through an industry association. It covers Medicare basics, plan types, enrollment rules, marketing rules, and fraud, waste and abuse. A high score is required to pass and the number of attempts is limited, so prepare for it seriously."},{"type":"h","text":"What must be in place before you sell"},{"type":"list","items":["An active Texas license with health authority","Errors and omissions coverage, which Medicare carriers generally require","The current plan year's AHIP certification, or the alternative training a carrier accepts","Each carrier's own product certification for the plan year","A completed contract and state appointment with each carrier","The carrier's confirmation that you are ready to sell"]},{"type":"flow","nodes":["License + E&O","AHIP","Carrier certification","Appointment","Ready to sell"],"caption":"The certification path that must be finished, every year, before marketing Medicare Advantage or Part D."},{"type":"p","text":"Certification is annual. Plans change their benefits, premiums and networks every year, and the rules are revised regularly. Training for the next plan year opens in the summer, ahead of the fall enrollment season. Being certified for this year does not let you sell next year's plans."},{"type":"p","text":"The consequences of skipping a step are concrete. If you write an application before you are certified and appointed for that plan year, the carrier can refuse to pay commission, end your contract and report you. The beneficiary may be left with an enrollment that has to be untangled."},{"type":"p","text":"Medigap is regulated differently. It falls mainly under state insurance law, and AHIP is not what authorizes its sale, although you still need your license, a carrier appointment and any training the carrier requires."},{"type":"p","text":"When AllShield will begin Medicare sales, which carriers it will contract with and whether certification costs are covered: [AllShield to confirm]."},{"type":"example","text":"In September an agent has finished AHIP but has not completed one carrier's product certification. A friend asks about that carrier's plan for next year. The agent cannot present it yet and says so, then finishes the certification before the conversation continues."},{"type":"tip","text":"Medicare Advantage and Part D certification must be renewed every plan year before any marketing or sales activity for that year."}]},{"title":"CMS Marketing Rules in Concept","blocks":[{"type":"p","text":"CMS publishes detailed marketing and communication rules for Medicare Advantage and Part D, and carriers add policies of their own. The details are revised often, so the carrier's current-year guidance is always the final word. What follows are the ideas behind the rules."},{"type":"h","text":"Contact rules"},{"type":"p","text":"<b>Unsolicited contact<\/b> is prohibited. You may not knock on doors, approach people in parking lots or other common areas, or make cold calls or send unsolicited texts to market these plans. The beneficiary must ask to be contacted, for example by returning a reply card, filling out a request form or calling you. That permission is limited to the purpose and products the person asked about, and it does not last forever. You may call your own existing clients about their plans."},{"type":"h","text":"Scope of appointment"},{"type":"p","text":"Before any one-on-one sales appointment, whether in person, by phone or online, you must document a <b>scope of appointment<\/b>. It records which plan types the beneficiary agreed to discuss and that they understand a licensed sales agent will be presenting. The rules require it to be agreed and documented before the appointment begins, and CMS has set timing rules for how far in advance; check the current-year requirement with the carrier. If the beneficiary wants to discuss a product not on the form, a new scope is needed. Keep every scope, even when no sale results; plans must retain these records for ten years."},{"type":"list","items":["Do not discuss products outside the agreed scope.","Do not market non-health products, such as life insurance or annuities, during a Medicare appointment.","Do not ask for referrals or collect names of friends at the appointment.","Do not pressure the beneficiary to enroll on the spot."]},{"type":"h","text":"Events, statements and materials"},{"type":"table","head":["Topic","The idea"],"rows":[["Educational events","Inform only; no plan-specific selling and no enrollment forms"],["Sales events","Plan presentations are allowed; no meals, though light refreshments are permitted"],["Gifts","Only items of nominal value, offered to everyone whether or not they enroll"],["Claims","No saying a plan is the best, and no implying Medicare or the government endorses you or the plan"],["Disclaimers","Agents who do not represent every plan in the area must say so, using the required wording"],["Phone sales","Sales and enrollment calls must be recorded and the recordings retained"]]},{"type":"p","text":"Use only marketing materials the carrier has approved. Report suspected violations and beneficiary complaints through the carrier's compliance channel."},{"type":"tip","text":"A scope of appointment must be documented before a personal Medicare sales appointment, and only the products listed on it may be discussed."}]},{"title":"Enrollment Periods","blocks":[{"type":"p","text":"Medicare enrollment runs on a calendar of election periods. A beneficiary can act only during a period that applies to them, so knowing these windows is a large part of serving Medicare clients well."},{"type":"table","head":["Period","When","What can be done"],"rows":[["Initial Enrollment Period","Seven months: the three months before the 65th birthday month, that month, and the three months after","Enroll in Parts A and B; join a Medicare Advantage or Part D plan"],["General Enrollment Period","January 1 to March 31 each year","Enroll in Part A or B if the initial period was missed; penalties may apply"],["Annual Enrollment Period","October 15 to December 7","Join, switch or drop Medicare Advantage and Part D plans; changes start January 1"],["Medicare Advantage Open Enrollment Period","January 1 to March 31","People already in Medicare Advantage may switch plans once or return to Original Medicare"],["Special Enrollment Period","Triggered by an event","Make changes outside the regular periods"],["Medigap open enrollment","Six months starting when a person is 65 or older and enrolled in Part B","Buy any Medigap policy sold in the state without health questions"]]},{"type":"p","text":"The <b>Initial Enrollment Period<\/b> is the most important one to get right. Missing it can lead to a <b>late enrollment penalty<\/b>. For Part B, the penalty is added to the monthly premium for as long as the person has Part B. For Part D, a penalty applies when someone goes without creditable drug coverage for an extended time after first becoming eligible."},{"type":"p","text":"The <b>Annual Enrollment Period<\/b> in the fall is the busy season. Marketing for the coming plan year may begin on October 1, and applications are accepted starting October 15. Do not take enrollment forms before that date."},{"type":"p","text":"A <b>Special Enrollment Period<\/b> opens after certain events, such as moving out of a plan's service area, losing employer coverage, or qualifying for Medicaid or other financial assistance. Each one has its own rules and time limit. Confirm the facts before you tell a beneficiary they qualify, and never invent a reason to enroll someone outside a valid period."},{"type":"p","text":"The Medigap window deserves careful attention. During that six-month period an insurer cannot refuse the applicant or charge more for health reasons. Afterward, in most situations, the insurer may underwrite and can decline. Someone who leaves Medigap for Medicare Advantage may not be able to get the same Medigap policy back later."},{"type":"example","text":"Walter turned 65 two years ago, never signed up for Part B and has had no employer coverage. He now must use the General Enrollment Period, and his Part B premium will carry a penalty. A conversation during his initial window would have prevented it."},{"type":"tip","text":"The Annual Enrollment Period runs from October 15 to December 7, with changes taking effect on January 1."}]}],"summary":{"recap":["Medicare covers people 65 or older, people under 65 after 24 months of Social Security disability benefits, and people with end-stage renal disease or ALS. It is not based on income.","Part A is hospital insurance and Part B is medical insurance; together they are Original Medicare. Part C is Medicare Advantage, delivered by private plans. Part D is prescription drug coverage.","Medigap helps pay Original Medicare's cost sharing and cannot be combined with Medicare Advantage.","Before selling Medicare Advantage or Part D, an agent needs a license, E&O, the current year's AHIP and carrier certifications, an appointment and ready-to-sell confirmation. This is repeated every year.","Marketing rules prohibit unsolicited contact, require a documented scope of appointment before a sales appointment, limit what happens at events, and ban misleading claims.","Enrollment happens in defined periods: initial, general, annual, Medicare Advantage open enrollment, special periods and the Medigap open enrollment window."],"avaSummary":"Let us review the Medicare path. Medicare is the federal program for people who are 65 or older, for people under 65 who have received Social Security disability benefits for two years, and for people with end-stage renal disease or ALS. It is not based on income. That is Medicaid. Medicare has four parts. Part A covers hospital care. Part B covers doctors and outpatient care. Together they are Original Medicare. Part C is Medicare Advantage, where a private plan provides those benefits, usually through a network. Part D covers prescriptions. Medigap is supplement insurance that helps pay what Original Medicare leaves behind, and it cannot be paired with Medicare Advantage. Before you sell Medicare Advantage or Part D, you must be licensed, carry errors and omissions coverage, complete AHIP and each carrier's certification for that plan year, be appointed, and be confirmed as ready to sell. You repeat that every year. The marketing rules are strict. No door knocking, no cold calls, no unsolicited texts. Before a sales appointment you document a scope of appointment, and you discuss only what is on it. Use approved materials, and never suggest that Medicare endorses you. Finally, the calendar. The Initial Enrollment Period is seven months around the sixty-fifth birthday. The Annual Enrollment Period runs from October fifteenth to December seventh. Medicare Advantage open enrollment runs from January through March. Special periods follow certain life events, and Medigap has its own six-month window. Learn these well, and when AllShield opens this line, you will be ready.","reviewNotes":[{"objective":"Identify who is eligible for Medicare","concepts":["Age 65 or older.","Under 65 after 24 months of Social Security disability benefits.","End-stage renal disease or ALS at any age.","Medicare is not income-based; Medicaid is.","Medicare-eligible people generally cannot receive Marketplace tax credits."],"terms":[{"term":"Original Medicare","def":"Part A and Part B, run by the federal government."}]},{"objective":"Describe what Parts A, B, C and D cover and how Medigap fits with Original Medicare","concepts":["Part A: inpatient hospital, skilled nursing facility, hospice, some home health.","Part B: doctors, outpatient care, preventive services, equipment.","Part C: private plans providing A and B benefits, often with drugs and extras.","Part D: prescription drugs through private plans.","Medigap is standardized by letter and works only with Original Medicare."],"terms":[{"term":"Medicare Advantage","def":"Part C private plans that deliver Part A and B benefits."},{"term":"Medigap","def":"Supplement insurance that helps pay Original Medicare's cost sharing."}]},{"objective":"Explain why AHIP and carrier certification are required before selling Medicare plans","concepts":["Plans must ensure agents are licensed, appointed and annually trained and tested.","AHIP is the common way carriers meet the training requirement.","Each carrier also requires its own yearly product certification.","Selling before certification risks commission, contract and the beneficiary's enrollment.","Medigap is governed mainly by state law."],"terms":[{"term":"AHIP certification","def":"Annual Medicare training and test required by carriers."}]},{"objective":"Apply core CMS marketing rules, including scope of appointment and contact rules","concepts":["No door-to-door, cold calls or unsolicited texts.","Permission to contact is limited in purpose and time.","Scope of appointment is documented before a personal sales appointment.","No non-health products and no meals at sales events.","No claims of government endorsement; use approved materials."],"terms":[{"term":"Scope of appointment","def":"A documented agreement on which plan types will be discussed."},{"term":"Unsolicited contact","def":"Contacting a beneficiary who has not given permission."}]},{"objective":"Distinguish the main Medicare enrollment periods","concepts":["Initial Enrollment Period: seven months around the 65th birthday month.","General Enrollment Period: January 1 to March 31.","Annual Enrollment Period: October 15 to December 7, effective January 1.","Medicare Advantage Open Enrollment Period: January 1 to March 31, for people already in Medicare Advantage.","Medigap open enrollment: six months from age 65 or older with Part B.","Late enrollment can bring lasting Part B and Part D penalties."],"terms":[{"term":"Annual Enrollment Period","def":"October 15 through December 7 each year."},{"term":"Late enrollment penalty","def":"A lasting premium surcharge for enrolling late without qualifying coverage."}]}]},"exam":[{"q":"Which person is eligible for Medicare?","choices":["A 40-year-old with low income and no disability","A 50-year-old who lost employer coverage","A 58-year-old who has received Social Security disability benefits for 24 months","A 62-year-old early retiree in good health"],"answer":2,"why":"People under 65 qualify after 24 months of Social Security disability benefits. Income alone does not create eligibility."},{"q":"Which part of Medicare covers inpatient hospital stays?","choices":["Part A","Part B","Part C","Part D"],"answer":0,"why":"Part A is hospital insurance; Part B covers doctor and outpatient services."},{"q":"Original Medicare consists of:","choices":["Part C and Part D","Part A and Part B","Part B and Medigap","Part A and Part D"],"answer":1,"why":"Parts A and B, run by the federal government, make up Original Medicare."},{"q":"Which statement about Medigap is correct?","choices":["It replaces Part B","It is another name for Medicare Advantage","It covers prescription drugs in place of Part D","It works with Original Medicare and cannot be paired with a Medicare Advantage plan"],"answer":3,"why":"Medigap supplements Original Medicare only and may not be used with Medicare Advantage."},{"q":"To join a Medicare Advantage plan, a person must:","choices":["Have both Part A and Part B","Drop Part B","Own a Medigap policy","Be under 65"],"answer":0,"why":"Medicare Advantage requires enrollment in both Part A and Part B, and the Part B premium continues."},{"q":"Why must an agent complete AHIP and carrier certification before selling Medicare Advantage or Part D?","choices":["It replaces the state license","It raises the agent's commission","Plans must ensure their agents are trained and tested on Medicare each year","It is optional but recommended"],"answer":2,"why":"Federal rules make plans responsible for annual training and testing of agents; AHIP and carrier courses meet that requirement."},{"q":"An agent certified for the current plan year wants to sell next year's plans. What is required?","choices":["Nothing; certification carries over","Completing certification for the new plan year first","Only a new scope of appointment","A new state exam"],"answer":1,"why":"Certification is annual and must be completed for each plan year before marketing that year's plans."},{"q":"Which activity is prohibited when marketing Medicare Advantage plans?","choices":["Returning a call from someone who asked for information","Calling a current client about their plan","Meeting a beneficiary who requested an appointment","Knocking on doors without an invitation"],"answer":3,"why":"Unsolicited contact such as door-to-door solicitation is not allowed."},{"q":"What is the purpose of a scope of appointment?","choices":["To document, before a sales appointment, which plan types the beneficiary agreed to discuss","To enroll the beneficiary in a plan","To record the agent's commission","To verify the beneficiary's income"],"answer":0,"why":"The scope sets and documents the products to be discussed before the appointment begins."},{"q":"During a Medicare appointment the beneficiary's scope lists only Medicare Advantage. The agent would also like to offer a life insurance policy. The agent should:","choices":["Present it at the end of the appointment","Add it to the scope afterward","Not market non-health products during the Medicare appointment","Mail a life application the same day without asking"],"answer":2,"why":"Products outside the scope, and non-health products in particular, may not be marketed during the Medicare appointment."},{"q":"When is the Annual Enrollment Period for Medicare Advantage and Part D?","choices":["January 1 to March 31","October 15 to December 7","November 1 to January 15","The seven months around age 65"],"answer":1,"why":"The Annual Enrollment Period runs October 15 through December 7, wit
