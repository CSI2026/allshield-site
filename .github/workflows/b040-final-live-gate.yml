name: B040 Final Editable Compensation Gate
on:
  push:
    branches: [universal-comp-b040]
    paths: ['.github/workflows/b040-final-live-gate.yml']
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-comp-b040
          fetch-depth: 0
      - name: Wire B040 into production page and test suite
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          tags='''\n<script defer src="./universal-compensation-platform.js?v=B2026.08.29.040"></script>\n<script defer src="./comp-qualification-ui.js?v=B2026.08.29.040"></script>\n'''
          if 'universal-compensation-platform.js' not in s:
              if '</body>' not in s: raise SystemExit('index body close not found')
              s=s.replace('</body>',tags+'</body>')
          p.write_text(s)
          pkg=Path('package.json')
          j=json.loads(pkg.read_text())
          extra='node tests/universal-compensation-contract.mjs && node tests/universal-compensation-live-contract.mjs'
          if extra not in j['scripts']['test']:
              j['scripts']['test']=j['scripts']['test']+' && '+extra
          pkg.write_text(json.dumps(j,indent=2)+'\n')
          b=Path('build-info.js');x=b.read_text()
          x=x.replace("current_build:'B2026.08.29.039'","current_build:'B2026.08.29.040'")
          x=x.replace("label:'Production B039 — Marcus AI Performance & Compensation Analyst Live Execution — Certified'","label:'Production B040 — Universal Editable Compensation + Qualification Tracking — Certified'")
          marker='  certification:{\n'
          add="    universal_compensation:'LIVE CONFIGURATION PASS',\n    editable_commission_structure:'PASS',\n    editable_bonus_structure:'PASS',\n    editable_agent_tiers:'PASS',\n    product_program_reuse:'PASS',\n    automatic_bonus_qualification_tracking:'PASS',\n"
          if "universal_compensation:'LIVE CONFIGURATION PASS'" not in x:
              x=x.replace(marker,marker+add)
          change="    'Added universal versioned compensation configuration for ACA and future products/programs, including editable base commission, bonus structures, agent tiers and automatic qualification snapshots',\n"
          if change.strip() not in x:
              x=x.replace('  changes:[\n','  changes:[\n'+change)
          b.write_text(x)
      - name: JavaScript syntax
        run: |
          node --check universal-compensation-platform.js
          node --check comp-qualification-ui.js
      - name: Universal live contract
        run: node tests/universal-compensation-live-contract.mjs
      - name: Full ALLSHIELD contract suite
        run: npm test
      - name: Organization regression
        run: node tests/ai-workforce-organization-cert.mjs
      - name: Verify release markers
        run: |
          grep -q 'universal-compensation-platform.js?v=B2026.08.29.040' index.html
          grep -q 'comp-qualification-ui.js?v=B2026.08.29.040' index.html
          grep -q "current_build:'B2026.08.29.040'" build-info.js
      - name: Remove one-time B040 workflows
        run: |
          rm -f .github/workflows/b040-universal-comp-gate.yml
          rm -f .github/workflows/b040-final-live-gate.yml
      - name: Commit exact release tree
        run: |
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Certify B040 universal editable compensation release'
          git push origin HEAD:universal-comp-b040
