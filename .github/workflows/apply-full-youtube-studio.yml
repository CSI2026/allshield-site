name: Apply Full YouTube Studio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-full-youtube-studio.yml'
      - '.restore/youtube-studio/renderVideo.production.js.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-youtube-studio
  cancel-in-progress: true

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Replace incomplete canonical video renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path('phase16-production-core.js')
          source=core.read_text()
          replacement=Path('.restore/youtube-studio/renderVideo.production.js.txt').read_text().strip()+"\n\n"
          start=source.find('async function renderVideo(main){')
          end=source.find('async function renderBrand(main){',start)
          if start<0 or end<0 or end<=start:
              raise SystemExit('Canonical renderVideo boundaries not found')
          old=source[start:end]
          if 'Company video library.' not in old and 'Create, edit, repurpose and publish.' not in old:
              raise SystemExit('Unexpected renderVideo implementation; refusing unsafe replacement')
          core.write_text(source[:start]+replacement+source[end:])
          PY
          node --check phase16-production-core.js
          grep -q 'Long-form YouTube' phase16-production-core.js
          grep -q 'Mid-form YouTube' phase16-production-core.js
          grep -q 'Short-form Video' phase16-production-core.js
          grep -q 'YouTube Shorts' phase16-production-core.js
          grep -q 'Generate Full AI Production Package' phase16-production-core.js
          grep -q 'video-studio-ai' phase16-production-core.js
          grep -q 'youtube-oauth' phase16-production-core.js
          grep -q 'youtube-publish' phase16-production-core.js

      - name: Record YouTube Studio completion release
        shell: bash
        run: |
          cat > build-info.js <<'EOF'
          window.ALLSHIELD_BUILD_INFO={
            build_number:'B2026.08.23.021',
            label:'Approved B021 + Full Production YouTube Studio',
            base_build:'B2026.08.23.021',
            completion_release:'2026.08.26.002',
            channel:'production',
            released_at:'2026-08-26'
          };
          EOF
          sed -i 's/^          //' build-info.js

      - name: Upgrade source certification for YouTube Studio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/owner-portal-contract.mjs')
          s=p.read_text()
          s=s.replace("'Create Draft Version','Video Assets','Approved Allshield brand system.'","'Create Draft Version','Long-form YouTube','Mid-form YouTube','Short-form Video','YouTube Shorts','Generate Full AI Production Package','Script + Storyboard','AI Clips + Voice','Metadata + Thumbnail','Publish + Library','video_projects','video_project_assets','video_publish_jobs','video-studio-ai','youtube-oauth','youtube-publish','Approved Allshield brand system.'")
          s=s.replace("completion_release:'2026.08.26.001'","completion_release:'2026.08.26.002'")
          s=s.replace("approved B021 completion release","approved B021 YouTube Studio completion release")
          p.write_text(s)
          PY
          cat > tests/youtube-studio-contract.mjs <<'EOF'
          import fs from 'node:fs';
          const core=fs.readFileSync('phase16-production-core.js','utf8');
          const start=core.indexOf('async function renderVideo(main){');
          const end=core.indexOf('async function renderBrand(main){',start);
          if(start<0||end<0) throw new Error('Canonical YouTube Studio renderer not found');
          const video=core.slice(start,end);
          const required=['VIDEO & YOUTUBE STUDIO','Create, edit, repurpose and publish.','Long-form YouTube','Mid-form YouTube','Short-form Video','YouTube Shorts','Create','Script + Storyboard','AI Clips + Voice','Metadata + Thumbnail','Publish + Library','Generate Full AI Production Package','Generate AI Scene Clip','Generate Voiceover','Generate Metadata','Generate Thumbnail','Publish / Schedule to YouTube','video_projects','video_project_assets','video_publish_jobs','video-studio-ai','youtube-oauth','youtube-publish','Open Social Publishing for Other Channels'];
          for(const marker of required) if(!video.includes(marker)) throw new Error(`YouTube Studio feature missing: ${marker}`);
          for(const rejected of ['Company video library.','Production build will upload','Video publish job queued in demo']) if(video.includes(rejected)) throw new Error(`Incomplete/demo YouTube Studio behavior remains: ${rejected}`);
          console.log('YouTube Studio source contract: PASS');
          EOF
          cat > package.json <<'EOF'
          {
            "name":"allshield-site",
            "private":true,
            "version":"1.0.0",
            "scripts":{"test":"node tests/owner-portal-contract.mjs && node tests/youtube-studio-contract.mjs"}
          }
          EOF
          sed -i 's/^          //' tests/youtube-studio-contract.mjs package.json
          npm test

      - name: Upgrade live browser certification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/live-browser-cert.mjs')
          s=p.read_text()
          marker=" rec('Browser page errors',errs.length===0,errs.join(' | ')||'none');"
          insert=""" await page.evaluate(()=>window.showOwnerView('video',null));await page.waitForTimeout(650);const videoBody=await page.locator('#ownerMain').innerText();const videoMarkers=['Long-form YouTube','Mid-form YouTube','Short-form Video','YouTube Shorts','Script + Storyboard','AI Clips + Voice','Metadata + Thumbnail','Publish + Library','Generate Full AI Production Package'];rec('Full YouTube Studio workflow',videoMarkers.every(x=>videoBody.includes(x)),videoMarkers.filter(x=>!videoBody.includes(x)).join(', ')||'all creation modes and workbench sections present');const videoTabs=['create','script','assets','metadata','publish'];let tabsOk=true;for(const tab of videoTabs){await page.locator(`[data-yt-tab="${tab}"]`).click();await page.waitForTimeout(80);const on=await page.locator(`[data-yt-panel="${tab}"]`).evaluate(el=>el.classList.contains('on'));if(!on)tabsOk=false;}rec('YouTube Studio internal tabs',tabsOk,'Create, Script, Assets, Metadata and Publish tabs switch correctly');\n"""+marker
          if 'Full YouTube Studio workflow' not in s:
              if marker not in s: raise SystemExit('Live certification insertion point not found')
              s=s.replace(marker,insert,1)
          p.write_text(s)
          PY
          node --check tests/live-browser-cert.mjs

      - name: Final source tests
        run: npm test

      - name: Commit full production YouTube Studio
        shell: bash
        run: |
          git config user.name 'Allshield Production Completion'
          git config user.email 'actions@users.noreply.github.com'
          git add phase16-production-core.js build-info.js tests/owner-portal-contract.mjs tests/youtube-studio-contract.mjs tests/live-browser-cert.mjs package.json
          if git diff --cached --quiet; then
            echo 'Full YouTube Studio is already current.'
          else
            git commit -m 'Complete production Video and YouTube Studio'
            git push origin HEAD:main
          fi
