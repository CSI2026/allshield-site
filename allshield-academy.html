s and coinsurance and often more paperwork."},{"type":"table","head":["Plan","Gatekeeper required","Out-of-network care"],"rows":[["HMO","Yes","Not covered, except emergencies"],["PPO","No","Covered at a higher cost to the member"],["EPO","Generally no","Not covered, except emergencies"],["POS","Yes","Covered at a higher cost to the member"]]},{"type":"example","text":"Carlos has a PPO. His in-network orthopedist costs him a modest copayment. He prefers a surgeon outside the network for his knee operation, so the plan still pays, but Carlos owes a higher deductible and a larger percentage of the bill."},{"type":"list","items":["Most freedom of choice: PPO","Most control over cost: HMO","Middle ground with a gatekeeper: POS","Network-only without a gatekeeper: EPO"]},{"type":"tip","text":"A POS plan is the one where the member decides between network and non-network care each time treatment is needed."}]},{"title":"Self-Funded Plans, TPAs, and MEWAs","blocks":[{"type":"p","text":"Some employers decide not to buy group insurance at all. In a <b>self-funded plan<\/b>, also called self-insured, the employer sets aside money and pays employee medical claims directly from its own funds. The employer, not an insurance company, carries the risk."},{"type":"p","text":"Employers choose this route to save the insurer's profit and overhead charges, to keep control of plan design, and to hold on to cash until claims are actually paid. Private employer self-funded plans are governed mainly by the federal law known as ERISA and are largely outside state insurance regulation."},{"type":"h","text":"Getting help with administration and risk"},{"type":"p","text":"Paying claims takes expertise most employers lack. A <b>third-party administrator (TPA)<\/b> is an outside firm hired to process claims, keep records, and handle other plan paperwork. The TPA is paid a fee and takes on no insurance risk. An insurer may provide the same help under an administrative services only, or ASO, contract."},{"type":"p","text":"A run of large claims could sink a self-funded employer, so most buy <b>stop-loss insurance<\/b>. This policy protects the employer, not the employees."},{"type":"list","items":["Specific stop-loss reimburses the employer when one person's claims pass a set dollar amount","Aggregate stop-loss reimburses the employer when total plan claims for the year pass a set amount"]},{"type":"flow","nodes":["Employer funds claims","TPA processes claims","Stop-loss covers excess"],"caption":"Who does what in a self-funded plan"},{"type":"h","text":"MEWAs"},{"type":"p","text":"A <b>multiple employer welfare arrangement (MEWA)<\/b> is formed when two or more employers join to provide health or other benefits to their employees. Small employers use MEWAs to gain the buying power and lower costs of a large group. A MEWA may be insured or self-funded. Unlike single-employer self-funded plans, MEWAs are subject to state insurance regulation, a response to past failures that left members with unpaid claims."},{"type":"example","text":"A manufacturer with 400 workers self-funds its health plan and hires a TPA. Its specific stop-loss threshold is 75,000 dollars per person. When one employee's cancer treatment reaches 240,000 dollars, the stop-loss carrier reimburses the employer for the amount above 75,000 dollars."},{"type":"tip","text":"A TPA administers claims but never bears the risk; in a self-funded plan the risk stays with the employer."}]},{"title":"Government Health Programs","blocks":[{"type":"p","text":"Government is one of the largest providers of health coverage in the country. Each program serves a specific group of people, and exam questions usually turn on matching the program to the person."},{"type":"p","text":"<b>Medicare<\/b> is a federal program. It covers people age 65 and older, people who have received Social Security disability benefits for 24 months, and people with permanent kidney failure. Part A covers hospital care, Part B covers medical services such as doctor visits, Part C is Medicare Advantage offered through private plans, and Part D covers prescription drugs."},{"type":"p","text":"<b>Medicaid<\/b> is based on financial need, not age. It is funded jointly by the federal and state governments and administered by each state. It serves people with low income and limited assets, including many children, pregnant women, and elderly or disabled individuals."},{"type":"p","text":"The <b>Children's Health Insurance Program (CHIP)<\/b> covers children in families whose income is too high to qualify for Medicaid but too low to afford private insurance. Like Medicaid, it is run by the states with federal and state money."},{"type":"p","text":"<b>TRICARE<\/b> is the health program for the military community. It covers active-duty service members, military retirees, and their eligible dependents."},{"type":"p","text":"<b>Workers' compensation<\/b> is set by state law and paid for by employers. It covers injuries and illnesses that arise from the job, without regard to who was at fault. Benefits include medical care, income replacement, rehabilitation, and death benefits for survivors. Texas is unusual because it does not require most private employers to carry workers' compensation coverage."},{"type":"table","head":["Program","Who it serves","Who runs it"],"rows":[["Medicare","Age 65 and over, certain disabled people, kidney failure","Federal government"],["Medicaid","People with low income and limited resources","States, with federal and state funds"],["CHIP","Children above Medicaid income limits without affordable coverage","States, with federal and state funds"],["TRICARE","Military members, retirees, and dependents","Federal government"],["Workers' compensation","Employees hurt or made ill by their work","State law, employer-funded"]]},{"type":"tip","text":"Medicare is tied to age or disability and is federal; Medicaid is tied to financial need and is run by the states."}]},{"title":"Cost Containment","blocks":[{"type":"p","text":"Every provider in this chapter faces the same pressure: medical costs keep rising. <b>Cost containment<\/b> is the set of tools a plan uses to avoid paying for care that is unnecessary, overpriced, or delivered in a more expensive setting than needed. The goal is to control cost without lowering the quality of care."},{"type":"h","text":"Utilization review"},{"type":"p","text":"<b>Utilization review<\/b> examines whether care is medically necessary and appropriate. It can take place at three points in time."},{"type":"list","items":["Prospective review happens before treatment. Often called precertification or preauthorization, it requires approval before a non-emergency hospital admission or procedure.","Concurrent review happens during treatment. The plan monitors a hospital stay while it is under way to confirm that continued confinement is needed.","Retrospective review happens after treatment. The plan looks back at the records to judge whether the care given was appropriate and correctly billed."]},{"type":"flow","nodes":["Prospective: before care","Concurrent: during care","Retrospective: after care"],"caption":"The three stages of utilization review"},{"type":"h","text":"Other tools"},{"type":"p","text":"<b>Case management<\/b> is used for members with serious, expensive, or long-lasting conditions. A case manager, often a nurse, works with the patient, family, and doctors to coordinate treatment and find effective alternatives, such as home care instead of a long hospital stay."},{"type":"p","text":"A <b>second surgical opinion<\/b> provision asks the member to consult another physician before certain elective operations. Some plans make it mandatory and reduce benefits if the member skips it. The plan pays for the second opinion because it costs far less than an unneeded surgery."},{"type":"list","items":["Preventive care: checkups and screenings that catch problems early","Outpatient or ambulatory surgery: procedures done without an overnight hospital stay","Hospice and home health care: lower-cost alternatives to hospital confinement","Cost sharing: deductibles, copayments, and coinsurance that give members a stake in the cost"]},{"type":"example","text":"Before her scheduled back surgery, Angela's plan requires precertification and a second opinion. The second surgeon recommends physical therapy first. Angela improves, the operation is never needed, and both she and the plan avoid a large expense."},{"type":"tip","text":"Precertification is prospective review, because the approval is requested before the care is given."}]}],"summary":{"recap":["Commercial insurers reimburse covered expenses, while service organizations such as Blue Cross and Blue Shield prepay for care and pay contracted providers directly.","HMOs finance and deliver care within a service area, emphasize prevention, use a primary care gatekeeper, and often pay by capitation. The four models are staff, group, network, and IPA.","PPOs offer discounted fee-for-service care with no gatekeeper and allow out-of-network care at higher cost. EPOs cover network care only. POS plans use a gatekeeper but let members go outside the network at the point of service.","In a self-funded plan the employer bears the risk, a TPA handles administration, and stop-loss insurance caps the employer's exposure. MEWAs pool two or more employers and are subject to state regulation.","Government programs include Medicare for the aged and disabled, Medicaid for the needy, CHIP for children, TRICARE for the military community, and workers' compensation for job-related injuries.","Cost containment relies on prospective, concurrent, and retrospective utilization review, case management, second surgical opinions, preventive care, and outpatient treatment."],"avaSummary":"Great job working through chapter fourteen. Here is the short version to carry into the exam. Commercial insurers are stock and mutual companies that reimburse expenses. Blue Cross and Blue Shield are service organizations. Their members are subscribers who prepay, and the plan pays contracted hospitals and doctors directly. Next, the HMO. It both pays for care and provides it, inside a service area. It stresses preventive care, uses a primary care physician as a gatekeeper, and often pays providers by capitation, a flat amount per member. Know the four models. Staff means salaried employees. Group means one medical group. Network means two or more groups. IPA means independent doctors in their own offices. Then compare the alternatives. A PPO has no gatekeeper and pays for out-of-network care at a higher cost. An EPO pays for network care only. A POS plan has a gatekeeper but lets the member choose outside care each time. With self-funding, the employer keeps the risk, a third-party administrator handles claims, and stop-loss insurance protects the employer from large losses, either per person or in total. A MEWA is two or more employers pooling together, and the states regulate it. For government programs, match the person to the plan. Medicare is for age sixty-five and the disabled. Medicaid is for financial need. CHIP is for children. TRICARE is for military families. Workers' compensation is for job injuries. Last, cost containment. Utilization review can be prospective, concurrent, or retrospective. Add case management and second surgical opinions and you have the full set. Now go take the chapter exam.","reviewNotes":[{"objective":"Compare commercial insurers with service organizations such as Blue Cross Blue Shield","concepts":["Commercial insurers are stock or mutual companies that reimburse covered expenses","Service organizations provide benefits as services from contracted providers","Blue Cross is associated with hospital care and Blue Shield with physician care","Service plans are prepaid and pay the provider directly"],"terms":[{"term":"Subscriber","def":"The person covered under a service organization or prepaid plan."},{"term":"Reimbursement basis","def":"Paying benefits after expenses are incurred, to the insured or an assigned provider."}]},{"objective":"Describe how an HMO operates, including the gatekeeper, capitation, and the four HMO models","concepts":["An HMO both finances and delivers care in a defined service area","Preventive care is emphasized and members pay copayments","The primary care physician controls referrals to specialists","Capitation pays a fixed amount per member regardless of services used","Staff and group models are closed panel; the IPA model is open panel"],"terms":[{"term":"Gatekeeper","def":"The primary care physician who manages a member's care and referrals."},{"term":"Capitation","def":"A flat per-member payment to a provider."},{"term":"IPA","def":"An HMO model using independent physicians in their own offices."}]},{"objective":"Differentiate PPO, EPO, and POS plans by network rules and out-of-network coverage","concepts":["PPO providers accept discounted fees and are paid fee-for-service","PPO members need no gatekeeper and may go out of network at higher cost","EPO members have no out-of-network coverage except for emergencies","POS plans combine an HMO gatekeeper with the option to use outside providers"],"terms":[{"term":"PPO","def":"A network of providers offering discounted fees, with outside care covered at a lower level."},{"term":"EPO","def":"A network-only plan that generally does not require a gatekeeper."},{"term":"POS plan","def":"A hybrid plan where the member chooses network or non-network care at each visit."}]},{"objective":"Explain self-funded plans and the roles of third-party administrators and stop-loss insurance","concepts":["The employer pays claims from its own funds and keeps the risk","Private self-funded plans are governed mainly by ERISA","A TPA processes claims for a fee and takes no risk","Specific stop-loss applies per individual; aggregate stop-loss applies to total claims"],"terms":[{"term":"Third-party administrator (TPA)","def":"An outside firm that handles claims and paperwork for a self-funded plan."},{"term":"Stop-loss insurance","def":"Coverage that reimburses the employer for claims above a set threshold."}]},{"objective":"Identify what a MEWA is and how it is regulated","concepts":["A MEWA joins two or more employers to provide employee benefits","Small employers use MEWAs to gain large-group pricing","A MEWA may be insured or self-funded","MEWAs are subject to state insurance regulation"],"terms":[{"term":"MEWA","def":"Multiple employer welfare arrangement."}]},{"objective":"Summarize the major government health programs and who each one serves","concepts":["Medicare is federal and serves people 65 and older and certain disabled people","Medicaid is needs-based, jointly funded, and administered by the states","CHIP covers children in families above Medicaid income limits","TRICARE covers military members, retirees, and dependents","Workers' compensation covers job-related injury and illness regardless of fault"],"terms":[{"term":"Medicare","def":"Federal health program for the aged and certain disabled individuals."},{"term":"Medicaid","def":"Federal and state program for people with low income and limited resources."},{"term":"TRICARE","def":"Health program for the military community."}]},{"objective":"List the cost containment methods used by health plans","concepts":["Prospective review approves care before it is given","Concurrent review monitors care while it is under way","Retrospective review evaluates care after it is completed","Case management coordinates care for serious or costly conditions","Second surgical opinions help avoid unnecessary operations"],"terms":[{"term":"Utilization review","def":"Evaluation of the necessity and appropriateness of care."},{"term":"Case management","def":"Coordinated oversight of care for a member with a serious condition."}]}]},"exam":[{"q":"Which type of provider traditionally pays benefits on a reimbursement basis?","choices":["Commercial insurer","Staff model HMO","Blue Cross plan","Group model HMO"],"answer":0,"why":"Commercial insurers reimburse covered expenses after care is received, while service plans and HMOs provide or prepay for services."},{"q":"A person covered by a Blue Cross Blue Shield plan is called a","choices":["beneficiary","gatekeeper","subscriber","claimant"],"answer":2,"why":"Members of prepaid service organizations are referred to as subscribers."},{"q":"Blue Cross and Blue Shield plans are best described as","choices":["reimbursement insurers","prepaid service organizations","government programs","third-party administrators"],"answer":1,"why":"They are service organizations that are prepaid and pay contracted providers directly."},{"q":"Which statement about an HMO is correct?","choices":["It reimburses members for any provider they choose","It is available only to people over 65","It pays providers only on a fee-for-service basis","It both finances and delivers health care services"],"answer":3,"why":"An HMO combines the financing and delivery of care for members within its service area."},{"q":"In an HMO, the primary care physician who controls referrals to specialists is the","choices":["case manager","gatekeeper","administrator","subscriber"],"answer":1,"why":"The primary care physician acts as the gatekeeper for specialist and other care."},{"q":"A provider who receives a fixed monthly payment for each member, regardless of services used, is paid by","choices":["capitation","fee-for-service","reimbursement","coinsurance"],"answer":0,"why":"Capitation is a flat per-member payment that does not vary with the amount of care given."},{"q":"In which HMO model are the physicians salaried employees of the HMO?","choices":["IPA model","Network model","Staff model","Group model"],"answer":2,"why":"In a staff model the doctors are employed and paid a salary by the HMO."},{"q":"Physicians who keep their own offices and may also treat non-HMO patients belong to which model?","choices":["Staff model","Group model","Closed panel model","IPA model"],"answer":3,"why":"An independent practice association uses independent doctors in their own offices, an open panel arrangement."},{"q":"HMOs emphasize which of the following to control long-term costs?","choices":["High deductibles","Preventive care","Unlimited choice of specialists","Reimbursement of out-of-area care"],"answer":1,"why":"HMOs cover preventive services because early detection is less costly than later treatment."},{"q":"Which plan lets members use any provider but pays a larger share when network providers are used, with no gatekeeper required?","choices":["PPO","HMO","EPO","Staff model HMO"],"answer":0,"why":"A PPO has no gatekeeper and covers out-of-network care at a higher cost to the member."},{"q":"A plan that generally requires no gatekeeper but pays nothing for non-emergency care outside the network is","choices":["a PPO","a POS plan","an EPO","a commercial fee-for-service plan"],"answer":2,"why":"An exclusive provider organization covers network providers only, except in emergencies."},{"q":"A member has a primary care physician but may choose to go outside the network each time care is needed, at a higher cost. This is","choices":["an EPO","a staff model HMO","a MEWA","a POS plan"],"answer":3,"why":"A point of service plan combines an HMO gatekeeper with the option of out-of-network care at each visit."},{"q":"In a self-funded health plan, who bears the risk of paying employee claims?","choices":["The third-party administrator","The employer","The state insurance department","The employees' physicians"],"answer":1,"why":"A self-funded employer pays claims from its own funds and retains the risk."},{"q":"A third-party administrator","choices":["processes claims for a fee without assuming risk","insures the employer against large claims","regulates self-funded plans","acts as the members' primary care physician"],"answer":0,"why":"A TPA handles claims and administrative work but takes on no insurance risk."},{"q":"Stop-loss insurance purchased by a self-funded employer protects","choices":["each employee from deductibles","the TPA from errors","the employer from claims above a set amount","providers from unpaid bills"],"answer":2,"why":"Stop-loss coverage reimburses the employer when claims exceed a specific or aggregate threshold."},{"q":"An arrangement in which two or more employers join to provide health benefits to their employees is a","choices":["PPO","TPA","POS","MEWA"],"answer":3,"why":"A multiple employer welfare arrangement pools two or more employers to provide benefits."},{"q":"Which program is funded jointly by the federal and state governments and is based on financial need?","choices":["Medicare","Medicaid","TRICARE","Workers' compensation"],"answer":1,"why":"Medicaid is a needs-based program financed by both levels of government and administered by the states."},{"q":"TRICARE provides health coverage for","choices":["military members, retirees, and their dependents","low-income children only","all persons age 65 and older","employees injured on the job"],"answer":0,"why":"TRICARE is the health program for the military community."},{"q":"A requirement to obtain approval before a non-emergency hospital admission is an example of","choices":["retrospective review","concurrent review","prospective review","capitation"],"answer":2,"why":"Precertification takes place before care is given, which makes it prospective utilization review."},{"q":"A nurse who coordinates treatment for a member with a serious, high-cost condition and looks for effective alternatives is performing","choices":["capitation","stop-loss underwriting","retrospective review","case management"],"answer":3,"why":"Case management coordinates care for seriously ill or injured members to keep it effective and cost-efficient."}]},{"id":"ch15","num":15,"title":"Medical Expense Insurance","intro":{"hook":["A single night in a hospital can cost more than a month of rent. A surgery can cost more than a new car. Very few families could pay those bills out of a checking account, and that is exactly why medical expense insurance exists.","This chapter walks through how medical expense coverage is built. You will start with the older basic plans, move to major medical and the cost-sharing tools every client asks about, and then look at the Affordable Care Act rules that shape almost every individual and small group plan sold today.","You will also learn the tax-favored accounts that pair with health plans, the federal rules that protect people who leave a job, and how premiums and benefits are taxed.","Clients will ask you what a deductible is, why they still owe money after insurance pays, and what happens to their coverage if they lose their job. After this chapter you will be able to answer in plain language."],"objectives":["Describe the three types of basic medical expense coverage and their limits","Explain how deductibles, coinsurance, copayments and the out-of-pocket maximum share costs in a major medical plan","Identify the main consumer protections and plan rules created by the Affordable Care Act","Compare health savings accounts, flexible spending accounts and health reimbursement arrangements","Apply COBRA, HIPAA and coordination of benefits rules to group health situations","Summarize how medical expense premiums and benefits are taxed"],"avaIntro":"Hi, I'm Ava, and welcome to chapter fifteen. Today we are talking about medical expense insurance, the coverage that pays doctors, hospitals and pharmacies when someone gets sick or hurt. I like to start this chapter with a simple idea: health insurance is a cost-sharing deal. The client pays some, the insurance company pays the rest, and the policy spells out who pays what. We will begin with the older basic plans, then move into major medical, where you will meet deductibles, coinsurance and the out-of-pocket maximum. After that I will walk you through the Affordable Care Act, the tax-favored accounts like the health savings account, and the group rules such as COBRA. Take your time with the examples, because the exam loves to test the math. Let's get started."},"keywords":[{"term":"Basic hospital expense","def":"Coverage for room, board and miscellaneous hospital charges, usually with no deductible and low limits."},{"term":"Birthday rule","def":"Coordination of benefits rule making the plan of the parent whose birthday comes first in the calendar year primary for a child."},{"term":"COBRA","def":"Federal law letting workers and dependents keep group health coverage for a limited time after a qualifying event."},{"term":"Coinsurance","def":"The percentage split of covered costs between insurer and insured after the deductible is met."},{"term":"Coordination of benefits","def":"Group provision that sets which plan pays first so total benefits do not exceed the actual expense."},{"term":"Copayment","def":"A flat dollar amount the insured pays for a specific service, such as an office visit."},{"term":"Deductible","def":"The amount of covered expense the insured pays before the plan starts paying."},{"term":"Essential health benefits","def":"Ten categories of care that ACA-compliant individual and small group plans must cover."},{"term":"Flexible spending account","def":"Employer-sponsored account funded by pre-tax salary reductions, generally subject to a use-it-or-lose-it rule."},{"term":"Guaranteed issue","def":"Requirement that an insurer accept an applicant regardless of health status."},{"term":"Health reimbursement arrangement","def":"Employer-funded and employer-owned arrangement that reimburses employees for medical costs tax free."},{"term":"Health savings account","def":"Tax-favored account owned by an individual who is covered by a high deductible health plan."},{"term":"Major medical","def":"Coverage with high limits and broad benefits that uses deductibles and coinsurance."},{"term":"Metal tiers","def":"Bronze, silver, gold and platinum plan levels based on the share of average costs the plan pays."},{"term":"Out-of-pocket maximum","def":"The most an insured pays in cost sharing for covered services in a year; also called a stop-loss limit."},{"term":"Premium tax credit","def":"Federal subsidy that lowers the monthly premium for eligible marketplace enrollees."}],"sections":[{"title":"Basic Medical Expense Coverage","blocks":[{"type":"p","text":"Before major medical became common, most people had what the industry calls basic coverage. A basic plan pays for a narrow list of services, starts paying from the first dollar, and stops at a fairly low limit. You will not sell many of these today, but the exam still expects you to know the three kinds."},{"type":"p","text":"<b>Basic hospital expense<\/b> coverage pays for a hospital stay. It has two parts. The first is the daily room and board benefit, which pays a set amount per day for a set number of days. The second is the miscellaneous expense benefit, which covers extras such as the operating room, lab work, X-rays, drugs and supplies used during the stay. The miscellaneous benefit is often stated as a multiple of the daily room rate."},{"type":"p","text":"<b>Basic surgical expense<\/b> coverage pays the surgeon, the anesthesiologist and the operating room. Insurers decide how much to pay in one of three ways."},{"type":"list","items":["Surgical schedule: the policy lists procedures and the maximum dollar amount paid for each.","Relative value scale: each procedure is given a number of units, and the units are multiplied by a dollar conversion factor.","Usual, customary and reasonable: the insurer pays based on what providers in that area normally charge."]},{"type":"p","text":"<b>Basic medical expense<\/b> coverage, sometimes called basic physician's expense, pays for non-surgical doctor care. It usually covers visits while the patient is in the hospital and may also cover office visits, subject to a limit per visit and a limit on the number of visits."},{"type":"h","text":"What basic plans have in common"},{"type":"table","head":["Feature","Basic plans"],"rows":[["Deductible","Usually none; this is called first-dollar coverage"],["Coinsurance","Usually none"],["Benefit limits","Low, with a separate limit for each type of service"],["Scope","Narrow; only the listed services are paid"]]},{"type":"p","text":"The weakness is easy to see. First-dollar coverage feels generous for a small claim, but a serious illness can run past the limits quickly, leaving the insured to pay everything above them."},{"type":"example","text":"Rosa has a basic hospital policy that pays a fixed daily room benefit for up to 30 days. She is hospitalized for 45 days. The policy pays nothing toward room and board for the last 15 days, and those charges are hers."},{"type":"tip","text":"If a question mentions first-dollar coverage, no deductible and low limits, the answer is a basic plan, not major medical."}]},{"title":"Major Medical and Cost Sharing","blocks":[{"type":"p","text":"<b>Major medical<\/b> insurance was designed to cover large, unpredictable bills. It has high benefit limits and covers a wide range of services in and out of the hospital. In exchange, the insured shares in the cost. Cost sharing keeps premiums lower and discourages unnecessary use of care."},{"type":"p","text":"There are two ways major medical is sold. A supplemental major medical plan sits on top of a basic plan and picks up where the basic limits end. A comprehensive major medical plan combines basic and major medical benefits into one policy, and it is the design most people have today."},{"type":"h","text":"The cost-sharing tools"},{"type":"list","items":["Deductible: the amount the insured pays first. A calendar-year deductible is met once per year. A per-cause deductible applies to each separate illness or injury.","Corridor deductible: a deductible that applies between basic benefits and supplemental major medical benefits.","Integrated deductible: an amount that can be satisfied by benefits paid under the basic plan.","Family deductible: a cap on the number of individual deductibles one family must meet in a year.","Carryover provision: expenses in the last three months of the year that did not meet the deductible can count toward next year's deductible.","Coinsurance: a percentage split after the deductible, such as 80/20, where the insurer pays the larger share.","Copayment: a flat dollar amount paid at the time of service."]},{"type":"p","text":"The <b>out-of-pocket maximum<\/b>, also called the stop-loss limit, protects the insured from unlimited coinsurance. Once the insured's cost sharing for the year reaches this cap, the plan pays 100 percent of covered expenses for the rest of the year."},{"type":"flow","nodes":["Insured pays deductible","Insured and insurer split coinsurance","Out-of-pocket maximum reached","Insurer pays 100%"],"caption":"How a covered claim moves through a major medical plan during the year."},{"type":"example","text":"Dan's plan has a $1,000 deductible and 80/20 coinsurance. He has an $11,000 covered bill. He pays the first $1,000. Of the remaining $10,000 he pays 20 percent, or $2,000. Dan's total is $3,000 and the insurer pays $8,000."},{"type":"p","text":"Major medical plans also list exclusions. Common ones are cosmetic surgery that is not medically necessary, care covered by workers' compensation, and custodial care."},{"type":"tip","text":"On math questions, always subtract the deductible first, then apply the coinsurance percentage to what is left."}]},{"title":"The Affordable Care Act","blocks":[{"type":"p","text":"The Patient Protection and Affordable Care Act, known as the ACA, changed how individual and small group health plans are designed, priced and sold. Its goal was to make coverage available to people no matter what their health history is."},{"type":"h","text":"Key consumer protections"},{"type":"list","items":["Guaranteed issue: an insurer must accept any eligible applicant during an enrollment period and cannot turn someone down because of health.","No pre-existing condition exclusions.","No lifetime or annual dollar limits on essential health benefits.","Children may stay on a parent's plan until age 26, whether or not they are married, in school or living at home.","Preventive care, such as screenings and immunizations, is covered with no cost sharing when received in network.","Premiums may vary only by age, tobacco use, geographic area and whether the plan covers an individual or a family. Health status and gender cannot be used."]},{"type":"p","text":"<b>Essential health benefits<\/b> are ten categories of care every compliant individual and small group plan must include: outpatient care, emergency services, hospitalization, maternity and newborn care, mental health and substance use services, prescription drugs, rehabilitative and habilitative services, laboratory services, preventive and wellness services, and pediatric services including dental and vision for children."},{"type":"h","text":"Metal tiers"},{"type":"table","head":["Tier","Plan pays on average","Enrollee pays on average"],"rows":[["Bronze","60%","40%"],["Silver","70%","30%"],["Gold","80%","20%"],["Platinum","90%","10%"]]},{"type":"p","text":"Lower tiers have lower premiums and higher cost sharing. All tiers cover the same essential health benefits. A catastrophic plan is also available to people under 30 and to those with a hardship exemption."},{"type":"h","text":"The marketplace and financial help"},{"type":"p","text":"The health insurance marketplace, also called the exchange, is where individuals compare and buy qualified health plans. A <b>premium tax credit<\/b> lowers the monthly premium for people whose household income falls in the eligible range. Cost-sharing reductions lower deductibles, copays and coinsurance for lower-income enrollees, but only if they choose a silver plan."},{"type":"p","text":"People can enroll during the annual open enrollment period. Outside that window, a person needs a special enrollment period, which is triggered by a qualifying life event such as marriage, birth or adoption of a child, a move to a new coverage area, or loss of other coverage. The special window generally lasts 60 days from the event."},{"type":"flow","nodes":["Qualifying life event","Special enrollment period opens","Choose a plan","Coverage begins"],"caption":"Enrolling outside of open enrollment."},{"type":"tip","text":"Cost-sharing reductions are tied to silver plans, while premium tax credits can be used with any metal tier."}]},{"title":"HSAs, FSAs and HRAs","blocks":[{"type":"p","text":"Three tax-favored arrangements help people pay for the costs their health plan leaves behind. They sound alike, so focus on who owns the money, who puts it in, and whether it carries over."},{"type":"h","text":"Health savings account"},{"type":"p","text":"A <b>health savings account<\/b>, or HSA, is owned by the individual. To contribute, the person must be covered by a high deductible health plan, have no other disqualifying health coverage, not be enrolled in Medicare, and not be claimed as a dependent on someone else's tax return."},{"type":"list","items":["Contributions may come from the individual, the employer or both, up to an annual limit set by the IRS. People age 55 and older may add a catch-up amount.","Contributions are tax deductible or made pre-tax, growth is tax free, and withdrawals for qualified medical expenses are tax free.","Unused money rolls over every year, and the account goes with the owner when changing jobs.","Withdrawals for non-medical purposes are taxed as income and carry a 20 percent penalty. After age 65 the penalty no longer applies, though income tax still does."]},{"type":"h","text":"Flexible spending account"},{"type":"p","text":"A <b>flexible spending account<\/b>, or FSA, is set up by an employer as part of a cafeteria plan. The employee chooses an amount to set aside from pay before taxes and uses it for qualified medical costs during the plan year. The classic rule is use it or lose it: money not spent by the end of the plan year is forfeited, although an employer may offer a short grace period or a limited carryover. An FSA does not follow the employee to a new job."},{"type":"h","text":"Health reimbursement arrangement"},{"type":"p","text":"A <b>health reimbursement arrangement<\/b>, or HRA, is funded only by the employer. Employees cannot contribute. The employer decides how much to make available and whether unused amounts carry over. Reimbursements for qualified expenses are tax free to the employee, and the employer keeps the funds if the employee leaves."},{"type":"table","head":["Feature","HSA","FSA","HRA"],"rows":[["Who owns it","Individual","Employer plan","Employer"],["Who funds it","Individual, employer or both","Mostly employee salary reduction","Employer only"],["Needs a high deductible plan","Yes","No","No"],["Unused funds","Roll over","Generally forfeited","Employer decides"],["Portable","Yes","No","No"]]},{"type":"example","text":"Maya has a high deductible health plan and an HSA. She leaves her employer for a new job. The HSA balance is still hers, and she can keep using it for qualified medical expenses."},{"type":"tip","text":"If the question says the account is portable and requires a high deductible health plan, the answer is the HSA."}]},{"title":"Group Health Rules: COBRA, HIPAA and Coordination of Benefits","blocks":[{"type":"p","text":"Group health insurance is tied to a job, so the law provides safeguards for when that job ends or when a person is covered by more than one plan."},{"type":"h","text":"COBRA"},{"type":"p","text":"<b>COBRA<\/b> is a federal law that applies to employers with 20 or more employees. It lets employees and their covered dependents continue the same group health coverage after a qualifying event that would otherwise end it. The person electing COBRA pays the premium, which can be up to 102 percent of the full group cost. The extra 2 percent covers administration."},{"type":"table","head":["Qualifying event","Maximum continuation"],"rows":[["Termination of employment, other than for gross misconduct","18 months"],["Reduction in work hours","18 months"],["Death of the employee","36 months for dependents"],["Divorce or legal separation","36 months for dependents"],["Employee becomes entitled to Medicare","36 months for dependents"],["Child no longer qualifies as a dependent","36 months for that child"]]},{"type":"p","text":"A qualified beneficiary has 60 days to elect COBRA. Coverage can be extended to 29 months if the person is found disabled under Social Security rules. Texas also has a state continuation law for fully insured group plans: up to nine months for people who are not eligible for COBRA, and up to six more months after COBRA runs out."},{"type":"flow","nodes":["Qualifying event","Notice sent","60 days to elect","Coverage continues"],"caption":"The COBRA election process."},{"type":"h","text":"HIPAA"},{"type":"p","text":"The Health Insurance Portability and Accountability Act, or <b>HIPAA<\/b>, was passed to help people keep health coverage when they move between jobs. It gave workers credit for prior creditable coverage, as long as there was no break in coverage longer than 63 days, so a new group plan could not make them start a pre-existing condition waiting period over again. It also bars group plans from discriminating against an individual based on health status and sets privacy standards for protected health information."},{"type":"h","text":"Coordination of benefits"},{"type":"p","text":"The <b>coordination of benefits<\/b> provision applies when someone is covered by more than one group plan. It prevents overinsurance by naming one plan primary and the other secondary, so that combined payments never exceed 100 percent of the covered expense. A person's own employer plan is primary for that person. For children covered by both parents, the birthday rule applies: the plan of the parent whose birthday falls earlier in the calendar year pays first."},{"type":"tip","text":"Remember 18 months for job loss or reduced hours, and 36 months for death, divorce or a dependent aging out."}]},{"title":"Taxation of Premiums and Benefits","blocks":[{"type":"p","text":"Tax questions on medical expense insurance follow a consistent pattern. Ask two things: who paid the premium, and is the benefit paying back an actual medical cost? Medical expense benefits reimburse real expenses, so they are generally received free of income tax no matter who paid the premium."},{"type":"h","text":"Individually owned policies"},{"type":"p","text":"When a person buys a medical expense policy with personal after-tax money, the premium is treated as a medical expense. Medical expenses can be deducted only if the taxpayer itemizes, and only the portion of total unreimbursed medical expenses that is more than 7.5 percent of adjusted gross income counts. In practice many people get no deduction. The benefits are not taxable."},{"type":"h","text":"Group policies"},{"type":"list","items":["Premiums paid by the employer are deductible to the employer as a normal business expense.","Employer-paid premiums are not counted as taxable income to the employee.","The employee's own share of the premium is often paid pre-tax through a cafeteria plan.","Benefits paid for medical expenses are not taxable to the employee."]},{"type":"h","text":"Self-employed people"},{"type":"p","text":"Sole proprietors, partners and other self-employed people may generally deduct 100 percent of the health insurance premiums they pay for themselves, a spouse and dependents. This is taken as an adjustment to income, so the person does not have to itemize to claim it."},{"type":"table","head":["Situation","Premiums","Benefits"],"rows":[["Individual policy","Deductible only as itemized medical expenses above 7.5% of adjusted gross income","Tax free"],["Employer-paid group","Deductible to employer; not income to employee","Tax free"],["Self-employed","Generally 100% deductible","Tax free"]]},{"type":"example","text":"An employer pays the full premium for its workers' group major medical plan. The employer deducts the premium as a business expense. An employee who has a covered surgery does not report the premium or the claim payment as income."},{"type":"p","text":"Tax-favored accounts follow the rules from the earlier section: HSA contributions are deductible or pre-tax, and qualified withdrawals from an HSA, FSA or HRA are tax free."},{"type":"tip","text":"Medical expense benefits are tax free to the insured whether the premium was paid by the individual or by the employer."}]}],"summary":{"recap":["Basic medical expense plans come in three types: hospital, surgical and medical. They pay from the first dollar with no deductible, but their limits are low and their coverage is narrow.","Major medical plans offer high limits and broad coverage in exchange for cost sharing. The insured pays a deductible first, then a coinsurance share, until the out-of-pocket maximum is reached and the plan pays 100 percent.","The Affordable Care Act requires guaranteed issue, bans pre-existing condition exclusions, removes dollar limits on essential health benefits, covers preventive care with no cost sharing and lets children stay on a parent's plan to age 26. Plans are grouped into bronze, silver, gold and platinum tiers.","An HSA is individually owned, portable and paired with a high deductible health plan. An FSA is funded by salary reduction and is generally use it or lose it. An HRA is funded and owned by the employer.","COBRA continues group coverage for 18 or 36 months at up to 102 percent of the premium. HIPAA supports portability and privacy. Coordination of benefits sets primary and secondary plans so benefits do not exceed the expense.","Medical expense benefits are generally tax free. Employer-paid premiums are deductible to the employer and not income to the employee, while individual premiums are deductible only as itemized medical expenses above 7.5 percent of adjusted gross income."],"avaSummary":"Nice work finishing chapter fifteen. Let me pull the big ideas together for you. We started with basic medical expense coverage. There are three kinds: hospital, surgical and medical. They pay from the first dollar, but the limits are low, so a serious illness can outrun them. Next came major medical, which flips that idea. The limits are high, and the insured shares the cost. Remember the order: the deductible comes first, then coinsurance, and when the out-of-pocket maximum is reached the plan pays one hundred percent. Then we covered the Affordable Care Act. Think guaranteed issue, no pre-existing condition exclusions, ten essential health benefits, free preventive care in network, and children covered to age twenty-six. The metal tiers run from bronze at sixty percent to platinum at ninety percent. Premium tax credits lower the premium, and cost-sharing reductions require a silver plan. For the accounts, keep it simple. The health savings account belongs to the individual, needs a high deductible health plan and is portable. The flexible spending account is use it or lose it. The health reimbursement arrangement is employer money only. For group rules, COBRA applies to employers with twenty or more employees and lasts eighteen months for job loss or reduced hours and thirty-six months for death, divorce or a child aging out. Coordination of benefits uses the birthday rule for children. Finally, taxes: medical expense benefits are tax free, and employer-paid premiums are deductible to the employer and not income to the employee. Review the practice math once more, then take the chapter exam. You've got this.","reviewNotes":[{"objective":"Describe the three types of basic medical expense coverage and their limits","concepts":["Basic hospital expense pays room and board plus miscellaneous hospital charges.","Basic surgical expense pays surgeons using a schedule, a relative value scale or usual, customary and reasonable charges.","Basic medical expense pays for non-surgical physician care.","Basic plans are first-dollar coverage with low limits and narrow scope."],"terms":[{"term":"First-dollar coverage","def":"Benefits that begin with no deductible."},{"term":"Surgical schedule","def":"A list of procedures with the maximum amount payable for each."}]},{"objective":"Explain how deductibles, coinsurance, copayments and the out-of-pocket maximum share costs in a major medical plan","concepts":["The deductible is paid first, then coinsurance applies to the balance.","A copayment is a flat dollar amount; coinsurance is a percentage.","The out-of-pocket maximum caps the insured's cost sharing for the year.","A corridor deductible sits between a basic plan and supplemental major medical.","Comprehensive major medical combines basic and major medical in one policy."],"terms":[{"term":"Stop-loss limit","def":"Another name for the out-of-pocket maximum."},{"term":"Carryover provision","def":"Lets unmet expenses from the last three months count toward next year's deductible."}]},{"objective":"Identify the main consumer protections and plan rules created by the Affordable Care Act","concepts":["Guaranteed issue with no pre-existing condition exclusions.","Ten essential health benefits with no lifetime or annual dollar limits.","Dependents may stay covered to age 26 and preventive care has no cost sharing in network.","Metal tiers pay 60, 70, 80 and 90 percent of average costs.","Premium tax credits lower premiums; cost-sharing reductions require a silver plan.","Enrollment happens in open enrollment or a special enrollment period after a qualifying life event."],"terms":[{"term":"Marketplace","def":"The exchange where individuals compare and buy qualified health plans."},{"term":"Special enrollment period","def":"A window, generally 60 days, to enroll after a qualifying life event."}]},{"objective":"Compare health savings accounts, flexible spending accounts and health reimbursement arrangements","concepts":["An HSA requires a high deductible health plan, is owned by the individual and is portable.","HSA non-medical withdrawals before 65 are taxed and carry a 20 percent penalty.","An FSA is funded by pre-tax salary reduction and is generally use it or lose it.","An HRA is funded only by the employer and stays with the employer."],"terms":[{"term":"High deductible health plan","def":"A health plan with a higher deductible that makes a person eligible for an HSA."},{"term":"Cafeteria plan","def":"An employer plan that lets employees pay for certain benefits with pre-tax dollars."}]},{"objective":"Apply COBRA, HIPAA and coordination of benefits rules to group health situations","concepts":["COBRA applies to employers with 20 or more employees.","Continuation is 18 months for termination or reduced hours and 36 months for death, divorce, Medicare entitlement or loss of dependent status.","The COBRA premium may be up to 102 percent and the election period is 60 days.","HIPAA supports portability through creditable coverage and protects health information.","Under coordination of benefits, a person's own employer plan is primary and the birthday rule applies to children."],"terms":[{"term":"Qualifying event","def":"An event that would end group coverage and triggers COBRA rights."},{"term":"Creditable coverage","def":"Prior health coverage that counts toward a new plan's waiting period if there is no break longer than 63 days."}]},{"objective":"Summarize how medical expense premiums and benefits are taxed","concepts":["Medical expense benefits are generally received tax free.","Employer-paid group premiums are deductible to the employer and not income to the employee.","Individual premiums are deductible only as itemized medical expenses above 7.5 percent of adjusted gross income.","Self-employed people may generally deduct 100 percent of their health premiums."],"terms":[{"term":"Adjusted gross income","def":"Total income minus certain adjustments; used to measure the medical expense deduction threshold."}]}]},"exam":[{"q":"Which feature is typical of a basic hospital expense policy?","choices":["A high out-of-pocket maximum","First-dollar coverage with low limits","An 80/20 coinsurance split","A corridor deductible"],"answer":1,"why":"Basic plans usually pay from the first dollar with no deductible, but their benefit limits are low."},{"q":"The miscellaneous expense benefit in a basic hospital policy pays for:","choices":["Hospital extras such as lab work, X-rays and supplies","The surgeon's fee","Daily room and board","Physician office visits"],"answer":0,"why":"Miscellaneous expenses are the hospital extras beyond room and board, such as lab work, drugs and supplies."},{"q":"An insurer assigns each surgical procedure a number of units and multiplies the units by a dollar conversion factor. This method is called:","choices":["Usual, customary and reasonable","A surgical schedule","A relative value scale","Coordination of benefits"],"answer":2,"why":"A relative value scale uses units multiplied by a conversion factor to set the benefit."},{"q":"A policy has a $500 deductible and 80/20 coinsurance. The insured has a $5,500 covered claim. How much does the insured pay?","choices":["$500","$1,000","$1,100","$1,500"],"answer":3,"why":"The insured pays the $500 deductible plus 20 percent of the remaining $5,000, which is $1,000, for a total of $1,500."},{"q":"The purpose of the out-of-pocket maximum is to:","choices":["Limit the insured's total cost sharing in a year","Limit the amount the insurer pays in a year","Set the amount paid at each office visit","Exclude pre-existing conditions"],"answer":0,"why":"Once the insured's cost sharing reaches the out-of-pocket maximum, the plan pays 100 percent of covered expenses."},{"q":"A deductible that applies between a basic plan and a supplemental major medical plan is a:","choices":["Family deductible","Per-cause deductible","Corridor deductible","Carryover deductible"],"answer":2,"why":"The corridor deductible is paid after basic benefits are used up and before supplemental major medical begins."},{"q":"A flat $30 charge the insured pays at each doctor visit is a:","choices":["Coinsurance","Copayment","Deductible","Premium"],"answer":1,"why":"A copayment is a flat dollar amount paid at the time of service."},{"q":"Under the Affordable Care Act, a child may remain on a parent's health plan until age:","choices":["19","21","23","26"],"answer":3,"why":"The ACA allows dependent children to stay on a parent's plan until age 26."},{"q":"On average, a silver plan pays what share of covered health care costs?","choices":["60%","70%","80%","90%"],"answer":1,"why":"Silver plans pay about 70 percent of average costs, with the enrollee paying about 30 percent."},{"q":"Cost-sharing reductions are available to eligible enrollees who choose which type of plan?","choices":["Silver","Bronze","Gold","Catastrophic"],"answer":0,"why":"Cost-sharing reductions apply only when an eligible person enrolls in a silver plan."},{"q":"Which factor may an insurer use to set premiums for an ACA-compliant individual plan?","choices":["Gender","Medical history","Tobacco use","Occupation"],"answer":2,"why":"Premiums may vary only by age, tobacco use, geographic area and individual versus family coverage."},{"q":"Which event would allow a person to enroll in a marketplace plan outside of open enrollment?","choices":["Deciding the current plan costs too much","Receiving a new diagnosis","Turning 40","Losing other health coverage"],"answer":3,"why":"Loss of other coverage is a qualifying life event that opens a special enrollment period."},{"q":"To contribute to a health savings account, a person must be covered by:","choices":["A platinum plan","A high deductible health plan","Medicare","A basic hospital expense plan"],"answer":1,"why":"HSA eligibility requires coverage under a high deductible health plan and no enrollment in Medicare."},{"q":"Which arrangement is funded only by the employer?","choices":["Health savings account","Flexible spending account","Health reimbursement arrangement","Individual retirement account"],"answer":2,"why":"Only the employer may put money into an HRA; employees cannot contribute."},{"q":"The use-it-or-lose-it rule is most closely associated with a:","choices":["Flexible spending account","Health savings account","Major medical policy","Premium tax credit"],"answer":0,"why":"FSA funds not used by the end of the plan year are generally forfeited."},{"q":"An employee is laid off from a company with 50 employees. For how long may the employee continue group health coverage under COBRA?","choices":["6 months","12 months","36 months","18 months"],"answer":3,"why":"Termination of employment for reasons other than gross misconduct gives up to 18 months of COBRA continuation."},{"q":"What is the maximum premium a COBRA beneficiary can generally be charged?","choices":["100% of the group cost","102% of the group cost","110% of the group cost","125% of the group cost"],"answer":1,"why":"The beneficiary may be charged the full premium plus a 2 percent administrative fee."},{"q":"A child is covered under both parents' group health plans. Under the birthday rule, which plan is primary?","choices":["The plan of the older parent","The plan with the lower deductible","The plan of the parent whose birthday falls earlier in the calendar year","The plan that has been in force longer"],"answer":2,"why":"The birthday rule looks at the month and day of each parent's birthday, not the year of birth."},{"q":"An employer pays the entire premium for a group medical expense plan. How are the premiums treated?","choices":["Deductible to the employer and not taxable income to the employee","Not deductible to the employer and taxable to the employee","Deductible to the employer and taxable to the employee","Not deductible to the employer and not taxable to the employee"],"answer":0,"why":"Employer-paid group health premiums are a deductible business expense and are not income to employees."},{"q":"Benefits paid under an individually owned medical expense policy are generally:","choices":["Taxable as ordinary income","Taxable only above 7.5% of adjusted gross income","Taxable as capital gains","Received income tax free"],"answer":3,"why":"Medical expense benefits reimburse actual costs and are generally not taxable to the insured."}]},{"id":"ch16","num":16,"title":"Disability Income Insurance","intro":{"hook":["Ask a client what their most valuable asset is and most will say the house or the retirement account. For most working people the real answer is the ability to earn a paycheck. Over a career, that paycheck adds up to far more than any home.","Disability income insurance protects that paycheck. If an illness or injury keeps the insured from working, the policy pays a monthly benefit that replaces part of the lost income so rent, groceries and car payments still get paid.","This chapter covers how policies define disability, the time periods that control when benefits start and stop, why insurers limit how much they will pay, the riders that add flexibility, and how group and business disability plans work.","You will also learn how benefits are taxed, which is one of the most heavily tested ideas in this part of the exam."],"objectives":["Explain the purpose of disability income insurance","Distinguish among own occupation, any occupation, partial, residual, presumptive and recurrent disability","Describe how the probationary period, elimination period and benefit period affect a claim","Explain why insurers limit benefits to a share of income and how common riders change coverage","Compare group short-term and long-term disability plans","Identify business uses of disability insurance and how disability benefits are taxed"],"avaIntro":"Hi, it's Ava. Welcome to chapter sixteen, disability income insurance. Here is a question I ask every new agent: if you could not work for the next two years, how would you pay your bills? Most people do not have a good answer, and that is why this coverage matters so much. Disability income insurance does not pay doctors or hospitals. It pays the insured a monthly check to replace part of a lost paycheck. In this chapter we will look at how a policy defines disability, the waiting periods before benefits begin, how long benefits last, and the riders that can be added. We will finish with group plans, business uses and taxes. Pay close attention to the definitions, because small wording differences change who gets paid. Let's begin."},"keywords":[{"term":"Any occupation","def":"Definition of total disability requiring the insured to be unable to work in any job suited to their education, training and experience."},{"term":"Benefit period","def":"The maximum length of time disability benefits will be paid for a claim."},{"term":"Business overhead expense","def":"Policy that reimburses a business owner's ongoing office expenses while the owner is disabled."},{"term":"Cost of living adjustment rider","def":"Rider that increases benefits during a long claim to help keep pace with inflation."},{"term":"Disability buy-sell","def":"Policy that funds the purchase of a disabled owner's share of a business."},{"term":"Elimination period","def":"The waiting time after a disability begins before benefits are payable; a time deductible."},{"term":"Guaranteed insurability rider","def":"Rider that lets the insured buy more coverage at set times without proving good health."},{"term":"Key person disability","def":"Policy owned by a business that pays the business if an essential employee becomes disabled."},{"term":"Own occupation","def":"Definition of total disability requiring the insured to be unable to perform the duties of their own regular job."},{"term":"Partial disability","def":"Inability to perform some of the duties of a job or to work full time, usually paying a reduced flat benefit."},{"term":"Presumptive disability","def":"Specified severe losses, such as total loss of sight, that automatically qualify as total disability."},{"term":"Probationary period","def":"A period after the policy is issued during which sickness claims are not covered."},{"term":"Recurrent disability","def":"A disability that returns within a set time and is treated as a continuation of the earlier claim."},{"term":"Residual disability","def":"Benefit based on the percentage of income lost when the insured returns to work at reduced earnings."},{"term":"Social Security offset rider","def":"Rider that pays an added benefit when Social Security disability benefits are denied or are less than expected."},{"term":"Waiver of premium","def":"Provision that excuses premium payments while the insured is totally disabled."}],"sections":[{"title":"The Purpose of Disability Income Insurance","blocks":[{"type":"p","text":"Medical expense insurance pays the hospital. <b>Disability income insurance<\/b> pays the insured. Its job is to replace part of the earned income a person loses when a sickness or injury keeps them from working. The benefit is normally a set monthly amount, and the insured can spend it on anything: housing, food, loan payments or savings."},{"type":"p","text":"The need is easy to overlook. A long disability can be harder on a household than a death. Income stops, yet living costs continue and medical costs are often added on top. Savings run down fast, and other sources of help are limited."},{"type":"h","text":"Other sources and their gaps"},{"type":"list","items":["Workers' compensation pays only when the injury or illness is job related.","Social Security disability has a very strict definition. The person must be unable to engage in any substantial gainful activity, and the condition must be expected to last at least 12 months or to end in death. There is also a five-month waiting period.","Employer sick leave usually lasts days or weeks, not years.","Personal savings rarely cover more than a few months of expenses."]},{"type":"p","text":"Policies can be occupational or non-occupational. An occupational policy covers disabilities that happen on or off the job. A non-occupational policy covers only disabilities that happen off the job, on the assumption that workers' compensation handles work-related claims. Most group plans are non-occupational."},{"type":"h","text":"How injury is defined"},{"type":"p","text":"Policies also differ in how they define an accident. An accidental bodily injury definition, also called the results definition, only requires that the injury itself was unexpected. An accidental means definition is stricter: both the cause and the result must be unexpected. Accidental bodily injury is more favorable to the insured."},{"type":"flow","nodes":["Sickness or injury","Unable to work","Income stops","Policy pays monthly benefit"],"caption":"What disability income insurance is designed to do."},{"type":"example","text":"Luis, a self-employed electrician, injures his back at home and cannot work for eight months. Workers' compensation does not apply because the injury was not job related. His individual disability policy pays a monthly benefit after the waiting period."},{"type":"tip","text":"Disability income insurance replaces lost earnings; it does not reimburse medical bills."}]},{"title":"How Policies Define Disability","blocks":[{"type":"p","text":"Whether a claim is paid depends on the policy's definition of disability. Two people with the same injury can have different outcomes because their policies use different wording."},{"type":"h","text":"Total disability"},{"type":"p","text":"Under an <b>own occupation<\/b> definition, the insured is totally disabled when unable to perform the main duties of their own regular job. This is the more generous definition, and it costs more. It is common for professionals with specialized skills."},{"type":"p","text":"Under an <b>any occupation<\/b> definition, the insured is totally disabled only when unable to work in any job for which they are reasonably suited by education, training and experience. This is stricter and less expensive. Many policies blend the two, using own occupation for an initial period such as the first two years and any occupation after that."},{"type":"example","text":"A surgeon loses the fine use of one hand and can no longer operate, but could teach at a medical school. Under an own occupation policy the surgeon is totally disabled. Under an any occupation policy the surgeon probably is not."},{"type":"h","text":"Less than total disability"},{"type":"table","head":["Type","What it means","How it pays"],"rows":[["Partial","Insured cannot do some job duties or cannot work full time","A flat reduced amount, often half of the total disability benefit, for a short time"],["Residual","Insured is back at work but earning less because of the disability","A share of the total benefit equal to the percentage of income lost"],["Presumptive","A listed severe loss, such as total loss of sight, hearing, speech or the use of two limbs","The full benefit, even if the insured is able to work"],["Recurrent","The same or a related disability returns within a set time, commonly six months","Treated as a continuation of the first claim, with no new elimination period"]]},{"type":"p","text":"Residual benefits encourage people to go back to work. If the insured returns at 60 percent of prior earnings, the loss is 40 percent, so the policy pays 40 percent of the total disability benefit."},{"type":"p","text":"The recurrent disability provision protects the insured from waiting through a second elimination period for a relapse. If the disability comes back after the stated time has passed, it is treated as a new claim with a new elimination period and a new benefit period."},{"type":"tip","text":"Partial disability pays a flat percentage of the benefit, while residual disability pays in proportion to the income actually lost."}]},{"title":"Probationary, Elimination and Benefit Periods","blocks":[{"type":"p","text":"Three time periods control when a disability policy pays. Students mix them up often, so learn what starts each clock."},{"type":"h","text":"Probationary period"},{"type":"p","text":"The <b>probationary period<\/b> begins when the policy is issued. During this time, often 10 to 30 days, the policy will not pay for disabilities caused by sickness. It applies once, at the start of the policy, and it does not apply to accidents. Its purpose is to keep people from buying coverage for an illness they already know about."},{"type":"h","text":"Elimination period"},{"type":"p","text":"The <b>elimination period<\/b> begins when a disability starts. It is the number of days the insured must be disabled before benefits are payable, and no benefit is paid for that time. Think of it as a deductible measured in days instead of dollars. Common choices are 30, 60, 90 or 180 days. It applies to every new claim, whether caused by sickness or accident."},{"type":"p","text":"The longer the elimination period, the lower the premium, because the insurer avoids paying short claims. A client with a healthy emergency fund can choose a longer wait and save money."},{"type":"h","text":"Benefit period"},{"type":"p","text":"The <b>benefit period<\/b> is the longest time benefits will be paid for a single disability. It starts when the elimination period ends. Choices might be two years, five years, or until age 65. A longer benefit period means a higher premium."},{"type":"flow","nodes":["Policy issued","Probationary period ends","Disability begins","Elimination period ends","Benefits paid for benefit period"],"caption":"The order of the three time periods."},{"type":"table","head":["Period","Starts when","Applies to","Effect on premium"],"rows":[["Probationary","Policy is issued","Sickness only, one time","Not a pricing choice for the client"],["Elimination","Disability begins","Each claim, sickness or accident","Longer wait, lower premium"],["Benefit","Elimination period ends","Each claim","Longer period, higher premium"]]},{"type":"example","text":"Tara has a 90-day elimination period and a five-year benefit period. She becomes disabled on January 1. Benefits begin to accrue after 90 days of disability, and they can continue for up to five years if she stays disabled."},{"type":"tip","text":"The probationary period follows policy issue and the elimination period follows the start of a disability."}]},{"title":"Benefit Limits, Renewability and Riders","blocks":[{"type":"p","text":"Insurers will not replace 100 percent of a person's income. Benefits are normally capped at a share of earned income, commonly in the range of 60 to 70 percent. The reason is simple: if staying home paid as much as working, there would be little reason to recover and go back. Limiting the benefit reduces overinsurance and discourages malingering, which means pretending or prolonging a disability to keep collecting."},{"type":"p","text":"Underwriters look closely at occupation and income as well as health. A riskier job means a higher premium or a more limited policy. Insurers also check for other disability coverage so that total benefits from all sources stay below the insured's earnings."},{"type":"h","text":"Renewability"},{"type":"list","items":["Noncancellable: the insurer cannot cancel the policy or raise the premium as long as premiums are paid.","Guaranteed renewable: the insurer cannot cancel, but it may raise premiums for an entire class of insureds."]},{"type":"h","text":"Common riders"},{"type":"p","text":"The <b>cost of living adjustment rider<\/b>, or COLA, increases the monthly benefit each year while the insured is on claim, usually tied to a price index. It protects buying power during a long disability."},{"type":"p","text":"The <b>guaranteed insurability rider<\/b>, also called a future increase option, lets the insured buy additional coverage at stated dates or ages without medical evidence of insurability. The insured usually must still show enough income to justify the larger benefit."},{"type":"p","text":"The <b>Social Security offset rider<\/b>, also called a social insurance supplement, pays an added monthly amount when the insured is disabled but Social Security or another social insurance program denies the claim or pays less than the rider amount. If the government benefit is later paid, the rider benefit is reduced by that amount."},{"type":"p","text":"<b>Waiver of premium<\/b> excuses premium payments while the insured is totally disabled, commonly after the disability has lasted 90 days. Premiums paid during that waiting time are often refunded. The policy stays in force as if premiums were being paid."},{"type":"example","text":"A young physician buys a policy with a guaranteed insurability rider. Five years later her income has doubled and she has developed a health condition. She can still buy more coverage under the rider because no medical exam is required."},{"type":"tip","text":"The COLA rider raises benefits during a claim, while the guaranteed insurability rider raises the amount of coverage the insured can buy before a claim."}]},{"title":"Group Disability Plans","blocks":[{"type":"p","text":"Many workers get disability coverage through an employer. Group plans come in two forms that are meant to work together: short-term disability and long-term disability."},{"type":"p","text":"<b>Short-term disability<\/b>, or STD, has a brief elimination period and a brief benefit period. Benefits might begin right away for an accident and after about a week for sickness, and they typically last from 13 to 26 weeks. Benefits are often paid weekly."},{"type":"p","text":"<b>Long-term disability<\/b>, or LTD, picks up where short-term coverage ends. The elimination period is longer, often matching the length of the short-term plan, and the benefit period usually runs at least two years and may extend to age 65. Benefits are paid monthly, commonly around 60 percent of pay up to a stated dollar cap."},{"type":"table","head":["Feature","Short-term disability","Long-term disability"],"rows":[["Elimination period","Very short, from zero to a few days or weeks","Longer, often several months"],["Benefit period","Typically 13 to 26 weeks","Two years or more, often to age 65"],["Payment","Usually weekly","Usually monthly"],["Definition of disability","Usually own occupation","Often own occupation at first, then any occupation"]]},{"type":"flow","nodes":["Disability begins","Short-term plan pays","Short-term benefits end","Long-term plan pays"],"caption":"How group short-term and long-term plans fit together."},{"type":"h","text":"Other group features"},{"type":"list","items":["Group plans are usually non-occupational, because workers' compensation covers job-related disabilities.","Benefits are set by a formula based on earnings, not chosen by each employee.","Group long-term plans commonly reduce their benefit by amounts received from Social Security, workers' compensation or other employer plans. This is called integration or an offset.","A plan is contributory when employees pay part of the premium and noncontributory when the employer pays all of it."]},{"type":"p","text":"Group coverage is convenient and inexpensive, but it has limits. The benefit cap may leave high earners underinsured, and coverage usually ends when the job ends. That gap is a common reason clients add an individual policy."},{"type":"example","text":"Kim's employer provides short-term disability for 26 weeks and long-term disability with a 26-week elimination period. When Kim is disabled for a year, the short-term plan pays for the first six months and the long-term plan pays after that."},{"type":"tip","text":"A group long-term plan's elimination period is usually designed to end when short-term benefits run out."}]},{"title":"Business Uses and Taxation of Benefits","blocks":[{"type":"p","text":"A disability can threaten a business as much as a family. Three policy types address that risk."},{"type":"p","text":"<b>Business overhead expense<\/b> insurance, or BOE, reimburses the actual ongoing costs of running a business while the owner is disabled. Covered costs include rent, utilities, employee wages, insurance and similar fixed bills. It does not replace the owner's own salary or profit. Elimination periods and benefit periods are short, usually a year or two of benefits. Premiums are deductible as a business expense, and benefits are taxable income to the business, though the expenses they pay are deductible too."},{"type":"p","text":"A <b>disability buy-sell<\/b> policy, or disability buyout, provides the cash for the remaining owners or the business to buy the interest of an owner who becomes totally disabled. It has a long elimination period, often one to two years, so that no one is forced out during a disability that might end. The benefit may be a lump sum or installments. Premiums are not deductible and the benefits are received tax free."},{"type":"p","text":"<b>Key person disability<\/b> insurance covers an employee whose work is vital to the firm's income. The business owns the policy, pays the premium and receives the benefit, which it can use to hire a replacement or cover lost profits. Premiums are not deductible and benefits are tax free to the business."},{"type":"h","text":"Taxation of personal disability benefits"},{"type":"p","text":"The tax rule turns on who paid the premium and whether that money had already been taxed."},{"type":"table","head":["Who paid the premium","Premium","Benefit"],"rows":[["Individual, with after-tax dollars","Not deductible","Tax free"],["Employer pays all","Deductible to employer; not income to employee","Fully taxable to employee"],["Employer and employee share the cost","Employer share deductible to employer","Taxable in proportion to the employer-paid share"],["Business overhead expense","Deductible","Taxable"],["Buy-sell or key person","Not deductible","Tax free"]]},{"type":"example","text":"An employer pays 75 percent of the group disability premium and the employee pays 25 percent with after-tax dollars. The employee becomes disabled and receives $2,000 a month. Seventy-five percent, or $1,500, is taxable income, and $500 is tax free."},{"type":"tip","text":"If the premium was not deducted, the benefit is tax free; if the premium was deducted or paid by the employer, the benefit is taxable."}]}],"summary":{"recap":["Disability income insurance replaces part of the earned income lost when sickness or injury keeps the insured from working. It pays the insured, not medical providers.","Total disability may be defined as own occupation, which is broader, or any occupation, which is stricter. Partial disability pays a flat reduced benefit, residual pays in proportion to lost income, presumptive pays for listed severe losses, and recurrent treats a relapse as the same claim.","The probationary period follows policy issue and applies to sickness. The elimination period follows the start of each disability and acts as a time deductible. The benefit period is the longest time benefits are paid.","Insurers cap benefits at a share of income, commonly 60 to 70 percent, to keep an incentive to return to work. Riders such as COLA, guaranteed insurability, Social Security offset and waiver of premium adjust the coverage.","Group short-term disability pays for weeks or months, and group long-term disability takes over afterward. Business overhead expense, disability buy-sell and key person policies protect a business.","Benefits are tax free when the insured paid the premium with after-tax dollars and taxable when the employer paid. Business overhead expense premiums are deductible and its benefits are taxable."],"avaSummary":"Great job working through chapter sixteen. Let's review what matters most. Disability income insurance protects a paycheck. It pays the insured a monthly benefit when sickness or injury keeps them from working. Start with the definitions. Own occupation means the insured cannot do their own job, and it is the more generous definition. Any occupation means the insured cannot do any job that fits their education, training and experience. Partial disability pays a flat reduced amount for a short time. Residual disability pays based on the percentage of income lost. Presumptive disability covers losses like sight, hearing, speech or two limbs. Recurrent disability means a relapse within a set time continues the old claim with no new waiting period. Next, the time periods. The probationary period comes after the policy is issued and applies to sickness only. The elimination period comes after the disability begins and works like a deductible in days. The benefit period is how long payments last. Insurers limit benefits to a share of income so people still have a reason to return to work. For riders, cost of living raises benefits during a claim, and guaranteed insurability lets the insured buy more coverage without a medical exam. In group coverage, short-term pays first and long-term takes over. For business, overhead expense covers bills but not the owner's salary, buy-sell funds a buyout, and key person pays the business. Finally, taxes. If the insured paid the premium with after-tax money, benefits are tax free. If the employer paid, benefits are taxable. Review the tables, then take the exam.","reviewNotes":[{"objective":"Explain the purpose of disability income insurance","concepts":["Replaces part of earned income lost because of sickness or injury.","Pays a monthly benefit to the insured rather than to medical providers.","Workers' compensation covers only job-related disability, and Social Security uses a very strict definition with a five-month wait.","Occupational policies cover on and off the job; non-o
