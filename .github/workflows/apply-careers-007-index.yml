name: Apply Careers 010 Index Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-careers-007-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version config loader for responsive Careers release
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="./config.js?v=2026.08.27.009"></script>'
          new='<script src="./config.js?v=2026.08.27.010"></script>'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('versioned config.js loader not found')
          p.write_text(s)
          PY
      - name: Commit index patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "allshield-build-bot"
          git config user.email "allshield-build-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Version config loader for responsive Careers release"
          git push origin HEAD:main
