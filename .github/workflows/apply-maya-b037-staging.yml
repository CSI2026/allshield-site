name: Apply Maya B037 Staging

on:
  push:
    branches: [maya-creative-b037]
    paths:
      - '.github/workflows/apply-maya-b037-staging.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maya-creative-b037
      - name: Materialize B037 staged source and contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/ai-maya-marketing-manager supabase/seeds tests docs
          echo '[... huge base64 omitted for display ...]==' | base64 -d | gzip -d > supabase/functions/ai-maya-marketing-manager/index.ts
          echo '' | base64 -d | gzip -d > supabase/seeds/maya-marketing-capabilities-b037.sql
          echo '' | base64 -d | gzip -d > tests/maya-marketing-manager-contract.mjs
          echo '' | base64 -d | gzip -d > docs/maya-b037-professional-readiness.md
      - name: Verify B037 static contract
        shell: bash
        run: |
          set -euo pipefail
          cp supabase/functions/ai-maya-marketing-manager/index.ts /tmp/maya-b037.mjs
          node --check /tmp/maya-b037.mjs
          node tests/maya-marketing-manager-contract.mjs
      - name: Commit staged B037 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git rm .github/workflows/apply-maya-b037-staging.yml
          git add supabase/functions/ai-maya-marketing-manager/index.ts supabase/seeds/maya-marketing-capabilities-b037.sql tests/maya-marketing-manager-contract.mjs docs/maya-b037-professional-readiness.md
          git commit -m 'Stage Maya B037 professional paid marketing workstation'
          git push origin HEAD:maya-creative-b037
