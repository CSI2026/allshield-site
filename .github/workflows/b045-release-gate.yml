name: B045 Final Release Gate
on:
  push:
    branches: [social-professional-b045]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-professional-b045
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Finalize release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-info.js');s=p.read_text()
          old="label:'B045 Candidate — Professional Social Provider Verification'"
          if old not in s: raise SystemExit('B045 candidate label missing')
          s=s.replace(old,"label:'Production B045 — Professional Social Provider Verification — Certified'",1)
          anchor="    social_connection_center:'PASS',\n"
          extra="    social_connection_center:'PASS',\n    social_professional_provider_verification:'PASS',\n    social_engagement_scope_model:'PASS',\n    linkedin_company_page_verification:'PASS',\n    linkedin_engagement_api_probe:'PASS',\n    youtube_analytics_api_probe:'PASS',\n"
          if "social_professional_provider_verification" not in s:
            if anchor not in s: raise SystemExit('certification anchor missing')
            s=s.replace(anchor,extra,1)
          changes="    'Hardened professional social readiness so LinkedIn requires a verified Company Page plus organization engagement API access, and YouTube requires a verified channel plus a successful YouTube Analytics API probe before engagement readiness can pass',\n    'Separated engagement OAuth requirements from publishing and comment scopes so each capability is verified independently and fails closed when provider access is incomplete',\n"
          marker="  changes:[\n"
          if changes.splitlines()[0].strip() not in s:
            if marker not in s: raise SystemExit('changes anchor missing')
            s=s.replace(marker,marker+changes,1)
          p.write_text(s)
          PY
      - name: Exact release tests
        run: |
          grep -q "Production B045 — Professional Social Provider Verification — Certified" build-info.js
          grep -q "required_engagement_scopes" supabase/migrations/20260829_social_professional_engagement_scopes_b045.sql
          node --check social-connection-center.js
          node tests/social-professional-b045-contract.mjs
          deno check --node-modules-dir=auto supabase/functions/social-connection-admin/index.ts
          npm test
      - name: Commit clean release tree
        run: |
          rm -f .github/workflows/b045-release-gate.yml
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Certify B045 professional social provider verification'
          git push origin social-professional-b045
