name: Patch B028 Index Loaders
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-b028-index-loaders.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force fresh B028 config and build info
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./config.js?v=2026.08.28.016','./config.js?v=2026.08.28.017')
          s=s.replace('<script src="./build-info.js"></script>','<script src="./build-info.js?v=B2026.08.28.028"></script>')
          p.write_text(s)
          PY
      - name: Commit B028 loader versions
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "allshield-build-bot"
          git config user.email "allshield-build-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Force B028 config and build info loaders"
          git push
