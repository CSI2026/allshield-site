 from coverage?","choices":["They cannot be measured in dollars","They are speculative risks","They are caused by morale hazards","They are catastrophic, affecting too many insureds at once"],"answer":3,"why":"A risk is not insurable if losses could strike a huge number of insureds at the same time."},{"q":"The tendency of people with a higher-than-average chance of loss to seek insurance more than others is called:","choices":["Adverse selection","Indemnity","Reinsurance","Risk retention"],"answer":0,"why":"Adverse selection tilts the pool toward poor risks."},{"q":"An insurer's primary protection against adverse selection is:","choices":["Advertising","Underwriting","Paying dividends","Reinsurance"],"answer":1,"why":"Underwriting screens and classifies applicants so the pool matches the insurer's pricing assumptions."},{"q":"In life insurance, when must insurable interest exist?","choices":["Only at the time of the insured's death","At both application and death","At the time of application","Whenever a premium is paid"],"answer":2,"why":"Insurable interest is required when the policy is applied for and need not continue to the time of death."},{"q":"Which person would NOT have an insurable interest in the proposed insured?","choices":["The insured's spouse","A business partner of the insured","A lender the insured owes money to","A casual acquaintance of the insured"],"answer":3,"why":"A casual acquaintance would suffer no financial or emotional loss, so no insurable interest exists."},{"q":"The principle that an insured should be restored to the same financial position as before the loss, without profit, is:","choices":["Indemnity","Adverse selection","Insurable interest","Retention"],"answer":0,"why":"Indemnity makes the insured whole but does not allow a gain from the loss."},{"q":"In a reinsurance arrangement, the insurer that transfers part of its risk to another insurer is the:","choices":["Reinsurer","Ceding insurer","Attorney-in-fact","Field underwriter"],"answer":1,"why":"The ceding (primary) insurer passes risk to the reinsurer, which accepts it."}]},{"id":"ch03","num":3,"title":"Legal Concepts of Insurance","intro":{"hook":["Think about the last time you clicked 'I agree' on something without reading it. You accepted terms someone else wrote, and you had no chance to change a word. An insurance policy works in a very similar way, and the law has special rules to keep that arrangement fair.","This chapter explains what makes an insurance policy a legally binding contract, the features that make it different from an ordinary business deal, and what happens when someone gives wrong or incomplete information on an application.","It also covers you. As an agent you act on behalf of an insurance company, and the law treats what you say, do, and know as if the company said, did, and knew it. Understanding where your authority starts and stops protects your clients, your insurer, and your license."],"objectives":["Identify the four elements required to form a legally binding contract.","Describe the special characteristics that set insurance contracts apart from other contracts.","Distinguish among representations, warranties, misrepresentation, concealment, and fraud.","Explain how waiver, estoppel, the parol evidence rule, and void or voidable status affect a policy.","Compare express, implied, and apparent agent authority.","Summarize the fiduciary duties an agent owes when handling premiums and client information."],"avaIntro":"Hi, I'm Ava, and welcome to chapter three. I know the phrase legal concepts can sound intimidating, but I promise this chapter is more practical than it looks. Every policy you ever sell is a contract, and I want you to understand exactly what makes that contract valid. We'll start with the four building blocks every contract needs. Then I'll walk you through the features that make insurance contracts unusual, with words like adhesion, aleatory, and unilateral. Don't worry, each one has a simple meaning. After that we'll look at what happens when an applicant leaves something out or stretches the truth. Finally, we'll talk about you: the authority an insurer gives you, and the trust you carry whenever you handle a client's money. These terms show up on the exam again and again, so let's learn them well."},"keywords":[{"term":"Adhesion","def":"A contract written entirely by one party that the other party can only accept or reject."},{"term":"Aleatory","def":"A contract in which the values exchanged are unequal and depend on an uncertain event."},{"term":"Apparent authority","def":"Authority the public reasonably believes an agent has because of the insurer's words or actions."},{"term":"Concealment","def":"Failing to disclose a known material fact when applying for insurance."},{"term":"Consideration","def":"The value each party gives to the other to make a contract binding."},{"term":"Estoppel","def":"A legal bar that stops a party from enforcing a right it previously gave up when someone relied on that."},{"term":"Express authority","def":"Authority spelled out in the written agency contract between the insurer and the agent."},{"term":"Fiduciary","def":"A person in a position of trust who handles the money or affairs of another."},{"term":"Implied authority","def":"Unwritten authority an agent needs in order to carry out the duties that are expressly granted."},{"term":"Parol evidence rule","def":"A rule that keeps earlier oral statements from changing the terms of a written contract."},{"term":"Representation","def":"A statement the applicant believes to be true to the best of his or her knowledge."},{"term":"Unilateral","def":"A contract in which only one party makes a legally enforceable promise."},{"term":"Utmost good faith","def":"The expectation that both parties will be honest and will not hide or distort important facts."},{"term":"Valued contract","def":"A contract that pays a stated amount regardless of the actual dollar loss."},{"term":"Waiver","def":"The voluntary surrender of a known legal right."},{"term":"Warranty","def":"A statement guaranteed to be absolutely true, which can void the contract if it is false."}],"sections":[{"title":"The Four Elements of a Legal Contract","blocks":[{"type":"p","text":"A contract is an agreement that a court will enforce. An insurance policy is a contract between the insurer and the policyowner. For any contract to be legally binding, four elements must be present. If even one is missing, there is no enforceable contract."},{"type":"h","text":"Agreement: offer and acceptance"},{"type":"p","text":"One party must make a definite <b>offer<\/b> and the other must accept it exactly as made. In life insurance, the applicant usually makes the offer by submitting a completed application together with the first premium. The insurer accepts when its underwriters approve the application and the policy is issued. If the application is sent in without a premium, the applicant is only inviting the insurer to make an offer. In that case the insurer makes the offer by issuing the policy, and the applicant accepts by paying the first premium on delivery."},{"type":"p","text":"If the insurer issues the policy on different terms than requested, such as a higher premium, that is a counteroffer. The applicant is then free to accept or reject it."},{"type":"h","text":"Consideration"},{"type":"p","text":"<b>Consideration<\/b> is the value each side gives. The applicant's consideration is the premium payment plus the statements made in the application. The insurer's consideration is its promise to pay benefits according to the policy terms."},{"type":"h","text":"Competent parties"},{"type":"p","text":"Each party must have the legal capacity to enter a contract. In general that means being of legal age, mentally competent, and not under the influence of drugs or alcohol. The insurer is considered competent when it is authorized to do business in the state."},{"type":"h","text":"Legal purpose"},{"type":"p","text":"The contract must have a lawful goal and cannot go against public policy. For life insurance, this is why insurable interest and the consent of the insured matter. A policy bought as a wager on a stranger's life has no legal purpose."},{"type":"flow","nodes":["Offer and acceptance","Consideration","Competent parties","Legal purpose"],"caption":"All four elements must be present for a binding contract."},{"type":"tip","text":"On the exam, the applicant's consideration is the premium and the statements in the application; the insurer's consideration is the promise to pay."}]},{"title":"Special Characteristics of Insurance Contracts","blocks":[{"type":"p","text":"Insurance policies meet the four basic requirements, but they also have several features that ordinary commercial contracts usually do not share. Expect a question on almost every one of these."},{"type":"p","text":"A policy is a contract of <b>adhesion<\/b>. The insurer writes every word, and the applicant can only take it or leave it. Because the buyer had no part in the drafting, courts interpret any unclear or ambiguous language in favor of the insured and against the insurer."},{"type":"p","text":"A policy is <b>aleatory<\/b>. The exchange of value is unequal and depends on chance. A person could pay one small premium and the beneficiary could collect a large death benefit, or a person could pay premiums for years on a term policy and never collect anything."},{"type":"p","text":"A policy is <b>unilateral<\/b>. Only the insurer makes a promise the law will enforce. The policyowner never promises to keep paying premiums and cannot be sued for stopping. If premiums stop, the coverage simply ends."},{"type":"p","text":"A policy is <b>conditional<\/b>. The insurer's duty to pay depends on certain conditions being met, such as paying the premium and providing proof of loss when a claim occurs."},{"type":"p","text":"A policy is a contract of <b>utmost good faith<\/b>. Each side relies on the honesty of the other. The insurer trusts the applicant to answer truthfully, and the applicant trusts the insurer to pay valid claims."},{"type":"h","text":"Valued versus indemnity"},{"type":"p","text":"A <b>valued contract<\/b> pays a stated amount no matter what the actual financial loss turns out to be. Life insurance is a valued contract. An <b>indemnity contract<\/b> pays only the amount of the actual loss, with the aim of restoring the insured to the same financial position as before. Most medical expense coverage works this way, so the insured should not profit from a claim."},{"type":"table","head":["Characteristic","What it means"],"rows":[["Adhesion","Insurer writes it; ambiguity favors the insured"],["Aleatory","Unequal exchange that depends on chance"],["Unilateral","Only the insurer makes an enforceable promise"],["Conditional","Payment depends on conditions being met"],["Utmost good faith","Both sides must be honest"],["Valued","Pays a stated amount, as in life insurance"],["Indemnity","Pays the actual loss, as in medical expense coverage"]]},{"type":"tip","text":"If a question mentions ambiguous policy wording being read in the insured's favor, the answer is adhesion."}]},{"title":"Representations, Warranties, Concealment, and Fraud","blocks":[{"type":"p","text":"Underwriters decide whether to issue a policy largely from the answers on the application. The law sorts those answers, and any problems with them, into a few categories."},{"type":"p","text":"A <b>representation<\/b> is a statement the applicant believes is true to the best of his or her knowledge. It is not a guarantee. Statements made on a life or health insurance application are treated as representations, not warranties, unless fraud is involved."},{"type":"p","text":"A <b>warranty<\/b> is a statement guaranteed to be literally and completely true. If a warranty turns out to be false in any respect, the contract can be voided, even if the error was innocent or minor. That harsh result is the reason application answers are treated as representations instead."},{"type":"p","text":"A <b>misrepresentation<\/b> is a statement that is untrue. An untrue statement alone does not automatically cancel coverage. It must be a <b>material misrepresentation<\/b>, meaning that if the insurer had known the truth, it would have declined the risk or issued the policy on different terms. A material misrepresentation gives the insurer grounds to rescind the policy."},{"type":"p","text":"<b>Concealment<\/b> is staying silent about a known material fact. Nothing false is said, but something important is held back. Like a material misrepresentation, concealment of a material fact can allow the insurer to void the contract."},{"type":"p","text":"<b>Fraud<\/b> is the most serious. It is an intentional deception meant to get another party to give up something of value. Fraud requires a deliberate false statement or concealment, an intent that the other party rely on it, actual reliance, and resulting harm."},{"type":"table","head":["Term","Key idea"],"rows":[["Representation","Believed true to the best of knowledge"],["Warranty","Guaranteed absolutely true"],["Material misrepresentation","False statement that would have changed the underwriting decision"],["Concealment","Withholding a known material fact"],["Fraud","Intentional deception that causes harm"]]},{"type":"example","text":"An applicant writes that her last doctor visit was in March when it was actually in April. That is a misrepresentation, but it would not have changed the underwriting decision, so it is not material. If she had left off a recent heart attack, that would be material."},{"type":"tip","text":"Remember: application answers are representations, and only a material misrepresentation can void the policy."}]},{"title":"Waiver, Estoppel, and Reading the Contract","blocks":[{"type":"p","text":"Several legal rules control how a policy is enforced once it is in place. These rules often decide who wins when the insurer and the insured disagree."},{"type":"h","text":"Waiver and estoppel"},{"type":"p","text":"A <b>waiver<\/b> is the voluntary giving up of a known right. It can be stated outright or shown by conduct. If an insurer issues a policy even though a question on the application was left blank, it has waived its right to that answer."},{"type":"p","text":"<b>Estoppel<\/b> follows from waiver. Once a party has given up a right, and the other party has reasonably relied on that, the first party is blocked from going back and enforcing the right later."},{"type":"flow","nodes":["Insurer gives up a right","Insured relies on it","Insurer is barred from enforcing it"],"caption":"Waiver comes first; estoppel prevents the insurer from reversing course."},{"type":"example","text":"An insurer repeatedly accepts a policyowner's premium two weeks after the grace period ends without objection. When a claim arises after another late payment, the insurer may be estopped from denying it on the grounds of late payment."},{"type":"h","text":"Parol evidence rule"},{"type":"p","text":"Parol means oral. The <b>parol evidence rule<\/b> says that once an agreement is put in writing, earlier spoken statements cannot be used to change or contradict the written terms. The written policy is what counts. This is why a promise an agent makes out loud does not rewrite the policy."},{"type":"h","text":"Void and voidable contracts"},{"type":"p","text":"A <b>void contract<\/b> is not really a contract at all. It lacks one of the required elements and has never had legal effect, so neither side can enforce it. A contract with an illegal purpose is void."},{"type":"p","text":"A <b>voidable contract<\/b> is valid and binding unless the party with the right to cancel chooses to set it aside. A policy obtained through a material misrepresentation is voidable by the insurer. A contract signed by a minor is generally voidable by the minor."},{"type":"tip","text":"Void means it never had legal force; voidable means it is in force until the wronged party chooses to cancel it."}]},{"title":"Agent Authority","blocks":[{"type":"p","text":"The law of agency describes the relationship between a <b>principal<\/b> and an <b>agent<\/b>. In insurance, the principal is the insurer and the agent is the licensed person who acts for it. The agent represents the insurance company, not the applicant."},{"type":"p","text":"Three rules follow from this relationship. First, the acts of the agent, when within the scope of authority, are treated as the acts of the insurer. Second, a contract completed by the agent on the insurer's behalf is the insurer's contract. Third, knowledge the agent gains while doing the job is presumed to be knowledge of the insurer. If a client tells the agent about a health condition, the law assumes the insurer has been told."},{"type":"h","text":"Three types of authority"},{"type":"p","text":"<b>Express authority<\/b> is what the insurer puts in writing in the agency contract. Typical examples are the authority to solicit applications, collect initial premiums, and issue receipts."},{"type":"p","text":"<b>Implied authority<\/b> is not written down, but it is reasonably necessary to carry out the express duties. If the contract lets an agent solicit applications, the agent has implied authority to phone prospects, set appointments, and use the insurer's sales materials."},{"type":"p","text":"<b>Apparent authority<\/b> is the authority a reasonable member of the public believes the agent has, based on what the insurer has said or done. If the insurer supplies an agent with its logo, forms, and business cards, a customer can fairly assume the agent speaks for that company, even where the agent's actual authority is narrower."},{"type":"table","head":["Type","Source","Example"],"rows":[["Express","Written agency contract","Authority to collect the initial premium"],["Implied","Needed to carry out express duties","Calling prospects to set appointments"],["Apparent","Public's reasonable belief created by the insurer","Customer relies on agent holding company forms and receipts"]]},{"type":"flow","nodes":["Insurer (principal)","Agent","Applicant"],"caption":"The agent acts for the insurer when dealing with the applicant."},{"type":"tip","text":"Apparent authority is created by the insurer's conduct as seen by the public, not by anything written in the agent's contract."}]},{"title":"The Agent as a Fiduciary","blocks":[{"type":"p","text":"A <b>fiduciary<\/b> is someone placed in a position of special trust, especially where another person's money is involved. An insurance agent is a fiduciary because clients hand over premium payments and private information, and the insurer depends on the agent to pass both along properly."},{"type":"h","text":"Handling premiums"},{"type":"p","text":"Premiums an agent collects belong to the insurer, not the agent. They are held in trust and must be sent to the insurer promptly. Because the agent's knowledge and acts are treated as the insurer's, a premium paid to the agent is generally considered paid to the insurer."},{"type":"p","text":"An agent must never mix premium money with personal money. Doing so is called <b>commingling<\/b>, and it is a serious violation that can cost an agent the license. Using client premiums for personal purposes is even more serious."},{"type":"h","text":"Duties to the insurer and the client"},{"type":"list","items":["Send collected premiums and completed applications to the insurer without delay.","Keep premium funds separate from personal funds.","Report everything relevant to the risk honestly to the insurer.","Explain policy features, costs, and limits accurately to the applicant.","Recommend only coverage that fits the client's needs.","Keep the client's personal and financial information confidential."]},{"type":"p","text":"Although the agent legally represents the insurer, the agent also has an ethical responsibility to the applicant. Clients rely on the agent's knowledge and usually cannot check it themselves. Giving honest advice and full disclosure is part of acting in good faith."},{"type":"p","text":"An agent who acts outside the authority granted, or who breaches these duties, can be held personally liable for the harm that results. Many agents carry errors and omissions insurance for protection against claims that arise from mistakes in their professional work."},{"type":"example","text":"An agent collects a first premium check on Friday and deposits it into a personal checking account, planning to forward the money on Monday. Even though the agent intends to pay it over, this is commingling and a breach of fiduciary duty."},{"type":"tip","text":"Any question about an agent's responsibility for premiums collected points to the word fiduciary."}]}],"summary":{"recap":["Every insurance policy is a contract, and a valid contract needs four elements: agreement through offer and acceptance, consideration, competent parties, and a legal purpose.","Insurance contracts have their own special traits. They are contracts of adhesion, aleatory, unilateral, conditional, and based on utmost good faith. Life insurance is a valued contract, while most medical expense coverage follows the principle of indemnity.","Statements on an application are representations, not warranties. A material misrepresentation or the concealment of a material fact can make the policy voidable. Fraud is intentional deception that causes harm.","Waiver is giving up a known right, and estoppel prevents taking that right back after someone has relied on the waiver. The parol evidence rule keeps earlier oral statements from changing the written policy. A void contract never had legal force; a voidable one stands until the party with the right cancels it.","Agents represent the insurer. Their authority may be express, implied, or apparent, and their knowledge is treated as the insurer's knowledge.","Agents are fiduciaries. Premiums must be forwarded promptly and never commingled with personal funds."],"avaSummary":"Nice work getting through chapter three. Let me pull the big ideas together for you. First, a policy is a contract, and every contract needs four things: offer and acceptance, consideration, competent parties, and a legal purpose. Remember that the applicant's consideration is the premium plus the statements on the application, and the insurer's consideration is its promise to pay. Next, we covered what makes insurance contracts special. Adhesion means the insurer wrote it, so unclear wording favors the insured. Aleatory means the exchange is unequal and depends on chance. Unilateral means only the insurer makes an enforceable promise. Conditional means certain things must happen before the insurer pays. And utmost good faith means both sides are expected to be honest. Life insurance is a valued contract, while medical expense coverage is based on indemnity. We then looked at application answers. They are representations, not warranties. Only a material misrepresentation or concealment gives the insurer grounds to void the policy, and fraud requires intent to deceive. We also covered waiver, which is giving up a known right, and estoppel, which stops a party from taking that right back. The parol evidence rule protects the written contract from earlier spoken statements. Finally, we talked about your role. You represent the insurer, with express, implied, and apparent authority, and what you know, the insurer is presumed to know. You are also a fiduciary, so premiums are never mixed with your own money. Review the key terms, then take the chapter exam when you feel ready.","reviewNotes":[{"objective":"Identify the four elements required to form a legally binding contract.","concepts":["The four elements are agreement (offer and acceptance), consideration, competent parties, and legal purpose.","An application submitted with the first premium is an offer from the applicant.","An application submitted without premium is only an invitation; the insurer makes the offer by issuing the policy.","Issuing a policy on changed terms is a counteroffer.","Insurable interest and consent support the legal purpose of a life policy."],"terms":[{"term":"Consideration","def":"The value each party gives: premium and application statements from the applicant, a promise to pay from the insurer."},{"term":"Competent parties","def":"Parties with the legal capacity to contract, such as adults of sound mind and authorized insurers."}]},{"objective":"Describe the special characteristics that set insurance contracts apart from other contracts.","concepts":["Adhesion: the insurer drafts the contract and ambiguity is resolved in the insured's favor.","Aleatory: unequal exchange of value depending on an uncertain event.","Unilateral: only the insurer is legally bound to perform.","Conditional: payment depends on conditions such as premium payment and proof of loss.","Life insurance is a valued contract; medical expense insurance is an indemnity contract."],"terms":[{"term":"Adhesion","def":"A take-it-or-leave-it contract prepared by one party."},{"term":"Aleatory","def":"A contract with an unequal exchange based on chance."},{"term":"Valued contract","def":"A contract paying a stated sum regardless of actual loss."}]},{"objective":"Distinguish among representations, warranties, misrepresentation, concealment, and fraud.","concepts":["Application statements are representations, not warranties, absent fraud.","A warranty must be literally true or the contract can be voided.","A misrepresentation must be material to give the insurer grounds to rescind.","Concealment is silence about a known material fact.","Fraud involves intent to deceive, reliance, and harm."],"terms":[{"term":"Representation","def":"A statement believed true to the best of the applicant's knowledge."},{"term":"Warranty","def":"A statement guaranteed to be absolutely true."},{"term":"Concealment","def":"Withholding a known material fact."}]},{"objective":"Explain how waiver, estoppel, the parol evidence rule, and void or voidable status affect a policy.","concepts":["Waiver is the voluntary surrender of a known right, by words or conduct.","Estoppel bars a party from reasserting a right after another has relied on its waiver.","The parol evidence rule keeps prior oral statements from altering the written contract.","A void contract never had legal effect.","A voidable contract is valid until the entitled party chooses to cancel it."],"terms":[{"term":"Waiver","def":"Giving up a known legal right voluntarily."},{"term":"Estoppel","def":"A bar against enforcing a right previously waived."},{"term":"Parol evidence rule","def":"Oral statements made before the written contract cannot change it."}]},{"objective":"Compare express, implied, and apparent agent authority.","concepts":["The insurer is the principal and the agent represents the insurer.","Express authority is written in the agency contract.","Implied authority is unwritten but needed to perform express duties.","Apparent authority arises from what the insurer leads the public to believe.","The agent's knowledge is presumed to be the insurer's knowledge."],"terms":[{"term":"Express authority","def":"Authority stated in the written agency agreement."},{"term":"Implied authority","def":"Incidental authority needed to carry out express duties."},{"term":"Apparent authority","def":"Authority the public reasonably assumes from the insurer's conduct."}]},{"objective":"Summarize the fiduciary duties an agent owes when handling premiums and client information.","concepts":["An agent is a fiduciary because the agent handles money and information belonging to others.","Premiums are held in trust and must be forwarded to the insurer promptly.","Commingling premiums with personal funds is prohibited.","Agents must be honest with both the insurer and the applicant.","An agent who exceeds authority can be personally liable."],"terms":[{"term":"Fiduciary","def":"A person in a position of financial trust."},{"term":"Commingling","def":"Mixing premium funds with the agent's personal funds."}]}]},"exam":[{"q":"Which of the following is NOT one of the four elements of a legal contract?","choices":["Consideration","Competent parties","A written signature from a witness","Legal purpose"],"answer":2,"why":"The four elements are agreement, consideration, competent parties, and legal purpose. A witness signature is not required."},{"q":"An applicant submits a completed life insurance application along with the first premium. In contract terms, the applicant has made:","choices":["An offer","An acceptance","A counteroffer","A warranty"],"answer":0,"why":"An application submitted with the initial premium is an offer; the insurer accepts by issuing the policy."},{"q":"The insurer's consideration in an insurance contract is:","choices":["The premium payment","The statements in the application","The agent's commission","The promise to pay benefits under the policy"],"answer":3,"why":"The insurer gives its promise to pay; the applicant gives the premium and application statements."},{"q":"A court interprets unclear policy language in favor of the insured. This reflects which characteristic of insurance contracts?","choices":["Aleatory","Adhesion","Unilateral","Conditional"],"answer":1,"why":"Because the insurer writes the contract, ambiguity is resolved against the insurer under the principle of adhesion."},{"q":"A policyowner pays one monthly premium and dies, and the beneficiary receives the full death benefit. This unequal exchange illustrates that insurance is:","choices":["A contract of adhesion","A unilateral contract","An aleatory contract","A conditional contract"],"answer":2,"why":"An aleatory contract involves an unequal exchange of value that depends on an uncertain event."},{"q":"An insurance contract is called unilateral because:","choices":["Only the insurer makes a legally enforceable promise","Only the insurer may write the policy language","Both parties exchange equal value","The policyowner must pay premiums for life"],"answer":0,"why":"Only the insurer is legally bound to perform; the policyowner cannot be forced to keep paying premiums."},{"q":"A life insurance policy pays its stated face amount without regard to the actual financial loss. This makes it:","choices":["An indemnity contract","A voidable contract","A conditional contract","A valued contract"],"answer":3,"why":"A valued contract pays a stated amount, which is how life insurance works."},{"q":"Statements made by an applicant on a life insurance application are generally considered to be:","choices":["Warranties","Representations","Waivers","Conditions"],"answer":1,"why":"Application answers are representations, meaning they are true to the best of the applicant's knowledge."},{"q":"A statement that is guaranteed to be absolutely true is a:","choices":["Representation","Concealment","Warranty","Waiver"],"answer":2,"why":"A warranty is guaranteed to be literally true and can void the contract if false."},{"q":"A misrepresentation is considered material when:","choices":["It is made orally instead of in writing","It involves the applicant's address","It is discovered after the policy is delivered","Knowing the truth would have changed the insurer's underwriting decision"],"answer":3,"why":"A material misrepresentation is one that would have caused the insurer to decline or change the terms of coverage."},{"q":"An applicant knowingly fails to mention a recent serious diagnosis that the application asked about. This is an example of:","choices":["Concealment","Waiver","Estoppel","Apparent authority"],"answer":0,"why":"Concealment is the failure to disclose a known material fact."},{"q":"The voluntary giving up of a known right is called:","choices":["Estoppel","Waiver","Adhesion","Consideration"],"answer":1,"why":"Waiver is the intentional and voluntary surrender of a known right."},{"q":"An insurer has regularly accepted late premiums from a policyowner without objection. The legal principle that may prevent the insurer from later denying a claim because of a late payment is:","choices":["Parol evidence","Indemnity","Estoppel","Warranty"],"answer":2,"why":"Estoppel prevents a party from reasserting a right it waived when the other party relied on that waiver."},{"q":"The parol evidence rule states that:","choices":["Oral statements made before a written contract cannot change its written terms","An agent's knowledge is the insurer's knowledge","A contract must have a legal purpose","Ambiguities are resolved in favor of the insured"],"answer":0,"why":"The rule protects the written contract from being altered by earlier oral statements."},{"q":"A contract that is valid but may be set aside by one of the parties is:","choices":["Void","Aleatory","Unilateral","Voidable"],"answer":3,"why":"A voidable contract remains in force until the party with the right to cancel does so."},{"q":"An agreement that lacks a legal purpose is:","choices":["Voidable by the insurer only","Void","Conditional","Valid until challenged"],"answer":1,"why":"A contract missing a required element, such as legal purpose, is void and never had legal effect."},{"q":"In the law of agency, an insurance agent legally represents the:","choices":["Applicant","Beneficiary","Insurer","State insurance department"],"answer":2,"why":"The insurer is the principal, and the agent acts on the insurer's behalf."},{"q":"The authority written into an agent's contract with the insurer is:","choices":["Express authority","Implied authority","Apparent authority","Fiduciary authority"],"answer":0,"why":"Express authority is the authority specifically stated in the agency agreement."},{"q":"An insurer gives an agent its application forms, receipts, and branded business cards. A customer reasonably assumes the agent can act for the insurer. This is:","choices":["Express authority","Implied authority","Waiver","Apparent authority"],"answer":3,"why":"Apparent authority comes from the impression the insurer's conduct creates in the mind of the public."},{"q":"An agent deposits a client's premium payment into the agent's personal bank account. The agent has violated fiduciary duty by:","choices":["Twisting","Commingling","Concealment","Estoppel"],"answer":1,"why":"Mixing premium money with personal funds is commingling and breaches the agent's fiduciary responsibility."}]},{"id":"ch04","num":4,"title":"Life Insurance Policy Types","intro":{"hook":["Imagine three clients walk into your office on the same day. One is a young parent with a new mortgage and a tight budget. One is a business owner who wants coverage that lasts a lifetime and builds value. One is a retired couple worried about the taxes their children will face on the family estate.","All three need life insurance, but none of them needs the same policy. This chapter walks through the main types of life insurance: term, whole life, the flexible and investment-based policies, and several special-purpose policies.","Knowing how each policy works, what it guarantees, and who it fits is the core of an agent's job. It is also one of the most heavily tested areas on the licensing exam."],"objectives":["Describe the features of term life insurance and its level, decreasing, increasing, renewable, and convertible forms.","Compare straight life, limited-pay, and single premium whole life policies.","Explain how cash value builds and how a policyowner can use it.","Differentiate universal, variable, variable universal, and indexed life insurance.","Identify the purpose of joint life, survivorship life, juvenile, and credit life policies.","Recognize what makes a policy a modified endowment contract and how that changes its tax treatment."],"avaIntro":"Hi, it's Ava. Welcome to chapter four, which is one of my favorites because this is where you learn the products you'll actually be offering. We'll begin with term insurance, the simplest and most affordable kind of coverage, and look at its different versions. Then we'll move to whole life, which lasts a lifetime and builds cash value along the way. After that I'll explain the more flexible policies: universal life, variable life, variable universal life, and indexed life. I'll show you who carries the investment risk in each one, because the exam loves that question. We'll finish with special policies that cover two lives, children, and loans, plus a quick look at something called a modified endowment contract. Take your time with the comparison tables. They'll make everything easier to remember."},"keywords":[{"term":"Cash value","def":"The savings element of a permanent policy that the owner can borrow against or receive on surrender."},{"term":"Convertible term","def":"Term coverage that can be exchanged for permanent insurance without proof of insurability."},{"term":"Credit life","def":"Insurance on a borrower's life that pays off the remaining loan balance at death."},{"term":"Decreasing term","def":"Term insurance with a level premium and a death benefit that shrinks over time."},{"term":"Indexed universal life","def":"Universal life whose credited interest is linked to a stock market index, with a guaranteed minimum."},{"term":"Joint life","def":"One policy covering two or more lives that pays at the first death."},{"term":"Level term","def":"Term insurance whose death benefit stays the same for the entire term."},{"term":"Limited-pay whole life","def":"Whole life with premiums compressed into a set number of years while coverage lasts for life."},{"term":"Modified endowment contract","def":"A life policy funded faster than the seven-pay test allows, which loses favorable tax treatment on withdrawals and loans."},{"term":"Renewable term","def":"Term coverage that can be continued for another term without proof of insurability."},{"term":"Separate account","def":"The insurer's investment account, apart from its general account, that backs variable products."},{"term":"Seven-pay test","def":"The test comparing premiums paid in the first seven years with the amount needed to pay up the policy in seven level annual payments."},{"term":"Straight life","def":"Whole life with level premiums payable for the insured's entire life, up to age 100."},{"term":"Survivorship life","def":"One policy covering two lives that pays only when the second insured dies."},{"term":"Universal life","def":"Permanent insurance with flexible premiums and an adjustable death benefit."},{"term":"Variable life","def":"Permanent insurance with fixed premiums whose cash value is invested in a separate account at the owner's risk."}],"sections":[{"title":"Term Life Insurance","blocks":[{"type":"p","text":"<b>Term life insurance<\/b> provides protection for a set period, such as 10, 20, or 30 years, or up to a stated age. If the insured dies during the term, the death benefit is paid. If the insured is still living when the term ends, the coverage stops and nothing is paid."},{"type":"p","text":"Term is often called pure protection because it has no cash value. For that reason it delivers the largest death benefit for the lowest initial premium. It suits needs that are temporary, such as covering the years while children are growing up or a debt is being paid down."},{"type":"h","text":"Types of term by death benefit"},{"type":"p","text":"<b>Level term<\/b> keeps the same death benefit throughout the term. With level premium term, the premium also stays the same for the whole period."},{"type":"p","text":"<b>Decreasing term<\/b> has a level premium, but the death benefit goes down each year until it reaches zero at the end of the term. It is commonly used to cover a mortgage or other loan whose balance also falls over time."},{"type":"p","text":"<b>Increasing term<\/b> has a death benefit that grows over the term. It is often added as a rider, for example to return premiums paid or to help coverage keep pace with the cost of living."},{"type":"h","text":"Renewable and convertible features"},{"type":"p","text":"A <b>renewable<\/b> term policy lets the owner continue coverage for another term without showing evidence of insurability. The premium for the new term is based on the insured's attained age, so it goes up at each renewal. Annually renewable term renews every year, with the premium rising each time."},{"type":"p","text":"A <b>convertible<\/b> term policy lets the owner exchange the term coverage for permanent insurance, again without evidence of insurability. The premium for the new permanent policy is typically based on the insured's attained age at conversion."},{"type":"table","head":["Type","Death benefit","Premium"],"rows":[["Level term","Stays the same","Level during the term"],["Decreasing term","Goes down","Level"],["Increasing term","Goes up","Usually increases"],["Annually renewable term","Stays the same","Rises each year"]]},{"type":"tip","text":"Both renewing and converting are done without evidence of insurability, and the new premium is based on attained age."}]},{"title":"Whole Life Insurance","blocks":[{"type":"p","text":"<b>Whole life insurance<\/b> is permanent protection. It is designed to last for the insured's entire life, traditionally to age 100, as long as premiums are paid. It has three guarantees: a level death benefit, a level premium, and a cash value that grows on a guaranteed schedule."},{"type":"p","text":"A whole life policy is said to mature, or endow, when the cash value equals the face amount. Traditionally this happens at age 100. If the insured is still alive at that point, the face amount is paid to the policyowner."},{"type":"p","text":"The different kinds of whole life offer the same lifetime protection. What changes is how long the premiums are paid."},{"type":"h","text":"Straight life"},{"type":"p","text":"<b>Straight life<\/b>, also called ordinary life or continuous premium whole life, spreads the premiums over the insured's whole life, up to age 100. Because the cost is spread over the longest period, it has the lowest annual premium of the whole life types."},{"type":"h","text":"Limited-pay whole life"},{"type":"p","text":"<b>Limited-pay whole life<\/b> squeezes the premiums into a shorter period. Examples are 20-pay life, where premiums are paid for 20 years, and life paid-up at 65, where premiums stop at age 65. Annual premiums are higher than straight life, and cash value builds faster. Once premiums end, the policy is paid up, but coverage still continues for life."},{"type":"h","text":"Single premium whole life"},{"type":"p","text":"<b>Single premium whole life<\/b> is paid for with one lump sum at the start. The policy is fully paid up from day one and has an immediate cash value."},{"type":"table","head":["Type","Premiums paid","Annual premium","Cash value growth"],"rows":[["Straight life","For life, to age 100","Lowest","Slowest"],["Limited-pay","Set number of years or to a set age","Higher","Faster"],["Single premium","One lump sum","One large payment","Immediate"]]},{"type":"flow","nodes":["Shorter premium period","Higher premium","Faster cash value growth"],"caption":"The fewer years premiums are paid, the larger each payment and the quicker cash value builds."},{"type":"example","text":"A 40-year-old buys a 20-pay life policy. She pays premiums until age 60, then stops. Her coverage continues for the rest of her life with no further premiums due."},{"type":"tip","text":"Limited-pay changes how long premiums are paid, not how long coverage lasts."}]},{"title":"How Cash Value Works","blocks":[{"type":"p","text":"<b>Cash value<\/b> is the living benefit that separates permanent insurance from term. Part of each premium in a permanent policy goes toward a reserve that grows over time. In a whole life policy this growth is guaranteed and shown in a table in the policy."},{"type":"p","text":"Cash value grows slowly in the early years, because much of the early premium goes to the insurer's costs of issuing the policy. It then picks up speed. In a whole life policy, the cash value is scheduled to reach the face amount at maturity."},{"type":"p","text":"The death benefit of a whole life policy can be thought of as two parts: the cash value and the insurer's net amount at risk. As the cash value rises, the amount the insurer has at risk goes down."},{"type":"flow","nodes":["Premiums paid","Cash value grows","Cash value equals face amount at maturity"],"caption":"How whole life cash value builds over the life of the policy."},{"type":"h","text":"What the owner can do with cash value"},{"type":"list","items":["Take a policy loan, using the cash value as security. Interest is charged, and any unpaid loan and interest are subtracted from the death benefit.","Surrender the policy and receive the cash surrender value, which ends the coverage.","Use a nonforfeiture option, such as trading the cash value for a smaller paid-up policy or for extended term coverage.","Leave it in the policy to keep growing."]},{"type":"h","text":"Tax treatment"},{"type":"p","text":"Cash value growth inside a life insurance policy is tax deferred, meaning the owner pays no income tax on the gain each year. Policy loans from a regular life insurance policy are generally not taxable. If the policy is surrendered, any amount received above the total premiums paid is taxed as ordinary income."},{"type":"example","text":"A policyowner has a $100,000 whole life policy and an outstanding loan of $10,000 including interest. If the insured dies, the beneficiary receives $90,000."},{"type":"tip","text":"An unpaid policy loan plus interest is deducted from the death benefit when the insured dies."}]},{"title":"Universal and Indexed Life","blocks":[{"type":"p","text":"<b>Universal life<\/b> is permanent insurance built for flexibility. It is sometimes described as flexible premium adjustable life. Within limits, the owner can raise, lower, or even skip premium payments, and can adjust the death benefit. An increase in the death benefit normally requires evidence of insurability."},{"type":"p","text":"Universal life is unbundled, which means the owner can see its separate parts. Premiums go into a cash value account. Each month the insurer subtracts the cost of insurance and expense charges and adds interest. The policy stays in force as long as the cash value is enough to cover those monthly deductions. If it runs too low, the policy can lapse."},{"type":"p","text":"Interest is credited at a current rate that can change, but the policy also has a <b>guaranteed minimum interest rate<\/b>. The cash value is held in the insurer's general account, so universal life is not a security."},{"type":"h","text":"Two death benefit options"},{"type":"p","text":"<b>Option A<\/b> is the level death benefit option. The death benefit stays the same, and as the cash value grows the pure insurance portion shrinks. <b>Option B<\/b> is the increasing death benefit option. The beneficiary receives the face amount plus the cash value, so the death benefit rises as the cash value grows."},{"type":"p","text":"Universal life also allows partial withdrawals of cash value, not just loans. A withdrawal reduces the cash value and can reduce the death benefit."},{"type":"h","text":"Indexed universal life"},{"type":"p","text":"<b>Indexed universal life<\/b> works like universal life, but the interest credited is tied to the performance of a stock market index such as the S&P 500. The owner does not actually own stocks. The policy has a guaranteed minimum rate, so the cash value is protected when the index falls, and the upside is usually limited by a cap or participation rate. Because the funds stay in the general account, indexed life is not a security, and a life insurance license is all that is needed to sell it."},{"type":"table","head":["Option","Death benefit pays","Pattern"],"rows":[["Option A","Face amount","Level"],["Option B","Face amount plus cash value","Increasing"]]},{"type":"tip","text":"Flexible premium and adjustable death benefit are the two phrases that signal universal life."}]},{"title":"Variable and Variable Universal Life","blocks":[{"type":"p","text":"Variable products shift the investment risk from the insurer to the policyowner. In exchange, the owner has the chance for higher growth and some protection against inflation."},{"type":"p","text":"<b>Variable life<\/b> has a fixed, level premium like whole life. The difference is where the cash value goes. It is placed in the insurer's <b>separate account<\/b>, where the owner chooses among investment subaccounts such as stock, bond, and money market funds. The cash value rises and falls with those investments and is not guaranteed. The death benefit can also go up and down, but it will never drop below a guaranteed minimum, which is the original face amount."},{"type":"p","text":"<b>Variable universal life<\/b> combines the two ideas. It has the flexible premiums and adjustable death benefit of universal life together with the separate account investing of variable life. The owner carries the investment risk, and there is no guaranteed cash value or guaranteed interest rate."},{"type":"h","text":"Dual regulation"},{"type":"p","text":"Because the owner bears investment risk, variable products are securities as well as insurance. They are regulated by the state insurance department and also at the federal level by the Securities and Exchange Commission, with FINRA overseeing the people who sell them. An agent must hold a life insurance license and be registered with FINRA to sell variable products. A <b>prospectus<\/b> must be given to the buyer at or before the sale."},{"type":"table","head":["Policy","Premium","Where cash value is held","Who bears investment risk","Securities registration needed"],"rows":[["Whole life","Fixed","General account","Insurer","No"],["Universal life","Flexible","General account","Insurer","No"],["Indexed universal life","Flexible","General account","Insurer","No"],["Variable life","Fixed","Separate account","Policyowner","Yes"],["Variable universal life","Flexible","Separate account","Policyowner","Yes"]]},{"type":"example","text":"A client wants to pick her own investment funds and also wants the freedom to change her premium from year to year. Variable universal life is the policy that offers both features."},{"type":"tip","text":"If you see the word variable, think separate account, policyowner bears the risk, and two licenses."}]},{"title":"Special Policies and Modified Endowment Contracts","blocks":[{"type":"h","text":"Policies covering two lives"},{"type":"p","text":"<b>Joint life<\/b>, also called first-to-die, insures two or more people under one policy and pays the death benefit when the first insured dies. Coverage then ends. The premium is based on a joint average age and is lower than the combined cost of separate policies on each person."},{"type":"p","text":"<b>Survivorship life<\/b>, also called second-to-die or last survivor, pays nothing at the first death. It pays when the last insured dies. It is commonly used by married couples to provide cash for estate taxes. Because the benefit is delayed until the second death, its premium is lower than joint life."},{"type":"h","text":"Juvenile insurance"},{"type":"p","text":"<b>Juvenile insurance<\/b> is written on the life of a minor. An adult, usually a parent or guardian, applies for and owns the policy. A payor benefit can be added so that premiums are waived if the adult who pays them dies or becomes disabled before the child reaches a stated age. One well-known juvenile policy, often called a jumping juvenile policy, automatically increases the face amount, typically to five times the original, when the child turns 21, with no increase in premium and no evidence of insurability."},{"type":"h","text":"Credit life"},{"type":"p","text":"<b>Credit life<\/b> insures a borrower and pays off the loan balance if the borrower dies. It is usually written as decreasing term, often on a group basis. The creditor is the policyowner and the beneficiary, the borrower is the insured and normally pays the premium, and the coverage cannot be more than the amount owed."},{"type":"h","text":"Modified endowment contracts"},{"type":"p","text":"A <b>modified endowment contract<\/b>, or MEC, is a life policy that has been funded too quickly. It fails the seven-pay test, which means the premiums paid during the first seven years exceed what would be needed to pay the policy up with seven level annual premiums. Single premium life policies are typically MECs."},{"type":"p","text":"A MEC still pays an income tax free death benefit, and its cash value still grows tax deferred. What changes is the treatment of money taken out during life. Loans and withdrawals are taxed with earnings coming out first, and a 10 percent penalty applies to taxable amounts taken before age 59 and a half. Once a policy becomes a MEC, it stays a MEC."},{"type":"tip","text":"Joint life pays at the first death; survivorship life pays at the last death."}]}],"summary":{"recap":["Term insurance is temporary, pure protection with no cash value. It can be level, decreasing, or increasing, and it may be renewable or convertible without evidence of insurability.","Whole life is permanent coverage with a level premium, a level death benefit, and guaranteed cash value. Straight life, limited-pay, and single premium whole life differ only in how long premiums are paid.","Cash value grows tax deferred and can be borrowed against, surrendered, or used through nonforfeiture options. Unpaid loans and interest reduce the death benefit.","Universal life offers flexible premiums and an adjustable death benefit, with Option A level and Option B increasing. Indexed universal life ties interest to an index but keeps a guaranteed minimum.","Variable life and variable universal life invest cash value in a separate account. The owner bears the risk, and the agent needs both a life license and securities registration.","Joint life pays at the first death and survivorship life at the last. Juvenile policies cover minors, credit life covers a loan balance, and a modified endowment contract is an overfunded policy that loses tax advantages on loans and withdrawals."],"avaSummary":"You made it through chapter four, and that's a lot of products, so let me sort them out for you one more time. Start with term insurance. It's temporary, it has no cash value, and it gives the most coverage for the lowest starting premium. Level term keeps the same death benefit, decreasing term goes down, and increasing term goes up. Renewable and convertible features both work without evidence of insurability. Next comes whole life. It's permanent, with a level premium, a level death benefit, and guaranteed cash value. Straight life has premiums for life, limited-pay shortens the payment period, and single premium is paid all at once. Remember, the coverage period is the same for all three. Cash value grows tax deferred, and the owner can borrow against it, but an unpaid loan reduces what the beneficiary receives. Then we covered the flexible policies. Universal life means flexible premiums and an adjustable death benefit, with Option A level and Option B increasing. Indexed universal life links interest to a market index with a guaranteed floor. Variable life and variable universal life use a separate account, the policyowner carries the investment risk, and you need securities registration along with your life license to sell them. Finally, the special policies. Joint life pays at the first death, survivorship pays at the last death. Juvenile policies insure children, and credit life pays off a loan. And a modified endowment contract is a policy that fails the seven-pay test, so loans and withdrawals lose their favorable tax treatment. Review the tables, then go take the chapter exam.","reviewNotes":[{"objective":"Describe the features of term life insurance and its level, decreasing, increasing, renewable, and convertible forms.","concepts":["Term is temporary, pure protection with no cash value.","It offers the greatest coverage for the lowest initial premium.","Decreasing term has a level premium and a falling death benefit, often used for mortgages.","Renewal does not require evidence of insurability; the premium rises with attained age.","Conversion to permanent insurance does not require evidence of insurability."],"terms":[{"term":"Level term","def":"Term coverage with an unchanging death benefit."},{"term":"Decreasing term","def":"Term coverage with a level premium and shrinking death benefit."},{"term":"Convertible term","def":"Term coverage that can be exchanged for permanent insurance without proof of insurability."}]},{"objective":"Compare straight life, limited-pay, and single premium whole life policies.","concepts":["Whole life provides coverage for life with level premium, level death benefit, and guaranteed cash value.","Whole life traditionally matures at age 100, when cash value equals the face amount.","Straight life has the lowest annual premium of the whole life types.","Limited-pay has higher premiums and faster cash value growth; coverage still lasts for life.","Single premium whole life is paid up immediately and has immediate cash value."],"terms":[{"term":"Straight life","def":"Whole life with premiums payable for the insured's lifetime, to age 100."},{"term":"Limited-pay whole life","def":"Whole life with premiums paid for a limited period, such as 20 years or to age 65."}]},{"objective":"Explain how cash value builds and how a policyowner can use it.","concepts":["Cash value is the living benefit of permanent insurance.","As cash value rises, the insurer's net amount at risk falls.","The owner may borrow against it, surrender for it, or use nonforfeiture options.","Unpaid loans and interest are deducted from the death benefit.","Growth is tax deferred; gain above premiums paid is taxable on surrender."],"terms":[{"term":"Cash value","def":"The savings element of a permanent life policy."},{"term":"Policy loan","def":"A loan from the insurer secured by the policy's cash value."}]},{"objective":"Differentiate universal, variable, variable universal, and indexed life insurance.","concepts":["Universal life has flexible premiums, an adjustable death benefit, and a guaranteed minimum interest rate.","Option A is a level death benefit; Option B is face amount plus cash value.","Indexed universal life credits interest linked to an index and is not a security.","Variable life has fixed premiums and a guaranteed minimum death benefit, with cash value in a separate account.","Variable universal life combines flexible premiums with separate account investing.","Variable products require a life license plus FINRA registration, and a prospectus must be delivered."],"terms":[{"term":"Universal life","def":"Flexible premium adjustable life insurance."},{"term":"Separate account","def":"The investment account that backs variable products."},{"term":"Prospectus","def":"The disclosure document required for the sale of a security."}]},{"objective":"Identify the purpose of joint life, survivorship life, juvenile, and credit life policies.","concepts":["Joint life pays at the first death and costs less than separate policies.","Survivorship life pays at the last death and is often used for estate taxes.","Juvenile insurance is owned by an adult on the life of a minor; a payor benefit can waive premiums.","Credit life is usually decreasing term with the creditor as owner and beneficiary.","Credit life coverage cannot exceed the amount of the debt."],"terms":[{"term":"Joint life","def":"A first-to-die policy on two or more lives."},{"term":"Survivorship life","def":"A second-to-die policy on two lives."},{"term":"Credit life","def":"Coverage that pays off a loan at the borrower's death."}]},{"objective":"Recognize what makes a policy a modified endowment contract and how that changes its tax treatment.","concepts":["A policy becomes a MEC when it fails the seven-pay test.","Single premium life policies are typically MECs.","Loans and withdrawals from a MEC are taxed earnings first.","A 10 percent penalty applies to taxable distributions before age 59 and a half.","The death benefit remains income tax free, and MEC status is permanent."],"terms":[{"term":"Modified endowment contract","def":"An overfunded life policy that loses favorable tax treatment on living distributions."},{"term":"Seven-pay test","def":"The test that limits how much premium can be paid in the first seven policy years."}]}]},"exam":[{"q":"Which type of life insurance provides the greatest amount of coverage for the lowest initial premium?","choices":["Straight whole life","Term life","Universal life","Limited-pay whole life"],"answer":1,"why":"Term is pure protection with no cash value, so it provides the most coverage per premium dollar at the start."},{"q":"A homeowner wants a policy whose death benefit shrinks along with the mortgage balance. Which policy fits best?","choices":["Decreasing term","Level term","Increasing term","Survivorship life"],"answer":0,"why":"Decreasing term has a level premium and a death benefit that falls over time, matching a declining loan balance."},{"q":"When a renewable term policy is renewed, the new premium is based on the insured's:","choices":["Original issue age","Health at renewal","Attained age","Occupation"],"answer":2,"why":"Renewal requires no evidence of insurability, but the premium is recalculated at the insured's attained age."},{"q":"The convertible feature of a term policy allows the policyowner to:","choices":["Extend the term without paying premiums","Increase the death benefit each year","Withdraw the policy's cash value","Exchange the term policy for permanent insurance without evidence of insurability"],"answer":3,"why":"Conversion lets the owner switch to permanent coverage without proving insurability."},{"q":"Which statement about term life insurance is true?","choices":["It builds guaranteed cash value","It provides protection for a specified period only","It always matures at age 100","It requires securities registration to sell"],"answer":1,"why":"Term insurance covers a set period and has no cash value."},{"q":"Which whole life policy has the lowest annual premium?","choices":["Straight life","20-pay life","Life paid-up at 65","Single premium whole life"],"answer":0,"why":"Straight life spreads premiums over the longest period, so each annual premium is the smallest."},{"q":"A policyowner has a 20-pay whole life policy. After 20 years of premium payments:","choices":["Coverage ends","The policy converts to term","The policy is paid up and coverage continues for life","The face amount is paid to the owner"],"answer":2,"why":"Limited-pay policies shorten the premium period, but the coverage still lasts for the insured's lifetime."},{"q":"Traditionally, a whole life policy matures when the insured reaches age 100 because at that point:","choices":["Premiums double","The policy converts to an annuity","The death benefit drops to zero","The cash value equals the face amount"],"answer":3,"why":"Whole life endows when the cash value has grown to equal the face amount, traditionally at age 100."},{"q":"An insured dies with a $200,000 whole life policy and an outstanding policy loan of $15,000 including interest. The beneficiary receives:","choices":["$200,000","$185,000","$215,000","$15,000"],"answer":1,"why":"Any unpaid loan and interest are subtracted from the death benefit: $200,000 minus $15,000 is $185,000."},{"q":"Compared with straight life, a limited-pay whole life policy of the same face amount will have:","choices":["Lower premiums and slower cash value growth","The same premiums and the same cash value","Higher premiums and faster cash value growth","Lower premiums and no cash value"],"answer":2,"why":"Paying over fewer years means higher premiums and quicker cash value accumulation."},{"q":"Which policy is characterized by flexible premiums and an adjustable death benefit, with cash value held in the insurer's general account?","choices":["Universal life","Variable life","Straight whole life","Decreasing term"],"answer":0,"why":"Universal life is flexible premium adjustable life, and it credits interest from the general account."},{"q":"Under universal life Option B, the death benefit equals:","choices":["The face amount only","The cash value only","The premiums paid","The face amount plus the cash value"],"answer":3,"why":"Option B is the increasing death benefit option, paying the face amount plus the accumulated cash value."},{"q":"In a variable life policy, the investment risk is borne by the:","choices":["Insurer","Policyowner","Agent","Beneficiary"],"answer":1,"why":"Cash value is invested in a separate account and is not guaranteed, so the policyowner carries the risk."},{"q":"To sell variable life insurance, an agent must have:","choices":["A life insurance license only","A securities registration only","Both a life insurance license and securities registration","A property and casualty license"],"answer":2,"why":"Variable products are both insurance and securities, so both credentials are required."},{"q":"Which feature is found in variable life but NOT in variable universal life?","choices":["A fixed, level premium","Separate account investing","Policyowner bears investment risk","A prospectus requirement"],"answer":0,"why":"Variable life has a fixed premium, while variable universal life has flexible premiums."},{"q":"An indexed universal life policy credits interest based on:","choices":["Subaccounts the owner selects in a separate account","A rate fixed for the life of the policy","The insurer's dividend scale only","The movement of a market index, subject to a guaranteed minimum"],"answer":3,"why":"Indexed life ties credited interest to an index such as the S&P 500 while guaranteeing a minimum rate."},{"q":"A married couple wants a single policy that will provide money for estate taxes after both of them have died. Which policy is most appropriate?","choices":["Joint life","Survivorship life","Credit life","Decreasing term"],"answer":1,"why":"Survivorship, or second-to-die, life pays when the last insured dies, which is when estate taxes are commonly due."},{"q":"A joint life policy covering two business partners pays the death benefit:","choices":["Only after both partners have died","At age 100 of the younger partner","When the first partner dies","Half at each death"],"answer":2,"why":"Joint life is a first-to-die policy; it pays at the first death and then ends."},{"q":"In a credit life policy, the beneficiary is the:","choices":["Creditor","Borrower's spouse","Borrower's estate","Insurer"],"answer":0,"why":"Credit life pays the lender the remaining loan balance, so the creditor is the beneficiary."},{"q":"A life insurance policy that fails the seven-pay test is classified as:","choices":["A variable contract","A limited-pay policy","A survivorship policy","A modified endowment contract"],"answer":3,"why":"A policy funded faster than the seven-pay test permits becomes a modified endowment contract."}]},{"id":"ch05","num":5,"title":"Life Insurance Provisions, Options, and Riders","intro":{"hook":["Picture a client who misses a premium because she was in the hospital, then calls you in a panic three weeks later. Is her coverage gone? The answer is sitting in her policy, in a paragraph most people never read.","A life insurance policy is more than a face amount and a premium. It is a set of written rules that say what the company must do, what the owner may do, and what happens when life does not go according to plan.","This chapter walks through those rules: the standard provisions, the exclusions, the choices an owner has when premiums stop or dividends are paid, and the riders that customize a policy. These topics show up heavily on the Texas exam, and they are the questions clients ask most often."],"objectives":["Identify the standard provisions that form the foundation of a life insurance contract","Explain how the grace period, reinstatement, and automatic premium loan provisions keep coverage from lapsing","Describe how the incontestability, misstatement, and suicide provisions limit the defenses an insurer can raise","Compare the three nonforfeiture options available to the owner of a cash value policy","Distinguish the dividend options offered on participating policies","Match common riders to the client need each one is designed to solve"],"avaIntro":"Hi, I'm Ava, and welcome to chapter five. So far we have talked about the kinds of life insurance you can sell. Now we are going to open the policy itself and read the fine print together. I promise it is more interesting than it sounds. Every provision in a policy exists because something once went wrong for a policyowner or an insurer, and the provision is the fix. We will start with the standard provisions, the ones the law expects in every contract. Then we will look at what an owner can do with cash value if premiums stop, how dividends can be used, and how riders let you tailor a policy to one specific person. Pay close attention to time periods in this chapter. Days, months, and years are favorite exam targets. Let's get started."},"keywords":[{"term":"Absolute assignment","def":"A permanent transfer of all ownership rights in a policy to another person or entity."},{"term":"Accelerated death benefit","def":"A provision or rider that pays part of the death benefit early to an insured with a terminal or other qualifying condition."},{"term":"Automatic premium loan","def":"A provision that uses a policy loan against cash value to pay a premium still unpaid at the end of the grace period."},{"term":"Collateral assignment","def":"A temporary, partial transfer of policy rights to a lender as security for a debt."},{"term":"Entire contract","def":"The provision stating that the policy and the attached application make up the whole agreement."},{"term":"Extended term","def":"A nonforfeiture option that uses cash value to buy term insurance for the original face amount for as long as the money lasts."},{"term":"Free look","def":"The period after delivery during which the owner may return the policy for a full refund of premium."},{"term":"Grace period","def":"The time after a premium due date during which the policy stays in force even though the premium is unpaid."},{"term":"Guaranteed insurability","def":"A rider that lets the owner buy more coverage at set times without proving good health."},{"term":"Incontestability","def":"The provision that stops the insurer from challenging the policy for misstatements after it has been in force for two years."},{"term":"Nonforfeiture options","def":"The guaranteed ways an owner can receive the value of a cash value policy when premiums stop."},{"term":"Paid-up additions","def":"A dividend option that uses each dividend to buy a small block of fully paid permanent insurance."},{"term":"Reduced paid-up","def":"A nonforfeiture option that uses cash value to buy a smaller permanent policy needing no further premiums."},{"term":"Reinstatement","def":"The provision that lets an owner restore a lapsed policy by meeting stated conditions."},{"term":"Waiver of premium","def":"A rider that excuses premium payments while the insured is totally disabled."}],"sections":[{"title":"The Foundation: Entire Contract, Insuring Clause, Consideration, and Free Look","blocks":[{"type":"p","text":"Every life policy opens with a few provisions that define what the contract is. They are not flashy, but everything else in the policy rests on them."},{"type":"p","text":"The <b>entire contract<\/b> provision says that the policy and a copy of the application attached to it are the complete agreement. Nothing outside those pages counts. The insurer cannot point to a company manual or an unattached document to deny a claim, and an agent cannot change the contract with a verbal promise. Any change must be in writing, approved by an officer of the insurer, and made part of the policy."},{"type":"p","text":"The <b>insuring clause<\/b> is the insurer's basic promise. It usually appears on the first page and states that the company will pay the face amount to the beneficiary when it receives proof that the insured has died while the policy is in force. It names the parties and the amount."},{"type":"p","text":"The <b>consideration clause<\/b> explains what each side gives. The owner gives the first premium and the statements made in the application. The insurer gives its promise to pay. This clause also tells the owner how much the premium is and how often it is due."},{"type":"h","text":"The free look period"},{"type":"p","text":"The <b>free look<\/b>, sometimes called the right to examine, gives the new owner a short window to read the policy and send it back for a full refund of the premium paid, for any reason. The clock starts when the policy is delivered to the owner, not when the application was signed or the policy was issued. Ten days is the period most often seen on life policies, and a longer period, commonly 30 days, applies when the new policy replaces existing coverage."},{"type":"flow","nodes":["Application signed","Policy issued","Policy delivered","Free look begins"],"caption":"The free look clock starts at delivery, which is why a dated delivery receipt matters."},{"type":"example","text":"Marcus receives his new whole life policy on June 3. On June 9 he decides the premium is more than he wants to pay. He returns the policy to the insurer and gets back every dollar he paid, with no surrender charge."},{"type":"tip","text":"If a question asks when the free look starts, the answer is the date the policy is delivered to the owner."}]},{"title":"Keeping Coverage Alive: Grace Period, Reinstatement, and Automatic Premium Loan","blocks":[{"type":"p","text":"People miss payments. Three provisions work together to keep a missed payment from turning into a lost policy."},{"type":"p","text":"The <b>grace period<\/b> is the stretch of time after the due date when the policy is still fully in force even though the premium has not been paid. On an individual life policy this is generally 31 days, or one month. If the insured dies during the grace period, the insurer pays the claim but subtracts the overdue premium from the death benefit. If the premium is still unpaid when the grace period ends, the policy lapses."},{"type":"h","text":"Automatic premium loan"},{"type":"p","text":"The <b>automatic premium loan<\/b> provision is a safety net for cash value policies. If the grace period ends with the premium unpaid, the insurer borrows the premium from the policy's cash value and pays it on the owner's behalf. Coverage continues without interruption. The loan accrues interest like any other policy loan, and it can keep the policy going only as long as there is enough cash value to borrow. This feature usually costs nothing extra, but the owner typically must elect it."},{"type":"h","text":"Reinstatement"},{"type":"p","text":"If a policy does lapse, <b>reinstatement<\/b> gives the owner a way back. The usual conditions are:"},{"type":"list","items":["Apply within the time allowed, commonly three years from the date of lapse","Provide evidence that the insured is still insurable","Pay all overdue premiums, plus interest","Repay or reinstate any outstanding policy loans"]},{"type":"p","text":"A policy that has been surrendered for its cash value cannot be reinstated. The main advantage of reinstating instead of buying a new policy is that the premium stays based on the insured's original issue age. One catch: statements made in the reinstatement application open a new contestable period for those statements."},{"type":"flow","nodes":["Premium due","Grace period","Automatic premium loan","Lapse","Reinstatement"],"caption":"Each step is a chance to save the policy before the next one applies."},{"type":"tip","text":"A death during the grace period is a covered claim; the insurer simply deducts the unpaid premium from the proceeds."}]},{"title":"Limits on the Insurer: Incontestability, Misstatement, Suicide, and Exclusions","blocks":[{"type":"p","text":"Several provisions decide when an insurer may refuse or reduce a claim. Each has its own rule, and the exam likes to test whether you can tell them apart."},{"type":"p","text":"The <b>incontestability<\/b> clause gives the insurer a limited time, two years from the issue date, to challenge the policy because of misstatements or concealment in the application. Once the policy has been in force for two years during the insured's lifetime, the insurer can no longer void it on those grounds, even if the application contained a material misstatement. The clause does not protect an owner who stops paying premiums. Nonpayment can always end the policy."},{"type":"p","text":"The <b>misstatement of age or sex<\/b> provision works differently. If the insured's age or sex was stated wrong, the insurer does not cancel the policy. It adjusts the benefit to whatever amount the premium paid would have purchased at the correct age or sex. This adjustment can be made at any time, including after the contestable period has ended."},{"type":"example","text":"Dana said she was 40 when she applied, but she was really 45. She dies six years later. The insurer pays the claim, but the amount is reduced to what her premium would have bought for a 45-year-old."},{"type":"p","text":"The <b>suicide clause<\/b> protects the insurer from someone buying coverage while planning to take their own life. If the insured dies by suicide within the stated period, usually two years from issue, the insurer does not pay the face amount. It refunds the premiums paid. After that period, suicide is covered like any other cause of death."},{"type":"h","text":"Common exclusions"},{"type":"p","text":"An <b>exclusion<\/b> is a cause of death the policy does not cover. Typical ones are:"},{"type":"list","items":["War or military service, either death caused by acts of war or any death while in active service","Aviation, usually limited to pilots, crew, or private flying, while fare-paying airline passengers remain covered","Hazardous occupations or hobbies, which may be excluded or covered for an added premium"]},{"type":"table","head":["Provision","What the insurer does"],"rows":[["Misstatement in application, found within two years","May contest and void the policy"],["Misstatement of age or sex, found any time","Adjusts the benefit up or down"],["Suicide within the exclusion period","Refunds premiums paid"],["Death from an excluded cause","Does not pay the death benefit"]]},{"type":"tip","text":"Wrong age means adjust the benefit, never void the policy, and it applies no matter how long the policy has been in force."}]},{"title":"Ownership Rights: Assignment and Policy Loans","blocks":[{"type":"p","text":"The policyowner, who may or may not be the insured, holds the rights in the contract. These include naming and changing the beneficiary, choosing options, borrowing against cash value, and transferring the policy to someone else."},{"type":"h","text":"Assignment"},{"type":"p","text":"An <b>assignment<\/b> is a transfer of ownership rights. The owner does not need the insurer's permission, but the insurer must be notified in writing so it knows whom to deal with. There are two kinds."},{"type":"table","head":["Type","What is transferred","Typical use"],"rows":[["Absolute assignment","All rights, permanently","Gift or sale of the policy to a new owner"],["Collateral assignment","Limited rights, temporarily","Security for a loan; the lender is repaid first and the rest goes to the beneficiary"]]},{"type":"p","text":"With a collateral assignment, the rights return to the owner once the debt is paid. If the insured dies first, the lender receives only the unpaid balance."},{"typ
