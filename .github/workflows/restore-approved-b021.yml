name: Restore Approved B2026.08.23.021

on:
  push:
    branches: [main]
    paths:
      - '.restore/b021-runtime.tar.gz.b64'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: approved-b021-restore
  cancel-in-progress: false

jobs:
  restore-verify-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact approved runtime
        run: |
          base64 -d .restore/b021-runtime.tar.gz.b64 > /tmp/b021-runtime.tar.gz
          echo '0fb31f3c307a44de7fc24d000fec31ef6547ec3aaef2a5a3a9e9c650097d1356  /tmp/b021-runtime.tar.gz' | sha256sum -c -
          tar -xzf /tmp/b021-runtime.tar.gz -C .

      - name: Verify approved runtime hashes
        run: |
          cat > /tmp/b021-sha256.txt <<'EOF'
          6bdcdf7b0291127f77be3376f1a96a25b17411cb3d210f7db7bb95e7f793c055  ./backend.js
          ffcd229c92e51c37fe7d574b1b11d1ce729c35e2117fc1313ac1661281167f74  ./build-info.js
          565325a7a6801ae27d9b8719b13346cb85ed687188ac3c9cf2bad74189f65540  ./config.js
          2dd72bb0a86e8d27a15de29ff144a79b1f235cb78393ef635c2ec4735a4374eb  ./index.html
          a6d257b50693788bbcbf04a152fff2af5d8243c18e5a7496612a419350301e80  ./phase16-academy-admin.js
          93e1259795e970aed1401266ba81daa0e6fcda337903d5d572608063d7aa6d9e  ./phase16-agent-academy-production.js
          f858e88987a8f63ace808d9ae27a409f1663a58b2f2cdd76c26d0d45085bf692  ./phase16-agent-live-essentials.js
          69b37664106e52e2c89516cf0cc4e1fbf9b676c1bca47c2cbbea13ad98d3f237  ./phase16-ai-command-production.js
          af8b9c86619def98abc70ed1b319402d8ec2c7a5c48609e52ba5aecb774c7c39  ./phase16-build-002.js
          d67b843d77c563f1d105bed7ab2ba6d8f89dd6bcc569593778a6f78aa1857d57  ./phase16-crm.js
          2902b7532d646bcc1760292d84c46a81cc9666a27cf5c3497e37ff21a8f5d1f3  ./phase16-live-backoffice.js
          e4d6d08965527da54f1763ea312436d137bcc8f78e69c9bcb9b75bc735d0b121  ./phase16-owner-live-dashboard.js
          d826e926433b44b222ca1d0f549ab5f871e96db66dc782834cba066559d84628  ./phase16-owner-support.js
          3e42d90e1e1ee18595429ad17b7c44e506988f9915921da0ab48a61105f2ca52  ./phase16-production-core.js
          592f534997bf00457da6fe8ce4e2ffb1b64c3ccc23ac8bce773d4453d2f98216  ./phase16-social-production.js
          2595c3d330f9e6c9d0567e705f21d13f0257663c1931548c4975c372d009ddc4  ./social-icons/facebook.svg
          850ee9de17866d11fdaf97245c66819f98b545bf075d31e024483184d70fff49  ./social-icons/instagram.svg
          c850ccc0541006b56a542bbdfa0ba4cf37ddc8ebb888fbf3862d6803533611bb  ./social-icons/linkedin.svg
          92db0e26e4ede062734063841619d95f8ef65de882de1712586aec8865ba062b  ./social-icons/messenger.svg
          a16258466f77c78da1a594a624b75c9dbc62bc7247e7d0350d45089bc1b1e154  ./social-icons/pinterest.svg
          8fd430aa6cc1f377d7c607afa93bb258f1da1d3da63c2d7da1b49e48aa13cbaa  ./social-icons/reddit.svg
          6d0b90a9df0a40533df1985bf5addad2c293d762f614ec3c839a65c0818b2b4a  ./social-icons/snapchat.svg
          e8d181f24da1520296ff95bbf40b46e91a19d1812e5fda3223d5b57fe92b3f3c  ./social-icons/threads.svg
          81499ddd3f634df957424df1109ea84ad39a0defa9cf2126f8565a05832630b8  ./social-icons/tiktok.svg
          4d5db6a4344bd22c9ce58e0b669c1f99081e521585413c611f725e59ad01f92a  ./social-icons/whatsapp.svg
          97e39e9377bc5156bfac4daa4d3195a5b649e6ccec54f90b132396b98de4ebea  ./social-icons/x.svg
          bf855a8a92fea0dd044a3530d5f17c0b88f881519ac42c208d8891808a31c91a  ./social-icons/youtube.svg
          EOF
          sed -i 's/^          //' /tmp/b021-sha256.txt
          sha256sum -c /tmp/b021-sha256.txt

      - name: Verify approved architecture and syntax
        run: |
          grep -q 'B2026.08.23.021' build-info.js
          for f in phase16-build-002.js backend.js phase16-crm.js phase16-owner-live-dashboard.js phase16-owner-support.js phase16-live-backoffice.js phase16-agent-academy-production.js phase16-academy-admin.js phase16-production-core.js phase16-ai-command-production.js phase16-agent-live-essentials.js phase16-social-production.js; do
            grep -q "$f" index.html
          done
          ! grep -q 'backoffice-live-completeness.js' index.html
          ! grep -q 'approved-owner-setup.js' index.html
          ! grep -q 'production-runtime.js' index.html
          for f in backend.js build-info.js config.js phase16-*.js; do node --check "$f"; done
          grep -q 'Live AI across Allshield' phase16-ai-command-production.js
          grep -q 'Brand + Profile AI' phase16-social-production.js
          grep -q 'Connections + Queue' phase16-social-production.js
          grep -q 'DEMO_FALLBACK: false' config.js

      - name: Persist approved runtime to main
        run: |
          git config user.name 'Allshield Production Restore'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html config.js build-info.js backend.js phase16-*.js social-icons/
          if ! git diff --cached --quiet; then
            git commit -m 'Restore exact approved B2026.08.23.021 production runtime'
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy approved runtime to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
