name: B050 Live TikTok Test Evidence

on:
  push:
    paths:
      - '.github/workflows/b050-live-tiktok-test-evidence.yml'

permissions:
  contents: write

jobs:
  record-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record live TikTok Sandbox test evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-info.js')
          s=p.read_text()
          repl={
            "label:'Production B050 — TikTok Sandbox Review Demo Workflow — Certified'":"label:'Production B050 — TikTok Sandbox Review Demo Workflow — Live User Tests Passed'",
            "completion_release:'2026.08.30.001'":"completion_release:'2026.08.30.002'",
            "tiktok_sandbox_draft_upload:'READY — USER TEST REQUIRED'":"tiktok_sandbox_draft_upload:'LIVE USER TEST PASS — REAL PUBLISH ID'",
            "tiktok_sandbox_private_direct_post:'READY — USER TEST REQUIRED'":"tiktok_sandbox_private_direct_post:'LIVE USER TEST PASS — SELF_ONLY REAL PUBLISH ID'",
            "tiktok_professional_connection:'NOT CONNECTED — FAIL CLOSED'":"tiktok_professional_connection:'CONNECTED PARTIAL — REAL OAUTH + IDENTITY PASS'",
            "tiktok_account_stats_verification:'NOT RUN — ACCOUNT NOT CONNECTED'":"tiktok_account_stats_verification:'LIVE PASS'",
            "tiktok_video_metrics_verification:'NOT RUN — ACCOUNT NOT CONNECTED'":"tiktok_video_metrics_verification:'LIVE PASS'",
            "tiktok_creator_eligibility_verification:'NOT RUN — ACCOUNT NOT CONNECTED'":"tiktok_creator_eligibility_verification:'LIVE PASS — PRIVATE TEST READY'",
            "tiktok_token_refresh:'NOT RUN — ACCOUNT NOT CONNECTED'":"tiktok_token_refresh:'ACTIVE TOKEN — REFRESH NOT YET REQUIRED'"
          }
          for a,b in repl.items():
              if a not in s:
                  raise SystemExit(f'missing expected build-info text: {a}')
              s=s.replace(a,b,1)
          anchor="  changes:[\n"
          add=(
            "    'Live Sandbox Draft Upload user test passed against the connected Allshield.Insurance.Group TikTok account with a real TikTok publish ID and PROCESSING_UPLOAD response',\n"
            "    'Live Sandbox Private Direct Post user test passed with SELF_ONLY visibility after the target account was made private, returning a real TikTok publish ID; public posting remains fail-closed until TikTok audit approval',\n"
          )
          if anchor not in s: raise SystemExit('changes anchor missing')
          s=s.replace(anchor,anchor+add,1)
          p.write_text(s)
          PY
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('build-info.js','utf8');const c={window:{}};vm.createContext(c);vm.runInContext(s,c);const x=c.window.ALLSHIELD_BUILD_INFO.certification;if(x.tiktok_sandbox_draft_upload!=='LIVE USER TEST PASS — REAL PUBLISH ID'||x.tiktok_sandbox_private_direct_post!=='LIVE USER TEST PASS — SELF_ONLY REAL PUBLISH ID'||x.tiktok_public_posting_audit_gate!=='NOT SUBMITTED — FAIL CLOSED')process.exit(1);"
      - name: Commit evidence
        run: |
          git config user.name "ALLSHIELD Build Bot"
          git config user.email "buildbot@allshieldinsurancegroup.com"
          git add build-info.js
          git commit -m "Record live TikTok Sandbox upload and private post passes"
          git push origin main
      - name: Retire temporary workflow
        run: |
          git pull --rebase origin main
          git rm .github/workflows/b050-live-tiktok-test-evidence.yml
          git commit -m "Retire B050 TikTok live-test evidence workflow"
          git push origin main
