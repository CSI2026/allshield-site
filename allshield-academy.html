ccupational policies cover off the job only."],"terms":[{"term":"Non-occupational","def":"Coverage limited to disabilities that are not job related."},{"term":"Accidental bodily injury","def":"Definition requiring only that the injury itself was unexpected."}]},{"objective":"Distinguish among own occupation, any occupation, partial, residual, presumptive and recurrent disability","concepts":["Own occupation is broader and more costly; any occupation is stricter and cheaper.","Partial disability pays a flat reduced benefit for a limited time.","Residual disability pays in proportion to the income lost.","Presumptive disability pays for listed severe losses even if the insured can work.","Recurrent disability continues the earlier claim with no new elimination period."],"terms":[{"term":"Own occupation","def":"Unable to perform the duties of the insured's regular job."},{"term":"Residual disability","def":"Benefit tied to the percentage of earnings lost."}]},{"objective":"Describe how the probationary period, elimination period and benefit period affect a claim","concepts":["The probationary period starts at policy issue and applies to sickness only.","The elimination period starts when a disability begins and applies to each claim.","A longer elimination period lowers the premium.","The benefit period is the maximum time benefits are paid; a longer period raises the premium."],"terms":[{"term":"Elimination period","def":"A time deductible before benefits are payable."},{"term":"Benefit period","def":"The maximum duration of benefit payments for a claim."}]},{"objective":"Explain why insurers limit benefits to a share of income and how common riders change coverage","concepts":["Benefits are capped, commonly at 60 to 70 percent of income, to discourage malingering and overinsurance.","COLA raises benefits during a claim to offset inflation.","Guaranteed insurability allows more coverage without medical evidence.","The Social Security offset rider pays when social insurance benefits are denied or lower than expected.","Waiver of premium excuses premiums during total disability, commonly after 90 days."],"terms":[{"term":"Malingering","def":"Faking or prolonging a disability in order to collect benefits."},{"term":"Noncancellable","def":"Insurer cannot cancel the policy or raise its premium."}]},{"objective":"Compare group short-term and long-term disability plans","concepts":["Short-term plans have brief elimination periods and typically pay 13 to 26 weeks.","Long-term plans start after short-term benefits end and may pay to age 65.","Group plans are usually non-occupational.","Group long-term benefits are often reduced by Social Security or workers' compensation payments."],"terms":[{"term":"Contributory plan","def":"A group plan in which employees pay part of the premium."},{"term":"Offset","def":"A reduction in group benefits for amounts received from other sources."}]},{"objective":"Identify business uses of disability insurance and how disability benefits are taxed","concepts":["Business overhead expense reimburses operating costs but not the owner's salary; premiums are deductible and benefits taxable.","Disability buy-sell funds the purchase of a disabled owner's interest and has a long elimination period.","Key person disability is owned by and payable to the business.","Individually paid premiums are not deductible and benefits are tax free.","Employer-paid benefits are taxable to the employee, in proportion to the employer's share of premium."],"terms":[{"term":"Business overhead expense","def":"Coverage for ongoing business bills during the owner's disability."},{"term":"Disability buy-sell","def":"Coverage that funds a buyout of a disabled owner."}]}]},"exam":[{"q":"The main purpose of disability income insurance is to:","choices":["Pay hospital and physician bills","Replace part of the income lost when the insured cannot work","Pay a death benefit to a beneficiary","Cover the cost of long-term custodial care"],"answer":1,"why":"Disability income insurance replaces a portion of lost earnings; it does not pay medical bills."},{"q":"Which definition of total disability is most favorable to the insured?","choices":["Own occupation","Any occupation","Any gainful activity","Accidental means"],"answer":0,"why":"Own occupation only requires that the insured be unable to perform their own regular job."},{"q":"An insured returns to work after a disability but earns 30 percent less than before. A benefit equal to 30 percent of the total disability benefit is paid. This is which type of benefit?","choices":["Presumptive","Recurrent","Residual","Partial"],"answer":2,"why":"Residual disability benefits are based on the percentage of income lost."},{"q":"Which loss would normally qualify as a presumptive disability?","choices":["A broken leg","A back strain lasting six months","Loss of a job due to layoff","Total and permanent loss of sight"],"answer":3,"why":"Presumptive disability covers listed severe losses such as sight, hearing, speech or the use of two limbs."},{"q":"The elimination period in a disability income policy is best described as:","choices":["A time deductible that follows the start of a disability","The time after issue when sickness is not covered","The maximum time benefits are paid","The time allowed to pay a late premium"],"answer":0,"why":"The elimination period is the waiting time after a disability begins before benefits are payable."},{"q":"The probationary period applies to:","choices":["Accidents only","Sickness only","Both accidents and sickness on every claim","Presumptive disabilities only"],"answer":1,"why":"The probationary period follows policy issue and excludes sickness claims for a short time; accidents are covered right away."},{"q":"All else being equal, choosing a longer elimination period will:","choices":["Raise the premium","Shorten the benefit period","Lower the premium","Increase the monthly benefit"],"answer":2,"why":"A longer waiting period means fewer short claims are paid, so the premium is lower."},{"q":"An insured recovers, returns to work, and three months later is disabled again from the same cause. Under a recurrent disability provision with a six-month limit, the second disability is:","choices":["A new claim with a new elimination period","Excluded as a pre-existing condition","Paid at half the normal benefit","A continuation of the first claim with no new elimination period"],"answer":3,"why":"A relapse within the stated time is treated as part of the original claim."},{"q":"Why do insurers limit disability benefits to a share of the insured's income?","choices":["To comply with Social Security rules","To keep an incentive for the insured to return to work","To make benefits taxable","To shorten the elimination period"],"answer":1,"why":"Replacing all income would remove the financial reason to recover and return to work."},{"q":"Which rider increases the monthly benefit during a long claim to help offset inflation?","choices":["Cost of living adjustment","Guaranteed insurability","Waiver of premium","Social Security offset"],"answer":0,"why":"The COLA rider raises benefits while the insured is on claim, usually tied to a price index."},{"q":"The guaranteed insurability rider allows the insured to:","choices":["Stop paying premiums while disabled","Receive benefits without an elimination period","Buy additional coverage without medical evidence of insurability","Convert the policy to life insurance"],"answer":2,"why":"This rider gives the right to purchase more coverage at set times without proving good health."},{"q":"A Social Security offset rider pays an additional benefit when:","choices":["The insured reaches age 65","The insured returns to work part time","The insured's premium is overdue","Social Security disability benefits are denied or are less than the rider amount"],"answer":3,"why":"The rider fills the gap when social insurance pays nothing or less than expected."},{"q":"Under a waiver of premium provision, premiums are waived when the insured:","choices":["Has been totally disabled for the required waiting time","Changes occupations","Reaches the end of the probationary period","Adds a rider to the policy"],"answer":0,"why":"Waiver of premium excuses premiums during total disability, commonly after 90 days."},{"q":"Compared with long-term disability, a group short-term disability plan has:","choices":["A longer benefit period","A shorter elimination period and a shorter benefit period","Benefits payable to age 65","A longer elimination period"],"answer":1,"why":"Short-term plans begin quickly and typically pay for 13 to 26 weeks."},{"q":"Most group disability plans are non-occupational, which means they:","choices":["Cover only job-related disabilities","Cover only employees with no occupation","Cover only disabilities that are not job related","Pay benefits regardless of where the disability occurs"],"answer":2,"why":"Non-occupational plans leave job-related disabilities to workers' compensation."},{"q":"A business overhead expense policy would NOT pay for which of the following?","choices":["Office rent","Utilities","Employee wages","The disabled owner's salary"],"answer":3,"why":"Business overhead expense covers operating costs but not the owner's own income."},{"q":"A disability buy-sell policy typically has a long elimination period because:","choices":["The premiums are deductible","The owner should not be bought out if recovery is still likely","Benefits are paid weekly","It covers only partial disability"],"answer":1,"why":"A wait of a year or more helps make sure the disability is lasting before the owner's interest is purchased."},{"q":"In a key person disability policy, who receives the benefit?","choices":["The business","The key person","The key person's family","The other employees"],"answer":0,"why":"The business owns the policy, pays the premium and receives the benefit."},{"q":"Marcus pays the full premium for his individual disability policy with after-tax dollars. If he becomes disabled, his benefits are:","choices":["Fully taxable","Taxable above 7.5% of adjusted gross income","Received income tax free","Half taxable"],"answer":2,"why":"When the insured pays premiums with after-tax dollars, the benefits are not taxable."},{"q":"An employer pays 100 percent of the premium for a group disability plan. Benefits received by a disabled employee are:","choices":["Tax free","Taxable only after age 65","Half taxable","Fully taxable as income"],"answer":3,"why":"Benefits attributable to employer-paid premiums are taxable income to the employee."}]},{"id":"ch17","num":17,"title":"Health Insurance Plans for Seniors","intro":{"hook":["Picture a client who turns 65 next month. Her mailbox is stuffed with brochures, her neighbor swears by one plan, her brother swears by another, and she has no idea which letters of the alphabet she actually needs. She calls you.","This chapter gives you the map. You will learn how Medicare is built, where it leaves gaps, how Medicare Supplement policies fill those gaps, how Medicaid helps people with limited means, and how long-term care insurance pays for the kind of help Medicare was never designed to cover.","Seniors are one of the most protected groups of consumers in insurance law, and the exam tests this area heavily. Knowing the parts, the time frames and the consumer safeguards will earn you points on test day and trust in the field."],"objectives":["Identify who qualifies for Medicare and when a person can enroll","Describe what Medicare Part A and Part B cover and what they leave out","Compare Medicare Advantage (Part C) and prescription drug coverage (Part D) with Original Medicare","Explain how Medicare Supplement policies are standardized and which consumer protections apply","Summarize the purpose of Medicaid and how it differs from Medicare","Explain long-term care insurance, including levels of care, benefit triggers and key policy features"],"avaIntro":"Hi, I am Ava, and welcome to chapter seventeen. Today we are talking about health coverage for seniors, and I will be honest with you, this is one of my favorite chapters, because the people you help here really need a guide. We will start with Medicare and walk through its four parts one at a time, so the letters stop feeling like alphabet soup. Then we will look at the holes Medicare leaves behind, and how Medicare Supplement policies are designed to plug them. After that we will touch on Medicaid, which is a very different program even though the names sound alike. Finally, we will spend time on long-term care insurance, which pays for help with everyday living. Take notes on the time frames. The exam loves them, and so will your future clients. Let us get started."},"keywords":[{"term":"Activities of daily living (ADLs)","def":"Basic self-care tasks such as bathing, dressing, eating, toileting, transferring and continence, used to trigger long-term care benefits."},{"term":"Benefit period (Part A)","def":"A span that starts on the day of hospital admission and ends after 60 days in a row without inpatient hospital or skilled nursing care."},{"term":"Core benefits","def":"The basic package every Medicare Supplement plan must include, beginning with Plan A."},{"term":"Custodial care","def":"Non-medical help with personal needs such as bathing and dressing; not covered by Medicare when it is the only care needed."},{"term":"Elimination period","def":"The waiting time, counted in days of care, before long-term care benefits start to be paid."},{"term":"Initial enrollment period","def":"The seven-month window around a person's 65th birthday month for signing up for Medicare."},{"term":"Medicaid","def":"A joint federal and state program that pays medical costs for people with low income and limited assets."},{"term":"Medicare Advantage","def":"Part C; private plans approved by Medicare that deliver Part A and Part B benefits, often with extras."},{"term":"Medicare Supplement (Medigap)","def":"Private insurance that pays some of the deductibles, coinsurance and copayments Original Medicare leaves to the patient."},{"term":"Original Medicare","def":"The federal fee-for-service program made up of Part A hospital insurance and Part B medical insurance."},{"term":"Partnership policy","def":"A qualified long-term care policy that lets the owner protect assets from Medicaid spend-down equal to the benefits the policy paid."},{"term":"Respite care","def":"Short-term care that gives a family caregiver a break."},{"term":"Skilled nursing care","def":"Daily medical care ordered by a physician and given by licensed medical professionals."},{"term":"Tax-qualified long-term care policy","def":"A policy meeting federal standards so that benefits are generally received free of income tax."}],"sections":[{"title":"Medicare Eligibility and Enrollment","blocks":[{"type":"p","text":"<b>Medicare<\/b> is the federal health insurance program created under Title XVIII of the Social Security Act. It is not based on income or assets. A person qualifies because of age or a specific medical situation, not because of financial need."},{"type":"h","text":"Who qualifies"},{"type":"list","items":["People age 65 or older","People under 65 who have received Social Security disability benefits for 24 months","People of any age with end-stage renal disease (permanent kidney failure needing dialysis or a transplant)","People with ALS (Lou Gehrig's disease), who qualify as soon as disability benefits begin"]},{"type":"h","text":"When to sign up"},{"type":"p","text":"The <b>initial enrollment period<\/b> lasts seven months: the three months before the month a person turns 65, the birthday month itself, and the three months after. Someone already drawing Social Security retirement benefits is usually enrolled in Part A and Part B automatically."},{"type":"flow","nodes":["3 months before","Birthday month","3 months after"],"caption":"The seven-month initial enrollment period around age 65"},{"type":"p","text":"A person who misses that window can sign up during the <b>general enrollment period<\/b>, which runs from January 1 through March 31 each year. Waiting may mean a permanently higher Part B premium. People who delayed Part B because they were covered by an employer group plan through active employment get a <b>special enrollment period<\/b> and avoid the penalty."},{"type":"p","text":"Each fall there is also an <b>annual election period<\/b>, October 15 through December 7, when beneficiaries can change Medicare Advantage or Part D plans. Changes take effect January 1."},{"type":"table","head":["Period","Timing","Purpose"],"rows":[["Initial enrollment","7 months around the 65th birthday month","First chance to enroll in Medicare"],["General enrollment","January 1 - March 31","Enroll in Part A or B if the first window was missed"],["Annual election","October 15 - December 7","Join, switch or drop Part C and Part D plans"],["Special enrollment","Triggered by events such as losing employer coverage","Enroll outside the usual windows without penalty"]]},{"type":"example","text":"Maria turns 65 on June 20. Her initial enrollment period opens March 1 and closes September 30."},{"type":"tip","text":"Remember 3-1-3: three months before, the birthday month, and three months after equal the seven-month initial enrollment period."}]},{"title":"Original Medicare: Part A and Part B","blocks":[{"type":"p","text":"<b>Original Medicare<\/b> has two parts. Part A is hospital insurance and Part B is medical insurance. Together they let a beneficiary see any provider in the country that accepts Medicare."},{"type":"h","text":"Part A - Hospital Insurance"},{"type":"p","text":"Part A is funded by payroll (FICA) taxes. Most people pay no premium for it because they or a spouse earned 40 quarters of coverage, which is about ten years of work. People without enough credits can buy Part A by paying a premium."},{"type":"list","items":["Inpatient hospital care","Skilled nursing facility care following a hospital stay","Home health care that is medically necessary","Hospice care for the terminally ill"]},{"type":"p","text":"Part A works in <b>benefit periods<\/b>. A benefit period begins the day the patient is admitted as an inpatient and ends once the patient has gone 60 consecutive days without inpatient hospital or skilled nursing care. The Part A deductible is charged per benefit period, not per year, so a person could owe it more than once in the same year."},{"type":"table","head":["Hospital days","Who pays"],"rows":[["Days 1 - 60","Medicare pays in full after the Part A deductible"],["Days 61 - 90","Patient pays a daily coinsurance amount"],["Lifetime reserve days (60 total, used once)","Patient pays a higher daily coinsurance amount"],["Beyond that","Patient pays all costs"]]},{"type":"p","text":"Skilled nursing facility care is covered for up to 100 days per benefit period, and only after an inpatient hospital stay of at least three days. Medicare pays the first 20 days in full; the patient pays a daily copayment for days 21 through 100."},{"type":"h","text":"Part B - Medical Insurance"},{"type":"p","text":"Part B is voluntary and is paid for by monthly premiums plus federal general revenue. It covers doctor services, outpatient hospital care, diagnostic tests, durable medical equipment, ambulance service and many preventive services. After an annual deductible, Medicare generally pays 80 percent of the approved amount and the patient pays 20 percent, with no annual cap on that 20 percent."},{"type":"example","text":"After meeting his Part B deductible, Leon has an approved outpatient charge of 500 dollars. Medicare pays 400 dollars and Leon owes 100 dollars."},{"type":"tip","text":"Part A is tied to benefit periods and payroll taxes; Part B is tied to an annual deductible, a monthly premium and an 80/20 split."}]},{"title":"Part C, Part D and What Medicare Does Not Cover","blocks":[{"type":"h","text":"Part C - Medicare Advantage"},{"type":"p","text":"<b>Medicare Advantage<\/b> plans are sold by private companies under contract with Medicare. They must provide at least everything Part A and Part B provide, and many add extras such as routine dental, vision, hearing or drug coverage. Common designs are HMOs, PPOs and private fee-for-service plans."},{"type":"p","text":"To join, a person must have both Part A and Part B and live in the plan's service area. The member keeps paying the Part B premium. In exchange for the extras, members usually agree to use a provider network and follow the plan's rules."},{"type":"h","text":"Part D - Prescription Drugs"},{"type":"p","text":"<b>Part D<\/b> is optional outpatient prescription drug coverage offered through private insurers. It can be bought as a stand-alone drug plan alongside Original Medicare, or it may be built into a Medicare Advantage plan. Each plan uses a formulary, which is its list of covered drugs. Members typically pay a monthly premium, a deductible and copayments or coinsurance."},{"type":"p","text":"A person who goes 63 days or more without Part D or other creditable drug coverage after first becoming eligible will pay a late enrollment penalty added to the premium for as long as the coverage is kept."},{"type":"table","head":["Part","Nickname","Delivered by"],"rows":[["A","Hospital insurance","Federal government"],["B","Medical insurance","Federal government"],["C","Medicare Advantage","Private insurers approved by Medicare"],["D","Prescription drug coverage","Private insurers approved by Medicare"]]},{"type":"h","text":"Gaps in Original Medicare"},{"type":"list","items":["Deductibles, coinsurance and copayments under Part A and Part B","Long-term custodial care","Routine dental care and dentures","Routine eye exams and eyeglasses","Hearing aids and the exams to fit them","Cosmetic surgery","Most care received outside the United States","Private-duty nursing"]},{"type":"example","text":"Gene needs help bathing and dressing but no medical treatment. Because this is custodial care only, Medicare will not pay for it."},{"type":"tip","text":"If a question asks which part of Medicare is run by private insurers and replaces Original Medicare delivery, the answer is Part C."}]},{"title":"Medicare Supplement (Medigap) Insurance","blocks":[{"type":"p","text":"A <b>Medicare Supplement<\/b> policy, also called Medigap, is sold by private insurers to pay some of the costs Original Medicare leaves behind, such as deductibles and coinsurance. It works only with Original Medicare. It cannot be used with a Medicare Advantage plan, and selling a Medigap policy to someone who is in Medicare Advantage is generally prohibited."},{"type":"h","text":"Standardized plans"},{"type":"p","text":"Medigap plans are <b>standardized<\/b> and identified by letters. A plan with a given letter offers the same benefits no matter which company sells it, so the main differences between insurers are price and service. Plan A is the most basic and contains only the core benefits. Every insurer that sells Medigap must offer Plan A. Plans that pay the Part B deductible (Plans C and F) cannot be sold to people who became newly eligible for Medicare on or after January 1, 2020."},{"type":"h","text":"Core benefits found in every plan"},{"type":"list","items":["Part A hospital coinsurance, plus 365 additional hospital days after Medicare benefits run out","Part B coinsurance or copayments (generally the 20 percent)","The first three pints of blood each year","Part A hospice coinsurance or copayments"]},{"type":"h","text":"Consumer protections"},{"type":"p","text":"The Medigap <b>open enrollment period<\/b> lasts six months and starts when a person is both 65 or older and enrolled in Part B. During this time the insurer must accept the applicant and cannot charge more because of health."},{"type":"flow","nodes":["Age 65 + Part B","6-month open enrollment","No health underwriting"],"caption":"Medigap open enrollment guarantees acceptance"},{"type":"list","items":["Guaranteed renewable: the insurer may not cancel because of health or claims, only for nonpayment of premium or material misrepresentation","30-day free look: the buyer may return the policy within 30 days for a full premium refund","Pre-existing conditions may be excluded for no more than six months","An outline of coverage and a buyer's guide must be given to the applicant","A policy may not duplicate Medicare benefits, and a person needs only one Medigap policy"]},{"type":"h","text":"Replacement"},{"type":"p","text":"When a new Medigap policy replaces an existing one, the agent must give the applicant a signed <b>notice regarding replacement<\/b>. The new policy cannot impose a fresh waiting period for pre-existing conditions that was already satisfied under the old policy. The client should keep the old policy until the new one is in force."},{"type":"tip","text":"Medigap numbers to memorize: 6-month open enrollment, 6-month maximum pre-existing exclusion, 30-day free look."}]},{"title":"Medicaid Basics","blocks":[{"type":"p","text":"<b>Medicaid<\/b> was created under Title XIX of the Social Security Act. It is a public assistance program for people with low income and few assets, regardless of age. Unlike Medicare, eligibility is <b>needs-based<\/b>: applicants must meet income and resource limits."},{"type":"p","text":"Medicaid is paid for jointly by the federal government and the states. Each state runs its own program within federal guidelines, so details differ from state to state. In Texas, the program is administered by the Texas Health and Human Services Commission."},{"type":"h","text":"Who Medicaid commonly helps"},{"type":"list","items":["Low-income children and pregnant women","Low-income adults who are aged, blind or disabled","People who need nursing home care and have used up most of their own resources"]},{"type":"p","text":"Medicaid is the largest public payer of long-term nursing home care in the country. Because Medicare does not cover custodial care, many people pay for a nursing home from savings until they qualify. Reducing countable assets to reach the limit is called <b>spend-down<\/b>."},{"type":"p","text":"To discourage people from simply giving property away, Medicaid reviews transfers of assets made for less than fair value during a look-back period before the application. Improper transfers can delay eligibility. After a recipient dies, the state may also seek repayment from the estate for long-term care costs it paid, which is known as estate recovery."},{"type":"p","text":"A person can have both programs at once. Someone who qualifies for Medicare and Medicaid is called <b>dual eligible<\/b>. Medicare pays first, and Medicaid may then help with premiums, deductibles and services Medicare does not cover."},{"type":"table","head":["Feature","Medicare","Medicaid"],"rows":[["Law","Title XVIII","Title XIX"],["Basis for eligibility","Age, disability or kidney failure","Financial need"],["Run by","Federal government","States, within federal rules"],["Funding","Payroll taxes, premiums, general revenue","Federal and state tax dollars"],["Long-term custodial care","Not covered","Covered for those who qualify"]]},{"type":"example","text":"Ruth, age 82, has spent nearly all her savings on nursing home bills. Once her assets fall below the state limit, Medicaid can begin paying for her care."},{"type":"tip","text":"Medicare is for the aged and disabled regardless of wealth; Medicaid is aid for people with financial need."}]},{"title":"Long-Term Care: Types and Levels of Care","blocks":[{"type":"p","text":"<b>Long-term care (LTC) insurance<\/b> pays for extended help when a person can no longer care for himself or herself because of chronic illness, disability or cognitive decline. It exists because Medicare, Medigap and ordinary health insurance pay very little for this kind of care."},{"type":"h","text":"Three levels of care"},{"type":"table","head":["Level","What it is","Who provides it"],"rows":[["Skilled","Round-the-clock medical and rehabilitative care ordered by a physician","Licensed medical professionals such as registered nurses and therapists"],["Intermediate","Occasional or intermittent nursing and rehabilitative care for stable conditions","Licensed nurses under a physician's supervision"],["Custodial","Help with personal needs like bathing, dressing and eating","People without medical training, though it must be recommended by a physician"]]},{"type":"p","text":"<b>Custodial care<\/b> is the level people need most often and for the longest time, and it can be provided in a facility or at home. It is also the level Medicare does not pay for."},{"type":"h","text":"Where care is delivered"},{"type":"list","items":["Home health care: part-time skilled nursing, therapy or aide services provided in the insured's home","Adult day care: supervision, meals and social activity during daytime hours for people who live at home but cannot be left alone","Respite care: temporary care, at home or in a facility, so the regular family caregiver can rest","Hospice care: comfort care and pain control for terminally ill patients and support for their families, rather than treatment aimed at a cure","Assisted living and residential care: housing with personal care services for people who do not need a nursing home","Continuing care retirement communities: campuses that offer independent living, assisted living and nursing care in one place"]},{"type":"p","text":"Texas law does not allow an LTC policy to require a prior hospital stay before it will pay for nursing home or home care. A policy also may not cover skilled care only or pay substantially more for skilled care than for lower levels of care."},{"type":"example","text":"Sam looks after his wife, who has dementia. Her LTC policy pays for a week of respite care in a facility so Sam can recover from his own surgery."},{"type":"tip","text":"Respite care is for the caregiver's relief; hospice care is for the terminally ill patient's comfort."}]},{"title":"Long-Term Care Policy Features","blocks":[{"type":"h","text":"Benefit triggers"},{"type":"p","text":"LTC benefits begin when the insured meets a <b>benefit trigger<\/b>. Under a tax-qualified policy the insured must be certified as chronically ill by a licensed health care practitioner within the past 12 months. That means one of two things is true:"},{"type":"list","items":["The insured cannot perform at least two of the six activities of daily living without substantial help, and the condition is expected to last at least 90 days","The insured has a severe cognitive impairment, such as Alzheimer's disease, and needs substantial supervision for safety"]},{"type":"p","text":"The six <b>activities of daily living<\/b> are bathing, dressing, eating, toileting, transferring (for example, moving from bed to chair) and continence."},{"type":"flow","nodes":["Trigger met","Elimination period","Benefits paid","Benefit period ends"],"caption":"How a long-term care claim moves through time"},{"type":"h","text":"Elimination and benefit periods"},{"type":"p","text":"The <b>elimination period<\/b> works like a deductible measured in time. It is the number of days of care the insured must pay for personally before benefits start, commonly 30, 60 or 90 days. A longer elimination period lowers the premium. The <b>benefit period<\/b> is how long benefits last, such as two, three or five years or for life. A longer benefit period raises the premium. Texas requires a benefit period of at least 12 months."},{"type":"h","text":"Other important features"},{"type":"list","items":["Inflation protection: the insurer must offer an option that increases benefits over time, such as 5 percent compounded annually, so coverage keeps pace with rising costs","Guaranteed renewable: the insurer cannot cancel for age or health, but may raise premiums for an entire class","30-day free look with a full refund","Pre-existing conditions: a look-back of no more than six months and an exclusion of no more than six months after the effective date","Alzheimer's disease and similar organic brain disorders may not be excluded","Protection against unintentional lapse, allowing the insured to name another person to receive notice of a missed premium"]},{"type":"h","text":"Tax-qualified and partnership policies"},{"type":"p","text":"A <b>tax-qualified<\/b> policy meets federal standards. Benefits are generally received income tax free, and premiums may count as medical expenses, up to age-based limits, for taxpayers who itemize."},{"type":"p","text":"A <b>partnership policy<\/b> is a tax-qualified policy tied to the state Medicaid program. For every dollar the policy pays in benefits, the insured may keep a dollar of assets that would otherwise have to be spent down before qualifying for Medicaid. Those protected assets are also shielded from estate recovery."},{"type":"example","text":"Dana's partnership policy pays 200,000 dollars in benefits before it is exhausted. When she applies for Medicaid, she may keep an extra 200,000 dollars of assets above the usual limit."},{"type":"tip","text":"The qualified LTC trigger is 2 of 6 ADLs expected to last 90 days, or severe cognitive impairment."}]}],"summary":{"recap":["Medicare is federal health insurance for people 65 and older, people who have collected Social Security disability for 24 months, and people with end-stage renal disease or ALS. The initial enrollment period is seven months wide, with general enrollment each January through March and an annual election period each fall.","Part A covers inpatient hospital, skilled nursing facility, home health and hospice care and is organized around benefit periods. Part B covers doctors and outpatient services with an annual deductible and an 80/20 split. Part C delivers those benefits through private plans, and Part D adds prescription drug coverage.","Original Medicare leaves gaps: cost sharing, custodial care, and routine dental, vision and hearing care. Medicare Supplement policies are standardized lettered plans that fill many cost-sharing gaps. They come with a six-month open enrollment period, guaranteed renewability and a 30-day free look.","Medicaid is a needs-based program funded by federal and state governments and run by each state. It is the main public payer of long-term nursing home care for people who have exhausted their resources.","Long-term care insurance covers skilled, intermediate and custodial care in facilities, in the community and at home. Benefits are triggered by the loss of two of six ADLs or by severe cognitive impairment. Elimination periods, benefit periods, inflation protection, tax-qualified status and partnership asset protection shape each policy."],"avaSummary":"Nice work getting through chapter seventeen. Let me pull it together for you. Medicare is federal coverage for people sixty-five and over, for people who have been on Social Security disability for twenty-four months, and for people with permanent kidney failure or ALS. The first chance to enroll is a seven-month window around the sixty-fifth birthday. Part A is hospital insurance. It covers inpatient stays, skilled nursing after a three-day hospital stay, home health and hospice, and it runs on benefit periods. Part B is medical insurance, with a yearly deductible and Medicare paying eighty percent. Part C, Medicare Advantage, is private plans delivering A and B benefits. Part D is drug coverage. Now the gaps. Medicare does not pay for custodial care, routine dental, vision or hearing aids, and it leaves deductibles and coinsurance to the patient. Medigap policies fill much of that cost sharing. They are standardized by letter, every plan includes the core benefits, open enrollment lasts six months, the free look is thirty days, and the policies are guaranteed renewable. Medicaid is different. It is needs-based, funded by federal and state dollars, and run by the state. Finally, long-term care insurance. Know the three levels of care: skilled, intermediate and custodial. Know that benefits trigger when someone cannot do two of six activities of daily living, or has a severe cognitive impairment. Know that the elimination period is a waiting period, and that a partnership policy protects assets dollar for dollar. Review the tables, take the chapter exam, and I will see you in chapter eighteen.","reviewNotes":[{"objective":"Identify who qualifies for Medicare and when a person can enroll","concepts":["Eligibility comes from age 65, 24 months of Social Security disability, end-stage renal disease or ALS","Medicare is not based on income or assets","The initial enrollment period is seven months: three before, the birthday month and three after","General enrollment runs January 1 through March 31; the annual election period runs October 15 through December 7","Late enrollment in Part B can mean a permanently higher premium unless a special enrollment period applies"],"terms":[{"term":"Initial enrollment period","def":"The seven-month window around the month a person turns 65."},{"term":"Special enrollment period","def":"A chance to enroll outside normal windows after events such as loss of employer group coverage."}]},{"objective":"Describe what Medicare Part A and Part B cover and what they leave out","concepts":["Part A covers inpatient hospital, skilled nursing facility, home health and hospice care","Part A is premium-free for most people with 40 quarters of work credits","A benefit period ends after 60 straight days without inpatient or skilled nursing care","Skilled nursing facility care requires a three-day hospital stay and is limited to 100 days per benefit period","Part B covers doctors and outpatient care, paying 80 percent after the annual deductible","Custodial care and routine dental, vision and hearing care are not covered"],"terms":[{"term":"Benefit period (Part A)","def":"The unit Part A uses to measure hospital and skilled nursing use and to charge its deductible."},{"term":"Lifetime reserve days","def":"Sixty extra hospital days that can be used only once in a lifetime."}]},{"objective":"Compare Medicare Advantage (Part C) and prescription drug coverage (Part D) with Original Medicare","concepts":["Part C plans are offered by private insurers and must cover at least what Parts A and B cover","A person needs both Part A and Part B to join a Medicare Advantage plan and still pays the Part B premium","Part C plans commonly use networks such as HMOs and PPOs and may add extra benefits","Part D is optional drug coverage through private plans that use formularies","Going 63 days or more without creditable drug coverage leads to a Part D late penalty"],"terms":[{"term":"Medicare Advantage","def":"Private plan alternative for receiving Part A and Part B benefits."},{"term":"Formulary","def":"A drug plan's list of covered medications."}]},{"objective":"Explain how Medicare Supplement policies are standardized and which consumer protections apply","concepts":["Medigap plans are lettered, and each letter has identical benefits from every insurer","Plan A holds only the core benefits and must be offered by every Medigap insurer","Open enrollment is six months beginning at age 65 with Part B, with no health underwriting","Policies are guaranteed renewable and carry a 30-day free look","Pre-existing condition exclusions are limited to six months and cannot restart on replacement","Medigap cannot be paired with Medicare Advantage"],"terms":[{"term":"Core benefits","def":"Part A coinsurance plus 365 extra hospital days, Part B coinsurance, three pints of blood and hospice coinsurance."},{"term":"Notice regarding replacement","def":"A signed form required when one Medigap policy replaces another."}]},{"objective":"Summarize the purpose of Medicaid and how it differs from Medicare","concepts":["Medicaid is Title XIX; Medicare is Title XVIII","Medicaid eligibility depends on limited income and assets","Funding is shared by federal and state governments, and the state administers the program","Medicaid pays for long-term custodial nursing home care for those who qualify","A person with both programs is dual eligible, and Medicare pays first"],"terms":[{"term":"Spend-down","def":"Using up countable assets until the Medicaid limit is reached."},{"term":"Dual eligible","def":"Qualified for both Medicare and Medicaid."}]},{"objective":"Explain long-term care insurance, including levels of care, benefit triggers and key policy features","concepts":["The levels of care are skilled, intermediate and custodial","Settings include home health, adult day care, respite care, hospice and assisted living","Qualified benefits trigger on loss of two of six ADLs for an expected 90 days or on severe cognitive impairment","A longer elimination period lowers premium; a longer benefit period raises it","Inflation protection must be offered, and policies are guaranteed renewable with a 30-day free look","Partnership policies protect assets from Medicaid spend-down dollar for dollar"],"terms":[{"term":"Activities of daily living","def":"Bathing, dressing, eating, toileting, transferring and continence."},{"term":"Elimination period","def":"Days of care the insured pays for before benefits begin."},{"term":"Partnership policy","def":"Qualified LTC policy that earns a Medicaid asset disregard equal to benefits paid."}]}]},"exam":[{"q":"How long is the Medicare initial enrollment period?","choices":["3 months","6 months","7 months","12 months"],"answer":2,"why":"It covers the three months before the 65th birthday month, the birthday month and the three months after, for seven months in total."},{"q":"Which person qualifies for Medicare before age 65?","choices":["Someone who has received Social Security disability benefits for 24 months","Someone whose income is below the poverty level","Someone who has been unemployed for 12 months","Someone who retired early at age 62"],"answer":0,"why":"Medicare is available under age 65 after 24 months of Social Security disability benefits, or with end-stage renal disease or ALS."},{"q":"Medicare Part A helps pay for which of the following?","choices":["Physician office visits","Outpatient prescription drugs","Routine dental care","Inpatient hospital care"],"answer":3,"why":"Part A is hospital insurance covering inpatient hospital, skilled nursing facility, home health and hospice care."},{"q":"A Part A benefit period ends when the patient has been out of the hospital or skilled nursing facility for how many consecutive days?","choices":["30","60","90","100"],"answer":1,"why":"A benefit period ends after 60 days in a row without inpatient hospital or skilled nursing care."},{"q":"After the annual deductible, Medicare Part B generally pays what share of approved charges?","choices":["50 percent","100 percent","80 percent","20 percent"],"answer":2,"why":"Part B pays 80 percent of the approved amount and the patient is responsible for the remaining 20 percent."},{"q":"How is Medicare Part A primarily funded?","choices":["Payroll taxes","Monthly premiums from all enrollees","State sales taxes","Insurance company assessments"],"answer":0,"why":"Part A is financed by FICA payroll taxes, which is why most people pay no premium for it."},{"q":"Medicare covers skilled nursing facility care for up to how many days in a benefit period?","choices":["20","60","90","100"],"answer":3,"why":"Following a qualifying three-day hospital stay, Part A covers up to 100 days of skilled nursing facility care per benefit period."},{"q":"Which statement about Medicare Advantage (Part C) is correct?","choices":["It is run directly by the federal government","It is offered by private insurers and must cover at least what Parts A and B cover","It is available only to people under age 65","It must be combined with a Medicare Supplement policy"],"answer":1,"why":"Part C plans are private plans approved by Medicare that provide at least Original Medicare's benefits."},{"q":"Which of these is NOT covered by Original Medicare?","choices":["Inpatient hospital stays","Hospice care","Custodial care that is the only care needed","Outpatient diagnostic tests"],"answer":2,"why":"Medicare does not pay for custodial care when no skilled care is required."},{"q":"Medicare Part D provides coverage for:","choices":["Long-term nursing home stays","Outpatient prescription drugs","Dental and vision care","Hospital deductibles"],"answer":1,"why":"Part D is the optional prescription drug benefit delivered through private plans."},{"q":"The Medicare Supplement open enrollment period lasts:","choices":["6 months from the time a person is 65 or older and enrolled in Part B","30 days from the policy delivery date","7 months around the 65th birthday","12 months from enrollment in Part A"],"answer":0,"why":"For six months after being both 65 and enrolled in Part B, an applicant cannot be turned down or charged more for health reasons."},{"q":"Which benefit is part of the core benefits in every Medicare Supplement plan?","choices":["The Part B deductible","Outpatient prescription drugs","Foreign travel emergency care","Part B coinsurance"],"answer":3,"why":"Core benefits include Part A coinsurance with 365 extra hospital days, Part B coinsurance, the first three pints of blood and hospice coinsurance."},{"q":"How long is the free-look period for a Medicare Supplement policy?","choices":["10 days","20 days","30 days","60 days"],"answer":2,"why":"Medigap buyers have 30 days to return the policy for a full refund of premium."},{"q":"What does it mean that Medigap plans are standardized?","choices":["Every insurer must charge the same premium","A plan with the same letter has the same benefits regardless of insurer","Only one insurer may sell each plan letter","All plans provide identical benefits"],"answer":1,"why":"Standardization means benefits are identical for a given plan letter, though premiums can differ among companies."},{"q":"Eligibility for Medicaid is based primarily on:","choices":["Reaching age 65","Number of work credits earned","Being enrolled in Medicare Part B","Financial need"],"answer":3,"why":"Medicaid is a needs-based assistance program with income and asset limits."},{"q":"Who funds the Medicaid program?","choices":["Federal and state governments together","Private insurers","The federal government alone","Employers through payroll taxes only"],"answer":0,"why":"Medicaid is jointly financed by federal and state governments and administered by each state."},{"q":"Help with bathing, dressing and eating given by someone without medical training is which level of care?","choices":["Skilled care","Intermediate care","Custodial care","Acute care"],"answer":2,"why":"Custodial care is non-medical assistance with personal needs and daily living."},{"q":"Under a tax-qualified long-term care policy, benefits are triggered when the insured cannot perform at least how many activities of daily living?","choices":["One","Two","Three","Four"],"answer":1,"why":"The trigger is the inability to perform at least two of six ADLs for an expected 90 days, or a severe cognitive impairment."},{"q":"Short-term care arranged so a family caregiver can take a break is called:","choices":["Hospice care","Adult day care","Intermediate care","Respite care"],"answer":3,"why":"Respite care temporarily relieves the person who normally provides the care."},{"q":"What is the main advantage of a long-term care partnership policy?","choices":["It allows the insured to protect assets from Medicaid spend-down equal to the benefits the policy paid","It has no elimination period","It never requires premium payments after age 65","It pays benefits without any benefit trigger"],"answer":0,"why":"Partnership policies provide dollar-for-dollar asset protection when the insured later applies for Medicaid."}]},{"id":"ch18","num":18,"title":"Health Insurance Policy Provisions","intro":{"hook":["Most people never read their health policy until something goes wrong. Then the questions come fast: How long do I have to report this? When will I get paid? Can the company back out because of something on my application?","The answers live in the policy provisions. To keep those answers fair and consistent, the states adopted a model law that requires every individual health policy to contain a set of standard provisions and allows insurers to add certain others.","In this chapter you will learn the twelve mandatory provisions and their time frames, the optional provisions an insurer may choose to include, and several other clauses found in nearly every policy. This chapter is heavy on numbers, and those numbers show up again and again on the state exam."],"objectives":["Explain the purpose of the Uniform Individual Accident and Sickness Policy Provisions Law","Describe the mandatory provisions that deal with the contract, premiums and reinstatement","List the claim-related mandatory provisions and the time frame attached to each","Identify the optional provisions and how each one affects benefits or premiums","Distinguish the insuring clause, consideration clause and free-look provision","Differentiate probationary periods, elimination periods, waiver of premium and common exclusions"],"avaIntro":"Hi, it is Ava. Welcome to chapter eighteen, health insurance policy provisions. I like to call this the rulebook chapter. Every individual health policy has to include twelve mandatory provisions, and each one protects the policyowner in a specific way. Several of them come with a number attached, like twenty days, ninety days or three years, and yes, you need to know those numbers. Do not worry, I will give you some easy ways to keep them straight. After the mandatory provisions, we will look at the optional provisions. Those are clauses the insurance company may add to protect itself, such as change of occupation and misstatement of age. We will finish with a few other clauses you will see in every policy, like the insuring clause, the free look and waiver of premium. Grab a pen, because a simple chart of time frames will be your best friend here."},"keywords":[{"term":"Change of occupation","def":"Optional provision that adjusts benefits or premiums when the insured moves to a more or less hazardous job."},{"term":"Consideration clause","def":"The part of the policy stating that the premium and the application statements are what the insured gives in exchange for coverage."},{"term":"Elimination period","def":"The waiting time after a disability begins before benefits become payable."},{"term":"Entire contract","def":"Provision stating that the policy, with the attached application and any riders, is the whole agreement."},{"term":"Free look","def":"The period after delivery during which the owner may return the policy for a full premium refund."},{"term":"Grace period","def":"Time after the premium due date during which coverage stays in force without payment."},{"term":"Insuring clause","def":"The insurer's basic promise to pay, naming the parties and the kind of losses covered."},{"term":"Legal actions","def":"Provision limiting when the insured may sue the insurer: no sooner than 60 days and no later than 3 years after proof of loss."},{"term":"Notice of claim","def":"Provision requiring written notice to the insurer within 20 days of a loss, or as soon as reasonably possible."},{"term":"Probationary period","def":"A waiting period after the policy starts during which certain sickness losses are not covered."},{"term":"Proof of loss","def":"Written evidence of a claim, due within 90 days of the loss."},{"term":"Reinstatement","def":"Putting a lapsed policy back in force, subject to the conditions in the policy."},{"term":"Time limit on certain defenses","def":"Provision that stops the insurer from using application misstatements to deny claims after a set time, except for fraud."},{"term":"Waiver of premium","def":"Provision excusing premium payments while the insured is totally disabled."}],"sections":[{"title":"The Uniform Provisions Law and the Contract Itself","blocks":[{"type":"p","text":"The <b>Uniform Individual Accident and Sickness Policy Provisions Law<\/b> is a model developed by the National Association of Insurance Commissioners and adopted, with small variations, by the states, including Texas. Its goal is to make sure every individual health policy contains the same basic rights and duties."},{"type":"p","text":"The law sets out twelve <b>mandatory provisions<\/b> that must appear in every policy and a group of <b>optional provisions<\/b> the insurer may choose to add. An insurer may reword a provision, but only if the new wording is at least as favorable to the policyowner."},{"type":"flow","nodes":["NAIC model law","State adopts it","12 mandatory provisions","Optional provisions"],"caption":"How the uniform provisions reach an individual health policy"},{"type":"h","text":"1. Entire Contract; Changes"},{"type":"p","text":"The <b>entire contract<\/b> provision says the policy, including any endorsements and attached papers such as the application, is the complete agreement between the parties. Nothing outside the policy can be used against the insured."},{"type":"p","text":"Any change to the policy must be approved by an executive officer of the insurer and attached to the policy in writing. An agent has no authority to change the policy or waive any of its terms."},{"type":"h","text":"2. Time Limit on Certain Defenses"},{"type":"p","text":"This provision works like the incontestable clause in life insurance. After the policy has been in force for the stated period, which is two years in Texas, the insurer cannot void the policy or deny a claim because of misstatements on the application. The exception is <b>fraudulent<\/b> misstatements, which may still be challenged."},{"type":"p","text":"The same provision protects the insured on pre-existing conditions. Once the time limit has passed, a claim cannot be reduced or denied on the ground that the condition existed before the policy date, unless that condition is excluded by name or specific description."},{"type":"example","text":"Paul forgot to list a minor knee treatment on his application. Three years later he files a claim. Because the time limit has passed and the mistake was not fraud, the insurer cannot use the omission to deny the claim."},{"type":"tip","text":"Only an executive officer of the insurer can change a policy; an agent never can."}]},{"title":"Keeping the Policy in Force: Grace Period and Reinstatement","blocks":[{"type":"h","text":"3. Grace Period"},{"type":"p","text":"The <b>grace period<\/b> gives the policyowner extra time to pay after the premium due date. Coverage continues during the grace period, so a covered loss during that time is still payable. The length depends on how often premiums are paid."},{"type":"table","head":["Premium mode","Minimum grace period"],"rows":[["Weekly","7 days"],["Monthly","10 days"],["All other modes (quarterly, semiannual, annual)","31 days"]]},{"type":"p","text":"If the premium is still unpaid when the grace period ends, the policy lapses."},{"type":"h","text":"4. Reinstatement"},{"type":"p","text":"<b>Reinstatement<\/b> brings a lapsed policy back to life. How it happens depends on whether the insurer asks for a new application."},{"type":"list","items":["If the insurer or its agent accepts the overdue premium without requiring an application, the policy is reinstated automatically","If the insurer requires a reinstatement application and issues a conditional receipt, the policy is reinstated when the insurer approves the application","If the insurer does not act on that application, the policy is reinstated automatically on the 45th day after the date of the conditional receipt, unless the insurer has already given written notice that it disapproves"]},{"type":"p","text":"A reinstated policy does not cover everything right away. The purpose is to keep someone from waiting until they get sick to restart coverage."},{"type":"table","head":["Type of loss","When coverage resumes"],"rows":[["Accidental injury","Immediately upon reinstatement"],["Sickness","Only sickness that begins more than 10 days after reinstatement"]]},{"type":"flow","nodes":["Policy lapses","Application + premium","Up to 45 days","Reinstated"],"caption":"Reinstatement when an application is required"},{"type":"example","text":"Tina's policy lapsed in March. She submits a reinstatement application and premium on April 1 and gets a conditional receipt. She hears nothing more. Her policy is automatically reinstated on the 45th day."},{"type":"tip","text":"Grace periods follow 7-10-31, and reinstatement follows 45 days for approval and 10 days for sickness coverage."}]},{"title":"Mandatory Claim Provisions: From Notice to Payment","blocks":[{"type":"p","text":"Five of the mandatory provisions lay out the claim process step by step. Learn them in order and the time frames become much easier to remember."},{"type":"flow","nodes":["Notice: 20 days","Forms: 15 days","Proof: 90 days","Payment"],"caption":"The claim timeline under the mandatory provisions"},{"type":"h","text":"5. Notice of Claim"},{"type":"p","text":"The insured must give the insurer written <b>notice of claim<\/b> within 20 days after the loss, or as soon as reasonably possible. Notice given to the insurer's agent counts as notice to the insurer."},{"type":"h","text":"6. Claim Forms"},{"type":"p","text":"Once it receives notice, the insurer must send <b>claim forms<\/b> to the claimant within 15 days. If the forms do not arrive in time, the claimant may submit proof of loss in any written form that describes the nature and extent of the loss."},{"type":"h","text":"7. Proof of Loss"},{"type":"p","text":"Written <b>proof of loss<\/b> must be given to the insurer within 90 days after the loss. If that is not reasonably possible, the claim is still valid as long as proof is furnished as soon as it can be, and no later than one year after it was due, unless the claimant lacked legal capacity."},{"type":"h","text":"8. Time of Payment of Claims"},{"type":"p","text":"The insurer must pay claims <b>immediately<\/b> after receiving written proof of loss. Benefits that are paid periodically, such as disability income, must be paid at least monthly."},{"type":"h","text":"9. Payment of Claims"},{"type":"p","text":"This provision says who gets the money. Benefits for loss of life go to the named beneficiary, or to the insured's estate if there is none. All other benefits are paid to the insured, unless the insured has asked that they go directly to the hospital or doctor. An optional <b>facility of payment<\/b> clause lets the insurer pay up to 1,000 dollars to a relative of the insured when there is no living beneficiary or the payee cannot legally give a release."},{"type":"table","head":["Provision","Who acts","Time frame"],"rows":[["Notice of claim","Insured","20 days after loss"],["Claim forms","Insurer","15 days after notice"],["Proof of loss","Insured","90 days after loss (outer limit of 1 year)"],["Time of payment","Insurer","Immediately; periodic benefits at least monthly"]]},{"type":"example","text":"Ben reports an injury on May 1. By May 20 no claim forms have arrived. He may write a letter describing what happened and the extent of his loss, and that letter satisfies the proof of loss requirement."},{"type":"tip","text":"Think 20-15-90: twenty days to give notice, fifteen for the insurer to send forms, ninety to file proof."}]},{"title":"Remaining Mandatory Provisions","blocks":[{"type":"p","text":"The last three mandatory provisions cover the insurer's right to investigate, the insured's right to sue and the owner's right to name who receives death benefits."},{"type":"h","text":"10. Physical Examination and Autopsy"},{"type":"p","text":"While a claim is pending, the insurer may have the insured examined by a doctor as often as is reasonably necessary. In a death claim it may also order an autopsy, unless state law forbids it. In both cases the <b>insurer pays the cost<\/b>."},{"type":"h","text":"11. Legal Actions"},{"type":"p","text":"The <b>legal actions<\/b> provision sets a window for lawsuits against the insurer. The insured must wait at least 60 days after filing written proof of loss before suing, which gives the company time to investigate. No suit may be brought more than three years after the date proof of loss was required."},{"type":"h","text":"12. Change of Beneficiary"},{"type":"p","text":"The policyowner may change the beneficiary at any time by written request to the insurer, without the beneficiary's consent, unless the beneficiary was named as <b>irrevocable<\/b>. An irrevocable beneficiary must agree to any change."},{"type":"h","text":"All twelve at a glance"},{"type":"table","head":["#","Provision","Key point"],"rows":[["1","Entire contract; changes","Policy and attachments are the whole agreement; only an executive officer can change it"],["2","Time limit on certain defenses","Misstatements cannot be used after the time limit, except fraud"],["3","Grace period","7, 10 or 31 days by premium mode"],["4","Reinstatement","Automatic on the 45th day; sickness covered after 10 days"],["5","Notice of claim","20 days"],["6","Claim forms","15 days"],["7","Proof of loss","90 days"],["8","Time of payment of claims","Immediately; periodic benefits at least monthly"],["9","Payment of claims","To beneficiary or estate for death; otherwise to insured"],["10","Physical exam and autopsy","At the insurer's expense"],["11","Legal actions","Not before 60 days; not after 3 years"],["12","Change of beneficiary","Owner may change unless irrevocable"]]},{"type":"example","text":"Lisa files proof of loss on January 10 and the insurer has not responded. She must wait until at least 60 days have passed before she can take the company to court."},{"type":"tip","text":"Legal actions: wait 60 days, and do not wait longer than 3 years."}]},{"title":"Optional Provisions","blocks":[{"type":"p","text":"The model law lists eleven <b>optional provisions<\/b>. An insurer is not required to use them, but if it wants a provision on one of these subjects, it must follow the model wording or wording that is no less favorable to the insured. Most of them protect the insurer from paying more than the premium was designed to support."},{"type":"table","head":["Provision","What it does"],"rows":[["Change of occupation","If the insured moves to a more hazardous job, benefits are reduced to what the premium paid would have bought for that job. If the insured moves to a less hazardous job, the premium rate is lowered and the excess premium is refunded."],["Misstatement of age","Benefits are adjusted to the amount the premium paid would have purchased at the correct age."],["Other insurance in this insurer","Limits total coverage with the same company; coverage above the limit is void and the premium for it is refunded."],["Insurance with other insurers (two provisions)","If the insured has overlapping coverage with other companies and did not tell the insurer, benefits are paid on a pro rata basis and premium for the unused portion is refunded. One provision applies to expense-incurred benefits and one to other benefits."],["Relation of earnings to insurance","In disability income policies, if total benefits from all insurers exceed the insured's earnings, each insurer pays only its proportionate share and refunds the excess premium."],["Unpaid premium","Any premium due and unpaid may be deducted from a claim payment."],["Cancellation","Where state law permits it, the insurer may cancel with written notice and a pro rata refund; if the insured cancels, the refund is on a short-rate basis."],["Conformity with state statutes","Any policy provision that conflicts with state law is automatically amended to meet the law's minimum requirements."],["Illegal occupation","The insurer is not liable for losses that result from the insured committing a felony or working in an illegal occupation."],["Intoxicants and narcotics","The insurer is not liable for losses that occur while the insured is intoxicated or under the influence of narcotics, unless the drug was taken on a physician's advice."]]},{"type":"p","text":"For the relation of earnings provision, earnings are measured as the greater of the insured's monthly earnings when the disability begins or the average monthly earnings over the two years before it. The aim is to prevent <b>overinsurance<\/b>, where a person would collect more by being disabled than by working."},{"type":"example","text":"Ray bought his policy as an office clerk and later became a roofer without telling the insurer. He is hurt on a roof. His benefit is cut to the amount his premium would have purchased for a roofer."},{"type":"tip","text":"Misstatement of age never cancels the policy; it only adjusts the benefit to match the premium paid."}]},{"title":"Other Common Policy Provisions","blocks":[{"type":"p","text":"Beyond the uniform provisions, several other clauses appear in almost every individual health policy."},{"type":"h","text":"Insuring clause"},{"type":"p","text":"The <b>insuring clause<\/b> is usually on the first page. It names the insurer and the insured and states the company's general promise to pay benefits for the kinds of loss the policy covers, subject to the policy's terms."},{"type":"h","text":"Consideration clause"},{"type":"p","text":"<b>Consideration<\/b> is what each side gives the other. The insured's consideration is the premium plus the statements made in the application. The insurer's consideration is its promise to pay as described in the policy."},{"type":"h","text":"Free look"},{"type":"p","text":"The <b>free look<\/b>, or right to examine, lets the owner return the policy after delivery for a full refund of premium, and the policy is treated as if it had never been issued. Individual health policies generally provide 10 days. Medicare Supplement and long-term care policies provide 30 days."},{"type":"h","text":"Probationary and elimination periods"},{"type":"table","head":["Feature","Probationary period","Elimination period"],"rows":[["When it runs","Once, right after the policy takes effect","After each disability begins"],["What it applies to","Sickness, not accidents","Any covered disability"],["Purpose","Guards against claims for conditions that already existed","Acts as a time deductible and lowers the premium"]]},{"type":"p","text":"A longer <b>elimination period<\/b> means a lower premium, because the insured absorbs more of each loss."},{"type":"h","text":"Waiver of premium"},{"type":"p","text":"The <b>waiver of premium<\/b> provision excuses premium payments while the insured is totally disabled, after the disability has lasted a stated time, often 90 days. Many policies refund the premiums paid during that waiting time. Premium payments begin again when the insured recovers."},{"type":"h","text":"Common exclusions"},{"type":"list","items":["Injuries that are intentionally self-inflicted","Losses caused by war or an act of war","Losses while on active military duty","Injuries or illness covered by workers' compensation","Elective cosmetic surgery","Losses while committing a felony","Pre-existing conditions, within the limits allowed by law"]},{"type":"example","text":"Kim's disability policy has a 30-day probationary period and a 60-day elimination period. A sickness that starts in week two is not covered at all. A covered disability a year later begins paying after 60 days."},{"type":"tip","text":"The probationary period happens once at the start of the policy; the elimination period applies every time a new disability begins."}]}],"summary":{"recap":["The Uniform Individual Accident and Sickness Policy Provisions Law standardizes individual health policies. It requires twelve mandatory provisions and permits a set of optional ones. Insurers may change the wording only in ways that are at least as favorable to the insured.","The entire contract provision makes the policy and its attachments the whole agreement, and only an executive officer can approve changes. The time limit on certain defenses stops the insurer from using application misstatements after the stated period, except for fraud.","Grace periods are 7 days for weekly premiums, 10 days for monthly and 31 days for other modes. A reinstatement application not acted on is approved automatically on the 45th day; accidents are covered at once and sickness after 10 days.","The claim provisions run in order: notice of claim within 20 days, claim forms within 15 days, proof of loss within 90 days, then immediate payment. The insurer may require exams and an autopsy at its own cost. Lawsuits must wait 60 days and must be filed within three years. The owner may change a revocable beneficiary at any time.","Optional provisions include change of occupation, misstatement of age, other insurance, relation of earnings to insurance, unpaid premium, cancellation, conformity with state statutes, illegal occupation, and intoxicants and narcotics.","Other standard clauses include the insuring clause, the consideration clause, the free look, probationary and elimination periods, waiver of premium and the list of exclusions."],"avaSummary":"That was a lot of numbers, so let us walk back through them together. Every individual health policy must carry twelve mandatory provisions. First, the entire contract: the policy and the attached application are the whole deal, and only an executive officer of the company can change it. Second, the time limit on certain defenses, which keeps the insurer from denying claims over old application mistakes once the time limit has run, unless there was fraud. Third, the grace period: seven days for weekly premiums, ten for monthly, thirty-one for everything else. Fourth, reinstatement: automatic on the forty-fifth day if the insurer stays silent, with accidents covered immediately and sickness after ten days. Then the claim steps. Notice of claim in twenty days. Claim forms from the insurer in fifteen days. Proof of loss in ninety days. Payment immediately. After that, the insurer can require a physical exam or autopsy at its own expense. Legal actions cannot begin before sixty days or after three years. And the owner can change the beneficiary unless it is irrevocable. The optional provisions mostly protect the company. Change of occupation and misstatement of age adjust the benefit rather than cancel the policy. Relation of earnings prevents overinsurance on disability policies. Illegal occupation and intoxicants provisions remove liability for those losses. Finally, remember the insuring clause is the promise to pay, consideration is the premium and the application, the probationary period happens once, and the elimination period applies to each disability. Make yourself a time frame chart, then try the exam.","reviewNotes":[{"objective":"Explain the purpose of the Uniform Individual Accident and Sickness Policy Provisions Law","concepts":["The law is an NAIC model adopted by the states to standardize individual health policies","It requires twelve mandatory provisions and permits eleven optional provisions","Insurers may reword provisions only if the result is at least as favorable to the insured","Mandatory provisions mainly protect the insured; optional provisions mainly protect the insurer"],"terms":[{"term":"Mandatory provisions","def":"The twelve provisions every individual health policy must contain."},{"term":"Optional provisions","def":"Provisions an insurer may include at its choice, following the model wording."}]},{"objective":"Describe the mandatory provisions that deal with the contract, premiums and reinstatement","concepts":["The policy with its attachments is the entire contract","Changes require approval by an executive officer; agents cannot alter the policy","After the time limit (two years in Texas), only fraudulent misstatements can be used to contest","Grace periods are 7, 10 and 31 days for weekly, monthly and other premium modes","Reinstatement is automatic on the 45th day after a conditional receipt if the insurer has not refused","After reinstatement, accidents are covered at once and sickness after 10 days"],"terms":[{"term":"Entire contract","def":"The policy, application and riders make up the full agreement."},{"term":"Grace period","def":"Extra time to pay a premium while coverage continues."},{"term":"Reinstatement","def":"Restoring a lapsed policy to active status."}]},{"objective":"List the claim-related mandatory provisions and the time frame attached to each","concepts":["Notice of claim is due within 20 days of the loss","The insurer must supply claim forms within 15 days of notice","Proof of loss is due within 90 days, with an outer limit of one year absent legal incapacity","Claims are paid immediately; periodic benefits at least monthly","The insurer pays for physical exams and autopsies","Lawsuits may not start before 60 days or after 3 years from proof of loss"],"terms":[{"term":"Notice of claim","def":"The insured's written report of a loss to the insurer."},{"term":"Proof of loss","def":"Written documentation showing the nature and extent of the loss."},{"term":"Legal actions","def":"The provision setting the 60-day and 3-year limits on suing the insurer."}]},{"objective":"Identify the optional provisions and how each one affects benefits or premiums","concepts":["Change to a more hazardous occupation reduces benefits; a less hazardous one reduces the premium rate","Misstatement of age adjusts benefits to what the premium would have bought","Other insurance provisions limit or prorate benefits and refund excess premium","Relation of earnings to insurance prevents disability benefits from exceeding earnings","Unpaid premiums can be deducted from a claim","Conflicting policy terms are amended to conform with state law"],"terms":[{"term":"Change of occupation","def":"Adjustment of benefits or premium when job hazard changes."},{"term":"Relation of earnings to insurance","def":"Proportionate reduction of disability benefits that exceed earnings."},{"term":"Conformity with state statutes","def":"Automatic amendment of policy terms that conflict with state law."}]},{"objective":"Distinguish the insuring clause, consideration clause and free-look provision","concepts":["The insuring clause states the insurer's promise and identifies the parties","The insured's consideration is the premium and the application statements","The insurer's consideration is the promise to pay","The free look allows return of the policy for a full refund, generally within 10 days for individual health policies","Medicare Supplement and long-term care policies have a 30-day free look"],"terms":[{"term":"Insuring clause","def":"The insurer's general promise to pay covered losses."},{"term":"Consideration clause","def":"Statement of what each party exchanges to form the contract."},{"term":"Free look","def":"Right to examine and return the policy for a full refund."}]},{"objective":"Differentiate probationary periods, elimination periods, waiver of premium and common exclusions","concepts":["A probationary period applies once after issue and applies to sickness, not accidents","An elimination period applies after each disability begins and works as a time deductible","Longer elimination periods reduce premiums","Waiver of premium stops premium payments during total disability after a waiting time, often 90 days","Typical exclusions include self-inflicted injury, war, military service, workers' compensation losses and cosmetic surgery"],"terms":[{"term":"Probationary period","def":"Initial waiting period for sickness coverage on a new policy."},{"term":"Elimination period","def":"Waiting period at the start of each disability before benefits are paid."},{"term":"Waiver of premium","def":"Premiums are excused while the insured remains totally disabled."}]}]},"exam":[{"q":"How many mandatory provisions does the Uniform Individual Accident and Sickness Policy Provisions Law require?","choices":["10","11","12","15"],"answer":2,"why":"The model law requires twelve mandatory provisions in every individual health policy."},{"q":"Under the entire contract provision, who may approve a change to the policy?","choices":["An executive officer of the insurer","The writing agent","The beneficiary","The agent's manager"],"answer":0,"why":"Changes must be approved by an executive officer and attached to the policy; agents have no authority to change it."},{"q":"What is the minimum grace period for a health policy with monthly premiums?","choices":["7 days","10 days","31 days","45 days"],"answer":1,"why":"Grace periods are 7 days for weekly premiums, 10 days for monthly and 31 days for all other modes."},{"q":"An annual-premium health policy has a grace period of at least:","choices":["7 days","10 days","20 days","31 days"],"answer":3,"why":"Any mode other than weekly or monthly carries a 31-day grace period."},{"q":"An insured submits a reinstatement application and receives a conditional receipt. If the insurer takes no action, the policy is reinstated automatically after:","choices":["10 days","30 days","45 days","60 days"],"answer":2,"why":"Unless the insurer gives notice of disapproval, reinstatement is automatic on the 45th day after the conditional receipt."},{"q":"After a policy is reinstated, sickness is covered only if it begins more than how many days after reinstatement?","choices":["10 days","20 days","31 days","45 days"],"answer":0,"why":"Accidents are covered immediately, but sickness must begin more than 10 days after reinstatement."},{"q":"Written notice of claim must be given to the insurer within:","choices":["10 days of the loss","20 days of the loss","60 days of the loss","90 days of the loss"],"answer":1,"why":"The notice of claim provision calls for notice within 20 days or as soon as reasonably possible."},{"q":"After receiving notice of claim, the insurer must furnish claim forms within:","choices":["5 days","10 days","20 days","15 days"],"answer":3,"why":"If forms are not supplied within 15 days, the claimant may submit proof of loss in any written form."},{"q":"Proof of loss must normally be filed with the insurer within:","choices":["20 days of the loss","45 days of the loss","90 days of the loss","3 years of the loss"],"answer":2,"why":"The proof of loss provision sets a 90-day period, with an outer limit of one year unless the claimant lacked legal capacity."},{"q":"Under the time of payment of claims provision, disability income benefits paid periodically must be paid at least:","choices":["Monthly","Weekly","Quarterly","Annually"],"answer":0,"why":"Claims are payable immediately upon proof of loss, and periodic benefits must be paid no less often than monthly."},{"q":"Who pays for a physical examination the insurer requires while a claim is pending?","choices":["The insured","The insurer","The insured's physician","The beneficiary"],"answer":1,"why":"The physical exam and autopsy provision gives the insurer the right to examine the insured at the insurer's own expense."},{"q":"An insured may not bring a lawsuit against the insurer until how long after filing proof of loss?","choices":["20 days","31 days","45 days","60 days"],"answer":3,"why":"The legal actions provision requires a 60-day wait and bars suits after three years."},{"q":"What is the latest an insured may bring legal action against the insurer after proof of loss is required?","choices":["1 year","2 years","3 years","5 years"],"answer":2,"why":"No legal action may be started more than three years after the time proof of loss is required."},{"q":"An insured changes to a more hazardous occupation and is then injured. Under the change of occupation provision, the insurer will:","choices":["Deny the claim entirely","Pay the reduced benefit
