name: Install Agent Operations Core
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-agent-operations-core.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy route ownership and install canonical core
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # The live back-office file may keep old renderer functions for historical code
          # compatibility, but it must no longer register or auto-enhance the canonical
          # dashboard/team routes owned by Agent Operations Core.
          p=Path('phase16-live-backoffice.js')
          s=p.read_text()
          for old in [
            "      if(k==='ALLSHIELD OPERATIONS') return await renderAdminDashboard(main);\n",
            "      if(k==='TEAM & ROLES') return await renderTeam(main);\n",
            "      if(k==='TEAM & ROLES' || k==='TEAM ACCOUNTS') return await renderTeam(main);\n",
            "  window.registerAllshieldView('admin','dashboard',()=>renderAdminDashboard(adminMain()));\n",
            "  window.registerAllshieldView('admin','team',()=>renderTeam(adminMain()));\n",
            "  window.registerAllshieldView('owner','teamaccounts',()=>renderTeam(ownerMain()));\n",
          ]:
            s=s.replace(old,'')
          p.write_text(s)

          # Onboarding Router owns onboarding/licensing/recruiting only. Team Accounts is
          # now canonical in Agent Operations Core, so remove the old/protective registration.
          p=Path('onboarding-router-2026-08-27.js')
          s=p.read_text()
          start="  window.registerAllshieldView('owner','teamaccounts',main=>{"
          if start in s:
            i=s.index(start)
            marker="\n  window.ALLSHIELD_ONBOARDING_ROUTER_VERSION=VERSION;"
            j=s.index(marker,i)
            s=s[:i]+s[j:]
          s=s.replace("const VERSION='2026.08.28.013';","const VERSION='2026.08.28.014';",1)
          p.write_text(s)

          # Remove the temporary Team Accounts bridge loaders and load one canonical core.
          p=Path('config.js')
          s=p.read_text()
          s=re.sub(r"\s*\['allshieldTeamAccountsInviteOverrideLoader','\./team-accounts-invite-override-2026-08-28\.js\?v=[^']+'\],",'',s)
          s=s.replace('./onboarding-router-2026-08-27.js?v=2026.08.28.013','./onboarding-router-2026-08-27.js?v=2026.08.28.014')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'^<script defer src="\./manual-agent-onboarding-2026-08-28\.js\?v=[^"]+"></script>\n','',s,flags=re.M)
          s=re.sub(r'^<script defer src="\./team-accounts-invite-override-2026-08-28\.js\?v=[^"]+"></script>\n','',s,flags=re.M)
          s=s.replace('./phase16-live-backoffice.js?v=B2026.08.20.006','./phase16-live-backoffice.js?v=2026.08.28.001')
          s=s.replace('./config.js?v=2026.08.28.017','./config.js?v=2026.08.28.018')
          loader='<script defer src="./agent-operations-core-2026-08-28.js?v=2026.08.28.001"></script>\n'
          if 'agent-operations-core-2026-08-28.js' not in s:
            anchor='<script defer src="./responsive-ui.js?v=2026.08.27.011"></script>'
            if anchor not in s: raise SystemExit('responsive-ui anchor missing')
            s=s.replace(anchor,loader+anchor,1)
          p.write_text(s)

          # Assert the canonical route ownership before committing.
          phase=Path('phase16-live-backoffice.js').read_text()
          router=Path('onboarding-router-2026-08-27.js').read_text()
          idx=Path('index.html').read_text()
          cfg=Path('config.js').read_text()
          assert "registerAllshieldView('admin','dashboard',()=>renderAdminDashboard" not in phase
          assert "registerAllshieldView('admin','team',()=>renderTeam" not in phase
          assert "registerAllshieldView('owner','teamaccounts',()=>renderTeam" not in phase
          assert "registerAllshieldView('owner','teamaccounts'" not in router
          assert 'manual-agent-onboarding-2026-08-28.js' not in idx
          assert 'team-accounts-invite-override-2026-08-28.js' not in idx
          assert 'allshieldTeamAccountsInviteOverrideLoader' not in cfg
          assert 'agent-operations-core-2026-08-28.js?v=2026.08.28.001' in idx
          PY
      - name: Syntax check canonical JavaScript
        run: |
          node --check agent-operations-core-2026-08-28.js
          node --check phase16-live-backoffice.js
          node --check onboarding-router-2026-08-27.js
          node --check config.js
      - name: Commit canonical ownership
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "allshield-build-bot"
          git config user.email "allshield-build-bot@users.noreply.github.com"
          git add phase16-live-backoffice.js onboarding-router-2026-08-27.js config.js index.html
          git commit -m "Make Agent Operations Core canonical for dashboard and team accounts"
          git push