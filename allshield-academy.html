 the whole path matters because the steps depend on each other. Agents who understand the order lose less time waiting, and they never make the costly mistake of selling before they are legally allowed to."],"objectives":["Describe how Allshield Academy modules, review notes and exams fit together","List the steps of the Texas licensing path in the correct order","Explain what happens at the state exam, fingerprinting and license application steps","Explain why errors and omissions coverage and carrier appointments come before selling","Identify the extra registration and certification needed for Marketplace and Medicare sales"],"avaIntro":"Hi, I am Ava, your instructor here at Allshield Academy, and I am glad you are here. Before we talk about a single insurance plan, I want to show you the road ahead. In this module I will explain how the Academy works, and then we will walk the licensing path together, step by step. You will prepare for the state exam, sit for it at a Pearson VUE test center, complete fingerprints, and apply for your Texas license. After that come errors and omissions coverage, carrier appointments, and your Marketplace registration. Medicare has its own certification, and we will get there later. I will tell you what each step is, why it exists, and what order to do it in. Nothing here is complicated once you see it laid out. Take notes, take your time, and let us get you licensed the right way."},"keywords":[{"term":"AHIP certification","def":"An annual training and test, widely required by carriers, that an agent completes before selling Medicare Advantage and Part D plans."},{"term":"Appointment","def":"A carrier's formal authorization for a licensed agent to sell its products."},{"term":"Continuing education","def":"Approved coursework a licensed agent completes each renewal period to keep the license active."},{"term":"Errors and omissions coverage","def":"Professional liability insurance that protects an agent against claims of mistakes or oversights in their work."},{"term":"FFM registration","def":"The yearly CMS training and agreement process that allows an agent to help consumers enroll through HealthCare.gov."},{"term":"Fingerprinting","def":"The background check step in which an applicant's prints are taken by the state's approved vendor."},{"term":"General lines license","def":"The Texas agent license type covering life, accident, health and HMO products."},{"term":"NIPR","def":"The National Insurance Producer Registry, an online system for license applications and renewals."},{"term":"NPN","def":"National Producer Number, the unique ID that follows an agent across states, carriers and the Marketplace."},{"term":"Pearson VUE","def":"The testing company that delivers the Texas insurance licensing exam."},{"term":"Sircon","def":"An online licensing service used to submit and track insurance license applications."},{"term":"Texas Department of Insurance","def":"The state agency that licenses and regulates insurance agents and companies in Texas."}],"sections":[{"title":"How Allshield Academy Works","blocks":[{"type":"p","text":"Allshield Academy is built as a series of short modules. Each one opens with a brief introduction and a set of learning objectives, then teaches the material in sections, and closes with a recap, review notes and a practice exam. The pattern never changes, so once you have finished one module you know how to work through all of them."},{"type":"p","text":"The <b>learning objectives<\/b> are the most useful part of each module. They tell you exactly what you should be able to do when you finish. Read them first, and read them again at the end. If you cannot explain an objective out loud in your own words, go back to that section before you take the exam."},{"type":"h","text":"Getting the most from each module"},{"type":"list","items":["Read the keywords before the sections so the vocabulary is familiar when it appears.","Work through one section at a time and stop at each tip; tips point to ideas that are easy to mix up.","Study the diagrams and tables, because they show order and comparisons faster than paragraphs do.","Use the review notes as a checklist, one objective at a time.","Take the module exam only after you can explain every objective without looking."]},{"type":"p","text":"The Academy covers two different kinds of knowledge. The first is what you need to pass the state licensing exam, which is tested by an outside company and follows a published outline. The second is what you need to do the job well and legally once you are licensed: how the Marketplace works, how to hold an honest sales conversation, and how to stay compliant. Both matter, and they support each other."},{"type":"p","text":"Details that belong to AllShield as a company, such as which exam prep course the agency uses, who your point of contact is, and whether any costs are reimbursed, are not set by law. Where those details come up in this module you will see them marked for the agency to fill in: [AllShield to confirm]."},{"type":"flow","nodes":["Objectives","Sections","Review notes","Module exam"],"caption":"Every Academy module follows the same four-part rhythm."},{"type":"tip","text":"If you can teach an objective to someone else in plain words, you are ready to be tested on it."}]},{"title":"The Licensing Path at a Glance","blocks":[{"type":"p","text":"In Texas, nobody may sell, solicit or negotiate insurance without a license from the <b>Texas Department of Insurance<\/b>, usually shortened to TDI. For health and life products, the license you are working toward is the general lines license covering life, accident, health and HMO."},{"type":"p","text":"Getting that license is only part of the path. A license gives you legal permission to act as an agent, but it does not by itself let you sell any particular company's plans, and it does not let you enroll people through HealthCare.gov. Those permissions come from later steps."},{"type":"flow","nodes":["Exam prep","State exam","Fingerprints + application","E&O + appointments","Marketplace registration"],"caption":"The path from new student to an agent who can enroll Marketplace consumers. Medicare certification is added later."},{"type":"table","head":["Step","What it is","Why it exists"],"rows":[["Exam prep","Studying the life and health exam outline","The exam is broad and most people need structured study to pass"],["State exam","A proctored test delivered by Pearson VUE","Proves a minimum level of knowledge before the public relies on you"],["Fingerprints and application","A background check plus the license application filed online","Lets TDI confirm identity and review fitness to hold a license"],["Errors and omissions coverage","Professional liability insurance for the agent","Protects you and your clients if an honest mistake causes a loss"],["Carrier appointments","Each insurer authorizes you to sell its plans","A company is responsible for the agents who represent it"],["Marketplace registration","Yearly CMS training and agreements","Required before assisting anyone with HealthCare.gov coverage"],["AHIP certification","Annual Medicare training and test","Required by carriers before selling Medicare Advantage or Part D"]]},{"type":"p","text":"The order matters. You cannot apply for the license until you have passed the exam. Carriers will not appoint you until the license is issued. And you should not present a carrier's plan to a consumer until that carrier has appointed you. Trying to skip ahead does not save time; it creates violations."},{"type":"p","text":"Texas does not require a set number of classroom hours before you take the exam, but that does not mean the exam is easy. Treat exam prep as a real step, with a schedule, and follow the study plan the agency gives you: [AllShield to confirm]."},{"type":"tip","text":"License first, appointment second, selling third: an agent needs both a state license and a carrier appointment before selling that carrier's products."}]},{"title":"Exam, Fingerprints and the License Application","blocks":[{"type":"p","text":"The Texas licensing exam is delivered by <b>Pearson VUE<\/b>, a testing company the state contracts with. You create an account, choose the life and health exam, pay the exam fee and book an appointment. The exam is multiple choice and timed. It covers general insurance concepts, life insurance, health insurance, and Texas laws and rules."},{"type":"h","text":"Exam day"},{"type":"list","items":["Bring the identification Pearson VUE lists in your confirmation; the name must match your registration exactly.","Arrive early. Late arrivals can lose both the appointment and the fee.","Personal items, phones and notes are not allowed in the testing room.","You receive a score report when you finish, so you know right away whether you passed.","If you do not pass, you can rebook and pay again. Use the score report to see which areas to study."]},{"type":"p","text":"Next comes <b>fingerprinting<\/b>. Texas requires a fingerprint-based background check for new agent applicants. Prints are taken electronically by the state's approved vendor at a scheduled appointment, and the results go to TDI. You do not carry the results anywhere yourself."},{"type":"p","text":"The license application itself is filed online through <b>Sircon<\/b> or <b>NIPR<\/b>. Both are simply doorways into the same state licensing process. The application asks for your personal details and a series of background questions. Answer every question truthfully and completely. A past issue that is disclosed can often be reviewed and worked through; an issue that is hidden and later discovered can cost you the license."},{"type":"p","text":"Once TDI approves the application, your license is issued and you are assigned a <b>National Producer Number<\/b>, or NPN. That number will appear on your carrier contracts, your Marketplace registration and the applications you submit for clients. Memorize it."},{"type":"example","text":"Jordan passes the exam on a Tuesday and is tempted to start quoting plans to friends that weekend. Jordan has not yet been fingerprinted, has not applied, and holds no license. Passing the exam is a requirement for the license, not the license itself, so Jordan must wait."},{"type":"tip","text":"Passing the exam does not make you an agent; you are licensed only when the state issues the license."}]},{"title":"E&O Coverage and Carrier Appointments","blocks":[{"type":"p","text":"<b>Errors and omissions coverage<\/b>, called E&O, is liability insurance for professionals. If a client claims that your advice or a mistake in your paperwork caused them a financial loss, E&O helps pay for your legal defense and any covered damages. It is built for honest errors. It does not cover intentional wrongdoing or fraud."},{"type":"p","text":"Many carriers and upline organizations will not contract with an agent who cannot show proof of E&O, and those that sell Medicare products almost always ask for it. Even where it is not demanded, carrying it is sound practice: one misunderstanding about an effective date can become an expensive dispute. How AllShield agents obtain E&O and who pays for it: [AllShield to confirm]."},{"type":"h","text":"What an appointment is"},{"type":"p","text":"An <b>appointment<\/b> is a carrier telling the state, in effect, that this agent represents the company. The process is usually called contracting. You submit a contracting packet, the carrier runs its own background review, and when it approves you it files the appointment and gives you a writing number or agent ID."},{"type":"list","items":["A typical packet asks for your license, NPN, proof of E&O, tax and payment forms, and background answers.","Each carrier appoints separately, so being appointed with one company gives you no authority with another.","Many carriers also require their own product training before you are marked ready to sell.","Approval takes time, so submit packets as soon as your license is issued."]},{"type":"p","text":"The rule to remember is simple: do not present, quote or enroll a carrier's plan until that carrier has confirmed you are appointed and ready to sell. Selling early can mean no commission, a terminated contract and a regulatory complaint. Which carriers AllShield contracts with, and the order in which new agents are contracted: [AllShield to confirm]."},{"type":"flow","nodes":["License issued","Proof of E&O","Contracting packet","Carrier approval","Ready to sell"],"caption":"Contracting with a carrier happens after the license and before the first sale."},{"type":"tip","text":"E&O covers unintentional professional mistakes, not deliberate misconduct."}]},{"title":"Marketplace Registration, Medicare Certification and Staying Licensed","blocks":[{"type":"p","text":"Texas uses the federal health insurance exchange, HealthCare.gov. The government calls it the Federally-facilitated Marketplace, or FFM. To help consumers apply and enroll there, a licensed agent must complete <b>FFM registration<\/b> with the Centers for Medicare & Medicaid Services, known as CMS."},{"type":"list","items":["Create a CMS portal account and complete identity verification.","Finish the required Marketplace training for the plan year.","Sign the agreements with CMS, including the privacy and security agreement.","Confirm that your NPN appears on the public list of registered agents and brokers."]},{"type":"p","text":"Registration is tied to a plan year, so it must be renewed every year. An agent who lets it lapse cannot assist with Marketplace enrollments and may not be paid on them. Module 2 covers the Marketplace itself; Module 4 covers the conduct rules that come with this registration."},{"type":"h","text":"Medicare comes later"},{"type":"p","text":"AllShield begins with health coverage through the Marketplace and adds life insurance and Medicare later. Before selling Medicare Advantage or Part D plans, agents complete <b>AHIP certification<\/b>, an annual course and test on Medicare rules, plus each carrier's own yearly product certification. Module 6 explains why."},{"type":"h","text":"Keeping the license"},{"type":"p","text":"A license is not permanent. Texas licenses expire on a schedule and are renewed by completing <b>continuing education<\/b>, including ethics coursework, and paying a renewal fee. Check the current hour requirement on the TDI website rather than relying on memory, because requirements change. You must also keep TDI informed of changes to your address and report certain legal or administrative actions against you."},{"type":"example","text":"Priya is licensed and appointed with a Marketplace carrier, but she has not finished this year's FFM registration. A neighbor asks for help enrolling on HealthCare.gov. Priya must complete registration first; her license and appointment alone are not enough."},{"type":"tip","text":"Marketplace registration and Medicare certification are both annual; neither carries over automatically from the year before."}]}],"summary":{"recap":["Allshield Academy teaches in a fixed rhythm: objectives, sections, review notes and an exam. Use the objectives as your personal checklist.","The Texas licensing path starts with exam prep and the Pearson VUE exam. Passing the exam is required, but it is not the license.","After the exam you are fingerprinted and you file the license application online through Sircon or NIPR. When TDI issues the license you receive a National Producer Number.","E&O coverage protects you against claims arising from honest mistakes. Carrier appointments give you authority to sell each company's plans, one carrier at a time.","Marketplace enrollment requires annual FFM registration with CMS. Medicare sales require annual AHIP and carrier certification. The license itself is kept active through continuing education and timely renewal."],"avaSummary":"Let us pull this module together. You now know how the Academy works: read the objectives, study the sections, use the review notes, and then take the exam. Keep that rhythm in every module and you will always know where you stand. You also know the licensing path, and more importantly, the order. First you prepare for the Texas life and health exam, and then you sit for it at a Pearson VUE test center. Passing is a big moment, but remember, it is not your license. Next you complete fingerprinting for the background check and file your application online through Sircon or the National Insurance Producer Registry. Answer every question honestly. When the Texas Department of Insurance approves you, the license is issued and you receive your National Producer Number. From there you obtain errors and omissions coverage, which protects you if an honest mistake leads to a claim, and you contract with carriers. Each carrier appoints you separately, and you never present a company's plan until that company says you are ready to sell. Then comes your Marketplace registration with CMS, which you renew every single year, so that you can help Texans enroll through HealthCare.gov. Medicare is a later chapter in your career, and it brings its own yearly certification. Finally, keep your license healthy with continuing education and on-time renewal. A few details in this module are marked for AllShield to confirm, so ask your trainer about those. You have the map now. In the next module we start learning the Marketplace itself.","reviewNotes":[{"objective":"Describe how Allshield Academy modules, review notes and exams fit together","concepts":["Every module follows the same order: introduction and objectives, sections, summary and review notes, exam.","Objectives state what you should be able to do at the end.","Tips flag ideas that are commonly confused.","Company-specific details are marked for the agency to supply rather than guessed."],"terms":[{"term":"Learning objective","def":"A statement of what the student should be able to do after the module."}]},{"objective":"List the steps of the Texas licensing path in the correct order","concepts":["Exam prep, state exam, fingerprints and application, E&O, carrier appointments, Marketplace registration.","AHIP certification is added before Medicare sales.","Each step unlocks the next; skipping ahead creates violations.","Texas sets no required classroom hours before the exam."],"terms":[{"term":"General lines license","def":"The Texas agent license type covering life, accident, health and HMO products."},{"term":"Texas Department of Insurance","def":"The state agency that licenses and regulates agents and insurers."}]},{"objective":"Explain what happens at the state exam, fingerprinting and license application steps","concepts":["Pearson VUE delivers a timed, multiple-choice exam and gives a score report at the end.","Fingerprints are taken by the state's approved vendor and results go to TDI.","The application is filed online through Sircon or NIPR.","Background questions must be answered truthfully and completely.","The NPN is assigned when the license is issued."],"terms":[{"term":"Pearson VUE","def":"The company that delivers the Texas licensing exam."},{"term":"NPN","def":"The unique national ID number for a licensed producer."}]},{"objective":"Explain why errors and omissions coverage and carrier appointments come before selling","concepts":["E&O pays defense costs and covered damages for unintentional professional errors.","E&O does not cover fraud or intentional acts.","Each carrier appoints separately after reviewing a contracting packet.","No presenting, quoting or enrolling a carrier's plan before that carrier confirms ready-to-sell status."],"terms":[{"term":"Errors and omissions coverage","def":"Professional liability insurance for agents."},{"term":"Appointment","def":"A carrier's authorization for an agent to sell its products."}]},{"objective":"Identify the extra registration and certification needed for Marketplace and Medicare sales","concepts":["FFM registration includes a CMS account, identity verification, training and signed agreements.","FFM registration is renewed every plan year.","AHIP plus carrier certification is completed yearly before selling Medicare Advantage or Part D.","The license itself is maintained with continuing education and renewal."],"terms":[{"term":"FFM registration","def":"The yearly CMS process that allows an agent to assist HealthCare.gov consumers."},{"term":"AHIP certification","def":"Annual Medicare training and test required by carriers."}]}]},"exam":[{"q":"Which agency issues insurance agent licenses in Texas?","choices":["The Centers for Medicare & Medicaid Services","The Texas Department of Insurance","Pearson VUE","The National Insurance Producer Registry"],"answer":1,"why":"TDI licenses and regulates agents in Texas. Pearson VUE only delivers the exam and NIPR is an application doorway."},{"q":"An applicant has just passed the state exam. What is true at that moment?","choices":["The applicant has met one requirement but is not yet licensed","The applicant may sell for any carrier","The applicant is licensed and may begin selling","The applicant is registered with the Marketplace"],"answer":0,"why":"Passing the exam is a requirement for the license. The license exists only once the state issues it."},{"q":"What is the purpose of the fingerprinting step?","choices":["To register the agent with HealthCare.gov","To prove the agent completed exam prep","To appoint the agent with a carrier","To support a background check reviewed by the state"],"answer":3,"why":"Fingerprints are used for a background check whose results go to TDI as part of the license review."},{"q":"Sircon and NIPR are best described as:","choices":["Insurance carriers","Exam prep courses","Online systems used to submit license applications","Federal health programs"],"answer":2,"why":"Both are online services through which an applicant files and tracks a license application."},{"q":"Errors and omissions coverage is designed to respond to which situation?","choices":["An agent knowingly falsifies an application","A client claims an agent's honest mistake caused a financial loss","An agent fails the licensing exam","A carrier ends an agent's contract"],"answer":1,"why":"E&O is professional liability insurance for unintentional errors. It does not cover fraud or intentional acts."},{"q":"What does a carrier appointment give an agent?","choices":["Authority to sell that carrier's products","A state license","Authority to sell every carrier's products","Marketplace registration"],"answer":0,"why":"An appointment is one carrier's authorization. Each carrier appoints separately."},{"q":"Which sequence is in the correct order?","choices":["Carrier appointment, state exam, license application","License application, state exam, exam prep","Marketplace registration, fingerprints, state exam","State exam, license application, carrier appointment"],"answer":3,"why":"The exam comes before the application, and carriers appoint only after the license is issued."},{"q":"A licensed agent is appointed with Carrier A only. A consumer asks about Carrier B's plan. What should the agent do?","choices":["Enroll the consumer and request the appointment afterward","Quote the plan but not enroll","Not present Carrier B's plan until appointed and ready to sell with Carrier B","Present the plan because any license covers any carrier"],"answer":2,"why":"An appointment with one carrier gives no authority with another, so the agent must be appointed with Carrier B first."},{"q":"How often must an agent complete FFM registration to assist HealthCare.gov consumers?","choices":["Once, when first licensed","Every plan year","Only when changing carriers","Every ten years"],"answer":1,"why":"Marketplace registration is tied to a plan year and must be renewed annually."},{"q":"What is an NPN?","choices":["A unique national identification number for a licensed producer","A type of health plan network","The name of the Texas licensing exam","A carrier's commission schedule"],"answer":0,"why":"The National Producer Number identifies the agent to states, carriers and the Marketplace."},{"q":"Before selling Medicare Advantage or Part D plans, an agent generally must complete:","choices":["A second state licensing exam for Medicare","Only FFM registration","A new set of fingerprints for each carrier","AHIP certification plus each carrier's own certification"],"answer":3,"why":"Carriers require annual AHIP training and their own product certification before Medicare sales."},{"q":"How does an agent keep a Texas license active over time?","choices":["By retaking the state exam at each renewal","By staying appointed with at least one carrier","By completing continuing education and renewing on time","Nothing is required; the license never expires"],"answer":2,"why":"Licenses expire and are renewed by completing continuing education, including ethics, and paying the renewal fee."}]},{"id":"as02","num":2,"title":"ACA Marketplace Fundamentals","intro":{"hook":["Picture a self-employed barber in Houston with no coverage through work. She has heard she might qualify for help paying for a health plan, but the website confuses her and she is afraid of choosing wrong. She is exactly the person you will sit across from.","This module explains the system she is trying to use: the Affordable Care Act Marketplace. You will learn how HealthCare.gov works in Texas, what the metal tiers mean, what every plan must cover, how financial help works in concept, when people can enroll, and where the agent fits in.","You cannot guide someone through a system you do not understand. Get these basics solid and the sales conversation in Module 3 becomes far easier."],"objectives":["Describe how the Marketplace operates in Texas through HealthCare.gov","Compare the metal tiers and identify the essential health benefits","Explain premium tax credits and cost-sharing reductions in concept","Distinguish open enrollment from special enrollment periods","Define household and income as the Marketplace uses them","Summarize the agent's role and the annual registration requirement"],"avaIntro":"Welcome back. I am Ava, and in this module we are going to learn the Marketplace from the ground up. Texas uses HealthCare.gov, the federal exchange, so that is the system you will work in every day. I will show you how plans are grouped into metal tiers, and what every one of those plans has to cover. Then we will look at the two kinds of financial help, premium tax credits and cost-sharing reductions, and I will keep it conceptual so you understand how they work without memorizing numbers that change each year. We will cover when people are allowed to enroll, how the Marketplace counts a household and its income, and finally what your job is as the agent. This is the foundation for everything else, so go slowly, and make sure each idea makes sense before you move on."},"keywords":[{"term":"Advance premium tax credit","def":"A premium tax credit paid ahead of time directly to the insurer to lower the monthly premium."},{"term":"Benchmark plan","def":"The second-lowest-cost Silver plan in an area, used to calculate the premium tax credit."},{"term":"Cost-sharing reduction","def":"Extra savings that lower deductibles, copays and out-of-pocket limits on Silver plans for eligible lower-income enrollees."},{"term":"Essential health benefits","def":"The ten categories of care that individual Marketplace plans must cover."},{"term":"Federal poverty level","def":"An income measure published each year and used to determine eligibility for financial help."},{"term":"Federally-facilitated Marketplace","def":"The exchange run by the federal government through HealthCare.gov, used in Texas."},{"term":"Metal tier","def":"A plan category (Bronze, Silver, Gold or Platinum) showing how costs are split between plan and member on average."},{"term":"Modified adjusted gross income","def":"The income figure the Marketplace uses, based on tax rules, to decide eligibility for savings."},{"term":"Open enrollment period","def":"The yearly window when anyone eligible can enroll in or change Marketplace coverage."},{"term":"Qualified health plan","def":"A plan certified to be sold through the Marketplace."},{"term":"Qualifying life event","def":"A change such as losing coverage, marrying or having a baby that opens a special enrollment period."},{"term":"Special enrollment period","def":"A window outside open enrollment when a person with a qualifying life event can enroll or change plans."},{"term":"Tax household","def":"The tax filer, spouse and tax dependents, used to measure household size for Marketplace savings."}],"sections":[{"title":"The Marketplace and HealthCare.gov in Texas","blocks":[{"type":"p","text":"The Affordable Care Act, or ACA, created health insurance exchanges where people who do not have coverage through a job or a government program can shop for private plans. Some states run their own exchange. Texas does not; it uses the <b>Federally-facilitated Marketplace<\/b>, which consumers reach through HealthCare.gov."},{"type":"p","text":"The Marketplace is not an insurance company. It is a shopping and eligibility platform. Private insurers offer plans on it, and each plan sold there has been certified as a <b>qualified health plan<\/b>. The Marketplace's job is to check who is eligible, work out any financial help, display the available plans and send the enrollment to the chosen insurer."},{"type":"h","text":"Protections that apply to these plans"},{"type":"list","items":["An insurer cannot turn someone down or charge more because of a pre-existing health condition.","Premiums may vary only by a short list of factors: age, location, tobacco use, and whether the plan covers one person or a family.","There are no annual or lifetime dollar caps on essential health benefits.","Recommended preventive services are covered in-network without cost sharing.","Children can generally stay on a parent's plan until age 26."]},{"type":"p","text":"To use the Marketplace a person must live in the service area, be a U.S. citizen or national or be lawfully present, and not be incarcerated. People enrolled in Medicare are not Marketplace customers; they belong on the Medicare path covered in Module 6."},{"type":"p","text":"Texas matters in one particular way. The state has not expanded Medicaid to cover most low-income adults. As a result, some adults have income too low to qualify for premium tax credits yet do not qualify for Texas Medicaid either. This is often called the coverage gap. You should be able to explain it kindly and accurately, because you will meet people in it."},{"type":"flow","nodes":["Application","Eligibility result","Plan comparison","Enrollment","First premium paid"],"caption":"How a consumer moves through the Marketplace. Coverage does not start until the first premium is paid."},{"type":"tip","text":"The Marketplace determines eligibility and shows plans, but the insurance itself comes from private carriers."}]},{"title":"Metal Tiers and Essential Health Benefits","blocks":[{"type":"p","text":"Marketplace plans are sorted into <b>metal tiers<\/b>. A tier tells you how costs are shared between the plan and its members on average across a typical population. It says nothing about the quality of care or the size of the doctor network."},{"type":"table","head":["Tier","Plan pays on average","General pattern"],"rows":[["Bronze","About 60%","Lowest premiums, highest costs when care is used"],["Silver","About 70%","Moderate premiums and costs; the only tier where cost-sharing reductions apply"],["Gold","About 80%","Higher premiums, lower costs when care is used"],["Platinum","About 90%","Highest premiums, lowest costs when care is used; not offered everywhere"]]},{"type":"p","text":"There is also a catastrophic category, available to people under 30 and to some people with a hardship or affordability exemption. Catastrophic plans have low premiums and a very high deductible, and premium tax credits cannot be used with them."},{"type":"p","text":"Whatever the tier, every plan must cover the same ten categories of <b>essential health benefits<\/b>. Tiers change how much the member pays, not which categories are covered."},{"type":"list","items":["Outpatient care","Emergency services","Hospitalization","Pregnancy, maternity and newborn care","Mental health and substance use disorder services","Prescription drugs","Rehabilitative and habilitative services and devices","Laboratory services","Preventive and wellness services and chronic disease management","Pediatric services, including dental and vision care for children"]},{"type":"p","text":"Plans still differ in important ways: the network of doctors and hospitals, the list of covered drugs, and the plan type, such as an HMO that usually requires staying in network. Two Silver plans can be very different in practice."},{"type":"example","text":"A healthy 28-year-old who rarely sees a doctor may lean toward Bronze for the lower premium. A person managing a long-term condition with regular specialist visits may spend less overall on Gold, even with the higher premium."},{"type":"tip","text":"Metal tiers describe cost sharing, not quality; all tiers cover the same ten essential health benefit categories."}]},{"title":"Financial Help: Premium Tax Credits and Cost-Sharing Reductions","blocks":[{"type":"p","text":"Two kinds of savings are available through the Marketplace. They solve different problems, and customers constantly confuse them, so learn to explain each in one sentence."},{"type":"h","text":"Premium tax credit"},{"type":"p","text":"The <b>premium tax credit<\/b> lowers the monthly premium. Its size depends on household income compared with the federal poverty level and on the price of the <b>benchmark plan<\/b>, which is the second-lowest-cost Silver plan where the person lives. In simple terms, the law expects a household to contribute a certain share of its income toward the benchmark plan, and the credit covers the rest. The credit can then be applied to a plan in any metal tier."},{"type":"p","text":"Most people take it as an <b>advance premium tax credit<\/b>, paid straight to the insurer each month. Because the advance amount is based on an income estimate, it must be reconciled on the federal tax return. The Marketplace sends Form 1095-A after the year ends, and the household uses it to complete the reconciliation. If actual income was higher than estimated, some or all of the advance credit may have to be repaid. If it was lower, the household may receive more."},{"type":"h","text":"Cost-sharing reductions"},{"type":"p","text":"A <b>cost-sharing reduction<\/b> lowers what the member pays when care is used: the deductible, copays, coinsurance and the out-of-pocket maximum. These reductions are for households at the lower end of the eligible income range, and they apply only when the person enrolls in a Silver plan. There is nothing to reconcile at tax time."},{"type":"table","head":["","Premium tax credit","Cost-sharing reduction"],"rows":[["What it lowers","Monthly premium","Deductible, copays, coinsurance, out-of-pocket limit"],["Which tiers","Bronze, Silver, Gold, Platinum","Silver only"],["Reconciled on tax return","Yes","No"]]},{"type":"p","text":"Eligibility has conditions. The person generally cannot have an offer of affordable employer coverage that meets minimum standards, cannot be eligible for programs like Medicare or Medicaid, and must file a federal tax return; married couples generally must file jointly. Income thresholds and the percentages used in the formula are set by federal law and have changed more than once, so always rely on the current year's Marketplace result rather than on memory."},{"type":"tip","text":"Premium tax credits reduce the premium on any metal tier; cost-sharing reductions reduce out-of-pocket costs and require a Silver plan."}]},{"title":"When People Can Enroll, and How Household and Income Are Counted","blocks":[{"type":"p","text":"The <b>open enrollment period<\/b> is the yearly window in which anyone eligible can sign up for a Marketplace plan or switch plans. On HealthCare.gov it has opened on November 1. The closing date and the deadline for coverage that starts January 1 have been changed by federal rule more than once, so confirm the current dates each season before you tell a customer anything."},{"type":"p","text":"Outside that window, a person needs a <b>special enrollment period<\/b>, which is triggered by a <b>qualifying life event<\/b>. The usual window is 60 days from the event, and the Marketplace may ask for documents that prove it happened."},{"type":"list","items":["Losing other qualifying coverage, such as job-based insurance or Medicaid","Getting married","Having a baby, adopting a child or placing a child for foster care","Moving to a new area where different plans are available","Gaining citizenship or lawful presence, or being released from incarceration"]},{"type":"p","text":"Voluntarily dropping coverage or losing it for not paying premiums does not create a special enrollment period."},{"type":"h","text":"Household and income"},{"type":"p","text":"For savings purposes the Marketplace looks at the <b>tax household<\/b>: the person who files taxes, their spouse, and anyone they claim as a tax dependent. This can differ from who lives in the home. A roommate is not in the household. A college student claimed as a dependent is, even when living elsewhere. Household members are counted even if they do not need coverage."},{"type":"p","text":"Income means <b>modified adjusted gross income<\/b> for the whole tax household, and it is the amount expected for the year of coverage, not last year's figure. It includes wages, net self-employment income, unemployment compensation and Social Security benefits, among other things. It does not include child support received or Supplemental Security Income."},{"type":"p","text":"The estimate must be honest and reasonable. When income or household size changes during the year, the consumer should report it to the Marketplace promptly so the advance credit can be adjusted before it becomes a tax-time surprise."},{"type":"example","text":"Marcus leaves a job with health benefits in June. Losing that coverage is a qualifying life event, so he can enroll in a Marketplace plan without waiting for open enrollment, as long as he acts within the special enrollment window."},{"type":"tip","text":"Marketplace income is a projection of the coverage year's household income, and changes should be reported when they happen."}]},{"title":"The Agent and Broker Role","blocks":[{"type":"p","text":"Consumers may enroll on their own, call the Marketplace, work with a navigator, or use a licensed agent or broker. Using an agent does not raise the premium. Agents are paid by the insurance carriers, not by the consumer and not by the Marketplace, and the price of a plan is the same whether or not an agent is involved. How AllShield agents are compensated: [AllShield to confirm]."},{"type":"h","text":"What the agent actually does"},{"type":"list","items":["Explains how the Marketplace, the metal tiers and financial help work","Helps the consumer complete the eligibility application with the consumer's own accurate information","Compares plans against the consumer's doctors, prescriptions and budget","Submits the enrollment for the plan the consumer chooses","Stays available afterward for billing questions, changes in circumstances and renewal"]},{"type":"p","text":"Agents enroll consumers either on HealthCare.gov directly or through an enrollment website approved by CMS to connect with the Marketplace. Which platform AllShield agents use: [AllShield to confirm]. On any platform, the agent enters their <b>National Producer Number<\/b> on the application so the enrollment is correctly linked to them."},{"type":"p","text":"Before doing any of this, an agent must hold a valid Texas license, be appointed with the carrier whose plan is chosen, and have completed <b>FFM registration<\/b> for the current plan year. Registration includes CMS training and signed agreements in which the agent promises to follow Marketplace privacy, security and conduct standards. It expires with the plan year and is renewed annually."},{"type":"p","text":"Those agreements carry real duties. The agent must give accurate information, must have the consumer's consent before looking up or working on their application, and must never enter an income figure or make a plan change the consumer did not approve. Module 4 goes through these duties in detail. For now, hold on to one idea: the application belongs to the consumer, and the agent is a helper acting only with permission."},{"type":"flow","nodes":["Texas license","Carrier appointment","Annual FFM registration","Consumer consent","Assist and enroll"],"caption":"What must be in place before an agent helps with a Marketplace enrollment."},{"type":"tip","text":"An agent's help costs the consumer nothing extra, and FFM registration must be renewed every plan year."}]}],"summary":{"recap":["Texas uses the Federally-facilitated Marketplace at HealthCare.gov. It checks eligibility and displays qualified health plans from private insurers.","Plans are grouped into Bronze, Silver, Gold and Platinum by how costs are shared on average. All tiers cover the same ten essential health benefit categories.","Premium tax credits lower the monthly premium on any tier and are reconciled on the tax return. Cost-sharing reductions lower out-of-pocket costs and require a Silver plan.","People enroll during open enrollment, or during a special enrollment period after a qualifying life event such as losing coverage, marriage, a birth or a move.","Savings are based on the tax household and its projected modified adjusted gross income for the coverage year. Changes should be reported promptly.","Agents are paid by carriers, must be licensed, appointed and registered with the Marketplace each year, and act only with the consumer's permission."],"avaSummary":"Nice work. Let us review what you now know about the Marketplace. Texas uses the federal exchange, HealthCare.gov. It is not an insurer. It checks eligibility, calculates savings and shows plans offered by private carriers. Those plans cannot turn anyone away for a health condition, and they all cover the same ten categories of essential health benefits. The metal tiers, Bronze, Silver, Gold and Platinum, tell you how costs are split between the plan and the member on average. They do not measure quality. Then we looked at financial help. The premium tax credit lowers the monthly premium, works on any metal tier, and is settled on the tax return using Form 1095-A. Cost-sharing reductions lower deductibles and copays, and they are available only on Silver plans for households at the lower end of the income range. Remember that Texas has a coverage gap, and be ready to explain it with care. People enroll during open enrollment, or within a special enrollment period after a qualifying life event. Always confirm the current dates before quoting them. The Marketplace counts the tax household, and it uses projected income for the coverage year, so accurate estimates and prompt updates protect your customer from a repayment surprise. Finally, your role. You explain, you compare, and you enroll, at no added cost to the consumer. You need your license, your carrier appointment and your yearly Marketplace registration, and you act only with the consumer's permission. Next, we turn this knowledge into a real conversation.","reviewNotes":[{"objective":"Describe how the Marketplace operates in Texas through HealthCare.gov","concepts":["Texas uses the federal exchange rather than a state-run one.","The Marketplace determines eligibility and shows plans; private carriers provide the insurance.","No denial or surcharge for pre-existing conditions.","Texas has not expanded Medicaid, which creates a coverage gap for some low-income adults."],"terms":[{"term":"Federally-facilitated Marketplace","def":"The federal exchange reached through HealthCare.gov."},{"term":"Qualified health plan","def":"A plan certified for sale through the Marketplace."}]},{"objective":"Compare the metal tiers and identify the essential health benefits","concepts":["Bronze, Silver, Gold and Platinum pay roughly 60, 70, 80 and 90 percent of average costs.","Lower tiers have lower premiums and higher costs at the point of care.","Every tier covers the same ten benefit categories.","Networks, drug lists and plan types still differ between plans in the same tier."],"terms":[{"term":"Metal tier","def":"A category showing the average split of costs between plan and member."},{"term":"Essential health benefits","def":"The ten categories of care every individual Marketplace plan must cover."}]},{"objective":"Explain premium tax credits and cost-sharing reductions in concept","concepts":["The premium tax credit is tied to household income and the benchmark Silver plan.","Advance payments are reconciled on the federal tax return using Form 1095-A.","Cost-sharing reductions apply only on Silver plans and are not reconciled.","An affordable employer offer or eligibility for Medicare or Medicaid generally blocks the credit."],"terms":[{"term":"Benchmark plan","def":"The second-lowest-cost Silver plan in the area."},{"term":"Cost-sharing reduction","def":"Savings that lower out-of-pocket costs on Silver plans."}]},{"objective":"Distinguish open enrollment from special enrollment periods","concepts":["Open enrollment is the yearly window open to everyone eligible.","A special enrollment period requires a qualifying life event.","The usual special enrollment window is 60 days from the event.","Dropping coverage voluntarily or for non-payment does not qualify."],"terms":[{"term":"Qualifying life event","def":"A change such as loss of coverage, marriage, birth or a move."}]},{"objective":"Define household and income as the Marketplace uses them","concepts":["The household is the tax filer, spouse and tax dependents.","Income is modified adjusted gross income projected for the coverage year.","Child support received and Supplemental Security Income are not counted.","Changes in income or household size should be reported promptly."],"terms":[{"term":"Tax household","def":"The filer, spouse and dependents claimed on the tax return."},{"term":"Modified adjusted gross income","def":"The tax-based income figure used for Marketplace savings."}]},{"objective":"Summarize the agent's role and the annual registration requirement","concepts":["Agents explain options, help with the application, compare plans and enroll.","Agents are paid by carriers; premiums are the same with or without an agent.","License, carrier appointment and current-year FFM registration are all required.","The agent acts only with the consumer's consent and with the consumer's accurate information."],"terms":[{"term":"FFM registration","def":"Yearly CMS training and agreements required to assist Marketplace consumers."}]}]},"exam":[{"q":"Which statement best describes the Marketplace in Texas?","choices":["It is a state-run insurance company","It is a federal platform where private insurers offer certified plans","It is a Medicaid program for low-income adults","It is a carrier that pays agents directly"],"answer":1,"why":"Texas uses the federal exchange at HealthCare.gov, which determines eligibility and displays plans from private carriers."},{"q":"What does a plan's metal tier tell a consumer?","choices":["The quality rating of the plan's doctors","The size of the provider network","How costs are shared between plan and member on average","Which essential health benefits are excluded"],"answer":2,"why":"Tiers describe average cost sharing. All tiers cover the same essential health benefit categories."},{"q":"Which tier typically has the lowest premium and the highest costs when care is used?","choices":["Bronze","Silver","Gold","Platinum"],"answer":0,"why":"Bronze plans pay about 60 percent of average costs, so premiums are lowest and member cost sharing is highest."},{"q":"Cost-sharing reductions are available on which metal tier?","choices":["Bronze only","Any tier","Gold and Platinum","Silver only"],"answer":3,"why":"Eligible consumers must enroll in a Silver plan to receive cost-sharing reductions."},{"q":"The premium tax credit is calculated using household income and the cost of:","choices":["The lowest-cost Bronze plan","The second-lowest-cost Silver plan in the area","The plan the consumer selects","The most expensive Gold plan"],"answer":1,"why":"The benchmark plan, the second-lowest-cost Silver plan, anchors the credit calculation."},{"q":"A consumer who received advance premium tax credits must do what after the year ends?","choices":["Nothing; the credit is final when paid","Repay the full credit to the insurer","Reconcile the credit on the federal tax return","Reapply for a license"],"answer":2,"why":"Advance payments are based on an estimate and are reconciled on the tax return using Form 1095-A."},{"q":"Which of these is a qualifying life event for a special enrollment period?","choices":["Losing job-based health coverage","Deciding the current plan costs too much","Losing coverage for not paying premiums","Wanting a different doctor"],"answer":0,"why":"Loss of other qualifying coverage opens a special enrollment period. Voluntary changes and non-payment do not."},{"q":"For Marketplace savings, who is counted in the household?","choices":["Everyone living at the same address","Only the people who need coverage","Only adults with income","The tax filer, spouse and tax dependents"],"answer":3,"why":"The Marketplace uses the tax household, which can differ from who lives in the home."},{"q":"Which income figure should be entered on a Marketplace application?","choices":["Last year's income exactly as filed","The household's expected income for the coverage year","The lowest amount that produces the largest credit","Only the income of the person enrolling"],"answer":1,"why":"The application asks for projected household modified adjusted gross income for the year of coverage."},{"q":"Which is one of the ten essential health benefit categories?","choices":["Adult cosmetic surgery","Long-term care in a nursing home","Prescription drugs","Adult dental cleanings"],"answer":2,"why":"Prescription drugs are an essential health benefit. The other choices are not among the ten categories."},{"q":"How does using an agent affect the premium a consumer pays for a Marketplace plan?","choices":["It does not change the premium","It adds a broker fee to each premium","It removes eligibility for tax credits","It lowers the premium"],"answer":0,"why":"Agents are paid by carriers, and the plan price is the same with or without an agent."},{"q":"Why is there a coverage gap for some low-income adults in Texas?","choices":["Texas plans exclude pre-existing conditions","HealthCare.gov does not operate in Texas","Bronze plans are not sold in Texas","Their income is too low for premium tax credits and Texas has not expanded Medicaid to cover them"],"answer":3,"why":"Without Medicaid expansion, some adults fall below the income range for tax credits yet do not qualify for Texas Medicaid."}]},{"id":"as03","num":3,"title":"The Needs-Based Health Insurance Conversation","intro":{"hook":["Most people do not want to talk about health insurance. They want to know two things: can I keep my doctor, and what will this cost me. An agent who answers those two questions clearly earns trust faster than any polished pitch.","This module teaches a needs-based conversation. You will learn what to ask, how to compare plans honestly, how to explain cost-sharing terms in everyday words, how to respond to common concerns, how to walk through an enrollment, and how to keep the customer after the sale.","The approach is simple: learn the person's situation first and recommend second. It is also the approach that produces customers who stay, pay their premiums and send their family to you."],"objectives":["Ask discovery questions that uncover a consumer's health coverage needs","Check doctors, prescriptions and budget before recommending a plan","Explain deductible, copay, coinsurance and out-of-pocket maximum in plain words","Compare plans honestly using total expected cost rather than premium alone","Respond to common concerns without pressure or misleading statements","Complete an enrollment walk-through and a follow-up plan that supports retention"],"avaIntro":"Hi again, it is Ava. So far we have covered the licensing path and how the Marketplace works. Now we get to the part of the job you will do every day, which is talking with people. In this module I will show you how to run a needs-based conversation. That means you ask before you recommend. We will go through the discovery questions I want you to use, including the big three: doctors, prescriptions and budget. I will give you plain-language ways to explain a deductible, a copay, coinsurance and the out-of-pocket maximum, because those four words confuse almost everyone. Then we will compare plans honestly, handle the concerns you will hear most often, walk through an enrollment step by step, and finish with follow-up. Good follow-up is what turns a single enrollment into a long-term customer. Let us begin."},"keywords":[{"term":"Coinsurance","def":"The percentage of a covered service's cost the member pays after meeting the deductible."},{"term":"Copay","def":"A fixed dollar amount the member pays for a covered service, such as an office visit."},{"term":"Deductible","def":"The amount the member pays for covered services before the plan starts sharing costs."},{"term":"Discovery","def":"The questioning stage in which the agent learns the consumer's situation and priorities."},{"term":"Effectuation","def":"The point at which coverage becomes active, after the first premium is paid."},{"term":"Formulary","def":"A plan's list of covered prescription drugs, usually arranged in cost tiers."},{"term":"Needs-based selling","def":"Recommending coverage based on the consumer's stated needs rather than on what pays the agent best."},{"term":"Network","def":"The doctors, hospitals and other providers that have contracted with a plan."},{"term":"Out-of-pocket maximum","def":"The most a member pays for covered in-network services in a plan year, not counting premiums."},{"term":"Premium","def":"The amount paid, usually monthly, to keep coverage in force."},{"term":"Retention","def":"Keeping customers enrolled and satisfied over time."},{"term":"Summary of Benefits and Coverage","def":"A standard document that shows a plan's costs and coverage in a uniform layout."}],"sections":[{"title":"Discovery: Ask Before You Recommend","blocks":[{"type":"p","text":"<b>Needs-based selling<\/b> means your recommendation comes out of what the customer tells you. The first part of the conversation is <b>discovery<\/b>, and during discovery you do far more listening than talking. A good rule is that the customer should be speaking for most of it."},{"type":"p","text":"Start by setting expectations. Tell the person who you are, that you are a licensed agent, that your help does not add to their premium, and that you will ask some questions so you can narrow down the options. Before you look up or start any Marketplace application, you must obtain and document their consent; Module 4 explains exactly how."},{"type":"h","text":"Questions worth asking"},{"type":"list","items":["Who needs coverage, and who is in your tax household?","Do you have coverage today? If so, what do you like and dislike about it?","Is health insurance offered to you or your spouse through a job?","What do you expect your household income to be for the coverage year?","Which doctors, specialists or hospitals do you want to keep?","What prescriptions does each person take?","Is anything planned, such as a surgery or a pregnancy?","What monthly amount fits comfortably in your budget?"]},{"type":"p","text":"Ask open questions and let silence do some work. If someone says they hardly ever go to the doctor, follow up: when was the last visit, and what was it for? People often forget the medication they refill every month or the specialist they see twice a year."},{"type":"p","text":"Write down what you hear. Your notes guide the recommendation, and they also show later why you suggested what you did. Handle health details with care; you are asking in order to match a plan, not to judge, and Marketplace plans cannot charge more because of a health condition."},{"type":"flow","nodes":["Introduce and get consent","Discovery questions","Summarize back","Compare plans","Recommend"],"caption":"The recommendation comes only after discovery and a summary the customer agrees with."},{"type":"p","text":"Before moving on, repeat the key points back: who is being covered, the doctors and drugs that matter, and the budget. When the customer says that is right, you have earned the right to show plans."},{"type":"tip","text":"In a needs-based sale, the recommendation always follows fact-finding and never comes before it."}]},{"title":"Doctors, Prescriptions and Budget","blocks":[{"type":"p","text":"Three checks decide whether a plan will actually work for someone. Skipping any one of them is the most common cause of an unhappy customer in February."},{"type":"h","text":"Doctors"},{"type":"p","text":"A plan's <b>network<\/b> is the group of providers that have agreed to its rates. Many Marketplace plans in Texas are HMO or similar designs that pay little or nothing outside the network except in an emergency. Look up each important doctor and hospital in the plan's own provider directory, using the exact plan name, because one carrier may run several networks. Directories are sometimes out of date, so encourage the customer to confirm with the doctor's office as well."},{"type":"h","text":"Prescriptions"},{"type":"p","text":"Every plan has a <b>formulary<\/b>, its list of covered drugs. Drugs are placed in tiers, and the tier determines the cost. Check each medication by name and dose. Note whether the drug is covered, which tier it is on, and whether the plan applies rules such as prior authorization or requires trying another drug first."},{"type":"h","text":"Budget"},{"type":"p","text":"Budget has two parts. The first is the <b>premium<\/b>, the fixed monthly cost after any tax credit. The second is what the person would pay when they use care. A premium that looks great is not affordable if a single hospital stay would produce a bill the household cannot handle. Ask directly: if something unexpected happened, how large a bill could you manage?"},{"type":"table","head":["Check","Where to look","What to confirm"],"rows":[["Doctors and hospitals","The plan's provider directory","In network for this exact plan and accepting patients"],["Prescriptions","The plan's formulary","Covered, which tier, any restrictions"],["Budget","Premium after credit plus cost sharing","Monthly cost fits, and worst-case cost is survivable"]]},{"type":"example","text":"Elena chooses the cheapest Silver plan on her own. In January she learns her daughter's pediatrician is not in the network. A two-minute directory check during discovery would have prevented the problem."},{"type":"p","text":"When a plan fails one of these checks, say so. Telling a customer that their doctor is not in a plan, even when that plan would be an easy sale, is the honesty that builds a book of business."},{"type":"tip","text":"A network is plan-specific, so a provider must be verified against the exact plan being considered, not just the carrier."}]},{"title":"Explaining Costs in Plain Words","blocks":[{"type":"p","text":"Four terms decide what a customer pays when they use care. If you can explain them without jargon, you are ahead of most people in the business."},{"type":"table","head":["Term","Plain-language explanation"],"rows":[["Deductible","The amount you pay yourself each year for covered care before the plan starts sharing the bill."],["Copay","A flat fee for a service, like a set price for an office visit or a prescription."],["Coinsurance","Your share of a bill as a percentage, with the plan paying the rest, usually after the deductible."],["Out-of-pocket maximum","Your yearly ceiling. Once covered in-network costs reach it, the plan pays 100 percent for the rest of the year."]]},{"type":"p","text":"The <b>deductible<\/b> is where confusion starts. Many people think nothing is covered until it is met. That is often untrue. Preventive care is covered in-network without cost sharing, and many plans cover office visits or generic drugs for a copay before the deductible. Always read the plan's details instead of assuming."},{"type":"p","text":"A <b>copay<\/b> is a fixed dollar amount, while <b>coinsurance<\/b> is a percentage, so its dollar amount depends on the size of the bill. Customers tend to prefer copays because they are predictable."},{"type":"p","text":"The <b>out-of-pocket maximum<\/b> is the most important protection in the plan. Deductible, copays and coinsurance for covered in-network services all count toward it. Premiums do not, and neither do charges for services the plan does not cover or for out-of-network care on most plans."},{"type":"flow","nodes":["Pay deductible","Share costs: copays and coinsurance","Reach out-of-pocket maximum","Plan pays 100%"],"caption":"How costs progress through a plan year for covered in-network care."},{"type":"example","text":"Use round numbers when you teach, and tell the customer they are only an illustration. Suppose a plan had a 2,000 deductible, 20 percent coinsurance and a 6,000 out-of-pocket maximum. On a 12,000 hospital bill the member would pay the first 2,000, then 20 percent of the remaining 10,000, which is 2,000 more, for 4,000 in total. A second large bill that year could cost no more than another 2,000 before the ceiling is reached."},{"type":"p","text":"The standard <b>Summary of Benefits and Coverage<\/b> shows these figures in the same layout for every plan. Use it as your shared reference so the customer sees the numbers and does not have to take your word for them."},{"type":"tip","text":"Premiums never count toward the deductible or the out-of-pocket maximum."}]},{"title":"Comparing Plans Honestly and Handling Concerns","blocks":[{"type":"p","text":"An honest comparison looks at total expected cost: twelve months of premium plus what the person is likely to spend on care. Show two or three plans that passed the doctor and prescription checks, not a wall of twenty. Present the trade-off each one makes, then give a recommendation and the reason for it."},{"type":"list","items":["Use the same facts for every plan: premium after credit, deductible, out-of-pocket maximum, and the costs of the services this person actually uses.","Point out a plan's weak spots as readily as its strengths.","If the customer qualifies for cost-sharing reductions, explain that those savings exist only on Silver plans.","Never let your own compensation steer the recommendation.","Do not describe a plan as free; say what the premium is after the tax credit and that cost sharing still applies."]},{"type":"h","text":"Concerns you will hear"},{"type":"table","head":["Concern","A helpful, honest response"],"rows":[["It costs too much.","Ask which number worries them, then revisit the budget and look at another tier. Do not adjust income to make the price look better."],["I never get sick.","Agree that they may not need much routine care, and explain that the plan mainly protects against a large unexpected bill and includes preventive care."],["The deductible is too high.","Show what is covered before the deductible and compare a higher-tier plan's total cost."],["I need to think about it.","Respect it. Give the enrollment deadline accurately, send a summary and set a time to talk again."],["Will I owe money at tax time?","Explain that advance credits are reconciled, and that reporting income changes during the year keeps surprises small."]]},{"type":"p","text":"Handling a concern is not the same as overcoming a person. Listen to the whole concern, restate it so they know you understood, answer with facts, and check whether the answer helped. If the honest answer is that the Marketplace is not their best option, for example because they have a good plan through work, say that."},{"type":"p","text":"Real deadlines are useful information. Invented urgency is not. Never suggest that a price or a plan will disappear tomorrow unless that is actually true."},{"type":"tip","text":"The lowest premium is not automatically the lowest total cost; compare premium plus expected out-of-pocket spending."}]},{"title":"Enrollment Walk-Through, Follow-Up and Retention","blocks":[{"type":"p","text":"Once the customer has chosen a plan, slow down. Errors in the application cause most of the problems that show up later, and nearly all of them come from rushing."},{"type":"h","text":"Walking through the enrollment"},{"type":"list","items":["Confirm consent is documented, then complete the application using the customer's own name, address, email and phone number.","Enter household members and projected income exactly as the customer states them.","Review the eligibility result together, including any tax credit and any request for documents.","Confirm the chosen plan by its full name, the premium after credit and the effective date.","Have the customer review the finished application and confirm it is accurate before it is submitted, and document that review.","Explain the next steps before you end the conversation."]},{"type":"p","text":"The most important next step is the first premium payment. Coverage does not become active until it is paid; the industry word for this is <b>effectuation<\/b>. Tell the customer how and when to pay the carrier, and warn them that a missed first payment means no coverage."},{"type":"p","text":"If the Marketplace asks for documents to verify income, identity or a qualifying event, give the customer the deadline and explain that ignoring the request can end their coverage or their savings."},{"type":"h","text":"Follow-up and retention"},{"type":"p","text":"<b>Retention<\/b> is built in the weeks after the sale. A customer who hears from you only at enrollment has no reason to stay with you."},{"type":"list","items":["Within the first few days: confirm the first payment was made.","After the effective date: check that ID cards arrived and help them find their member portal.","During the year: remind them to tell you about income, address or household changes.","At tax time: remind them to watch for Form 1095-A.","Before open enrollment: review the renewal, because premiums, networks and drug lists change every year."]},{"type":"p","text":"AllShield's own follow-up schedule and the system used to track it: [AllShield to confirm]."},{"type":"tip","text":"Marketplace coverage is not in force until the first month's premium is paid to the carrier."}]}],"summary":{"recap":["A needs-based conversation puts discovery ahead of any recommendation. Ask, listen, take notes and summarize back.","Three checks decide whether a plan fits: the customer's doctors are in that exact plan's network, their prescriptions are on its formulary, and both the premium and the worst-case cost fit their budget.","Explain cost terms in plain words. The deductible comes first, copays and coinsurance share costs, and the out-of-pocket maximum is the yearly ceiling. Premiums count toward none of them.","Compare a short list of plans on total expected cost, disclose weaknesses, and answer concerns with facts, never with pressure or invented urgency.","Enroll carefully using the customer's own information, have them confirm the application, and make sure the first premium is paid.","Follow up after the sale and again before renewal. Retention comes from staying useful."],"avaSummary":"Let us review the conversation you just learned. It begins with discovery. You introduce yourself, you get consent, and then you ask questions and listen. Who needs coverage? What is the household and the expected income? Which doctors and prescriptions matter? What monthly amount is comfortable? When you have the answers, you repeat them back, and only then do you look at plans. Next come the three checks. Confirm each doctor in the directory for the exact plan. Confirm each prescription on the formulary. And look at budget from two sides, the monthly premium and the worst case if something serious happens. Then explain costs in plain words. The deductible is what you pay first. A copay is a flat fee. Coinsurance is a percentage. The out-of-pocket maximum is the ceiling for the year, and premiums do not count toward it. When you compare, show two or three plans, be honest about each one's weak spots, and recommend based on total cost, not premium alone. When a customer raises a concern, listen, restate it, answer with facts, and never invent urgency. At enrollment, slow down. Use the customer's own contact information, enter income as they give it, let them review the application, and document that review. Remind them that coverage is not active until the first premium is paid. Finally, follow up. Check on the payment, the ID cards, any changes during the year, and the renewal. That steady attention is what keeps customers with you for years.","reviewNotes":[{"objective":"Ask discovery questions that uncover a consumer's health coverage needs","concepts":["Discovery comes before any plan is shown.","Ask about who needs coverage, current coverage, employer offers, income, doctors, drugs, planned care and budget.","Use open questions and follow-ups; take notes.","Summarize back and get agreement before recommending."],"terms":[{"term":"Discovery","def":"The questioning stage in which the agent learns the consumer's situation."},{"term":"Needs-based selling","def":"Recommending coverage based on the consumer's stated needs."}]},{"objective":"Check doctors, prescriptions and budget before recommending a plan","concepts":["Verify providers in the directory for the exact plan, not just the carrier.","Check each drug's coverage, tier and restrictions on the formulary.","Budget includes both the premium and the cost of using care.","Tell the customer when a plan fails a check."],"terms":[{"term":"Network","def":"Providers contracted with a plan."},{"term":"Formulary","def":"A plan's list of covered drugs."}]},{"objective":"Explain deductible, copay, coinsurance and out-of-pocket maximum in plain words","concepts":["Deductible: what the member pays before the plan shares costs.","Copay is a fixed amount; coinsurance is a percentage.","Out-of-pocket maximum caps yearly spending on covered in-network care.","Premiums do not count toward the deductible or the maximum.","Preventive care is covered in-network without cost sharing."],"terms":[{"term":"Deductible","def":"Amount paid before the plan starts sharing costs."},{"term":"Out-of-pocket maximum","def":"The yearly ceiling on member spending for covered in-network care."}]},{"objective":"Compare plans honestly using total expected cost rather than premium alone","concepts":["Total cost equals a year of premiums plus expected out-of-pocket spending.","Show a short list of plans that passed the doctor and drug checks.","Disclose weaknesses as well as strengths.","Compensation must not steer the recommendation."],"terms":[{"term":"Summary of Benefits and Coverage","def":"A standard document showing plan costs and coverage in a uniform layout."}]},{"objective":"Respond to common concerns without pressure or misleading statements","concepts":["Listen, restate, answer with facts, check understanding.","Never change income to improve a price.","Give real deadlines; never invent urgency.","Do not call a plan free; state the premium after credit and that cost sharing applies."],"terms":[{"term":"Premium","def":"The amount paid to keep coverage in force."}]},{"objective":"Complete an enrollment walk-through and a follow-up plan that supports retention","concepts":["Use the customer's own contact details and stated income.","The customer reviews and confirms the application before submission.","Coverage starts only after the first premium is paid.","Follow up on payment, ID cards, mid-year changes, Form 1095-A and renewal."],"terms":[{"term":"Effectuation","def":"The point at which coverage becomes active after the first premium is paid."},{"term":"Retention","def":"Keeping customers enrolled and satisfied over time."}]}]},"exam":[{"q":"In a needs-based conversation, when should the agent recommend a plan?","choices":["At the start, to save time","After discovery and after summarizing the customer's needs back to them","Only if the customer asks twice","Before asking about budget"],"answer":1,"why":"The recommendation follows fact-finding and a summary the customer has confirmed."},{"q":"Which term means a fixed dollar amount paid for a covered service?","choices":["Coinsurance","Deductible","Copay","Premium"],"answer":2,"why":"A copay is a flat fee. Coinsurance is a percentage and the deductible is paid before cost sharing begins."},{"q":"What happens when a member reaches the out-of-pocket maximum?","choices":["The plan pays 100 percent of covered in-network care for the rest of the year","The plan ends for the year","The premium is waived","The deductible resets"],"answer":0,"why":"The out-of-pocket maximum is the yearly ceiling on member cost sharing for covered in-network services."},{"q":"Which of these does NOT count toward the out-of-pocket maximum?","choices":["Deductible payments","Copays for covered visits","Coinsurance on a covered hospital stay","Monthly premiums"],"answer":3,"why":"Premiums keep the plan in force but never count toward the deductible or the out-of-pocket maximum."},{"q":"A customer wants to keep a specific cardiologist. What should the agent do?","choices":["Assume the doctor accepts all plans from that carrier","Check the provider directory for the exact plan being considered","Tell the customer all plans cover all doctors","Skip the check if the premium is low"],"answer":1,"why":"Networks are plan-specific, so the provider must be verified against the exact plan."},{"q":"What is a formulary?","choices":["A list of in-network hospitals","The Marketplace income worksheet","A plan's list of covered prescription drugs","A form used to cancel coverage"],"answer":2,"why":"The formulary lists covered drugs and the tier each one falls in."},{"q":"The fairest way to compare two plans is by looking at:","choices":["Yearly premiums plus expected out-of-pocket costs","The monthly premium only","The carrier with the best-known name","Which plan pays the agent more"],"answer":0,"why":"Total expected cost shows what the customer is likely to spend; premium alone can mislead."},{"q":"A customer says the price is too high. Which response is appropriate?","choices":["Lower the income on the application to increase the credit","Tell them the offer expires today","Leave their spouse off the household","Revisit the budget and compare other tiers using accurate information"],"answer":3,"why":"The agent may explore other options but must never alter income or household facts or invent urgency."},{"q":"When does Marketplace coverage become active?","choices":["When the application is submitted","After the first premium is paid to the carrier","When the agent sends a welcome email","When ID cards are printed"],"answer":1,"why":"Coverage is effectuated only once the first month's premium is paid."},{"q":"Whose contact information should be entered on the Marketplace application?","choices":["The agent's, so notices can be handled quickly","The agency's main office","The customer's own","Any valid email address"],"answer":2,"why":"The application belongs to the consumer and must carry the consumer's own name, address, email and phone."},{"q":"Why should an agent contact customers before the next open enrollment?","choices":["Premiums, networks and drug lists can change each year","Coverage always ends unless a new agent is chosen","The deductible must be paid again in advance","The customer must retake identity verification"],"answer":0,"why":"Plans change annually, so a renewal review makes sure the current plan still fits."},{"q":"A customer believes nothing is covered until the deductible is met. What is the accurate explanation?","choices":["That is correct for every plan","Only emergency care is covered first","Coverage begins once premiums equal the deductible","Preventive care is covered in-network without cost sharing, and many plans cover some services for a copay first"],"answer":3,"why":"Preventive care has no cost sharing in-network and many plans cover visits or generic drugs before the deductible."}]},{"id":"as04","num":4,"title":"Compliance and Ethics","intro":{"hook":["Imagine opening your mail to find that your health plan was changed by an agent you have never spoken to, and that the tax credit attached to it used an income you never reported. This has happened to real consumers, and it is why Marketplace rules for agents have become much stricter.","This module covers the rules that protect consumers and protect your license: documented consent, accurate application information, the ban on unauthorized plan changes, telephone marketing rules, privacy, record keeping, honest marketing and unfair trade practices.","Compliance is not a separate task that gets in the way of selling. It is the way a professional sells. One serious violation can end a career, and good habits formed now cost nothing."],"objectives":["Explain the consent and application review documentation required before assisting a Marketplace consumer","Describe the agent's duty to enter accurate income and household information","Recognize unauthorized enrollments and plan switching as prohibited conduct","Apply basic TCPA and Do-Not-Call rules to phone and text outreach","Describe how to safeguard personal information and keep required records","Identify dishonest marketing and unfair trade practices"],"avaIntro":"Hello, it is Ava. This module may be the most important one in the Academy, so I am going to ask for your full attention. We are going to talk about compliance and ethics. I will explain the consent you must have, and must be able to prove, before you touch a consumer's Marketplace application. We will talk about entering income and household information accurately, and why changing someone's plan without permission is one of the most serious things an agent can do. Then we will cover the telephone rules, including Do-Not-Call, how to protect the personal information people trust you with, which records to keep and for how long, and what honest marketing looks like. We will finish with unfair trade practices under Texas law. None of this is meant to scare you. It is meant to keep you, and your customers, safe."},"keywords":[{"term":"Application review documentation","def":"A record showing the consumer reviewed their eligibility application and confirmed it was accurate before submission."},{"term":"Consent","def":"A consumer's permission, given before the agent acts, for the agent to help with Marketplace applications and enrollment."},{"term":"Do-Not-Call Registry","def":"The national list of phone numbers whose owners have asked not to receive telemarketing calls."},{"term":"Internal do-not-call list","def":"A company's own list of people who have asked that company not to call again."},{"term":"Misrepresentation","def":"A false or misleading statement about a policy's terms, benefits or cost."},{"term":"Personally identifiable information","def":
