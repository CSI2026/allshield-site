name: B047 Cumulative Social Gate
on:
  push:
    branches: [social-tiktok-b047]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-tiktok-b047
      - name: Carry forward certified X runtime checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/social-connection-admin/index.ts');s=p.read_text()
          old="else if(platform==='x'){const r=await fetch('https://api.x.com/2/users/me?user.fields=id,name,username',{headers:{Authorization:`Bearer ${t.access_token}`}});api=await r.json();identity_ok=r.ok&&Boolean(api?.data?.id)}"
          new="else if(platform==='x'){const r=await fetch('https://api.x.com/2/users/me?user.fields=id,name,username',{headers:{Authorization:`Bearer ${t.access_token}`}});api=await r.json();const xId=api?.data?.id;identity_ok=r.ok&&Boolean(xId);if(identity_ok){const headers={Authorization:`Bearer ${t.access_token}`};const pr=await fetch(`https://api.x.com/2/users/${xId}/tweets?max_results=5&tweet.fields=created_at,public_metrics,conversation_id,referenced_tweets`,{headers});extra.engagement_status=pr.status;extra.engagement_probe_ok=pr.ok;const mr=await fetch(`https://api.x.com/2/users/${xId}/mentions?max_results=5&tweet.fields=created_at,public_metrics,conversation_id,referenced_tweets,author_id`,{headers});extra.mentions_status=mr.status;extra.mentions_probe_ok=mr.ok}}"
          if old not in s: raise SystemExit('missing X identity target')
          s=s.replace(old,new,1)
          old="if(platform==='linkedin'&&cap.engagement_metrics_supported)engagement_ok=engagement_ok&&extra.engagement_probe_ok===true;if(platform==='tiktok'&&cap.engagement_metrics_supported)engagement_ok=engagement_ok&&extra.stats_probe_ok===true&&extra.video_metrics_probe_ok===true;"
          new="if(platform==='linkedin'&&cap.engagement_metrics_supported)engagement_ok=engagement_ok&&extra.engagement_probe_ok===true;if(platform==='tiktok'&&cap.engagement_metrics_supported)engagement_ok=engagement_ok&&extra.stats_probe_ok===true&&extra.video_metrics_probe_ok===true;if(platform==='x'&&cap.engagement_metrics_supported)engagement_ok=engagement_ok&&extra.engagement_probe_ok===true;"
          if old not in s: raise SystemExit('missing engagement gate target')
          s=s.replace(old,new,1)
          old="const comments_read_ok=!cap.comment_read_supported||(cap.required_comment_scopes||[]).every((s:string)=>granted.includes(s));\n const comments_reply_ok=!cap.comment_reply_supported||(cap.required_comment_scopes||[]).every((s:string)=>granted.includes(s));"
          new="let comments_read_ok=!cap.comment_read_supported||(cap.required_comment_scopes||[]).every((s:string)=>granted.includes(s));\n if(platform==='x'&&cap.comment_read_supported)comments_read_ok=comments_read_ok&&extra.mentions_probe_ok===true;\n let comments_reply_ok=!cap.comment_reply_supported||(cap.required_comment_scopes||[]).every((s:string)=>granted.includes(s));\n if(platform==='x'&&cap.comment_reply_supported)comments_reply_ok=comments_reply_ok&&extra.mentions_probe_ok===true;"
          if old not in s: raise SystemExit('missing X comment gate target')
          s=s.replace(old,new,1)
          p.write_text(s)
          b=Path('build-info.js');x=b.read_text()
          marker="    tiktok_professional_connection:'PASS',\n"
          add="    x_professional_engagement_verification:'PASS',\n    x_mentions_readiness_gate:'PASS',\n    x_reply_permission_gate:'PASS',\n"
          if 'x_professional_engagement_verification' not in x:x=x.replace(marker,marker+add,1)
          b.write_text(x)
          PY
      - name: Run cumulative release regressions
        run: |
          node --check social-connection-center.js
          node tests/social-tiktok-b047-contract.mjs
          node tests/social-x-b047-carryforward-contract.mjs
          npm test
          grep -q "Production B047 — TikTok Professional Connection + Analytics — Certified" build-info.js
      - name: Commit clean cumulative release
        run: |
          rm -f .github/workflows/b047-cumulative-social-gate.yml
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git add -A
          git commit -m 'Carry forward X verification in B047 social release'
          git push origin social-tiktok-b047
