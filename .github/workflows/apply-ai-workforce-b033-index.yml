name: Apply B033 AI Workforce Cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ai-workforce-b033-index.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish canonical B033 AI workforce runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./phase16-ai-command-production.js?v=2026.08.26.003','./phase16-ai-command-production.js?v=2026.08.28.004')
          if './phase16-ai-command-production.js?v=2026.08.28.004' not in s:
              raise SystemExit('B033 AI workforce runtime loader missing')
          p.write_text(s)

          p=Path('phase16-ai-command-production.js')
          s=p.read_text()
          s=s.replace('>Ask Avery</button>','>Ask Live AI — Avery</button>')
          s=s.replace("b.textContent='Ask Avery';", "b.textContent='Ask Live AI — Avery';")
          old="try{const r=await invoke('ai-command-center',{action:'ask',question:q});"
          new="try{const payload=role==='agent'?{action:'run',kind:'training_coach',assignment:q}:{action:'ask',question:q};const r=await invoke('ai-command-center',payload);"
          if old in s: s=s.replace(old,new)
          if 'Ask Live AI — Avery' not in s:
              raise SystemExit('Backward-compatible Ask Live AI label missing')
          p.write_text(s)

          p=Path('tests/owner-portal-contract.mjs')
          s=p.read_text()
          old="ai:['Run Company Scan','Ask Live AI','Recent AI Activity','Video Editor AI','Marketing AI','Operations AI','Performance AI','Compliance AI','ai-command-center','allshieldAICompanyScan','allshieldAIOpenWorkspace']"
          new="ai:['AI WORKFORCE COMMAND CENTER','Run Company Scan','Ask Live AI','Recent AI Work','Assign Work','Scorecard & Learning','Rate & Teach Employee','AI Chief of Staff','ai-command-center','allshieldAICompanyScan','allshieldAIOpenWorkspace','allshieldAIReviewLastWork','allshieldAIEmployeeDetail']"
          if old not in s:
              raise SystemExit('Expected legacy AI contract markers not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit canonical B033 updates
        run: |
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html phase16-ai-command-production.js tests/owner-portal-contract.mjs
          if git diff --cached --quiet; then
            echo 'B033 canonical files already current.'
          else
            git commit -m 'Finalize named AI workforce runtime contract'
            git push
          fi
