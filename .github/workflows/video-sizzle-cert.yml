name: Certify Careers Sizzle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Certify Careers sizzle generation stability on live production
        run: |
          ALLSHIELD_LIVE_URL='https://allshieldinsurancegroup.com' node tests/video-sizzle-stability-cert.mjs
      - name: Certify public Careers Play button on live production
        run: |
          ALLSHIELD_LIVE_URL='https://allshieldinsurancegroup.com' node tests/public-career-sizzle-play-cert.mjs
