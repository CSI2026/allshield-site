name: Certify Production E-Sign

on:
  push:
    branches: [main]
    paths:
      - 'tests/esign-production-cert.mjs'
      - 'esign-agreements-2026-08-28.js'
      - 'onboarding-esign-bridge-2026-08-28.js'
      - 'config.js'
      - '.github/workflows/esign-production-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Certify production E-Sign and public navigation
        run: ALLSHIELD_LIVE_URL='https://allshieldinsurancegroup.com' node tests/esign-production-cert.mjs
