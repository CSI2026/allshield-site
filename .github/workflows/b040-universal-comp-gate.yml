name: B040 Universal Compensation Gate
on:
  push:
    branches: [universal-comp-b040]
    paths:
      - '.github/workflows/b040-universal-comp-gate.yml'
jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-comp-b040
          fetch-depth: 0
      - name: Repair contract formatting and role routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('supabase/functions/comp-admin/index.ts')
          s=p.read_text()
          old='''    if (t.benefit_type === "rate_override") {\n      const suffix = plan.rate_basis === "percent_of_value" ? "% rate" : plan.rate_basis === "flat" ? " flat rate" : ` per ${label}`;\n      return `- ${t.tier_name}: ${t.min_units}+ ${plural(label)} → ${num(t.benefit_value).toFixed(plan.rate_basis === "percent_of_value" ? 2 : 2)}${plan.rate_basis === "percent_of_value" ? "%" : `$${""}`}`;\n    }'''
          new='''    if (t.benefit_type === "rate_override") {\n      const benefit = plan.rate_basis === "percent_of_value"\n        ? `${num(t.benefit_value).toFixed(2)}% rate`\n        : plan.rate_basis === "flat"\n          ? `$${num(t.benefit_value).toFixed(2)} flat rate`\n          : `$${num(t.benefit_value).toFixed(2)} per ${label}`;\n      return `- ${t.tier_name}: ${t.min_units}+ ${plural(label)} → ${benefit}`;\n    }'''
          if old not in s: raise SystemExit('expected rate_override contract block not found')
          s=s.replace(old,new,1)
          old2='''  // Correct rate-format line separately so dollars precede the amount for non-percent plans.\n  const normalizedTierLines = tierLines.map((line: string) => line.replace(/→ ([0-9.]+)\\$ per /, "→ $$$1 per ").replace(/→ ([0-9.]+)\\$ flat rate/, "→ $$$1 flat rate"));\n'''
          if old2 not in s: raise SystemExit('expected normalized tier block not found')
          s=s.replace(old2,'',1)
          s=s.replace('${normalizedTierLines.length ? normalizedTierLines.join("\\n") : "No tier rules are configured for this version."}','${tierLines.length ? tierLines.join("\\n") : "No tier rules are configured for this version."}',1)
          p.write_text(s)

          p=Path('universal-compensation-platform.js')
          s=p.read_text()
          old="let controlState={programs:[],selected:null,dashboard:null};"
          new="let controlState={programs:[],selected:null,dashboard:null,role:'owner'};"
          if old not in s: raise SystemExit('controlState block not found')
          s=s.replace(old,new,1)
          old="async function renderControl(main,role){\n main.innerHTML='<div class=\"bo-card\">Loading compensation programs…</div>';"
          new="async function renderControl(main,role){\n controlState.role=role||'owner';\n main.innerHTML='<div class=\"bo-card\">Loading compensation programs…</div>';"
          if old not in s: raise SystemExit('renderControl block not found')
          s=s.replace(old,new,1)
          s=s.replace("window.loadUniversalCompControl('owner')","window.loadUniversalCompControl(controlState.role||'owner')")
          p.write_text(s)
          PY
      - name: JavaScript syntax
        run: node --check universal-compensation-platform.js && node --check mobile-symmetry-fix-2026-08-28.js
      - name: Universal compensation contract
        run: node tests/universal-compensation-contract.mjs
      - name: Full ALLSHIELD contract suite
        run: npm test
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo 'No repair diff.'
          else
            git config user.name 'ALLSHIELD Build Bot'
            git config user.email 'buildbot@allshieldinsurancegroup.com'
            git add supabase/functions/comp-admin/index.ts universal-compensation-platform.js
            git commit -m 'Repair B040 contract formatting and portal role routing'
            git push origin HEAD:universal-comp-b040
          fi
