name: Clean legacy portal source

on:
  push:
    branches: [main]
    paths:
      - 'scripts/production-source-cleanup.mjs'
      - '.github/workflows/source-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/production-source-cleanup.mjs
      - name: Commit cleaned production shell
        run: |
          if git diff --quiet -- index.html; then
            echo "No index cleanup changes required."
            exit 0
          fi
          git config user.name "allshield-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Remove legacy sample portal markup from production shell"
          git push
