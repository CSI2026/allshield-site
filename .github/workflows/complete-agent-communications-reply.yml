name: Complete Agent Communications Reply
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-agent-communications-reply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finish canonical agent email reply flow
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('supabase/functions/agent-operations/index.ts')
          s=p.read_text()
          old='''      await admin.from("email_threads").update({unread_count:0,updated_at:new Date().toISOString()}).eq("id",id);\n      return json({ok:true,thread:t,messages:m||[]});'''
          new='''      await admin.from("email_threads").update({unread_count:0,updated_at:new Date().toISOString()}).eq("id",id);\n      let mailAlias=null;\n      if(t.agent_id){\n        const {data:alias,error:ae}=await admin.from("agent_mail_aliases").select("user_id,alias_address,internal_identity,provider_status,active,last_verified_at").eq("user_id",t.agent_id).maybeSingle();\n        if(ae)throw ae;mailAlias=alias||null;\n      }\n      return json({ok:true,thread:t,messages:m||[],mail_alias:mailAlias});'''
          if old not in s: raise SystemExit('agent-operations thread return marker not found')
          p.write_text(s.replace(old,new,1))

          p=Path('agent-operations-core-2026-08-28.js')
          s=p.read_text()
          s=s.replace('.as-command-stat{color:inherit;', '.as-command-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.as-command-stat{color:inherit;',1)
          s=s.replace('@media(max-width:850px){.as-master-grid', '@media(max-width:1100px){.as-command-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}\n@media(max-width:850px){.as-command-grid{grid-template-columns:1fr 1fr}.as-master-grid',1)
          s=s.replace('<div class="stat-grid" style="margin-top:18px">${statCard', '<div class="stat-grid as-command-grid" style="margin-top:18px">${statCard',1)

          start=s.index('window.asOpenAgentThread=async')
          end=s.index('\nfunction start(){',start)
          replacement=r'''window.asOpenAgentThread=async(threadId,agentId)=>{try{const d=await edge('thread',{thread_id:threadId}),containers=[document.getElementById('asCommsThreadViewer'),document.getElementById('asMasterThreadViewer')].filter(Boolean),messages=d.messages||[],alias=d.mail_alias||null,canReply=alias?.active&&alias?.provider_status==='active'&&alias?.alias_address;window.__asOpenAgentThread={thread:d.thread,agentId,mailAlias:alias};const html=`<div class="bo-card" style="margin-top:14px"><div class="row-actions"><button class="tiny-btn" onclick="openAgentMasterProfile('${agentId}','${portalRole()}')">Open Agent Master File</button></div><h3>${esc(d.thread.subject||'(No subject)')}</h3><p style="color:#8195aa">${esc(d.thread.contact_email||'')}</p>${messages.map(m=>`<div class="as-email-message ${esc(m.direction)}"><div class="requirement"><span><strong>${esc(m.from_address||'Unknown')}</strong></span><span>${fmt(m.sent_at||m.received_at)}</span></div><div style="white-space:pre-wrap;line-height:1.6">${esc(m.body_text||'(No text body)')}</div></div>`).join('')||'<p>No messages.</p>'}${canReply?`<div class="bo-card" style="margin-top:14px"><h3>Reply as ${esc(alias.alias_address)}</h3><textarea id="asAgentReplyText" class="mini-input" style="min-height:120px;resize:vertical" placeholder="Type reply…"></textarea><div class="row-actions" style="margin-top:10px"><button id="asAgentReplyButton" class="btn btn-primary" onclick="asReplyAgentThread()">Send Reply</button></div></div>`:`<div class="demo-note">Reply is locked until this agent-specific ALLSHIELD address is verified by actual inbound provider routing. The secure @allshield.internal identity is never exposed as an internet mailbox.</div>`}</div>`;containers.forEach(c=>c.innerHTML=html)}catch(e){alert(e.message||e)}};
          window.asReplyAgentThread=async()=>{const ctx=window.__asOpenAgentThread||{},alias=ctx.mailAlias,thread=ctx.thread,text=document.getElementById('asAgentReplyText')?.value.trim()||'',btn=document.getElementById('asAgentReplyButton');try{if(!thread?.id||!alias?.alias_address||alias.provider_status!=='active')throw new Error('This agent sender identity is not verified for external mail.');if(!text)throw new Error('Type a reply first.');if(!thread.contact_email)throw new Error('This thread does not have a reply recipient.');if(btn){btn.disabled=true;btn.textContent='Sending…'}const c=sb();const {data,error}=await c.functions.invoke('ionos-mail',{body:{action:'send',thread_id:thread.id,from_address:alias.alias_address,to:thread.contact_email,subject:/^re:/i.test(thread.subject||'')?thread.subject:`Re: ${thread.subject||'ALLSHIELD message'}`,text}});if(error)throw error;if(data?.error)throw new Error(data.error);window.toast?.('Reply sent from '+alias.alias_address);await window.asOpenAgentThread(thread.id,ctx.agentId)}catch(e){alert(e.message||e)}finally{if(btn){btn.disabled=false;btn.textContent='Send Reply'}}};'''
          s=s[:start]+replacement+s[end:]
          old="window.registerAllshieldView('owner','agentcommunications',main=>renderCommunications(main,'owner'));"
          new="window.registerAllshieldView('owner','agentcommunications',main=>renderCommunications(main,'owner'));window.registerAllshieldView('owner','communications',main=>renderCommunications(main,'owner'));"
          if old not in s: raise SystemExit('owner communications registration marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          node --check agent-operations-core-2026-08-28.js
      - name: Commit reply flow
        run: |
          git config user.name "allshield-build-bot"
          git config user.email "allshield-build-bot@users.noreply.github.com"
          git add supabase/functions/agent-operations/index.ts agent-operations-core-2026-08-28.js
          git commit -m "Complete verified agent email reply flow"
          git push