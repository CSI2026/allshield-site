name: B050 TikTok Review Demo Integration

on:
  push:
    paths:
      - '.github/workflows/b050-tiktok-review-demo.yml'
      - 'scripts/b050_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply B050 patch
        run: python3 scripts/b050_patch.py
      - name: Run B050 contract
        run: node tests/social-tiktok-b050-review-demo-contract.mjs
      - name: Run permanent regression suite
        run: npm test
      - name: Commit B050
        run: |
          git config user.name "ALLSHIELD Build Bot"
          git config user.email "buildbot@allshieldinsurancegroup.com"
          git add supabase/functions/social-connection-admin/index.ts social-connection-center.js build-info.js tests/social-tiktok-b050-review-demo-contract.mjs package.json
          git commit -m "Add real TikTok Sandbox review demo transfers B050"
          git push origin main
      - name: Retire temporary B050 files
        run: |
          git pull --rebase origin main
          git rm .github/workflows/b050-tiktok-review-demo.yml scripts/b050_patch.py
          git commit -m "Retire B050 TikTok review demo build files"
          git push origin main
