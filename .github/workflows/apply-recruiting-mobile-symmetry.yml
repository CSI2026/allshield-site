name: Apply Recruiting And Mobile Symmetry

on:
  push:
    branches: [main]
    paths:
      - 'recruiting-platform.js'
      - 'mobile-symmetry-fix-2026-08-28.js'
      - '.github/workflows/apply-recruiting-mobile-symmetry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add recruiting and symmetry runtime before mobile navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script defer src="./responsive-ui.js?v=2026.08.27.011"></script>'
          old='<script defer src="./recruiting-platform.js?v=2026.08.28.001"></script>'
          new='<script defer src="./recruiting-platform.js?v=2026.08.28.002"></script>'
          symmetry='<script defer src="./mobile-symmetry-fix-2026-08-28.js?v=2026.08.28.001"></script>'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              if marker not in s:
                  raise SystemExit('responsive-ui marker not found')
              s=s.replace(marker,new+'\n'+marker)
          if symmetry not in s:
              if marker not in s:
                  raise SystemExit('responsive-ui marker not found for symmetry')
              s=s.replace(marker,symmetry+'\n'+marker)
          p.write_text(s)
          PY
      - name: Commit production wiring
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "allshield-build-bot"
          git config user.email "allshield-build-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Publish Recruiting & Leads mobile navigation fix"
          git push
