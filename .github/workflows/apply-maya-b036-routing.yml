name: Apply Maya B036 Routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-maya-b036-routing.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire Maya and bump workforce runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phase16-ai-command-production.js')
          s=p.read_text()
          old="}else if(kind==='operations_manager'||kind==='operations'||code==='operations_manager'){target='ai-olivia-operations-manager';if(a==='run')payload={action:'scan',assignment:body.assignment||''};else if(a==='work')payload={action:'work',assignment:body.assignment||'',job_id:body.job_id||null};}}const {data,error}=await c.functions.invoke(target,{body:payload});"
          new="}else if(kind==='operations_manager'||kind==='operations'||code==='operations_manager'){target='ai-olivia-operations-manager';if(a==='run')payload={action:'scan',assignment:body.assignment||''};else if(a==='work')payload={action:'work',assignment:body.assignment||'',job_id:body.job_id||null};}else if(kind==='marketing_manager'||kind==='marketing'||code==='marketing_manager'){target='ai-maya-marketing-manager';if(a==='run')payload={action:'scan',assignment:body.assignment||''};else if(a==='work')payload={action:'work',assignment:body.assignment||'',job_id:body.job_id||null};}}const {data,error}=await c.functions.invoke(target,{body:payload});"
          if old not in s: raise SystemExit('Maya routing anchor not found')
          s=s.replace(old,new,1).replace("const VERSION='2026.08.28.006'","const VERSION='2026.08.28.007'",1)
          p.write_text(s)
          i=Path('index.html')
          t=i.read_text()
          if './phase16-ai-command-production.js?v=2026.08.28.006' not in t: raise SystemExit('index runtime anchor not found')
          i.write_text(t.replace('./phase16-ai-command-production.js?v=2026.08.28.006','./phase16-ai-command-production.js?v=2026.08.28.007'))
          for name in ['tests/avery-chief-of-staff-cert.mjs','tests/olivia-operations-manager-cert.mjs','tests/ai-workforce-organization-cert.mjs']:
            f=Path(name)
            x=f.read_text()
            f.write_text(x.replace('2026.08.28.006','2026.08.28.007'))
          PY
      - name: Run permanent contracts
        run: npm test
      - name: Commit routing update
        run: |
          git config user.name "CSI2026"
          git config user.email "circlesolutionstx@gmail.com"
          git add phase16-ai-command-production.js index.html tests/avery-chief-of-staff-cert.mjs tests/olivia-operations-manager-cert.mjs tests/ai-workforce-organization-cert.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Route Maya through dedicated B036 marketing engine"
          git push
