name: Apply B035 Olivia Canonical Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-b035-olivia-runtime.yml'
      - 'phase16-ai-command-production.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch canonical AI runtime for Olivia
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phase16-ai-command-production.js')
          s=p.read_text()
          old="const VERSION='2026.08.28.005';"
          if old in s:
              s=s.replace(old,"const VERSION='2026.08.28.006';",1)
          old_invoke="async function invoke(name,body){const c=await sb();let target=name,payload=body;if(name==='ai-command-center'&&body){const a=body.action,kind=body.kind,code=body.employee_code;if(a==='ask'||kind==='company'||kind==='command_center'||code==='command_center'){target='ai-avery-chief-of-staff';if(a==='run')payload={action:'scan',assignment:body.assignment||''};else if(a==='work')payload={action:'work',assignment:body.assignment||''};}}const {data,error}=await c.functions.invoke(target,{body:payload});if(error)throw error;if(data?.error)throw new Error(data.error);return data;}"
          new_invoke="async function invoke(name,body){const c=await sb();let target=name,payload=body;if(name==='ai-command-center'&&body){const a=body.action,kind=body.kind,code=body.employee_code;if(a==='ask'||kind==='company'||kind==='command_center'||code==='command_center'){target='ai-avery-chief-of-staff';if(a==='run')payload={action:'scan',assignment:body.assignment||''};else if(a==='work')payload={action:'work',assignment:body.assignment||''};}else if(kind==='operations_manager'||kind==='operations'||code==='operations_manager'){target='ai-olivia-operations-manager';if(a==='run')payload={action:'scan',assignment:body.assignment||''};else if(a==='work')payload={action:'work',assignment:body.assignment||'',job_id:body.job_id||null};}}const {data,error}=await c.functions.invoke(target,{body:payload});if(error)throw error;if(data?.error)throw new Error(data.error);return data;}"
          if old_invoke in s:
              s=s.replace(old_invoke,new_invoke,1)
          elif "target='ai-olivia-operations-manager'" not in s:
              raise SystemExit('Expected canonical invoke block was not found; refusing blind patch.')
          p.write_text(s)

          i=Path('index.html')
          x=i.read_text()
          x=x.replace('./phase16-ai-command-production.js?v=2026.08.28.005','./phase16-ai-command-production.js?v=2026.08.28.006')
          i.write_text(x)
          PY
      - name: Commit canonical runtime
        run: |
          if git diff --quiet; then
            echo 'Canonical Olivia routing already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase16-ai-command-production.js index.html
          git commit -m 'Route Olivia through dedicated operations execution engine'
          git push
