name: Apply B034 Avery Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-b034-avery-runtime.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route Avery UI to certified execution engine
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('phase16-ai-command-production.js')
          s=p.read_text()
          s=s.replace("const VERSION='2026.08.28.004';","const VERSION='2026.08.28.005';")
          old="async function invoke(name,body){const c=await sb();const {data,error}=await c.functions.invoke(name,{body});if(error)throw error;if(data?.error)throw new Error(data.error);return data;}"
          new="async function invoke(name,body){const c=await sb();let target=name,payload=body;if(name==='ai-command-center'&&body){const a=body.action,kind=body.kind,code=body.employee_code;if(a==='ask'||kind==='company'||kind==='command_center'||code==='command_center'){target='ai-avery-chief-of-staff';if(a==='run')payload={action:'scan',assignment:body.assignment||''};else if(a==='work')payload={action:'work',assignment:body.assignment||''};}}const {data,error}=await c.functions.invoke(target,{body:payload});if(error)throw error;if(data?.error)throw new Error(data.error);return data;}"
          if old not in s:
              raise SystemExit('Expected canonical AI invoke helper not found')
          s=s.replace(old,new)
          if "target='ai-avery-chief-of-staff'" not in s:
              raise SystemExit('Avery runtime route missing')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          old='./phase16-ai-command-production.js?v=2026.08.28.004'
          new='./phase16-ai-command-production.js?v=2026.08.28.005'
          if old not in s:
              raise SystemExit('Expected B033 AI runtime loader not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit B034 Avery runtime
        run: |
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add phase16-ai-command-production.js index.html
          if git diff --cached --quiet; then
            echo 'B034 Avery runtime already current.'
          else
            git commit -m 'Route Avery to certified Chief of Staff engine'
            git push
          fi
