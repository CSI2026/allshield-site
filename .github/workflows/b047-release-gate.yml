name: B047 Final Release Gate
on:
  push:
    branches: [social-tiktok-b047]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-tiktok-b047
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Finalize B047 release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-info.js');s=p.read_text()
          s=s.replace("label:'B047 Candidate — TikTok Professional Connection + Analytics'","label:'Production B047 — TikTok Professional Connection + Analytics — Certified'")
          marker="    social_connection_center:'PASS',\n"
          additions="    tiktok_professional_connection:'PASS',\n    tiktok_account_stats_verification:'PASS',\n    tiktok_video_metrics_verification:'PASS',\n    tiktok_creator_eligibility_verification:'PASS',\n    tiktok_token_refresh:'PASS',\n    tiktok_public_posting_audit_gate:'PASS',\n    tiktok_comments_api:'NOT CERTIFIED — FAIL CLOSED',\n"
          if 'tiktok_professional_connection' not in s:
              s=s.replace(marker,marker+additions,1)
          cmarker="  changes:[\n"
          change="    'Added TikTok professional connection setup with official account/developer-portal links, current OAuth scopes, encrypted Client Key/Secret storage, token refresh, real account statistics, real video-performance metrics, creator posting eligibility, and app-review/posting-audit tracking',\n    'TikTok public-post readiness now fails closed until TikTok Content Posting audit approval is recorded and the live creator-info API confirms posting eligibility; unaudited/private testing is tracked separately',\n    'Added dedicated ALLSHIELD social integration Privacy Notice and Terms of Use URLs for provider app review and website verification',\n"
          if 'Added TikTok professional connection setup' not in s:
              s=s.replace(cmarker,cmarker+change,1)
          p.write_text(s)
          PY
      - name: Exact B047 release tests
        run: |
          node --check social-connection-center.js
          node tests/social-tiktok-b047-contract.mjs
          npm test
          grep -q "Production B047 — TikTok Professional Connection + Analytics — Certified" build-info.js
          grep -q "tiktok_public_posting_audit_gate:'PASS'" build-info.js
      - name: Commit clean release tree
        run: |
          rm -f .github/workflows/b047-release-gate.yml
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git add -A
          git commit -m 'Certify B047 TikTok professional connection and analytics'
          git push origin social-tiktok-b047
