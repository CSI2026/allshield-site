name: Patch TikTok Static Callback B048
on:
  push:
    branches: [tiktok-static-callback-b048]
    paths: ['.github/workflows/patch-tiktok-static-callback-b048.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tiktok-static-callback-b048
      - name: Patch callback contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/social-connection-admin/index.ts')
          s=p.read_text()
          old="const BUILD='B2026.08.29.047';"
          assert old in s
          s=s.replace(old,"const BUILD='B2026.08.29.048';",1)
          old="function callback(provider:string){return `${fnBase}?provider=${enc(provider)}&callback=1`}"
          new="function callback(provider:string){return provider==='tiktok'?`${SUPABASE_URL}/functions/v1/social-tiktok-callback`:`${fnBase}?provider=${enc(provider)}&callback=1`}"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Contract checks
        run: |
          grep -F 'social-tiktok-callback' supabase/functions/social-connection-admin/index.ts
          grep -F "const BUILD='B2026.08.29.048';" supabase/functions/social-connection-admin/index.ts
          node tests/social-tiktok-b047-contract.mjs
          node tests/social-connection-center-contract.mjs
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/patch-tiktok-static-callback-b048.yml
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git add supabase/functions/social-connection-admin/index.ts .github/workflows/patch-tiktok-static-callback-b048.yml
          git commit -m 'Use static TikTok OAuth callback in B048'
          git push origin HEAD:tiktok-static-callback-b048
