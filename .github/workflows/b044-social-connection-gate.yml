name: B044 Social Connection Integration Gate
on:
  push:
    branches: [social-connection-b044]
    paths: ['.github/workflows/b044-social-connection-gate.yml']
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-connection-b044
          fetch-depth: 0
      - name: Patch production loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          marker='<script defer src="./social-connection-center.js?v=B2026.08.29.044"></script>'
          if marker not in s:
              assert '</body>' in s
              s=s.replace('</body>',marker+'\n</body>',1)
              p.write_text(s)
          PY
      - name: Browser syntax
        run: node --check social-connection-center.js
      - name: B044 source contract
        run: node tests/social-connection-center-contract.mjs
      - name: Full ALLSHIELD contract suite
        run: npm test
      - name: AI organization regression
        env:
          ALLSHIELD_EXPECTED_LIVE_RUNTIME: 2026.08.29.009
        run: node tests/ai-workforce-organization-cert.mjs
      - name: Security markers
        run: |
          grep -q 'social-connection-center.js?v=B2026.08.29.044' index.html
          grep -q "current_build:'B2026.08.29.044'" build-info.js
          grep -q 'social_vault_get' supabase/migrations/20260829_social_connection_center_b044.sql
          grep -q 'to service_role' supabase/migrations/20260829_social_connection_center_b044.sql
          ! grep -q 'decrypted_secret' social-connection-center.js
          ! grep -q 'secret_value:' supabase/functions/social-connection-admin/index.ts
      - name: Remove one-time workflow
        run: rm -f .github/workflows/b044-social-connection-gate.yml
      - name: Commit clean B044 candidate
        run: |
          git config user.name 'ALLSHIELD Build Bot'
          git config user.email 'buildbot@allshieldinsurancegroup.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Stage B044 secure social connection center'
          git push origin HEAD:social-connection-b044
