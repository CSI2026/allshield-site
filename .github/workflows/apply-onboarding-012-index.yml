name: Apply Onboarding 015 Index Loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version config and force Team Accounts override
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./config.js?v=2026.08.28.014'
          new='./config.js?v=2026.08.28.015'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('Expected config loader not found')

          override='<script defer src="./team-accounts-invite-override-2026-08-28.js?v=2026.08.28.002"></script>'
          anchor='<script defer src="./manual-agent-onboarding-2026-08-28.js?v=2026.08.28.008"></script>'
          if override not in s:
              if anchor not in s:
                  raise SystemExit('Manual onboarding anchor not found')
              s=s.replace(anchor, anchor+'\n'+override)

          p.write_text(s)
          PY
      - name: Commit loader version
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "allshield-build-bot"
          git config user.email "allshield-build-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Force fresh Team Accounts invite loader"
          git push