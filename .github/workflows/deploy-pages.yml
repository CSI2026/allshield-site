name: Deploy Allshield to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  certify-owner-portal:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Certify all Owner portal routes on live domain
        run: |
          mkdir -p certification
          ALLSHIELD_LIVE_URL='https://allshieldinsurancegroup.com' node tests/live-browser-cert.mjs | tee certification/live-owner-portal-certification.json
      - name: Certify Careers sizzle generation stability
        run: |
          ALLSHIELD_LIVE_URL='https://allshieldinsurancegroup.com' node tests/video-sizzle-stability-cert.mjs | tee certification/video-sizzle-stability-certification.json

# Production is not considered complete until the post-deploy Owner Portal and Careers sizzle browser certifications pass.
