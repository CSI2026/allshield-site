the premium would have purchased for the more hazardous job","Cancel the policy and refund all premiums","Pay the full benefit and bill the insured for back premium"],"answer":1,"why":"Benefits are reduced to what the premium paid would have bought at the more hazardous classification."},{"q":"If an insured misstated his age on the application, the insurer will:","choices":["Adjust benefits to what the premium would have purchased at the correct age","Void the policy from inception","Refund all premiums and deny claims","Pay full benefits with no adjustment"],"answer":0,"why":"The misstatement of age provision adjusts the benefit rather than cancelling the coverage."},{"q":"Which optional provision is designed to prevent an insured from collecting more in disability benefits than he earned while working?","choices":["Unpaid premium","Conformity with state statutes","Illegal occupation","Relation of earnings to insurance"],"answer":3,"why":"The relation of earnings provision reduces benefits proportionately when total disability benefits exceed the insured's earnings."},{"q":"A policy provision conflicts with the law of the state where the insured lives. Under the conformity with state statutes provision:","choices":["The whole policy is void","The insured must buy a new policy","The provision is automatically amended to meet the minimum requirements of state law","The insurer may cancel the policy"],"answer":2,"why":"Conflicting provisions are treated as amended to conform to the state's minimum legal requirements."},{"q":"The consideration given by the insured consists of:","choices":["The promise to pay benefits","The premium and the statements in the application","The free-look period","The policy's list of exclusions"],"answer":1,"why":"The insured gives the premium and the application statements; the insurer gives its promise to pay."},{"q":"Which statement correctly describes a probationary period?","choices":["It applies once after the policy is issued and applies to sickness rather than accidents","It begins again at the start of every disability","It is the time allowed to pay an overdue premium","It is the time an owner has to return the policy for a refund"],"answer":0,"why":"The probationary period is a one-time waiting period for sickness at the start of the policy; the elimination period applies to each disability."},{"q":"The time limit on certain defenses provision still allows an insurer to contest a claim after the time limit because of:","choices":["Any misstatement on the application","A pre-existing condition not specifically excluded","A late premium payment in the first year","Fraudulent misstatements on the application"],"answer":3,"why":"After the time limit passes, only fraudulent misstatements may be used to void the policy or deny a claim."}]},{"id":"ch19","num":19,"title":"Health Insurance Underwriting and Policy Issue","intro":{"hook":["Picture sitting at a kitchen table with a client who wants disability income coverage. You ask the health questions, they sign, and you leave with a check. What happens next is not magic. A whole process starts, and you were the first step in it.","This chapter follows a health insurance application from the first conversation to the day the policy is handed to the client. You will see how insurers gather information, how they sort applicants into risk classes, what federal law allows and forbids, and what your duties are at delivery and when coverage is being replaced.","It matters because most agent complaints and most denied claims trace back to this stage: a sloppy application, a missing signature, a receipt that was not explained, or old coverage that was cancelled too soon."],"objectives":["Describe the agent's role as field underwriter and the rules for completing and signing an application","Identify the main sources of underwriting information and the privacy laws that govern them","Explain how insurers classify risks and which rating factors they may use","Compare the Affordable Care Act limits on underwriting with products that are still medically underwritten","Explain how conditional receipts, policy delivery and the first premium determine when coverage begins","Apply the rules for replacing health coverage, group underwriting and fair marketing and claims practices"],"avaIntro":"Hi, I'm Ava, and welcome to chapter nineteen. So far we have looked at what health policies cover. Now I want to show you how a policy actually comes to life. It starts with you. When you sit down with an applicant, you are the insurer's eyes and ears, and we call that field underwriting. In this chapter I will walk you through the application, the signatures you need, and where the company goes for more information, like the MIB and the applicant's doctor. We will talk about privacy rules, risk classes, and how the Affordable Care Act changed underwriting for major medical plans. Then we will cover receipts, delivering the policy, and replacing old coverage without leaving your client uninsured. Take your time with this one. These are habits you will use on every single sale."},"keywords":[{"term":"Adverse selection","def":"The tendency of people who expect to have claims to seek insurance more than healthy people do."},{"term":"Attending physician statement","def":"A report from the applicant's own doctor giving medical history and treatment details to the underwriter."},{"term":"Conditional receipt","def":"A receipt given with the first premium that starts coverage early if the applicant is found insurable as applied for."},{"term":"Consumer report","def":"A report on a person's credit, character, reputation or habits prepared by a reporting agency and regulated by the Fair Credit Reporting Act."},{"term":"Field underwriting","def":"The agent's work of screening the applicant and collecting accurate information at the point of sale."},{"term":"Guaranteed issue","def":"Coverage that must be offered to every eligible applicant regardless of health."},{"term":"HIPAA privacy rule","def":"Federal rule that limits how protected health information may be used and shared."},{"term":"MIB","def":"A member-owned organization that lets insurers share coded medical information found during earlier underwriting."},{"term":"Preferred risk","def":"An applicant with better than average health and habits who qualifies for a lower premium."},{"term":"Replacement","def":"Buying a new policy and ending or reducing existing coverage as part of the same transaction."},{"term":"Standard risk","def":"An applicant with average expected claims who is charged the normal premium."},{"term":"Statement of good health","def":"A signed statement that the applicant's health has not changed since the application, used when premium is collected at delivery."},{"term":"Substandard risk","def":"An applicant with higher than average expected claims who may be charged more, given an exclusion, or limited in benefits."},{"term":"Underwriting","def":"The insurer's process of selecting, classifying and pricing risks."}],"sections":[{"title":"Field Underwriting and the Application","blocks":[{"type":"p","text":"<b>Underwriting<\/b> is how an insurer decides whether to accept a risk and what to charge for it. The home office underwriter makes the final call, but that person never meets the applicant. You do. That is why the agent is called the field underwriter."},{"type":"p","text":"<b>Field underwriting<\/b> means asking every question on the application, writing down the answers exactly as given, and telling the company anything you observe that bears on the risk. Your goal is to prevent <b>adverse selection<\/b>, which happens when people who expect claims are the ones most eager to buy."},{"type":"h","text":"Parts of the application"},{"type":"list","items":["General information: name, address, date of birth, occupation, income and other coverage in force.","Medical information: health history, current treatment, medications and family history.","Agent's report: your own remarks about the applicant. The applicant does not see or sign this part."]},{"type":"h","text":"Getting it right"},{"type":"p","text":"Answers should be recorded in ink or in the company's electronic system. If a mistake is made on paper, do not use correction fluid. The usual practice is to draw a line through the error, write the correct answer, and have the applicant initial the change. Some insurers require a fresh application instead."},{"type":"p","text":"An application with blanks will be returned to you. Never guess at an answer and never fill one in later on the client's behalf."},{"type":"h","text":"Required signatures"},{"type":"list","items":["The proposed insured.","The policyowner, if that is someone other than the insured.","The agent, as witness to the applicant's signature.","A parent or guardian when the proposed insured is a minor."]},{"type":"p","text":"Statements on the application are treated as <b>representations<\/b>, meaning they are true to the best of the applicant's knowledge. They are not warranties. A material misrepresentation, however, can allow the insurer to rescind coverage during the contestable period."},{"type":"flow","nodes":["Agent interview","Signed application","Home office review","Decision"],"caption":"The agent's work in the field feeds the underwriter's decision."},{"type":"example","text":"Maria tells you she saw a cardiologist last year but asks you to leave it off. You must record it. Omitting it would put her claim and your license at risk."},{"type":"tip","text":"If a question asks who must sign the application, look for the applicant and the agent; the agent's report is signed by the agent only."}]},{"title":"Sources of Underwriting Information","blocks":[{"type":"p","text":"The application is the main source of underwriting information, but it is rarely the only one. The underwriter checks what the applicant said against outside records."},{"type":"h","text":"MIB"},{"type":"p","text":"The <b>MIB<\/b> is a nonprofit membership organization of insurers. When a member company learns something medically significant during underwriting, it reports that finding in coded form. Other members can later check the codes when the same person applies with them."},{"type":"list","items":["MIB reports help detect omissions and fraud.","An insurer may not decline or rate an applicant based only on an MIB report. The report is a flag that prompts further investigation.","The applicant must receive written notice that information may be reported to and requested from the MIB."]},{"type":"h","text":"Attending physician statement and exams"},{"type":"p","text":"An <b>attending physician statement<\/b>, or APS, comes from the doctor who has actually treated the applicant. It is often the most detailed medical source. The insurer may also order a paramedical exam or lab work at its own expense."},{"type":"h","text":"Consumer reports and the FCRA"},{"type":"p","text":"A <b>consumer report<\/b> covers credit and general reputation. An investigative consumer report goes further and includes interviews with neighbors, coworkers or friends. The federal <b>Fair Credit Reporting Act<\/b> protects the applicant."},{"type":"list","items":["The applicant must be told in writing that a report may be requested.","If coverage is declined or priced higher because of a report, the insurer must tell the applicant and give the name and address of the reporting agency.","The applicant may dispute inaccurate information and have it reinvestigated."]},{"type":"h","text":"HIPAA privacy"},{"type":"p","text":"The <b>HIPAA privacy rule<\/b> protects individually identifiable health information. A signed authorization is needed before a doctor or hospital releases records to the insurer, which is why the application package includes a medical authorization form. Information you learn about a client's health is confidential and may be shared only with the insurer for underwriting."},{"type":"table","head":["Source","What it provides"],"rows":[["Application","The applicant's own answers"],["Agent's report","The agent's observations"],["MIB","Coded findings from earlier applications"],["APS","Treatment history from the applicant's doctor"],["Consumer report","Credit, character and habits"]]},{"type":"tip","text":"Remember that the MIB alerts the underwriter but can never be the sole reason for an adverse decision."}]},{"title":"Risk Classification and Rating Factors","blocks":[{"type":"p","text":"Once the file is complete, the underwriter places the applicant into a risk class. The class decides the price and sometimes the terms of the policy."},{"type":"table","head":["Class","Meaning","Typical result"],"rows":[["Preferred","Better than average risk","Lower premium"],["Standard","Average risk","Normal premium"],["Substandard","Higher than average risk","Extra premium, exclusion rider or reduced benefits"],["Declined","Risk the insurer will not accept","No policy issued"]]},{"type":"p","text":"A <b>substandard risk<\/b> is still insurable. In health insurance the insurer has three common tools: charging a rated premium, attaching an exclusion rider for a specific condition, or lengthening the waiting period or shortening the benefit period on a disability policy."},{"type":"h","text":"Factors underwriters weigh"},{"type":"list","items":["Age: claims generally rise as people get older.","Health history and current physical condition.","Occupation: dangerous jobs raise disability and accident risk. Disability insurers assign occupational classes.","Tobacco use and other lifestyle habits.","Avocations: hobbies such as skydiving or racing.","Moral and morale hazards: dishonesty or carelessness that raises the chance of loss.","Income, for disability income coverage, so that benefits do not exceed what the person actually earns."]},{"type":"p","text":"Overinsurance is a special concern in disability income. If benefits would replace all or more of a person's pay, there is little reason to return to work. Underwriters therefore limit the benefit to a percentage of earned income and ask about other coverage."},{"type":"h","text":"What cannot be used"},{"type":"p","text":"Rates must be based on real differences in expected claims. Charging people of the same class and risk different prices is unfair discrimination. Race, color, religion and national origin may not be used. Federal law also bars health insurers from using genetic information to set premiums or decide eligibility."},{"type":"example","text":"Two applicants of the same age apply for disability income. One is an accountant and the other is a roofer. The roofer is placed in a higher occupational class and pays more, because the chance of a disabling injury is greater."},{"type":"tip","text":"A substandard applicant is not a declined applicant; expect answers that mention a higher premium or an exclusion rider."}]},{"title":"The Affordable Care Act and What Is Still Underwritten","blocks":[{"type":"p","text":"The Affordable Care Act changed the rules for individual and small group major medical coverage. For those plans, traditional medical underwriting is gone."},{"type":"h","text":"ACA rules for individual major medical"},{"type":"list","items":["<b>Guaranteed issue<\/b>: the insurer must accept every eligible applicant during an open or special enrollment period.","Guaranteed renewability: coverage continues as long as premiums are paid, with narrow exceptions such as fraud.","No pre-existing condition exclusions.","No health questions used to decline, rate up or exclude."]},{"type":"h","text":"Permitted rating factors"},{"type":"p","text":"Premiums for these plans may vary only by four things: age, tobacco use, geographic rating area, and family size, meaning whether the plan covers one person or a family. The age spread is capped so that the oldest adult pays no more than three times what the youngest adult pays. Tobacco users may be charged up to one and one half times the non-tobacco rate. Health status and gender may not be used."},{"type":"p","text":"Because the insurer cannot screen applicants, enrollment is limited to set periods. Without those windows, people could wait until they were sick to buy, which is adverse selection in its purest form."},{"type":"h","text":"Products still underwritten"},{"type":"p","text":"Many health products are not major medical plans and fall outside these ACA rules. They may still ask health questions, rate the applicant, or decline."},{"type":"table","head":["ACA individual major medical","Typically still underwritten"],"rows":[["Guaranteed issue","Disability income"],["No pre-existing condition exclusions","Long-term care"],["Rates by age, tobacco, area, family size","Short-term limited duration medical"],["Enrollment periods apply","Accident-only, critical illness, hospital indemnity"],["","Medicare supplement applied for outside open enrollment or a guaranteed issue right"]]},{"type":"example","text":"Devon has diabetes. During open enrollment he can buy a marketplace health plan at the same rate as any other non-smoker his age in his area. If he applies for an individual disability income policy, the insurer may rate or decline him."},{"type":"tip","text":"On ACA rating questions, memorize the four allowed factors: age, tobacco, geography and family size."}]},{"title":"Receipts, Policy Issue and Delivery","blocks":[{"type":"p","text":"When coverage begins is one of the most tested ideas in this chapter. It depends on whether premium was paid with the application and what kind of receipt was given."},{"type":"h","text":"Premium with the application"},{"type":"p","text":"If the applicant pays the first premium at the time of application, you give a receipt. The most common is the <b>conditional receipt<\/b>. It says coverage starts on the date of the application or the medical exam, whichever is later, provided the applicant is found insurable as a standard risk under the insurer's normal rules. If the applicant turns out to be uninsurable, there is no coverage and the premium is refunded."},{"type":"h","text":"No premium with the application"},{"type":"p","text":"If no money is collected, the application is only an invitation for the insurer to make an offer. Coverage does not begin until the policy is delivered and the first premium is paid. At that point you should also collect a signed <b>statement of good health<\/b> confirming nothing has changed since the application."},{"type":"flow","nodes":["Application plus premium","Conditional receipt","Underwriting approves","Coverage dates back"],"caption":"With a conditional receipt, approval makes coverage effective from the earlier date."},{"type":"h","text":"Delivering the policy"},{"type":"p","text":"Personal delivery is the best practice. It gives you a chance to do the following."},{"type":"list","items":["Review the benefits, exclusions, limitations and any riders.","Explain any rating or exclusion rider that differs from what was applied for.","Collect premium and a statement of good health if they are still owed.","Get a signed delivery receipt, which documents the date the free-look period starts.","Explain the right to return the policy for a full refund during the free-look period."]},{"type":"p","text":"If the insurer issues the policy with changes, such as a higher premium, that is a counteroffer. The applicant can accept it by paying the new premium or reject it."},{"type":"example","text":"Lena applies on Monday, pays the first premium and gets a conditional receipt. She has her exam on Thursday and is injured on Saturday. The insurer later approves her as standard. Her coverage was effective Thursday, so the Saturday injury is covered."},{"type":"tip","text":"Under a conditional receipt, the effective date is the later of the application date or the medical exam date, but only if the applicant qualifies."}]},{"title":"Replacement, Group Underwriting and Fair Practices","blocks":[{"type":"h","text":"Replacing health coverage"},{"type":"p","text":"<b>Replacement<\/b> means a new policy takes the place of existing coverage. It is legal, but it carries real risk for the client. Before recommending it, compare the two policies honestly."},{"type":"list","items":["Benefits: is anything the old policy covered missing from the new one?","Exclusions and limitations: are new waiting periods or pre-existing condition limits going to apply?","Underwriting: could a health condition that developed since the old policy was issued lead to a rating, a rider or a decline?","Cost: is the client paying more for the same or less?"]},{"type":"p","text":"The golden rule is simple. The old policy stays in force until the new one has been issued and is in effect. Cancelling first can leave the client with no coverage at all. Many applications ask whether the new coverage will replace existing coverage, and you must answer truthfully."},{"type":"flow","nodes":["Compare policies","Apply for new","New policy issued","Then cancel old"],"caption":"The safe order for replacing health coverage."},{"type":"h","text":"Group underwriting"},{"type":"p","text":"In group insurance the underwriter evaluates the group as a whole, not each member. Individual members usually give no evidence of insurability if they enroll when first eligible. The underwriter looks at the following."},{"type":"list","items":["Purpose of the group: it must exist for a reason other than buying insurance.","Size and stability: larger groups with low turnover are more predictable.","Flow of members: younger people joining as older ones leave keeps the average age steady.","Participation: a high share of eligible people must enroll, especially when employees pay part of the cost.","Benefit selection: amounts are set by a formula, not chosen freely by each person."]},{"type":"p","text":"Large groups are often experience rated, meaning the premium reflects that group's own claims. Small groups are generally community rated."},{"type":"h","text":"Fair marketing and claims practices"},{"type":"p","text":"State law forbids unfair marketing practices such as misrepresenting what a policy covers, misleading comparisons made to induce a replacement, and deceptive advertising. It also forbids unfair claims practices, such as misstating policy provisions, failing to investigate promptly, or refusing to pay without a reasonable basis. The details for Texas are covered in the next chapter."},{"type":"tip","text":"For any replacement question, choose the answer that keeps the existing policy in force until the new coverage is effective."}]}],"summary":{"recap":["The agent is the field underwriter. You ask every question, record answers accurately, obtain the required signatures and report what you observe. Corrections are initialed by the applicant, never covered up.","Underwriters confirm the application using the MIB, attending physician statements, exams and consumer reports. The Fair Credit Reporting Act gives applicants notice and dispute rights, and HIPAA requires a signed authorization before medical records are released.","Applicants are classified as preferred, standard, substandard or declined. Substandard risks may be rated, given an exclusion rider or offered limited benefits.","Under the Affordable Care Act, individual major medical plans are guaranteed issue with no pre-existing condition exclusions, and rates vary only by age, tobacco use, geography and family size. Disability income, long-term care and supplemental products are still underwritten.","A conditional receipt can make coverage effective before the policy is issued if the applicant is insurable. Without premium at application, coverage waits for delivery, payment and a statement of good health.","When replacing coverage, never let the old policy end until the new one is in force. Group underwriting looks at the whole group, and unfair marketing and claims practices are prohibited."],"avaSummary":"Nice work getting through chapter nineteen. Let me pull it together for you. You are the field underwriter. The company relies on you to ask every question, write down exactly what you hear, and get the right signatures: the applicant, the owner if different, and you. If something needs correcting, the applicant initials it. Next, the underwriter checks the story. The MIB flags earlier findings but can never be the only reason to decline. The attending physician statement gives the medical detail. Consumer reports fall under the Fair Credit Reporting Act, so the applicant gets notice and can dispute errors. HIPAA means no medical records without a signed authorization. From there the applicant lands in a class: preferred, standard, substandard or declined. Substandard still means insurable, usually with a higher premium or an exclusion rider. Remember the big split. Individual major medical under the Affordable Care Act is guaranteed issue, with rates based only on age, tobacco, where you live and family size. Disability income, long-term care and supplemental plans still ask health questions. Then timing. With premium and a conditional receipt, coverage can reach back to the application or the exam, whichever is later, if the person qualifies. With no premium, coverage waits for delivery, payment and a statement of good health. Deliver in person, explain the policy, and get a delivery receipt. Finally, when you replace coverage, keep the old policy until the new one is in force. Group underwriting looks at the group, not the individual. Review your notes, then try the exam.","reviewNotes":[{"objective":"Describe the agent's role as field underwriter and the rules for completing and signing an application","concepts":["The agent gathers accurate information and helps prevent adverse selection.","Every question must be answered; incomplete applications are returned.","Corrections are lined through and initialed by the applicant, or a new application is completed.","Signatures: proposed insured, policyowner if different, agent, and a parent or guardian for a minor.","Application answers are representations, not warranties."],"terms":[{"term":"Field underwriting","def":"Screening and information gathering done by the agent."},{"term":"Agent's report","def":"The agent's confidential remarks to the insurer about the applicant."}]},{"objective":"Identify the main sources of underwriting information and the privacy laws that govern them","concepts":["The application is the primary source.","MIB codes alert underwriters but cannot be the sole basis for an adverse decision.","The APS comes from the treating doctor.","The FCRA requires notice, disclosure of the reporting agency after an adverse action, and a right to dispute.","HIPAA requires signed authorization to release health information."],"terms":[{"term":"MIB","def":"Insurer membership organization that shares coded underwriting findings."},{"term":"Consumer report","def":"Report on credit, character and habits regulated by the FCRA."}]},{"objective":"Explain how insurers classify risks and which rating factors they may use","concepts":["Classes are preferred, standard, substandard and declined.","Substandard risks may get a rated premium, exclusion rider or limited benefits.","Factors include age, health, occupation, tobacco, avocations and income.","Disability benefits are limited to a share of income to avoid overinsurance.","Race, religion, national origin and genetic information may not be used."],"terms":[{"term":"Substandard risk","def":"Higher than average risk that is still insurable on modified terms."},{"term":"Adverse selection","def":"Poorer risks seeking coverage more than better risks."}]},{"objective":"Compare the Affordable Care Act limits on underwriting with products that are still medically underwritten","concepts":["Individual major medical is guaranteed issue and guaranteed renewable.","No pre-existing condition exclusions on ACA plans.","Allowed rating factors: age, tobacco, geographic area, family size.","Age rating is capped at three to one and tobacco at one and one half to one.","Disability income, long-term care, short-term and supplemental plans may still underwrite."],"terms":[{"term":"Guaranteed issue","def":"Coverage offered to all eligible applicants regardless of health."}]},{"objective":"Explain how conditional receipts, policy delivery and the first premium determine when coverage begins","concepts":["Conditional receipt: coverage from the later of application or exam date if insurable.","No premium at application means coverage starts at delivery and payment.","A statement of good health is collected when premium is paid at delivery.","A policy issued on changed terms is a counteroffer.","The delivery receipt documents the start of the free-look period."],"terms":[{"term":"Conditional receipt","def":"Receipt that provides early coverage if the applicant qualifies."},{"term":"Statement of good health","def":"Signed confirmation that health has not changed since application."}]},{"objective":"Apply the rules for replacing health coverage, group underwriting and fair marketing and claims practices","concepts":["Compare benefits, exclusions, waiting periods and cost before replacing.","Keep existing coverage until the new policy is in force.","Group underwriting evaluates the group, usually without individual evidence of insurability.","Participation requirements control adverse selection in groups.","Misrepresentation, misleading comparisons and unreasonable claim denials are unfair practices."],"terms":[{"term":"Replacement","def":"New coverage that takes the place of existing coverage."},{"term":"Experience rating","def":"Pricing a group based on its own claims history."}]}]},"exam":[{"q":"Why is an insurance agent referred to as a field underwriter?","choices":["The agent makes the final decision to issue the policy","The agent collects and screens information about the applicant at the point of sale","The agent sets the premium rate for each applicant","The agent pays claims on behalf of the insurer"],"answer":1,"why":"The agent gathers accurate information and observations; the home office underwriter makes the final decision."},{"q":"An applicant gives a wrong date on a paper application and notices right away. What is the usual correct procedure?","choices":["Cover the error with correction fluid","Have the agent rewrite the answer later at the office","Line through the error, enter the correct answer and have the applicant initial it","Leave it and let the underwriter fix it"],"answer":2,"why":"Changes must be made openly and initialed by the applicant, or a new application completed."},{"q":"Which part of the application is completed and signed only by the agent?","choices":["The agent's report","The medical information section","The general information section","The medical authorization"],"answer":0,"why":"The agent's report contains the agent's own observations and is not signed by the applicant."},{"q":"Statements made by an applicant on a health insurance application are generally considered to be","choices":["Warranties","Guarantees","Waivers","Representations"],"answer":3,"why":"Representations are statements believed true to the best of the applicant's knowledge."},{"q":"Which statement about the MIB is correct?","choices":["It is a federal agency that approves applications","An insurer may decline an applicant based solely on an MIB report","It provides coded information that alerts underwriters to investigate further","It stores complete medical records from hospitals"],"answer":2,"why":"MIB codes act as a flag; they may not be the sole basis for an adverse underwriting decision."},{"q":"The most detailed medical information about an applicant's treatment history usually comes from the","choices":["Agent's report","Attending physician statement","Consumer report","Delivery receipt"],"answer":1,"why":"The APS is prepared by the doctor who has actually treated the applicant."},{"q":"Under the Fair Credit Reporting Act, when coverage is declined because of information in a consumer report, the insurer must","choices":["Give the applicant the name and address of the reporting agency","Issue the policy at standard rates anyway","Refund double the premium","Report the applicant to the MIB"],"answer":0,"why":"The applicant must be told of the adverse action and which agency supplied the report."},{"q":"Before a physician may release an applicant's medical records to an insurer for underwriting, HIPAA generally requires","choices":["A court order","Approval from the state insurance department","A paid first premium","A signed authorization from the applicant"],"answer":3,"why":"Protected health information may be released for underwriting only with the individual's authorization."},{"q":"An applicant with higher than average expected claims who is still insurable is classified as","choices":["Preferred","Standard","Substandard","Declined"],"answer":2,"why":"Substandard risks are accepted on modified terms such as a higher premium or exclusion rider."},{"q":"Which of the following is a common way to insure a substandard health risk?","choices":["Attach an exclusion rider for a specific condition","Lower the premium","Waive the application","Issue the policy as preferred"],"answer":0,"why":"Insurers may exclude a condition, charge more or limit benefits for substandard risks."},{"q":"Why do disability income underwriters limit benefits to a percentage of earned income?","choices":["To increase commissions","To avoid overinsurance that removes the incentive to return to work","Because federal law sets a fixed dollar cap","To qualify the policy as group coverage"],"answer":1,"why":"If benefits equal or exceed pay, the insured has little reason to recover and return to work."},{"q":"Under the Affordable Care Act, premiums for individual major medical plans may vary based on all of these EXCEPT","choices":["Age","Tobacco use","Geographic area","Health status"],"answer":3,"why":"The only permitted factors are age, tobacco use, geographic area and family size."},{"q":"Under ACA rating rules, the oldest adult may be charged no more than how many times the rate of the youngest adult?","choices":["Two times","Three times","Five times","One and one half times"],"answer":1,"why":"Age rating is capped at a three to one ratio; one and one half to one is the tobacco limit."},{"q":"Which product may still be medically underwritten?","choices":["An individual major medical plan bought during open enrollment","A small group major medical plan","An individual disability income policy","A marketplace plan bought during a special enrollment period"],"answer":2,"why":"Disability income is not subject to the ACA guaranteed issue rules for major medical."},{"q":"An applicant pays the first premium with the application and receives a conditional receipt. If found insurable, coverage begins","choices":["On the later of the application date or the medical exam date","On the date the policy is delivered","On the date the underwriter signs the file","Thirty days after the application"],"answer":0,"why":"A conditional receipt dates coverage back to the application or exam, whichever is later, if the applicant qualifies."},{"q":"No premium is collected with the application. When does coverage normally begin?","choices":["When the application is signed","When the medical exam is completed","When the underwriter approves the file","When the policy is delivered and the first premium is paid"],"answer":3,"why":"Without premium, the application is only an invitation to offer; delivery and payment complete the contract."},{"q":"When collecting the first premium at policy delivery, the agent should also obtain a","choices":["New medical exam","Statement of good health","Consumer report","Second application"],"answer":1,"why":"The statement confirms the applicant's health has not changed since the application was taken."},{"q":"A policy is issued with a higher premium than the one applied for. This is best described as","choices":["A rejection","A conditional receipt","A counteroffer","A rebate"],"answer":2,"why":"Changed terms are a counteroffer that the applicant may accept by paying the new premium."},{"q":"A client wants to replace an existing health policy. What should the agent advise?","choices":["Cancel the old policy before applying so premiums do not overlap","Stop paying the old premium once the application is signed","Cancel the old policy when the medical exam is scheduled","Keep the old policy in force until the new policy is issued and effective"],"answer":3,"why":"Ending existing coverage before the new policy is in force can leave the client uninsured."},{"q":"In group health underwriting, the underwriter primarily evaluates","choices":["The characteristics of the group as a whole","Each member's medical exam","Each member's consumer report","Only the employer's credit score"],"answer":0,"why":"Group underwriting looks at the group's purpose, size, stability and participation rather than individuals."}]},{"id":"ch20","num":20,"title":"Texas Life and Health Insurance Laws and Rules","intro":{"hook":["Everything you have studied so far applies almost anywhere in the country. This chapter is different. It is about the rules of the road in Texas, the state that will issue your license and can take it away.","You will learn who regulates insurance in Texas, what it takes to get and keep a General Lines Life, Accident, Health and HMO license, which sales practices are illegal, how premiums and claims must be handled, and the Texas rules for specific policies such as Medicare supplements, long-term care and small employer plans.","The state portion of the exam is drawn from this material, and it is full of specific time frames and dollar limits. More important, these are the rules you will be held to on your very first sale."],"objectives":["Describe the role and powers of the Texas Department of Insurance and the Commissioner","List the requirements to obtain, renew and maintain a Texas agent license, including continuing education and appointments","Identify the grounds for license discipline and the penalties the state may impose","Recognize unfair trade practices and unfair claim settlement practices under Texas law","Explain an agent's fiduciary duties for premiums and the rules on sharing commissions","Summarize the protection provided by the Texas Life and Health Insurance Guaranty Association","Apply Texas-specific policy rules for life, Medicare supplement, long-term care and small employer coverage"],"avaIntro":"Hi, it's Ava. Welcome to chapter twenty, the Texas chapter. Up to now we have talked about how insurance works. Today we talk about the law that governs you as a Texas agent. I will introduce you to the Texas Department of Insurance and the Commissioner, and then walk you through getting licensed: the exam, fingerprints, your two year license term, and the twenty-four hours of continuing education you will need. We will look at what can cost you your license, and at the unfair trade practices every agent must avoid, like twisting, rebating and misrepresentation. Then we will cover handling client money, the Guaranty Association, and Texas rules for particular policies. There are a lot of numbers here, so I suggest you keep a short list as we go. Ready? Let's get started."},"keywords":[{"term":"Appointment","def":"An insurer's authorization for a licensed agent to act on its behalf, required before the agent does business."},{"term":"Cease and desist order","def":"An order from the Commissioner directing a person to stop an unlawful act or practice."},{"term":"Commissioner of Insurance","def":"The chief executive of the Texas Department of Insurance, who administers and enforces state insurance law."},{"term":"Conversion privilege","def":"The right to change group life coverage to an individual policy without proving insurability."},{"term":"Defamation","def":"A false or malicious statement about the financial condition or reputation of an insurer."},{"term":"Fiduciary","def":"A person who holds a position of trust, especially when handling money that belongs to others."},{"term":"Free look","def":"The period after delivery in which the owner may return a policy for a full refund."},{"term":"Guaranty Association","def":"An association of insurers that protects Texas policyholders, within limits, if a member insurer becomes insolvent."},{"term":"Misrepresentation","def":"A false or misleading statement about a policy's terms, benefits or dividends."},{"term":"Nonresident agent","def":"An agent licensed in a home state other than Texas who is also licensed to do business in Texas."},{"term":"Rebating","def":"Giving a buyer part of the commission or something of value not stated in the policy as an inducement to buy."},{"term":"Temporary license","def":"A short-term license that lets an applicant work while in training under an insurer or agent."},{"term":"Twisting","def":"Using misrepresentation or an incomplete comparison to persuade someone to drop or replace a policy."},{"term":"Unfair discrimination","def":"Treating people of the same class and risk differently in rates, benefits or terms."}],"sections":[{"title":"The Texas Department of Insurance and the Commissioner","blocks":[{"type":"p","text":"The <b>Texas Department of Insurance<\/b>, usually called TDI, is the state agency that regulates the business of insurance in Texas. Its job is to protect consumers and keep the insurance market fair, competitive and financially sound."},{"type":"p","text":"TDI is led by the <b>Commissioner of Insurance<\/b>. The Commissioner is appointed by the governor with the consent of the Texas Senate. The Commissioner is not elected and does not write the Insurance Code. The Legislature passes the laws; the Commissioner carries them out."},{"type":"h","text":"Powers and duties"},{"type":"list","items":["Adopt rules needed to carry out the Insurance Code. These rules appear in Title 28 of the Texas Administrative Code.","License agents, adjusters and other professionals, and authorize insurers to do business.","Review policy forms, and rates where the law calls for it.","Examine the financial condition and market conduct of insurers.","Investigate complaints against insurers and agents.","Hold hearings and issue orders, including cease and desist orders.","Impose penalties, and deny, suspend or revoke licenses."]},{"type":"h","text":"What the Commissioner cannot do"},{"type":"p","text":"The Commissioner enforces the law but cannot pass statutes, cannot send someone to jail, and does not act as an insurer. Criminal cases are referred to prosecutors, and disputes over the Commissioner's orders can be reviewed by the courts."},{"type":"flow","nodes":["Legislature passes Insurance Code","Commissioner adopts rules","TDI licenses and examines","TDI enforces"],"caption":"How insurance law moves from statute to enforcement in Texas."},{"type":"h","text":"Certificates of authority"},{"type":"p","text":"An insurer must hold a certificate of authority from TDI before selling in Texas. A company formed under Texas law is a domestic insurer, one formed in another state is a foreign insurer, and one formed in another country is an alien insurer. Agents may place business only with insurers that are authorized to operate in the state."},{"type":"example","text":"A consumer complains to TDI that an agent promised benefits the policy does not contain. TDI can investigate, hold a hearing and discipline the agent's license, but it would refer any criminal fraud to a prosecutor."},{"type":"tip","text":"Remember that the Commissioner is appointed, not elected, and makes rules but not statutes."}]},{"title":"Getting and Keeping a Texas License","blocks":[{"type":"p","text":"To sell life insurance, annuities, accident and health insurance and HMO coverage in Texas, you need a <b>General Lines Life, Accident, Health and HMO<\/b> license. Selling, soliciting or negotiating insurance without a license is illegal."},{"type":"h","text":"Steps to a license"},{"type":"list","items":["Pass the state licensing exam, which has a general knowledge part and a Texas-specific part.","Be fingerprinted so TDI can run a criminal history check.","Submit the application and fee to TDI and answer all background questions truthfully.","Be appointed by an insurer before doing business."]},{"type":"flow","nodes":["Pass exam","Fingerprints","Apply to TDI","Appointment","Sell"],"caption":"The path from candidate to working agent."},{"type":"h","text":"Appointments"},{"type":"p","text":"A license alone does not let you act as an agent. You must hold an <b>appointment<\/b> from an authorized insurer. An appointment does not need to be renewed; it stays in effect until the insurer or the agent ends it."},{"type":"h","text":"License term and renewal"},{"type":"p","text":"A license runs on a two year cycle. For an individual, it expires on the license holder's birthday. If a license has been expired for 90 days or less, it can be renewed by paying the renewal fee plus an added fee equal to half of it. Once a license has been expired for a year or more, the person must start over as a new applicant, including the exam."},{"type":"h","text":"Continuing education"},{"type":"list","items":["24 hours of continuing education every two year license period.","At least 3 of those hours must be in ethics.","At least half of the hours must be classroom or classroom equivalent courses.","Hours not finished on time bring a fine of $50 for each missing hour."]},{"type":"h","text":"Reporting duties"},{"type":"p","text":"An individual agent must keep TDI informed. The Insurance Code requires an agent to report, on a monthly basis, a change of mailing address, a felony conviction, or an administrative action taken against the agent. In practice, report these promptly."},{"type":"h","text":"Temporary and nonresident licenses"},{"type":"p","text":"A <b>temporary license<\/b> lets an applicant who is being trained by an insurer or agent work before passing the exam. It is valid for 180 days after it is issued. A <b>nonresident agent<\/b> is someone licensed and in good standing in a home state who obtains a Texas license, generally without retaking the exam when the home state gives Texas agents the same courtesy."},{"type":"tip","text":"Lock in the continuing education numbers: 24 hours every two years, with 3 hours of ethics."}]},{"title":"License Discipline and Penalties","blocks":[{"type":"p","text":"A license is a privilege. TDI may deny an application, or suspend, revoke or refuse to renew a license, when the holder breaks the law or shows that the public cannot trust them."},{"type":"h","text":"Grounds for discipline"},{"type":"list","items":["Willfully violating an insurance law of Texas.","Making a material misstatement on the license application, or getting a license through fraud.","Misappropriating or converting money that belongs to an insurer, an HMO or an insured.","Engaging in fraudulent or dishonest acts or practices.","Materially misrepresenting the terms of a policy.","Making an incomplete or misleading comparison to induce someone to lapse, forfeit or surrender a policy.","Being convicted of a felony.","Offering or giving a rebate of premium.","Obtaining a license mainly to write insurance on oneself, family or business associates rather than to serve the public."]},{"type":"h","text":"What the state can do"},{"type":"table","head":["Action","What it means"],"rows":[["Denial","The application is refused"],["Suspension","The license is put on hold for a period"],["Revocation","The license is taken away"],["Administrative penalty","A fine of up to $25,000 per violation unless another law sets a different amount"],["Cease and desist order","An order to stop an unlawful practice"],["Restitution","An order to repay people who were harmed"]]},{"type":"p","text":"In setting a fine, the Commissioner weighs how serious the violation was, the economic harm it caused, any history of earlier violations, what is needed to deter future violations, and the efforts made to correct the problem."},{"type":"h","text":"Cease and desist"},{"type":"p","text":"A <b>cease and desist order<\/b> tells a person to stop a practice the Commissioner believes is unlawful, such as an unfair trade practice or doing insurance business without authority. The person is entitled to notice and a hearing. Ignoring an order brings further penalties."},{"type":"h","text":"After revocation"},{"type":"p","text":"A person whose license was revoked, or whose application was denied, generally may not apply again until five years have passed. Even then the applicant must show good cause why the earlier action should not block a new license. The waiting period does not apply when the denial was only for failing the exam, not completing continuing education, or filing an incomplete application."},{"type":"example","text":"An agent collects a premium in cash and uses it to pay personal bills, intending to replace it later. That is misappropriation of funds. TDI can revoke the license and impose a fine, and the matter may be prosecuted."},{"type":"tip","text":"The standard Texas administrative penalty ceiling is $25,000 per violation, and a revoked agent waits five years to reapply."}]},{"title":"Unfair Trade Practices","blocks":[{"type":"p","text":"The Texas Insurance Code prohibits unfair methods of competition and unfair or deceptive acts in the business of insurance. These rules apply to insurers and to agents. You need to recognize each practice by its description."},{"type":"table","head":["Practice","What it looks like"],"rows":[["Misrepresentation","A false or misleading statement about a policy's terms, benefits, advantages or dividends"],["Twisting","Misrepresenting or giving an incomplete comparison to get someone to lapse, surrender or replace a policy"],["Rebating","Offering part of the commission, or something of value not stated in the policy, as an inducement to buy"],["Defamation","False or malicious statements about another insurer's finances or reputation"],["False advertising","Any untrue, deceptive or misleading advertisement about insurance or an insurer"],["Unfair discrimination","Different rates or benefits for people of the same class and expected risk"],["Coercion or boycott","Using intimidation or pressure to restrain trade or force a purchase"]]},{"type":"h","text":"Misrepresentation and false advertising"},{"type":"p","text":"<b>Misrepresentation<\/b> covers what you say and what you leave out. Calling a life policy a savings plan, describing dividends as guaranteed, or using a name or title that hides what the policy really is are all violations. Advertising includes brochures, websites, social media posts and sales scripts. The insurer is responsible for its advertising, and so is the agent who uses it."},{"type":"h","text":"Twisting"},{"type":"p","text":"Replacement is legal. <b>Twisting<\/b> is not. The difference is honesty. If you persuade a client to drop a policy by misstating facts or by comparing only the features that favor your product, you have twisted."},{"type":"h","text":"Rebating"},{"type":"p","text":"<b>Rebating<\/b> is giving the buyer anything of value that is not written into the policy in exchange for the purchase. Splitting your commission with the client or paying the first premium for them are classic examples. In Texas, giving a rebate is a ground for license discipline."},{"type":"h","text":"Unfair discrimination"},{"type":"p","text":"Insurers may charge different rates when the difference reflects real differences in risk, such as age or tobacco use. <b>Unfair discrimination<\/b> means treating people with the same risk profile differently, or basing decisions on race, color, religion or national origin."},{"type":"h","text":"Coercion"},{"type":"p","text":"No one may be forced to buy insurance from a particular agent or insurer as a condition of a loan or other deal, and no one may use threats or intimidation to control the market."},{"type":"example","text":"An agent tells a prospect that a competing company is about to go bankrupt, knowing it is not true. That is defamation, even if the prospect never buys."},{"type":"tip","text":"If the question involves dropping an existing policy because of a misleading comparison, the answer is twisting; if it involves giving something of value to the buyer, it is rebating."}]},{"title":"Claims Practices, Premium Handling and Commissions","blocks":[{"type":"h","text":"Unfair claim settlement practices"},{"type":"p","text":"Texas law lists claim practices that are unfair when an insurer engages in them. They include the following."},{"type":"list","items":["Knowingly misrepresenting to a claimant the facts or policy provisions that relate to coverage.","Failing to acknowledge communications about a claim with reasonable promptness.","Failing to adopt reasonable standards for investigating claims promptly.","Not trying in good faith to reach a fair settlement when liability has become reasonably clear.","Forcing policyholders to sue by offering far less than the amount they eventually recover.","Failing to keep the complaint records the law requires."]},{"type":"h","text":"Prompt payment deadlines"},{"type":"p","text":"The prompt payment law sets a timetable that applies to life, accident and health insurers among others."},{"type":"flow","nodes":["Notice of claim","Acknowledge within 15 days","Accept or reject within 15 business days","Pay within 5 business days"],"caption":"The Texas prompt payment timetable for an insurer."},{"type":"list","items":["Within 15 days after receiving notice of a claim, the insurer must acknowledge it, begin investigating and ask for whatever it needs.","Within 15 business days after receiving all items it requested, the insurer must tell the claimant in writing whether the claim is accepted or rejected.","After notifying the claimant that the claim will be paid, the insurer must pay within 5 business days.","An insurer that violates these deadlines owes interest at 18 percent a year as damages, plus reasonable attorney's fees."]},{"type":"p","text":"For life insurance, TDI tells consumers that the insurer must pay the death benefit within two months after it receives proof of death, and must pay interest on the proceeds."},{"type":"h","text":"Fiduciary duty and premiums"},{"type":"p","text":"An agent who collects premium is a <b>fiduciary<\/b>. The money belongs to the insurer or the client, never to the agent. You must send premiums to the insurer promptly and keep them separate from your own funds. Mixing client money with personal money is called commingling. Using it for yourself is conversion, and misappropriating funds is a ground for losing your license."},{"type":"h","text":"Sharing commissions"},{"type":"p","text":"Commissions may be paid only to people who hold the proper license. An insurer or agent may not pay a commission or other valuable consideration to an unlicensed person for acting as an agent, and an agent may not pay an unlicensed person for soliciting or negotiating insurance. Renewal or deferred commissions may continue to be paid to someone who was properly licensed when the business was written."},{"type":"tip","text":"Know the claim sequence in order: 15 days to acknowledge, 15 business days to accept or reject, 5 business days to pay."}]},{"title":"Texas Life and Health Insurance Guaranty Association","blocks":[{"type":"p","text":"Insurance companies can fail. When an insurer licensed in Texas is declared insolvent and ordered into liquidation, the <b>Texas Life and Health Insurance Guaranty Association<\/b> steps in to protect policyholders, up to limits set by law."},{"type":"h","text":"How it works"},{"type":"list","items":["Membership is made up of the insurers licensed to write life, health and annuity business in Texas.","The Association is funded by assessments on those member insurers, not by tax dollars.","Protection applies to Texas residents who hold covered policies with an insolvent member insurer.","Policyholders must keep paying any premiums due for coverage to continue.","The Association may continue the coverage, move it to a healthy insurer, or pay covered claims."]},{"type":"h","text":"Coverage limits"},{"type":"table","head":["Type of benefit","Limit"],"rows":[["Life insurance death benefit","$300,000 per life"],["Life insurance cash surrender value","$100,000 per life"],["Annuity benefits","$250,000 per life"],["Hospital, medical and surgical or major medical health coverage","$500,000 per individual"],["Long-term disability income and long-term care","$300,000 per individual"],["Other health coverage such as Medicare supplement","$200,000 per individual"]]},{"type":"h","text":"What is not protected"},{"type":"list","items":["Policies issued by insurers that were not licensed in Texas.","Benefits the policy does not guarantee, and the part of a variable product where the owner carries the investment risk.","Self-insured employer plans.","Certificates issued by fraternal benefit societies.","Property and casualty insurance, which has its own separate guaranty association."]},{"type":"h","text":"The advertising rule"},{"type":"p","text":"This is the point agents most often get wrong. Texas law prohibits an agent or insurer from using the existence of the Guaranty Association, or its coverage, as an inducement to sell insurance. You cannot tell a prospect that a weak company is safe because the state will back the policy. Insurers do give policyowners a written summary notice describing the Association, and that notice itself explains that it may not be used as a sales tool."},{"type":"example","text":"A prospect is nervous about a small insurer's rating. The agent says not to worry because the Guaranty Association covers the policy. That statement is an unlawful use of the Association in a sale."},{"type":"tip","text":"Expect a question on the advertising rule: an agent may never use Guaranty Association protection to help make a sale."}]},{"title":"Texas Rules for Life Policies","blocks":[{"type":"h","text":"Free look"},{"type":"p","text":"A <b>free look<\/b> lets the owner examine a new policy and return it for a full refund for any reason. TDI describes Texas life policies as having a free look of at least 10 days, with some policies providing up to 20 days. The period starts when the policy is delivered, which is why a dated delivery receipt matters."},{"type":"h","text":"Grace period"},{"type":"p","text":"Texas requires an individual life policy to give a grace period of at least one month for each premium after the first, and the policy stays in force during that time. Most policies state it as 31 days. If the insured dies during the grace period, the insurer pays the claim and may subtract the overdue premium. A group life policy must provide a 31 day grace period."},{"type":"h","text":"Other standard protections"},{"type":"list","items":["Life policies carry a two year contestable period, after which the insurer generally cannot challenge statements in the application.","The suicide exclusion typically applies during the first two years.","The insurer must pay the death benefit within two months after receiving proof of death, with interest."]},{"type":"h","text":"Group life conversion"},{"type":"p","text":"When a person's group life coverage ends because employment or membership ends, the person has a <b>conversion privilege<\/b>. The rules in Texas are as follows."},{"type":"list","items":["The person has 31 days to apply and pay the first premium.","No evidence of insurability is required.","The new individual policy may be any form the insurer normally issues except term insurance.","The amount cannot be more than the group coverage that ended.","The premium is the insurer's usual rate for the person's age at that time."]},{"type":"h","text":"Replacement"},{"type":"p","text":"Texas regulates the replacement of life insurance and annuities through Department rules. The application asks whether the new policy will replace existing coverage. When it will, the applicant must receive a notice regarding replacement in the form TDI prescribes, so the applicant can weigh what may be lost, such as accumulated values or a contestable period that has already run. The agent must answer the replacement question truthfully and give a fair and complete comparison."},{"type":"h","text":"HIV testing"},{"type":"p","text":"An insurer may ask an applicant to take an HIV test, but only under strict conditions. The insurer must explain how the test will be used and get the applicant's written authorization on a form adopted by the Commissioner, separate from any other document. Results are confidential, the applicant must be notified of a positive result, and underwriting decisions must follow nondiscriminatory standards applied to all applicants alike."},{"type":"tip","text":"For group life conversion, remember 31 days, no proof of insurability, and no conversion to term insurance."}]},{"title":"Texas Rules for Medicare Supplement, Long-Term Care and Small Employer Plans","blocks":[{"type":"h","text":"Medicare supplement"},{"type":"list","items":["Open enrollment lasts six months and begins when a person enrolls in Medicare Part B. During it, an insurer must sell the person a policy regardless of health.","People under 65 who have Medicare because of disability also get a six month open enrollment in Texas, but the guarantee applies only to Plan A. They receive another open enrollment when they turn 65.","The free look is 30 days.","A pre-existing condition waiting period may last up to six months, looking back at conditions treated in the six months before coverage.","Policies are guaranteed renewable. The insurer may cancel only for nonpayment of premium or material misrepresentation.","Guaranteed issue rights after losing certain other coverage generally last 63 days.","Selling a person coverage that duplicates what they already have, and using high-pressure tactics, are prohibited."]},{"type":"h","text":"Long-term care"},{"type":"list","items":["The free look is at least 30 days.","A pre-existing condition limit may be no longer than six months.","The insurer must offer inflation protection and a nonforfeiture benefit. A buyer who does not want them must reject them in writing.","Policies are guaranteed renewable.","Alzheimer's disease and similar conditions must be covered once the policy is in force, though an insurer may decline an applicant who already has the condition.","To guard against accidental lapse, when a premium is 30 days past due the insurer must notify the insured and a person the insured has designated. The policy cannot be cancelled for nonpayment until the premium is at least 65 days overdue."]},{"type":"table","head":["Rule","Medicare supplement","Long-term care"],"rows":[["Free look","30 days","At least 30 days"],["Pre-existing condition limit","Up to 6 months","Up to 6 months"],["Renewability","Guaranteed renewable","Guaranteed renewable"]]},{"type":"h","text":"Small employer health plans"},{"type":"p","text":"In Texas a small employer is a business with 2 to 50 employees. Small employer plans are sold on a guaranteed issue basis, and an insurer cannot deny or limit coverage for an employee because of a pre-existing condition."},{"type":"list","items":["An insurer may require that at least 75 percent of eligible employees participate.","Texas law does not require the employer to pay any part of the premium, although an insurer may set its own contribution requirement.","A new employee must be given at least 31 days to enroll.","An employer's waiting period before coverage begins may be no more than 90 days.","Federal COBRA applies to employers with 20 or more employees. Texas has its own continuation law that reaches employers of any size."]},{"type":"example","text":"A bakery has 12 eligible employees. The insurer's 75 percent rule means at least 9 must enroll for the group to qualify."},{"type":"tip","text":"Both Medicare supplement and long-term care policies in Texas carry a 30 day free look, which is longer than the life insurance free look."}]}],"summary":{"recap":["The Texas Department of Insurance regulates insurance in the state. The Commissioner is appointed by the governor with Senate consent, adopts rules, licenses agents and insurers, investigates, and enforces the Insurance Code.","A General Lines Life, Accident, Health and HMO agent must pass the exam, be fingerprinted, apply to TDI and be appointed by an insurer. The license runs two years, expires on the agent's birthday, and requires 24 hours of continuing education including 3 hours of ethics. A temporary license lasts 180 days.","TDI can deny, suspend or revoke a license, issue cease and desist orders and impose fines of up to $25,000 per violation. A revoked agent generally waits five years to reapply.","Unfair trade practices include misrepresentation, twisting, rebating, defamation, false advertising, unfair discrimination and coercion. Insurers must acknowledge claims within 15 days, accept or reject within 15 business days of receiving all items, and pay within 5 business days.","Agents are fiduciaries for premiums and may share commissions only with licensed persons. The Guaranty Association protects Texas residents within limits and may never be used as a sales inducement.","Texas policy rules include a one month life grace period, a 31 day group life conversion right, written consent for HIV testing, 30 day free looks for Medicare supplement and long-term care, and small employer plans for groups of 2 to 50."],"avaSummary":"You made it through the Texas chapter, and that is a big one. Let me give you the short version to carry into the exam. The Texas Department of Insurance regulates our business, and the Commissioner, who is appointed by the governor, runs it. The Commissioner makes rules and enforces the law but does not write statutes. To get your license you pass the exam, get fingerprinted, apply, and get appointed by an insurer. Your license lasts two years and expires on your birthday. You need twenty-four hours of continuing education each period, with three hours of ethics. A temporary license is good for one hundred eighty days. If you break the rules, the state can suspend or revoke your license and fine you up to twenty-five thousand dollars per violation, and after a revocation you wait five years to reapply. Know your unfair trade practices cold. Twisting is a misleading comparison to replace a policy. Rebating is giving the buyer something of value that is not in the policy. Defamation is a false statement about an insurer. For claims, think fifteen, fifteen, five: fifteen days to acknowledge, fifteen business days to decide, five business days to pay. Premiums you collect are never yours, so keep them separate and send them in promptly. The Guaranty Association covers three hundred thousand dollars in life death benefits and two hundred fifty thousand in annuities, but never mention it to close a sale. Last, remember thirty-one days for group life conversion, and thirty day free looks for Medicare supplement and long-term care. Now go take the chapter exam.","reviewNotes":[{"objective":"Describe the role and powers of the Texas Department of Insurance and the Commissioner","concepts":["TDI regulates insurers, agents and the insurance market in Texas.","The Commissioner is appointed by the governor with Senate consent.","The Commissioner adopts rules in Title 28 of the Texas Administrative Code but does not pass statutes.","Powers include licensing, examining insurers, holding hearings and imposing penalties.","Insurers need a certificate of authority to do business in Texas."],"terms":[{"term":"Commissioner of Insurance","def":"Appointed head of TDI who enforces the Insurance Code."},{"term":"Certificate of authority","def":"TDI's authorization for an insurer to transact business in Texas."}]},{"objective":"List the requirements to obtain, renew and maintain a Texas agent license, including continuing education and appointments","concepts":["Pass the exam, be fingerprinted, apply to TDI and obtain an appointment.","Two year license term that expires on the individual's birthday.","24 hours of continuing education per period, 3 in ethics, at least half classroom or classroom equivalent.","Expired 90 days or less: renew with an added half fee. Expired a year or more: reapply and retest.","Report address changes, felony convictions and administrative actions to TDI.","Temporary license is valid 180 days."],"terms":[{"term":"Appointment","def":"Insurer's authorization for an agent to act for it; continues until terminated."},{"term":"Temporary license","def":"License for an applicant in training, valid 180 days."}]},{"objective":"Identify the grounds for license discipline and the penalties the state may impose","concepts":["Grounds include willful violations, application fraud, misappropriating funds, dishonest acts, felony conviction and rebating.","Actions include denial, suspension, revocation and refusal to renew.","Administrative penalty of up to $25,000 per violation unless another law sets a different amount.","Cease and desist orders stop unlawful practices after notice and hearing.","Five year wait to reapply after revocation or denial, with stated exceptions."],"terms":[{"term":"Cease and desist order","def":"Order to stop an unlawful act or practice."},{"term":"Revocation","def":"Termination of a license by the state."}]},{"objective":"Recognize unfair trade practices and unfair claim settlement practices under Texas law","concepts":["Misrepresentation: false or misleading statements about policy terms or dividends.","Twisting: misleading or incomplete comparison to induce replacement or lapse.","Rebating: giving value not stated in the policy as an inducement.","Defamation: false statements about an insurer's finances or reputation.","Claims timetable: 15 days to acknowledge, 15 business days to accept or reject, 5 business days to pay.","Late payment brings 18 percent annual interest plus attorney's fees."],"terms":[{"term":"Twisting","def":"Misrepresentation used to cause a policy to be dropped or replaced."},{"term":"Unfair discrimination","def":"Unequal treatment of people in the same class and risk."}]},{"objective":"Explain an agent's fiduciary duties for premiums and the rules on sharing commissions","concepts":["Premiums are held in trust and must be remitted promptly.","Commingling is mixing premium funds with personal funds.","Conversion or misappropriation is a ground for license revocation.","Commissions may be paid only to properly licensed persons.","Deferred commissions may continue to a person who was licensed when the business was written."],"terms":[{"term":"Fiduciary","def":"Person in a position of financial trust."},{"term":"Commingling","def":"Mixing client or insurer funds with the agent's own money."}]},{"objective":"Summarize the protection provided by the Texas Life and Health Insurance Guaranty Association","concepts":["Protects Texas residents when a member insurer becomes insolvent.","Funded by assessments on member insurers.","Limits: $300,000 life death benefit, $100,000 cash surrender value, $250,000 annuity.","Limits: $500,000 major medical, $300,000 long-term disability or long-term care, $200,000 other health.","Does not cover unlicensed insurers, self-insured plans, fraternal certificates or non-guaranteed benefits.","May not be used as an inducement to sell insurance."],"terms":[{"term":"Guaranty Association","def":"Insurer-funded safety net for policyholders of insolvent insurers."},{"term":"Insolvency","def":"An insurer's inability to meet its financial obligations."}]},{"objective":"Apply Texas-specific policy rules for life, Medicare supplement, long-term care and small employer coverage","concepts":["Life: free look of at least 10 days, grace period of at least one month, two year contestable period.","Group life conversion: 31 days, no evidence of insurability, not to term insurance.","HIV testing requires explanation and separate written authorization; results are confidential.","Medicare supplement: six month open enrollment, 30 day free look, pre-existing limit up to six months.","Long-term care: 30 day free look, required offers of inflation protection and nonforfeiture, third party lapse notice.","Small employer: 2 to 50 employees, guaranteed issue, 75 percent participation, waiting period up to 90 days."],"terms":[{"term":"Conversion privilege","def":"Right to convert group life to an individual policy without proving insurability."},{"term":"Free look","def":"Period to return a new policy for a full refund."}]}]},"exam":[{"q":"How does the Texas Commissioner of Insurance obtain the office?","choices":["Elected by Texas voters","Appointed by the governor with the consent of the Senate","Chosen by insurers licensed in Texas","Appointed by the federal government"],"answer":1,"why":"The Commissioner is appointed by the governor and confirmed by the Texas Senate."},{"q":"Which of the following is NOT a power of the Commissioner?","choices":["Adopting rules to carry out the Insurance Code","Issuing cease and desist orders","Passing new insurance statutes","Revoking an agent's license"],"answer":2,"why":"Only the Legislature passes statutes; the Commissioner adopts rules and enforces the law."},{"q":"How many hours of continuing education must a Texas general lines agent complete each two year license period?","choices":["24 hours, including 3 hours of ethics","30 hours, including 2 hours of ethics","15 hours, including 3 hours of ethics","40 hours, including 4 hours of ethics"],"answer":0,"why":"TDI requires 24 hours per period with at least 3 hours in ethics."},{"q":"A Texas temporary agent license is valid for","choices":["30 days","90 days","One year","180 days"],"answer":3,"why":"The Insurance Code makes a temporary license valid for 180 days after issuance."},{"q":"Before a newly licensed agent may engage in business as an agent, the agent must","choices":["Complete 24 hours of continuing education","Be appointed by an authorized insurer","Post a notice in a newspaper","Join the Guaranty Association"],"answer":1,"why":"A license holder may not act as an agent until appointed by an insurer authorized in Texas."},{"q":"An individual agent's Texas license expires","choices":["Every year on January 1","Five years after issue","On the agent's birthday on a two year cycle","Only when the insurer ends the appointment"],"answer":2,"why":"Individual licenses run on a two year cycle tied to the license holder's birthday."},{"q":"An agent's license has been expired for 60 days. What must the agent do to renew?","choices":["Pay the renewal fee plus an additional fee equal to half the renewal fee","Retake the licensing exam","Wait five years","Obtain a temporary license"],"answer":0,"why":"A license expired 90 days or less may be renewed with the renewal fee plus an added half fee."},{"q":"Unless another law sets a different amount, the maximum administrative penalty per violation of the Texas Insurance Code is","choices":["$1,000","$5,000","$10,000","$25,000"],"answer":3,"why":"The Insurance Code caps the general administrative penalty at $25,000 per violation."},{"q":"After a license is revoked, the former agent generally may not apply for a new license until","choices":["One year has passed","Five years have passed","The fine has been paid","A new insurer offers an appointment"],"answer":1,"why":"Texas imposes a five year waiting period after revocation or denial, with limited exceptions."},{"q":"An agent tells a client that an existing policy is worthless, using a comparison that leaves out its guaranteed values, so the client will surrender it and buy a new one. This is","choices":["Rebating","Defamation","Twisting","Coercion"],"answer":2,"why":"Twisting is inducing a lapse or replacement through misrepresentation or an incomplete comparison."},{"q":"An agent offers to return half of the first year commission to a prospect who agrees to buy a policy. This practice is","choices":["Rebating","Twisting","Commingling","Conversion"],"answer":0,"why":"Rebating is giving the buyer value not stated in the policy as an inducement to purchase."},{"q":"Spreading a false statement that a competing insurer is financially unsound is","choices":["Misrepresentation","Unfair discrimination","Twisting","Defamation"],"answer":3,"why":"Defamation involves false or malicious statements about an insurer's financial condition or reputation."},{"q":"Under the Texas prompt payment law, an insurer must acknowledge receipt of a claim within","choices":["5 business days","15 days","30 days","60 days"],"answer":1,"why":"The insurer has 15 days after notice of claim to acknowledge it and begin investigating."},{"q":"Once an insurer notifies a claimant that a claim will be paid, payment must be made within","choices":["15 business days","30 days","5 business days","2 months"],"answer":2,"why":"Payment is due within 5 business days after notice that the claim will be paid."},{"q":"An agent deposits client premiums into a personal checking account along with personal funds. This is called","choices":["Commingling","Rebating","Twisting","Coercion"],"answer":0,"why":"Commingling is mixing fiduciary funds with personal funds, a breach of the agent's duty."},{"q":"The Texas Life and Health Insurance Guaranty Association limit for a life insurance death benefit is","choices":["$100,000 per life","$250,000 per life","$500,000 per life","$300,000 per life"],"answer":3,"why":"Death benefits are protected up to $300,000 per life; cash surrender value is limited to $100,000."},{"q":"Which statement about the Guaranty Association is correct?","choices":["Agents should mention it to reassure hesitant buyers","Agents may not use its existence as an inducement to sell insurance","It is funded by state income taxes","It covers self-insured employer health plans"],"answer":1,"why":"Texas law prohibits using Guaranty Association protection as a sales inducement."},{"q":"An employee leaves a job and loses group life coverage. Under Texas law the employee may convert to an individual policy within","choices":["10 days, with a medical exam","60 days, to term insurance only","31 days, without evidence of insurability","90 days, at the group rate"],"answer":2,"why":"The conversion right lasts 31 days, requires no evidence of insurability and excludes term insurance."},{"q":"In Texas, the free look period for a Medicare supplement policy is","choices":["30 days","10 days","15 days","60 days"],"answer":0,"why":"A Medicare supplement policy may be returned within 30 days for a full refund."},{"q":"For Texas health insurance purposes, a small employer is a business with","choices":["1 to 25 employees","2 to 100 employees","5 to 50 employees","2 to 50 employees"],"answer":3,"why":"TDI defines a small employer as a business with 2 to 50 employees."}]}],"modules":[{"id":"as01","num":1,"title":"Welcome to AllShield: Your Path to Getting Licensed and Selling","intro":{"hook":["Nobody is born knowing how to become an insurance agent. Most people who start this career come from somewhere else entirely: retail, field sales, customer service, teaching. What they share is a willingness to learn a new trade one step at a time.","This module is your map. It explains how Allshield Academy works and then walks through every step between today and your first enrollment: exam prep, the state exam, fingerprints and the license application, errors and omissions coverage, carrier appointments, Marketplace registration, and later the certification needed for Medicare.","Knowing
