name: Apply Onboarding 014 Index Loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version config loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./config.js?v=2026.08.27.013'
          new='./config.js?v=2026.08.28.014'
          if old in s:
              p.write_text(s.replace(old,new))
          elif new not in s:
              raise SystemExit('Expected config loader not found')
          PY
      - name: Commit loader version
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "allshield-build-bot"
          git config user.email "allshield-build-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Version config loader for live Team Accounts invite fix"
          git push